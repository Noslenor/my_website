<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituale Romanum</title>
<meta name="description" content="Rites and blessings of the traditional Rituale Romanum in Latin, with an English translation side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7; --page: #fffdf8; --ink: #2b2420; --muted: #75695d; --line: #e5dccb;
    --rubric: #a3221b; --accent: #7b1e1a; --hl: #f3e3b5;
    --shadow: 0 1px 2px rgba(50,30,10,.06), 0 8px 26px rgba(50,30,10,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #16120f; --page: #1f1a16; --ink: #ece4d6; --muted: #a89a88; --line: #3a3129; --rubric: #e9776c; --accent: #e9776c; --hl: #4a3b1a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 "EB Garamond", Georgia, serif; }
  button, input, select { font: inherit; color: inherit; }
  .ui { font-family: Inter, system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
  /* Sidebar */
  aside { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--page); padding: 18px 14px 40px; }
  .brand { font-size: 1.6rem; font-weight: 600; letter-spacing: .3px; color: var(--accent); line-height: 1.1; }
  .brand small { display: block; font-family: Inter, sans-serif; font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; font-weight: 500; }
  .back { font-size: .8rem; color: var(--muted); text-decoration: none; display: inline-block; margin: 6px 0 14px; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 11px; font-size: .9rem; }
  .cat { margin: 16px 0 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .toc a { display: block; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 8px; line-height: 1.25; }
  .toc a .la { display: block; font-size: .98rem; }
  .toc a .en { display: block; font-family: Inter, sans-serif; font-size: .74rem; color: var(--muted); }
  .toc a:hover { background: var(--paper); }
  .toc a[aria-current="true"] { background: var(--hl); }
  .toc .none { font-size: .85rem; color: var(--muted); padding: 8px; }
  /* Main */
  main { padding: 26px 34px 80px; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--page); }
  .seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .btn { border: 1px solid var(--line); background: var(--page); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
  .menu-btn { display: none; }
  article.rite { background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 34px 34px; }
  .ref { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 2px; font-weight: 600; font-size: clamp(1.7rem, 3.4vw, 2.4rem); line-height: 1.12; color: var(--accent); }
  h1 + .sub { font-size: 1.25rem; font-style: italic; color: var(--muted); margin-bottom: 18px; }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 34px; }
  .rows.only-la, .rows.only-en { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
  .rows.only-la .en, .rows.only-en .la { display: none; }
  .colhead { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
  .rows.only-la .colhead.en, .rows.only-en .colhead.la { display: none; }
  .row { display: contents; }
  .row > div { padding: 5px 0; }
  .la { font-feature-settings: "liga", "dlig"; }
  .r > div { color: var(--rubric); font-size: .92rem; font-style: italic; }
  .h > div { font-weight: 600; font-size: 1.12rem; padding-top: 16px; color: var(--accent); font-variant: small-caps; letter-spacing: .03em; }
  .t > div, .v > div, .x > div { }
  .v > div, .x > div { padding: 1px 0; }
  .sym, .cross { color: var(--rubric); font-weight: 600; }
  em.rb { color: var(--rubric); }
  .n { grid-column: 1 / -1; font-family: Inter, sans-serif; font-size: .82rem; color: var(--muted); background: var(--paper); border-left: 3px solid var(--rubric); border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
  .first-letter::first-letter { }
  .intro { background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 34px; }
  .intro h1 { margin-top: 0; }
  .intro p, .intro li { font-size: 1.05rem; max-width: 72ch; }
  .grid-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 18px 0; font-family: Inter, sans-serif; }
  .grid-cats a { display: block; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .grid-cats a b { display: block; font-size: .95rem; }
  .grid-cats a span { font-size: .78rem; color: var(--muted); }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; font-family: Inter, sans-serif; font-size: .85rem; }
  .pager a { text-decoration: none; max-width: 48%; }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(330px, 88vw); z-index: 20; transform: translateX(-102%); transition: transform .25s; box-shadow: var(--shadow); }
    body.menu-open aside { transform: none; }
    .menu-btn { display: inline-block; }
    main { padding: 16px 16px 60px; }
    article.rite, .intro { padding: 22px 18px; border-radius: 12px; }
    .rows { grid-template-columns: minmax(0, 1fr); }
    .rows .row > .en { padding-top: 0; padding-bottom: 12px; color: var(--muted); }
    .rows .r > .en { color: var(--rubric); opacity: .8; }
    .rows.only-la .row > .en, .rows.only-en .row > .la { display: none; }
    .rows.only-en .row > .en { color: var(--ink); padding-bottom: 5px; }
    .colhead { display: none; }
  }
  @media print {
    aside, .bar, .pager { display: none !important; }
    .shell { display: block; }
    main { padding: 0; max-width: none; }
    article.rite { border: 0; box-shadow: none; padding: 0; }
    body { background: #fff; color: #000; font-size: 11.5pt; }
    :root { --rubric: #a3221b; --accent: #7b1e1a; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="side" aria-label="Contents">
    <div class="brand">Rituale Romanum<small>Latin · English</small></div>
    <a class="back ui" href="index.html">← Game Room</a>
    <input class="search ui" id="q" type="search" placeholder="Search Latin or English…" aria-label="Search the rites">
    <nav class="toc" id="toc"></nav>
  </aside>
  <main>
    <div class="bar ui">
      <button class="btn menu-btn" id="menuBtn" aria-controls="side">☰ Contents</button>
      <div class="seg" role="group" aria-label="Language">
        <button data-view="both" aria-pressed="true">Latin &amp; English</button>
        <button data-view="la" aria-pressed="false">Latin</button>
        <button data-view="en" aria-pressed="false">English</button>
      </div>
      <button class="btn" id="printBtn">Print</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
const RITES = [{"id": "baptism-infants", "la": "Ordo Baptismi Parvulorum", "en": "The Rite of Baptism for Children", "cat": "Sacraments", "ref": "Tit. II, cap. 2", "b": [["r", "1. Sacerdos interrogat infantem (si plures sint baptizandi, interrogat singulariter singulos):", "1. The priest questions the child (if several are to be baptized, he questions each one individually):"], ["t", "*Sacerdos:* N., Quid petis ab Ecclésia Dei?", "*Priest:* N., what do you ask of the Church of God?"], ["t", "*Patrinus respondet:* Fidem.", "*The godparent answers:* Faith."], ["t", "*Sacerdos:* Fides, quid tibi præstat?", "*Priest:* What does faith offer you?"], ["t", "*Patrinus respondet:* Vitam ætérnam.", "*The godparent answers:* Eternal life."], ["r", "2. Sacerdos (etiam singulariter singulis):", "2. The priest (again to each individually):"], ["t", "Si ígitur vis ad vitam íngredi, serva mandáta. Díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex tota mente tua, et próximum tuum sicut teípsum.", "If, then, you wish to enter into life, keep the commandments. You shall love the Lord your God with your whole heart, and with your whole soul, and with your whole mind, and your neighbor as yourself."], ["r", "3. Deinde ter exsufflat leniter in faciem infantis, et dicit semel (singulariter singulis):", "3. Then he breathes gently three times on the child's face, and says once (to each individually):"], ["t", "Exi ab eo (ea), immúnde spíritus, et da locum Spirítui Sancto Paráclito.", "Go out from him (her), unclean spirit, and give place to the Holy Spirit, the Paraclete."], ["r", "4. Postea pollice facit signum crucis in fronte, et in pectore infantis, dicens (singulariter singulis):", "4. Then with his thumb he makes the sign of the cross on the forehead and on the breast of the child, saying (to each individually):"], ["t", "Accipe signum Crucis tam in fron✠te, quam in cor✠de, sume fidem cæléstium præceptórum: et talis esto móribus, ut templum Dei jam esse possis.", "Receive the sign of the Cross both on your fore✠head and on your ✠heart; take hold of the faith of the heavenly precepts, and be such in your conduct that you may now be a temple of God."], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Preces nostras, quǽsumus, Dómine, cleménter exáudi: et hunc eléctum tuum N. (hanc eléctam tuam N.) Crucis Domínicæ impressióne signátum (-am) perpétua virtúte custódi: ut, magnitúdinis glóriæ tuæ rudiménta servans, per custódiam mandatórum tuórum ad regeneratiónis glóriam perveníre mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "Mercifully hear our prayers, we beseech You, O Lord, and with Your unfailing power guard this Your chosen one, N., marked with the sign of the Lord's Cross; that, holding fast to these first lessons in the greatness of Your glory, he (she) may, by keeping Your commandments, be worthy to attain the glory of rebirth. Through Christ our Lord. ℟. Amen."], ["r", "5. Deinde imponit manum super caput infantis (singulorum infantium), et postea manum extensam tenens dicit:", "5. Then he lays his hand on the head of the child (of each child), and afterward, holding his hand extended, he says:"], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Omnípotens sempitérne Deus, Pater Dómini nostri Jesu Christi, respícere dignáre super hunc fámulum tuum N. (hanc fámulam tuam N.), quem (quam) ad rudiménta fídei vocáre dignátus es: omnem cæcitátem cordis ab eo (ea) expélle: disrúmpe omnes láqueos sátanæ, quibus fúerat colligátus (-a): áperi ei, Dómine, jánuam pietátis tuæ, ut signo sapiéntiæ tuæ imbútus (-a), ómnium cupiditátum fœtóribus cáreat, et ad suávem odórem præceptórum tuórum lætus (-a) tibi in Ecclésia tua desérviat, et profíciat de die in diem. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, Father of our Lord Jesus Christ, graciously look upon this Your servant N., whom You have deigned to call to the first lessons of the faith. Drive out from him (her) all blindness of heart; break all the snares of Satan with which he (she) was bound. Open to him (her), O Lord, the gate of Your mercy, so that, filled with the sign of Your wisdom, he (she) may be free from the foulness of all evil desires, and in the sweet fragrance of Your commandments may joyfully serve You in Your Church and grow from day to day. Through the same Christ our Lord. ℟. Amen."], ["r", "6. Deinde Sacerdos benedicit sal, quod semel benedictum alias ad eundem usum deservire potest.", "6. Then the priest blesses the salt, which, once blessed, may be used again for the same purpose."], ["h", "Benedictio salis", "Blessing of the salt"], ["t", "Exorcízo te, creatúra salis, in nómine Dei ✠ Patris omnipoténtis, et in caritáte Dómini nostri Jesu ✠ Christi, et in virtúte Spíritus ✠ Sancti. Exorcízo te per Deum ✠ vivum, per Deum ✠ verum, per Deum ✠ sanctum, per Deum ✠, qui te ad tutélam humáni géneris procreávit, et pópulo veniénti ad credulitátem per servos suos consecrári præcépit, ut in nómine sanctæ Trinitátis efficiáris salutáre sacraméntum ad effugándum inimícum. Proínde rogámus te, Dómine Deus noster, ut hanc creatúram salis sanctificándo sanctí✠fices, et benedicéndo bene✠dícas, ut fiat ómnibus accipiéntibus perfécta medicína, pérmanens in viscéribus eórum, in nómine ejúsdem Dómini nostri Jesu Christi, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of salt, in the name of God the ✠ Father almighty, and in the love of our Lord Jesus ✠ Christ, and in the power of the Holy ✠ Spirit. I exorcise you by the ✠ living God, by the ✠ true God, by the ✠ holy God, by ✠ God who created you for the protection of the human race and commanded that you be consecrated by His servants for the people coming to the faith, so that in the name of the Holy Trinity you may become a saving sacrament to put the enemy to flight. Therefore we ask You, O Lord our God, that by sanctifying You may sanc✠tify, and by blessing You may ✠ bless this creature of salt, so that it may become for all who receive it a perfect medicine, abiding in their inmost being; in the name of the same Jesus Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["r", "7. Deinde immittit modicum salis benedicti in os infantis, dicens (singulariter singulis):", "7. Then he puts a little of the blessed salt into the child's mouth, saying (to each individually):"], ["t", "N., Accipe sal sapiéntiæ: propitiátio sit tibi in vitam ætérnam. ℟. Amen.", "N., receive the salt of wisdom; may it be for you a pledge of mercy unto life everlasting. ℟. Amen."], ["t", "*Sacerdos:* Pax tecum. ℟. Et cum spíritu tuo.", "*Priest:* Peace be with you. ℟. And with your spirit."], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Deus patrum nostrórum, Deus univérsæ cónditor veritátis, te súpplices exorámus, ut hunc fámulum tuum N. (hanc fámulam tuam N.) respícere dignéris propítius, et hoc primum pábulum salis gustántem, non diútius esuríre permíttas, quo minus cibo expleátur cælésti, quátenus sit semper spíritu fervens, spe gaudens, tuo semper nómini sérviens. Perduc eum (eam), Dómine, quǽsumus, ad novæ regeneratiónis lavácrum, ut cum fidélibus tuis promissiónum tuárum ætérna prǽmia cónsequi mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "O God of our fathers, God, the author of all truth, we humbly beseech You graciously to look upon this Your servant N., and as he (she) tastes this first nourishment of salt, do not let him (her) hunger any longer, but fill him (her) with heavenly food, so that he (she) may be ever fervent in spirit, rejoicing in hope, always serving Your name. Lead him (her), O Lord, we beseech You, to the font of the new birth, that with Your faithful he (she) may be worthy to obtain the eternal rewards of Your promises. Through Christ our Lord. ℟. Amen."], ["t", "Exorcízo te, immúnde spíritus, in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti, ut éxeas, et recédas ab hoc fámulo (hac fámula) Dei N.: Ipse enim tibi ímperat, maledícte damnáte, qui pédibus super mare ambulávit, et Petro mergénti déxteram porréxit.", "I exorcise you, unclean spirit, in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit, that you go out and depart from this servant of God, N. For He commands you, accursed and damned one, who walked upon the sea and stretched out His right hand to Peter as he was sinking."], ["t", "Ergo, maledícte diábole, recognósce senténtiam tuam, et da honórem Deo vivo et vero, da honórem Jesu Christo Fílio ejus, et Spirítui Sancto, et recéde ab hoc fámulo (hac fámula) Dei N., quia istum (istam) sibi Deus et Dóminus noster Jesus Christus ad suam sanctam grátiam, et benedictiónem, fontémque Baptísmatis vocáre dignátus est.", "Therefore, accursed devil, acknowledge your sentence, and give honor to the living and true God; give honor to Jesus Christ, His Son, and to the Holy Spirit; and depart from this servant of God, N., for our God and Lord Jesus Christ has deigned to call him (her) to His holy grace and blessing and to the font of Baptism."], ["r", "8. Hic pollice in fronte signat infantem, dicens (singulariter singulis):", "8. Here with his thumb he signs the child on the forehead, saying (to each individually):"], ["t", "Et hoc signum sanctæ Cru✠cis, quod nos fronti ejus damus, tu, maledícte diábole, numquam áudeas violáre. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "And this sign of the holy ✠ Cross, which we place upon his (her) forehead, do you, accursed devil, never dare to violate. Through the same Christ our Lord. ℟. Amen."], ["r", "9. Mox imponit manum super caput infantis (singulorum infantium), et postea manum extensam tenens dicit:", "9. Next he lays his hand on the head of the child (of each child), and afterward, holding his hand extended, he says:"], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Ætérnam ac justíssimam pietátem tuam déprecor, Dómine sancte, Pater omnípotens, ætérne Deus, auctor lúminis et veritátis, super hunc fámulum tuum N. (hanc fámulam tuam N.), ut dignéris eum (eam) illumináre lúmine intellegéntiæ tuæ: munda eum (eam), et sanctífica: da ei sciéntiam veram, ut dignus (-a) grátia Baptísmi tui efféctus (-a), téneat firmam spem, consílium rectum, doctrínam sanctam. Per Christum, Dóminum nostrum. ℟. Amen.", "I implore Your eternal and most just mercy, holy Lord, Father almighty, everlasting God, author of light and truth, upon this Your servant N., that You would deign to enlighten him (her) with the light of Your understanding. Cleanse him (her) and sanctify him (her); give him (her) true knowledge, so that, being made worthy of the grace of Your Baptism, he (she) may hold firm hope, right counsel, and holy doctrine. Through Christ our Lord. ℟. Amen."], ["r", "10. Postea Sacerdos imponit extremam partem stolæ pendentem a suo humero sinistro super primum infantem, et introducit eum (quem sequuntur ceteri) in ecclesiam, dicens (in plurali pro pluribus):", "10. Then the priest places the end of the stole hanging from his left shoulder upon the first child and leads him (the others following) into the church, saying (in the plural for several):"], ["t", "N., Ingrédere in templum Dei, ut hábeas partem cum Christo in vitam ætérnam. ℟. Amen.", "N., enter into the temple of God, that you may have part with Christ unto life everlasting. ℟. Amen."], ["r", "11. Cum fuerint ecclesiam ingressi, Sacerdos procedens ad Fontem, cum susceptoribus conjunctim clara voce dicit:", "11. When they have entered the church, the priest, proceeding to the font, says aloud together with the sponsors:"], ["t", "Credo in Deum, Patrem omnipoténtem, Creatórem cæli et terræ. Et in Jesum Christum, Fílium ejus únicum, Dóminum nostrum: qui concéptus est de Spíritu Sancto, natus ex María Vírgine, passus sub Póntio Piláto, crucifíxus, mórtuus, et sepúltus: descéndit ad ínferos; tértia die resurréxit a mórtuis; ascéndit ad cælos; sedet ad déxteram Dei Patris omnipoténtis: inde ventúrus est judicáre vivos et mórtuos. Credo in Spíritum Sanctum, sanctam Ecclésiam cathólicam, Sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, vitam ætérnam. Amen.", "I believe in God, the Father almighty, Creator of heaven and earth; and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died, and was buried. He descended into hell; on the third day He rose again from the dead; He ascended into heaven and sits at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of Saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen."], ["t", "Pater noster, qui es in cælis, sanctificétur nomen tuum. Advéniat regnum tuum. Fiat volúntas tua, sicut in cælo et in terra. Panem nostrum cotidiánum da nobis hódie. Et dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris. Et ne nos indúcas in tentatiónem: sed líbera nos a malo. Amen.", "Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen."], ["r", "12. Ac deinde, antequam accedat ad Baptisterium, versis renibus ostio cancellorum Baptisterii, dicit (in plurali pro pluribus):", "12. And then, before he approaches the baptistery, with his back turned to the gate of the baptistery railing, he says (in the plural for several):"], ["h", "Exorcismus", "Exorcism"], ["t", "Exorcízo te, omnis spíritus immúnde, in nómine Dei ✠ Patris omnipoténtis, et in nómine Jesu ✠ Christi Fílii ejus, Dómini et Júdicis nostri, et in virtúte Spíritus ✠ Sancti, ut discédas ab hoc plásmate Dei N., quod Dóminus noster ad templum sanctum suum vocáre dignátus est, ut fiat templum Dei vivi, et Spíritus Sanctus hábitet in eo. Per eúndem Christum, Dóminum nostrum, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, every unclean spirit, in the name of God the ✠ Father almighty, and in the name of Jesus ✠ Christ, His Son, our Lord and Judge, and in the power of the Holy ✠ Spirit, that you depart from this creature of God, N., whom our Lord has deigned to call to His holy temple, that he (she) may become a temple of the living God and the Holy Spirit may dwell in him (her). Through the same Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["r", "13. Postea Sacerdos pollice accipit de saliva oris sui, et tangit aures et nares infantis: tangendo vero aurem dexteram et sinistram, dicit (singulariter singulis):", "13. Then the priest takes a little spittle from his mouth with his thumb and touches the ears and nostrils of the child; touching the right and the left ear, he says (to each individually):"], ["t", "Ephpheta, quod est, Adaperíre.", "Ephpheta, that is, Be opened."], ["r", "Deinde tangit nares, dicens:", "Then he touches the nostrils, saying:"], ["t", "In odórem suavitátis. Tu autem effugáre, diábole; appropinquábit enim judícium Dei.", "Unto the odor of sweetness. But you, devil, take flight; for the judgment of God draws near."], ["r", "14. Postea interrogat baptizandum nominatim, dicens (singulariter singulis):", "14. Then he questions the one to be baptized by name, saying (to each individually):"], ["t", "N., Abrenúntias sátanæ?", "N., do you renounce Satan?"], ["t", "*Respondet Patrinus:* Abrenúntio.", "*The godparent answers:* I do renounce him."], ["t", "*Sacerdos:* Et ómnibus opéribus ejus?", "*Priest:* And all his works?"], ["t", "*Patrinus:* Abrenúntio.", "*Godparent:* I do renounce them."], ["t", "*Sacerdos:* Et ómnibus pompis ejus?", "*Priest:* And all his empty show?"], ["t", "*Patrinus:* Abrenúntio.", "*Godparent:* I do renounce them."], ["r", "15. Deinde Sacerdos intingit pollicem in oleo Catechumenorum, et infantem ungit in pectore, et inter scapulas in modum crucis, dicens semel (singulariter singulis):", "15. Then the priest dips his thumb in the oil of catechumens and anoints the child on the breast and between the shoulders in the form of a cross, saying once (to each individually):"], ["t", "Ego te línio ✠ óleo salútis in Christo Jesu, Dómino nostro, ut hábeas vitam ætérnam. ℟. Amen.", "I anoint you ✠ with the oil of salvation in Christ Jesus our Lord, that you may have life everlasting. ℟. Amen."], ["r", "16. Subinde pollicem, et inuncta loca abstergit bombacio, vel re simili.", "16. He then wipes his thumb and the anointed places with cotton or something similar."], ["r", "17. Stans ibidem extra cancellos deponit stolam violaceam, et sumit stolam albi coloris. Tunc ingreditur Baptisterium, in quod intrat etiam patrinus cum infante. Sacerdos ad Fontem interrogat, expresso nomine, baptizandum (singulos baptizandos), patrino respondente:", "17. Standing there outside the railing, he lays aside the violet stole and takes a white one. He then enters the baptistery, into which the godparent also enters with the child. At the font the priest questions the one to be baptized (each one), calling him by name, the godparent answering:"], ["t", "N., Credis in Deum Patrem omnipoténtem, Creatórem cæli et terræ? ℟. Credo.", "N., do you believe in God the Father almighty, Creator of heaven and earth? ℟. I do believe."], ["t", "Credis in Jesum Christum, Fílium ejus únicum, Dóminum nostrum, natum, et passum? ℟. Credo.", "Do you believe in Jesus Christ, His only Son, our Lord, who was born and who suffered? ℟. I do believe."], ["t", "Credis et in Spíritum Sanctum, sanctam Ecclésiam cathólicam, Sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, et vitam ætérnam? ℟. Credo.", "Do you also believe in the Holy Spirit, the holy catholic Church, the communion of Saints, the forgiveness of sins, the resurrection of the body, and life everlasting? ℟. I do believe."], ["r", "18. Subinde, expresso nomine baptizandi, Sacerdos dicit (singulariter singulis):", "18. Then, naming the one to be baptized, the priest says (to each individually):"], ["t", "N., Vis baptizári?", "N., do you wish to be baptized?"], ["t", "*Respondet patrinus:* Volo.", "*The godparent answers:* I do."], ["r", "19. Tunc patrino, vel matrina, vel utroque (si ambo admittantur) infantem tenente, Sacerdos vasculo, seu urceolo accipit aquam baptismalem, et eam ter fundit super caput infantis in modum crucis, et simul verba proferens, semel tantum distincte, et attente, dicit (singulariter singulis):", "19. Then, while the godfather or godmother, or both (if both are admitted), hold the child, the priest takes baptismal water in a small vessel or pitcher and pours it three times on the child's head in the form of a cross, at the same time saying the words once only, distinctly and attentively (to each individually):"], ["t", "N., Ego te baptízo in nómine Patris, *(fundit primo)* et Fílii, *(fundit secundo)* et Spíritus ✠ Sancti. *(fundit tertio)*", "N., I baptize you in the name of the Father, *(he pours the first time)* and of the Son, *(he pours the second time)* and of the Holy ✠ Spirit. *(he pours the third time)*"], ["r", "20. Ubi autem est consuetudo baptizandi per immersionem, Sacerdos accipit infantem, et, advertens ne lædatur, caute immergit, et trina immersione baptizat, et semel tantum dicit:", "20. Where the custom is to baptize by immersion, the priest takes the child and, taking care that it is not harmed, carefully immerses it, baptizing it by a threefold immersion, and says only once:"], ["t", "N., Ego te baptízo in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti.", "N., I baptize you in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit."], ["r", "21. Mox patrinus, vel matrina, vel uterque simul infantem de sacro Fonte levant, suscipientes illum de manu Sacerdotis.", "21. Then the godfather or godmother, or both together, raise the child from the sacred font, receiving it from the hand of the priest."], ["r", "22. Si vero dubitetur, an infans fuerit baptizatus, utatur hac forma:", "22. If there is doubt whether the child has already been baptized, this form is used:"], ["t", "N., Si non es baptizátus (-a), ego te baptízo in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti.", "N., if you are not baptized, I baptize you in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit."], ["r", "23. Deinde intingit pollicem in sacro Chrismate, et ungit infantem in summitate capitis in modum crucis, dicens (singulariter singulis):", "23. Then he dips his thumb in the holy chrism and anoints the child on the crown of the head in the form of a cross, saying (to each individually):"], ["t", "Deus omnípotens, Pater Dómini nostri Jesu Christi, qui te regenerávit ex aqua et Spíritu Sancto, quique dedit tibi remissiónem ómnium peccatórum, *(hic inungit)* ipse te líniat ✠ Chrísmate salútis in eódem Christo Jesu Dómino nostro in vitam ætérnam. ℟. Amen.", "May almighty God, the Father of our Lord Jesus Christ, who has given you new birth by water and the Holy Spirit and has granted you the forgiveness of all your sins, *(here he anoints)* Himself anoint you ✠ with the chrism of salvation in the same Christ Jesus our Lord unto life everlasting. ℟. Amen."], ["t", "*Sacerdos:* Pax tibi. ℟. Et cum spíritu tuo.", "*Priest:* Peace be with you. ℟. And with your spirit."], ["r", "24. Tum bombacio, vel re simili, abstergit pollicem, et locum inunctum, et imponit capiti ejus linteolum candidum loco vestis albæ, dicens (singulariter singulis):", "24. Then with cotton or something similar he wipes his thumb and the anointed place, and lays a white linen cloth on the child's head in place of the white garment, saying (to each individually):"], ["t", "Accipe vestem cándidam, quam pérferas immaculátam ante tribúnal Dómini nostri Jesu Christi, ut hábeas vitam ætérnam. ℟. Amen.", "Receive this white garment, and carry it without stain before the judgment seat of our Lord Jesus Christ, that you may have life everlasting. ℟. Amen."], ["r", "25. Postea dat ei, vel patrino, candelam accensam, dicens (singulariter singulis):", "25. Then he gives to the child, or to the godparent, a lighted candle, saying (to each individually):"], ["t", "Accipe lámpadem ardéntem, et irreprehensíbilis custódi Baptísmum tuum: serva Dei mandáta, ut, cum Dóminus vénerit ad núptias, possis occúrrere ei una cum ómnibus Sanctis in aula cælésti, et vivas in sǽcula sæculórum. ℟. Amen.", "Receive this burning light, and keep your Baptism so as to be without blame. Keep the commandments of God, so that when the Lord comes to the wedding feast, you may go out to meet Him together with all the Saints in the heavenly court, and may live for ever and ever. ℟. Amen."], ["r", "26. Postremo dicit (in plurali pro pluribus):", "26. Lastly he says (in the plural for several):"], ["t", "N., Vade (Ite) in pace, et Dóminus sit tecum (vobíscum). ℟. Amen.", "N., go in peace, and the Lord be with you. ℟. Amen."], ["h", "Rubricæ", "Rubrics"], ["r", "27. Ritus superius descriptus servandus est etiam a Diacono Baptismum sollemnem ministrante, qui tamen sale et aqua utetur a Sacerdote ad hunc usum rite prius benedictis.", "27. The rite described above is to be observed also by a deacon administering solemn Baptism; he shall, however, use salt and water previously blessed for this purpose by a priest."], ["r", "28. Si vero sint plures baptizandi, sive masculi, sive feminæ, in catechismo masculi statuantur ad dexteram, feminæ vero ad sinistram; et omnia pariter dicantur ut supra, in proprio genere, et numero plurali. Verum prima nominis interrogatio, exsufflatio, crucis impressio, seu signatio, tactus aurium et narium cum saliva, abrenuntiationis interrogatio, unctio Olei Catechumenorum, interrogatio de Fide, seu Symbolo, et ipse Baptismus, inunctio Chrismatis, candidæ vestis impositio, atque accensæ candelæ traditio, singulariter singulis, et primum masculis, deinde feminis, fieri debent.", "28. If there are several to be baptized, whether boys or girls, the boys are placed on the right during the catechism and the girls on the left; and everything is said as above in the proper gender and in the plural. But the first questioning by name, the breathing, the imposition or signing of the cross, the touching of the ears and nostrils with spittle, the questioning on the renunciation, the anointing with the oil of catechumens, the questioning on the faith or Creed, the Baptism itself, the anointing with chrism, the giving of the white garment, and the handing over of the lighted candle are to be done for each individually, first for the boys and then for the girls."], ["r", "Sed pro majori commoditate adnotatum est propriis locis in rubricis parenthesi notatis; ita ut quando dicitur in tali rubrica singulariter singulis, intellegatur quod illa verba, vel actiones, usque ad aliam rubricam dici, vel fieri debent singulariter singulis, et primum masculis, deinde feminis, mutato solum genere, ut dictum est supra. Quando vero in simili rubrica dicitur in plurali pro pluribus, intellegatur, quod illa verba usque ad aliam rubricam dici debent semel, sed pro pluribus in plurali, mutato solum genere, si omnes sint feminæ.", "For greater convenience this is noted in parentheses in the rubrics at the proper places: when such a rubric says \"to each individually,\" the words or actions up to the next rubric are to be said or done for each individually, first for the boys and then for the girls, changing only the gender, as said above. When a similar rubric says \"in the plural for several,\" the words up to the next rubric are said once, but in the plural for all, changing only the gender if all are girls."], ["r", "29. Si infans, vel adultus ægrotus adeo graviter laboret, ut periculum immineat, ne pereat antequam Baptismus perficiatur, Sacerdos, omissis quæ Baptismum præcedunt, eum baptizet, ter, vel etiam semel infundens aquam super caput ejus in modum crucis, dicens: Ego te baptízo in nómine Patris, etc., ut supra. Si non habeatur aqua Baptismalis, et periculum impendeat, Sacerdos utatur aqua simplici. Deinde si habeat Chrisma, liniat eum in vertice, dicens: Deus omnípotens, etc., ut supra. Postea dat ei linteolum candidum, dicens: Accipe vestem, etc., ut supra. Ac demum dat ei ceream candelam accensam, dicens: Accipe lámpadem, ut supra. Si supervixerit, suppleantur alii ritus omissi.", "29. If a child, or a sick adult, is in such grave danger that he may die before the Baptism is completed, the priest, omitting what precedes the Baptism, baptizes him, pouring water on his head three times, or even once, in the form of a cross, saying: N., I baptize you in the name of the Father, etc., as above. If baptismal water is not at hand and danger is imminent, the priest uses ordinary water. Then, if he has the chrism, he anoints him on the crown of the head, saying: May almighty God, etc., as above. Afterward he gives him the white cloth, saying: Receive this white garment, etc., as above. Finally he gives him a lighted wax candle, saying: Receive this burning light, as above. If the person survives, the other rites that were omitted are to be supplied."], ["r", "30. Si plures sint baptizandi, et periculum mortis immineat, tempusque non suppetat, ut singuli separatim baptizentur, poterit minister singulorum capitibus aquam infundens omnes simul baptizare, dicendo: Ego vos baptízo in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti. Quam tamen formam ad plures simul baptizandos solum in mortis periculo, et ubi tempus non patiatur, ut singuli separatim baptizentur, alias numquam licet adhibere.", "30. If there are several to be baptized, danger of death is imminent, and there is not time to baptize each one separately, the minister may baptize them all together, pouring water on the head of each and saying: I baptize you all in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit. This form for baptizing several at once may be used only in danger of death and when time does not allow each to be baptized separately; otherwise it is never permitted."], ["r", "31. Admonendi sunt susceptores de spirituali cognatione, quam contraxerunt cum baptizato; quæ cognatio impedit Matrimonium, ac dirimit.", "31. The sponsors are to be reminded of the spiritual relationship they have contracted with the one baptized, a relationship that is an impediment to marriage and renders it invalid."], ["r", "32. Curet Parochus parentes infantis admoneri, ne in lecto secum ipsi, vel nutrices parvulum habeant, propter oppressionis periculum; sed eum diligenter custodiant, et opportune ad christianam disciplinam instituant.", "32. The pastor should see that the child's parents are warned not to keep the little one in bed with them, nor let nurses do so, because of the danger of smothering; but to watch over it carefully and, in due time, bring it up in the Christian way of life."], ["r", "33. Commonendi sunt etiam parentes, et alii, si opus fuerit, ne filios hebræis, aliisve infidelibus, vel hæreticis mulieribus ullo modo lactandos, aut nutriendos tradant.", "33. Parents and others are also to be warned, if need be, not to give their children in any way to be nursed or raised by Jewish, other non-Christian, or heretical women."], ["r", "34. Antequam infans ex ecclesia asportetur, aut susceptores discedant, eorum nomina, et alia de administrato Baptismo ad præscriptam formam in Baptismali libro Parochus accurate describat.", "34. Before the child is carried out of the church or the sponsors leave, the pastor is carefully to record their names and the other particulars of the Baptism in the baptismal register, in the prescribed form."], ["r", "35. Si Baptismus nec a proprio Parocho nec eo præsente administratus fuerit, minister de ipso collato quamprimum proprium ratione domicilii Parochum baptizati certiorem reddat.", "35. If the Baptism was administered neither by the proper pastor nor in his presence, the minister is to inform the pastor of the baptized person's domicile as soon as possible that it has been conferred."], ["r", "36. Ad collatum Baptismum comprobandum, si nemini fiat præjudicium, satis est unus testis omni exceptione major, vel ipsius baptizati jusjurandum, si ipse in adulta ætate Baptismum receperit.", "36. To prove that Baptism has been conferred, provided no one's rights are prejudiced, one entirely trustworthy witness suffices, or the sworn statement of the baptized person himself if he received Baptism as an adult."]]}, {"id": "marriage", "la": "Ritus Celebrandi Matrimonii Sacramentum", "en": "The Rite for Celebrating the Sacrament of Matrimony", "cat": "Sacraments", "ref": "Tit. VII, cap. 2", "b": [["r", "1. Parochus Matrimonio adfuturus, publicationibus factis ut dictum est, si nullum obstet legitimum impedimentum, in ecclesia, superpelliceo et stola alba indutus, adhibito uno saltem Clerico superpelliceo pariter induto, qui librum et vas aquæ benedictæ cum aspersorio deferat, coram duobus saltem testibus, virum et mulierem ante altare genuflexos, quos parentum vel propinquorum suorum præsentia cohonestari decet, de consensu in Matrimonium interroget, utrumque singillatim in hunc modum vulgari sermone:", "1. The pastor who is to assist at the marriage, the banns having been published as prescribed, and no lawful impediment standing in the way, vested in surplice and white stole in the church, and attended by at least one cleric likewise in surplice who carries the book and the vessel of holy water with the sprinkler, in the presence of at least two witnesses, questions the man and the woman, kneeling before the altar (whom the presence of their parents or relatives should honor), about their consent to marriage, each one separately, in the vernacular, in this manner:"], ["r", "Et primo quidem sponsum interroget:", "And first he questions the bridegroom:"], ["t", "N., Vis accípere N., hic præséntem, in tuam legítimam uxórem juxta ritum sanctæ matris Ecclésiæ?", "N., will you take N., here present, for your lawful wife, according to the rite of our holy Mother the Church?"], ["t", "*Respondeat sponsus:* Volo.", "*The bridegroom answers:* I will."], ["r", "2. Mox Sacerdos sponsam interroget:", "2. Then the priest questions the bride:"], ["t", "N., Vis accípere N., hic præséntem, in tuum legítimum marítum juxta ritum sanctæ matris Ecclésiæ?", "N., will you take N., here present, for your lawful husband, according to the rite of our holy Mother the Church?"], ["t", "*Respondeat sponsa:* Volo.", "*The bride answers:* I will."], ["r", "Nec sufficit consensus unius, sed debet esse amborum, et expressus verbis, si loqui possint, aut, secus, æquipollentibus signis, sive fiat per se, sive per procuratorem.", "The consent of one alone does not suffice; it must be the consent of both, expressed in words if they can speak, or otherwise by equivalent signs, whether given in person or through a proxy."], ["r", "Mutuo autem contrahentium consensu intellecto, Sacerdos jubeat eos invicem jungere dexteras, et dicat:", "The mutual consent of the parties having been ascertained, the priest bids them join their right hands, and says:"], ["t", "Ego conjúngo vos in matrimónium. In nómine Patris, ✠ et Fílii, et Spíritus Sancti. Amen.", "I join you together in marriage. In the name of the Father, ✠ and of the Son, and of the Holy Spirit. Amen."], ["r", "Vel aliis utatur verbis juxta receptum uniuscujusque loci ritum. Postea eos aspergat aqua benedicta. Mox benedicat anulum, dicens:", "Or he may use other words according to the accepted rite of each place. Then he sprinkles them with holy water. Next he blesses the ring, saying:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Bene✠dic, Dómine, ánulum hunc, quem nos in tuo nómine bene✠dícimus, ut, quæ eum gestáverit, fidelitátem íntegram suo sponso tenens, in pace et voluntáte tua permáneat atque in mútua caritáte semper vivat. Per Christum, Dóminum nostrum. ℟. Amen.", "Bless ✠, O Lord, this ring, which we ✠ bless in Your name, so that she who wears it, keeping faith unbroken with her husband, may abide in peace and in Your will, and live always in mutual love. Through Christ our Lord. ℟. Amen."], ["r", "3. Deinde Sacerdos aspergat anulum aqua benedicta; et sponsus acceptum anulum de manu Sacerdotis imponat in digito anulari sinistræ manus sponsæ, Sacerdote dicente:", "3. Then the priest sprinkles the ring with holy water; and the bridegroom, receiving the ring from the hand of the priest, places it on the ring finger of the bride's left hand, while the priest says:"], ["t", "In nómine Patris, et Fílii, ✠ et Spíritus Sancti. Amen.", "In the name of the Father, and of the Son, ✠ and of the Holy Spirit. Amen."], ["r", "Mox Sacerdos subjungat:", "Then the priest adds:"], ["v", "Confírma hoc, Deus, quod operátus es in nobis.", "Confirm, O God, what You have wrought in us."], ["x", "A templo sancto tuo, quod est in Jerúsalem.", "From Your holy temple, which is in Jerusalem."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants."], ["x", "Deus meus, sperántes in te.", "Who hope in You, O my God."], ["v", "Mitte eis, Dómine, auxílium de sancto.", "Send them help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eos.", "And defend them out of Sion."], ["v", "Esto eis, Dómine, turris fortitúdinis.", "Be to them, O Lord, a tower of strength."], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Réspice, quǽsumus, Dómine, super hos fámulos tuos: et institútis tuis, quibus propagatiónem humáni géneris ordinásti, benígnus assíste; ut, qui te auctóre jungúntur, te auxiliánte servéntur. Per Christum, Dóminum nostrum. ℟. Amen.", "Look down, we beseech You, O Lord, upon these Your servants, and graciously uphold the institution You established for the continuance of the human race; so that those who are joined together by Your authority may be preserved by Your help. Through Christ our Lord. ℟. Amen."], ["r", "4. His expletis, si benedicendæ sint nuptiæ, Parochus Missam pro Sponso et Sponsa, ut in Missali Romano, celebret, servatis omnibus quæ ibi præscribuntur.", "4. When this is finished, if the nuptial blessing is to be given, the pastor celebrates the Mass for the Bridegroom and Bride as in the Roman Missal, observing everything prescribed there."], ["r", "5. Quando plures simul copulantur, accepto primum singulorum consensu, et rite celebratis singulis Matrimoniis, dictoque pro singulis a Parocho Ego conjúngo vos in matrimónium, etc., benedictiones anulorum et reliquæ benedictiones plurali numero semel fiunt.", "5. When several couples are married together, the consent of each couple is first received and each marriage duly celebrated, the pastor saying \"I join you together in marriage,\" etc., for each; the blessings of the rings and the remaining blessings are then given once, in the plural."], ["r", "6. Ceterum, sicubi aliæ laudabiles consuetudines et cæremoniæ in celebrando Matrimonii Sacramento adhibentur, eas convenit retineri.", "6. Moreover, wherever other praiseworthy customs and ceremonies are used in celebrating the Sacrament of Matrimony, it is fitting that they be retained."], ["r", "7. Celebrato Matrimonio, Parochus vel qui ejus vices gerit, quamprimum describat in libro Matrimoniorum nomina conjugum ac testium, locum et diem celebrati Matrimonii, atque alia juxta formulam præscriptam; idque licet alius Sacerdos vel a se vel ab Ordinario delegatus Matrimonio adstiterit. Præterea Parochus in libro quoque Baptizatorum adnotet conjugem tali die in sua parœcia Matrimonium contraxisse. Quod si conjux alibi baptizatus fuerit, Matrimonii Parochus notitiam initi contractus ad Parochum Baptismi sive per se sive per Curiam episcopalem transmittat, ut Matrimonium in Baptizatorum librum referatur.", "7. After the marriage, the pastor or the one taking his place is to record as soon as possible in the marriage register the names of the spouses and the witnesses, the place and date of the marriage, and the other particulars according to the prescribed form; and this even if another priest, delegated by him or by the Ordinary, assisted at the marriage. The pastor is also to note in the baptismal register that the spouse contracted marriage in his parish on such a day. If the spouse was baptized elsewhere, the pastor of the marriage is to send notice of it to the pastor of the place of baptism, either directly or through the diocesan curia, so that the marriage may be entered in the baptismal register."], ["h", "Ex Missali Romano: Missa pro Sponso et Sponsa", "From the Roman Missal: the Mass for the Bridegroom and Bride"], ["n", "", "Note: these prayers come from the Roman Missal, not the Rituale. After the Our Father of the Mass, before \"Deliver us, we beseech You,\" the priest turns to the bridegroom and bride kneeling before the altar and says over them the following prayers."], ["t", "Orémus.", "Let us pray."], ["t", "Propitiáre, Dómine, supplicatiónibus nostris, et institútis tuis, quibus propagatiónem humáni géneris ordinásti, benígnus assíste: ut, quod te auctóre júngitur, te auxiliánte servétur. Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Be favorable, O Lord, to our prayers, and graciously uphold the institution You established for the continuance of the human race; so that what is joined together by Your authority may be preserved by Your help. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui potestáte virtútis tuæ de níhilo cuncta fecísti: qui, dispósitis universitátis exórdiis, hómini, ad imáginem Dei facto, ídeo inseparábile mulíeris adjutórium condidísti, ut femíneo córpori de viríli dares carne princípium, docens, quod ex uno placuísset ínstitui, numquam licére disjúngi: Deus, qui tam excellénti mystério conjugálem cópulam consecrásti, ut Christi et Ecclésiæ sacraméntum præsignáres in fœdere nuptiárum: Deus, per quem múlier júngitur viro, et socíetas principáliter ordináta ea benedictióne donátur, quæ sola nec per originális peccáti pœnam nec per dilúvii est abláta senténtiam: réspice propítius super hanc fámulam tuam, quæ maritáli jungénda consórtio, tua se éxpetit protectióne muníri: sit in ea jugum dilectiónis et pacis: fidélis et casta nubat in Christo, imitatríxque sanctárum permáneat feminárum: sit amábilis viro suo, ut Rachel: sápiens, ut Rebécca: longǽva et fidélis, ut Sara: nihil in ea ex áctibus suis ille auctor prævaricatiónis usúrpet: nexa fídei mandatísque permáneat: uni thoro juncta, contáctus illícitos fúgiat: múniat infirmitátem suam róbore disciplínæ: sit verecúndia gravis, pudóre venerábilis, doctrínis cæléstibus erudíta: sit fœcúnda in sóbole, sit probáta et ínnocens: et ad beatórum réquiem atque ad cæléstia regna pervéniat: et vídeant ambo fílios filiórum suórum, usque in tértiam et quartam generatiónem, et ad optátam pervéniant senectútem. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who by the might of Your power made all things out of nothing; who, when the beginnings of the universe had been set in order, made for man, created in the image of God, the inseparable help of woman, giving the woman's body its origin from the flesh of man, and teaching that what it had pleased You to form from one may never lawfully be separated: O God, who consecrated the union of marriage by so excellent a mystery that in the covenant of wedlock You foreshadowed the sacrament of Christ and the Church: O God, by whom woman is joined to man, and that partnership, ordained from the beginning, is endowed with the one blessing that was taken away neither by the penalty of original sin nor by the sentence of the flood: look kindly upon this Your handmaid, who, about to be joined in marriage, seeks to be strengthened by Your protection. May the yoke she bears be one of love and peace. Faithful and chaste, may she marry in Christ, and remain a follower of holy women. May she be beloved of her husband, like Rachel; wise, like Rebecca; long-lived and faithful, like Sarah. May the author of sin claim nothing in her by her deeds. May she remain bound to the faith and the commandments; united to one husband, may she shun all unlawful contact; may she fortify her weakness with the strength of discipline. May she be grave in modesty, honorable in purity, learned in heavenly doctrine. May she be fruitful in offspring; may she be approved and innocent, and come at last to the rest of the blessed and to the kingdom of heaven. And may they both see their children's children to the third and fourth generation, and reach the old age they desire. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["n", "", "At the end of Mass, before the final blessing, the priest turns to the newly married and says:"], ["t", "Deus Abraham, Deus Isaac, et Deus Jacob sit vobíscum: et ipse adímpleat benedictiónem suam in vobis: ut videátis fílios filiórum vestrórum usque ad tértiam et quartam generatiónem, et póstea vitam ætérnam habeátis sine fine: adjuvánte Dómino nostro Jesu Christo, qui cum Patre et Spíritu Sancto vivit et regnat Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "May the God of Abraham, the God of Isaac, and the God of Jacob be with you, and may He fulfill His blessing in you, so that you may see your children's children to the third and fourth generation, and afterward have life everlasting without end; by the help of our Lord Jesus Christ, who with the Father and the Holy Spirit lives and reigns, God, for ever and ever. ℟. Amen."], ["n", "", "The Missal then directs the priest to exhort the couple to remain faithful to one another and to live in the fear of the Lord, and to sprinkle them with holy water."]]}, {"id": "nuptial-blessing-outside-mass", "la": "Benedictio Nuptialis extra Missam", "en": "The Nuptial Blessing outside Mass", "cat": "Sacraments", "ref": "Appendix, De Matrimonio, I", "b": [["r", "Expleto ritu celebrandi Matrimonii sacramentum, post Orationem Réspice, etc., si permittatur benedictio nuptialis, sed non dicatur Missa, Sacerdos qui speciale indultum a Sancta Sede obtinuerit, ad neo-conjugatos conversus, dicit Psalmum sequentem:", "When the rite of celebrating the Sacrament of Matrimony is finished, after the prayer \"Look down,\" etc., if the nuptial blessing is permitted but Mass is not said, a priest who has obtained a special indult from the Holy See, turning to the newly married, says the following psalm:"], ["h", "Psalmus 127", "Psalm 127"], ["t", "Beáti omnes, qui timent Dóminum, * qui ámbulant in viis ejus.", "Blessed are all who fear the Lord, * who walk in His ways."], ["t", "Labóres mánuum tuárum quia manducábis: * beátus es, et bene tibi erit.", "For you shall eat the labors of your hands; * blessed are you, and it shall be well with you."], ["t", "Uxor tua sicut vitis abúndans, * in latéribus domus tuæ.", "Your wife shall be like a fruitful vine * on the sides of your house."], ["t", "Fílii tui sicut novéllæ olivárum, * in circúitu mensæ tuæ.", "Your children like olive shoots * round about your table."], ["t", "Ecce, sic benedicétur homo, * qui timet Dóminum.", "Behold, thus shall the man be blessed * who fears the Lord."], ["t", "Benedícat tibi Dóminus ex Sion: * et vídeas bona Jerúsalem ómnibus diébus vitæ tuæ.", "May the Lord bless you out of Sion, * and may you see the good things of Jerusalem all the days of your life."], ["t", "Et vídeas fílios filiórum tuórum, * pacem super Israel.", "And may you see your children's children, * peace upon Israel."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Bene✠dic, Dómine, et réspice de cælis super hanc conjunctiónem: et sicut misísti sanctum Angelum tuum Raphaélem pacíficum ad Tobíam et Saram, fíliam Raguélis; ita dignéris, Dómine, míttere benedictiónem tuam super hos cónjuges, ut in tua benedictióne permáneant, in tua voluntáte persístant, et in tuo amóre vivant. Per Christum, Dóminum nostrum. ℟. Amen.", "Bless ✠, O Lord, and look down from heaven upon this union; and as You sent Your holy Angel Raphael, the bringer of peace, to Tobias and Sara, the daughter of Raguel, so deign, O Lord, to send Your blessing upon this husband and wife, that they may abide in Your blessing, persevere in Your will, and live in Your love. Through Christ our Lord. ℟. Amen."], ["r", "Deinde elevatis manibus et extensis super capita eorum, ministro librum tenente, dicit:", "Then, with hands raised and extended over their heads, the server holding the book, he says:"], ["t", "Dóminus Deus omnípotens benedícat vos, impleátque benedictiónem in vobis, et videátis fílios filiórum vestrórum usque in tértiam et quartam generatiónem et progéniem, et ad optátam perveniátis senectútem. Per Christum, Dóminum nostrum. ℟. Amen.", "May the Lord God almighty bless you and fulfill His blessing in you; may you see your children's children to the third and fourth generation and beyond, and reach the old age you desire. Through Christ our Lord. ℟. Amen."]]}, {"id": "prayers-over-spouses", "la": "Preces super Conjuges", "en": "Prayers over the Spouses when the Nuptial Blessing is not Permitted", "cat": "Sacraments", "ref": "Appendix, De Matrimonio, II", "b": [["r", "Si sponsa sit vidua jam in primis nuptiis benedicta, vel etiam si prima vice nubat, sed tempore clauso, expleto ritu celebrandi Matrimonii sacramentum, post Orationem Réspice, etc., Sacerdos, qui speciale indultum a Sancta Sede obtinuerit, ad neo-conjugatos conversus, dicit Psalmum 127, Beáti omnes, ut supra, cum Glória Patri; deinde:", "If the bride is a widow who already received the blessing at her first marriage, or if she is marrying for the first time but during the closed season, then after the rite of celebrating the Sacrament of Matrimony and the prayer \"Look down,\" etc., a priest who has obtained a special indult from the Holy See, turning to the newly married, says Psalm 127, \"Blessed are all,\" as above, with the Glory be; then:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Preténde, quǽsumus, Dómine, fidélibus tuis déxteram cæléstis auxílii, ut te toto corde perquírant, et quæ digne póstulant, assequántur. Per Christum, Dóminum nostrum. ℟. Amen.", "Stretch forth, O Lord, we beseech You, the right hand of heavenly help to Your faithful, that they may seek You with all their heart and obtain what they worthily ask. Through Christ our Lord. ℟. Amen."]]}, {"id": "churching", "la": "Benedictio Mulieris post Partum", "en": "The Blessing of a Mother after Childbirth (Churching)", "cat": "Sacraments", "ref": "Tit. VII, cap. 3", "b": [["r", "1. Si qua puerpera post partum, juxta piam ac laudabilem consuetudinem, ad ecclesiam venire voluerit, pro incolumitate sua Deo gratias actura, petieritque a Sacerdote benedictionem, ipse superpelliceo et stola alba indutus, cum ministro aspersorium deferente, ad fores ecclesiæ accedat, ubi illam foris ad limina genuflectentem et candelam accensam in manu tenentem, aqua benedicta aspergat, deinde dicat:", "1. If a mother after childbirth, following the pious and praiseworthy custom, wishes to come to the church to give thanks to God for her safe delivery, and asks the priest for a blessing, he, vested in surplice and white stole, with a server carrying the sprinkler, goes to the door of the church, where she kneels outside at the threshold holding a lighted candle in her hand. He sprinkles her with holy water and then says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "*Ant.* Hæc accípiet.", "*Ant.* She shall receive."], ["h", "Psalmus 23", "Psalm 23"], ["t", "Dómini est terra, et plenitúdo ejus: * orbis terrárum, et univérsi qui hábitant in eo.", "The earth is the Lord's and the fullness thereof, * the world and all who dwell in it."], ["t", "Quia ipse super mária fundávit eum: * et super flúmina præparávit eum.", "For He has founded it upon the seas, * and established it upon the rivers."], ["t", "Quis ascéndet in montem Dómini? * aut quis stabit in loco sancto ejus?", "Who shall ascend the mountain of the Lord? * Or who shall stand in His holy place?"], ["t", "Innocens mánibus et mundo corde, * qui non accépit in vano ánimam suam, nec jurávit in dolo próximo suo.", "The innocent of hands and clean of heart, * who has not set his soul on vain things, nor sworn deceitfully to his neighbor."], ["t", "Hic accípiet benedictiónem a Dómino: * et misericórdiam a Deo, salutári suo.", "He shall receive a blessing from the Lord, * and mercy from God his Savior."], ["t", "Hæc est generátio quæréntium eum, * quæréntium fáciem Dei Jacob.", "Such is the generation of those who seek Him, * who seek the face of the God of Jacob."], ["t", "Attóllite portas, príncipes, vestras, et elevámini, portæ æternáles: * et introíbit Rex glóriæ.", "Lift up your gates, O princes, and be lifted up, O eternal gates, * and the King of glory shall enter in."], ["t", "Quis est iste Rex glóriæ? * Dóminus fortis et potens: Dóminus potens in prǽlio.", "Who is this King of glory? * The Lord, strong and mighty; the Lord, mighty in battle."], ["t", "Attóllite portas, príncipes, vestras, et elevámini, portæ æternáles: * et introíbit Rex glóriæ.", "Lift up your gates, O princes, and be lifted up, O eternal gates, * and the King of glory shall enter in."], ["t", "Quis est iste Rex glóriæ? * Dóminus virtútum ipse est Rex glóriæ.", "Who is this King of glory? * The Lord of hosts, He is the King of glory."], ["t", "Glória Patri.", "Glory be to the Father."], ["r", "Et repetitur Antiphona:", "And the antiphon is repeated:"], ["t", "*Ant.* Hæc accípiet benedictiónem a Dómino, et misericórdiam a Deo, salutári suo: quia hæc est generátio quæréntium Dóminum.", "*Ant.* She shall receive a blessing from the Lord, and mercy from God her Savior; for she is of the generation of those who seek the Lord."], ["r", "2. Deinde porrigens ad manum mulieris extremam partem stolæ, ex humero sinistro pendentem, eam introducit in ecclesiam, dicens:", "2. Then, extending to the woman's hand the end of the stole hanging from his left shoulder, he leads her into the church, saying:"], ["t", "Ingrédere in templum Dei, adóra Fílium beátæ Maríæ Vírginis, qui tibi fecunditátem tríbuit prolis.", "Enter into the temple of God; adore the Son of the Blessed Virgin Mary, who has given you the blessing of a child."], ["r", "3. Et ipsa, ingressa, genuflectit coram Altari et orat, gratias agens Deo de beneficiis sibi collatis; tunc Sacerdos dicit:", "3. Having entered, she kneels before the altar and prays, thanking God for the blessings bestowed on her; then the priest says:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvam fac ancíllam tuam, Dómine.", "Save Your handmaid, O Lord."], ["x", "Deus meus, sperántem in te.", "Who hopes in You, O my God."], ["v", "Mitte ei, Dómine, auxílium de sancto.", "Send her help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eam.", "And defend her out of Sion."], ["v", "Nihil profíciat inimícus in ea.", "Let the enemy have no power over her."], ["x", "Et fílius iniquitátis non appónat nocére ei.", "And let the son of iniquity do nothing to harm her."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui per beátæ Maríæ Vírginis partum fidélium pariéntium dolóres in gáudium vertísti: réspice propítius super hanc fámulam tuam, ad templum sanctum tuum pro gratiárum actióne lætam accedéntem, et præsta; ut post hanc vitam, ejúsdem beátæ Maríæ méritis et intercessióne, ad ætérnæ beatitúdinis gáudia cum prole sua perveníre mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who through the child-bearing of the Blessed Virgin Mary have turned into joy the pains of the faithful in childbirth, look kindly upon this Your handmaid, who comes joyfully to Your holy temple to give thanks; and grant that after this life, by the merits and intercession of the same Blessed Mary, she may be worthy to attain, together with her child, the joys of everlasting happiness. Through Christ our Lord. ℟. Amen."], ["r", "4. Deinde illam aspergit iterum aqua benedicta, dicens:", "4. Then he sprinkles her again with holy water, saying:"], ["t", "Pax et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the peace and blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "5. Prædicta benedictio mulieris post partum fieri debet a Parocho, si expetitus ipse fuerit: potest autem fieri a quocumque Sacerdote, si expetitus pariter fuerit, in quacumque ecclesia vel oratorio publico, certiore facto Superiore ecclesiæ.", "5. This blessing of a mother after childbirth should be given by the pastor if he is asked; but it may be given by any priest who is likewise asked, in any church or public oratory, the rector of the church having been informed."]]}, {"id": "general-rules", "la": "De Benedictionibus: Regulæ Generales", "en": "On Blessings: General Rules", "cat": "General", "ref": "Tit. VIII, cap. 1", "b": [["r", "1. Benedictiones impertire potest quilibet Presbyter, exceptis iis quæ Romano Pontifici aut Episcopis aliisve reserventur. Benedictio reservata quæ a Presbytero detur sine necessaria licentia, illicita est, sed valida, nisi in reservatione Sedes Apostolica aliud expresserit. Diaconi et Lectores illas tantum valide et licite benedictiones dare possunt, quæ ipsis expresse a jure permittuntur.", "1. Any priest may impart blessings, except those reserved to the Roman Pontiff, to bishops, or to others. A reserved blessing given by a priest without the necessary permission is unlawful but valid, unless the Apostolic See has stated otherwise in making the reservation. Deacons and lectors can validly and lawfully give only those blessings expressly permitted to them by law."], ["r", "2. Benedictiones sive constitutivæ sive invocativæ invalidæ sunt, si adhibita non fuerit formula ab Ecclesia præscripta.", "2. Blessings, whether constitutive or invocative, are invalid if the formula prescribed by the Church has not been used."], ["r", "3. Benedictiones, imprimis impertiendæ catholicis, dari quoque possunt catechumenis, immo, nisi obstet Ecclesiæ prohibitio, etiam acatholicis ad obtinendum fidei lumen vel, una cum illo, corporis sanitatem.", "3. Blessings, which are to be given first of all to Catholics, may also be given to catechumens, and even, unless a prohibition of the Church stands in the way, to non-Catholics, to obtain for them the light of faith or, together with it, bodily health."], ["r", "4. Res benedictæ constitutiva benedictione, reverenter tractentur neque ad usum profanum vel non proprium adhibeantur, etiamsi in dominio privatorum sint.", "4. Things blessed with a constitutive blessing are to be treated with reverence and are not to be put to profane or improper use, even if they are privately owned."], ["r", "5. Benedictionem illius sacræ supellectilis quæ ad normam legum liturgicarum benedici debet antequam ad usum sibi proprium adhibeatur, impertire possunt: 1° S. R. E. Cardinales et Episcopi omnes; 2° Locorum Ordinarii, charactere episcopali carentes, pro ecclesiis et oratoriis proprii territorii; 3° Parochus pro ecclesiis et oratoriis in territorio suæ parœciæ positis, et rectores ecclesiarum pro suis ecclesiis; 4° Sacerdotes a loci Ordinario delegati, intra fines delegationis et jurisdictionis delegantis; 5° Superiores religiosi, et Sacerdotes ejusdem religionis ab ipsis delegati, pro propriis ecclesiis et oratoriis ac pro ecclesiis monialium sibi subjectarum.", "5. The blessing of those sacred furnishings which, according to the liturgical laws, must be blessed before being put to their proper use may be given by: (1) the Cardinals of the Holy Roman Church and all bishops; (2) local Ordinaries who are not bishops, for the churches and oratories of their own territory; (3) the pastor, for the churches and oratories within the territory of his parish, and rectors of churches for their own churches; (4) priests delegated by the local Ordinary, within the limits of the delegation and of the delegating person's jurisdiction; (5) religious superiors, and priests of the same institute delegated by them, for their own churches and oratories and for the churches of nuns subject to them."], ["r", "6. In omni benedictione extra Missam, Sacerdos saltem superpelliceo et stola coloris tempori convenientis utatur, nisi aliter notetur.", "6. For every blessing outside Mass the priest wears at least a surplice and a stole of the color suited to the season, unless otherwise noted."], ["r", "7. Stando semper benedicat, et aperto capite. In principio cujusque benedictionis, nisi aliter notetur, dicat:", "7. He always blesses standing and with head uncovered. At the beginning of each blessing, unless otherwise noted, he says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["r", "Deinde dicat Orationem propriam, unam vel plures, prout suo loco notatum fuerit. Postea rem aspergat aqua benedicta, et, ubi notatum fuerit, pariter incenset, nihil dicendo.", "Then he says the proper prayer, one or more, as noted in each place. Afterward he sprinkles the object with holy water and, where so noted, incenses it as well, saying nothing."], ["r", "8. Cum Sacerdos aliquid benedicturus est, habeat ministrum cum vase aquæ benedictæ et aspersorio, et cum hoc Rituali libro, seu Missali.", "8. When the priest is about to bless something, he should have a server with the vessel of holy water and the sprinkler, and with this Ritual or the Missal."], ["r", "9. Caveat, ne benedictionis causa ponat aliquid indecens super Altare, veluti esculenta; sed quod ejusmodi est, ponatur super mensam, commodo loco paratam.", "9. He must take care not to place anything unbecoming on the altar for the purpose of blessing it, such as food; things of that kind are to be placed on a table prepared in a convenient place."]]}, {"id": "holy-water", "la": "Ordo ad Faciendam Aquam Benedictam", "en": "The Order for Making Holy Water", "cat": "Holy Water", "ref": "Tit. VIII, cap. 2", "b": [["r", "1. Diebus Dominicis, et quandocumque opus sit, præparato sale et aqua munda benedicenda in ecclesia, vel in sacristia, Sacerdos, superpelliceo et stola violacea indutus, primo dicit:", "1. On Sundays, and whenever it is needed, salt and clean water to be blessed having been prepared in the church or in the sacristy, the priest, vested in surplice and violet stole, first says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["r", "2. Deinde absolute incipit exorcismum salis.", "2. Then he begins the exorcism of the salt directly."], ["h", "Exorcismus salis", "Exorcism of the salt"], ["t", "Exorcízo te, creatúra salis, per Deum ✠ vivum, per Deum ✠ verum, per Deum ✠ sanctum, per Deum, qui te per Eliséum Prophétam in aquam mitti jussit, ut sanarétur sterílitas aquæ: ut efficiáris sal exorcizátum in salútem credéntium; et sis ómnibus suméntibus te sánitas ánimæ et córporis; et effúgiat, atque discédat a loco, in quo aspérsum fúeris, omnis phantásia, et nequítia, vel versútia diabólicæ fraudis, omnísque spíritus immúndus, adjurátus per eum, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of salt, by the ✠ living God, by the ✠ true God, by the ✠ holy God, by God who commanded you to be cast into the water by the prophet Elisha, that its barrenness might be healed: that you may become exorcised salt for the salvation of believers; that you may be health of soul and body to all who take you; and that from the place where you are sprinkled every illusion and wickedness and cunning of the devil's deceit may flee and depart, together with every unclean spirit, adjured by Him who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Imménsam cleméntiam tuam, omnípotens ætérne Deus, humíliter implorámus, ut hanc creatúram salis, quam in usum géneris humáni tribuísti, bene✠dícere et sancti✠ficáre tua pietáte dignéris: ut sit ómnibus suméntibus salus mentis et córporis; et quidquid ex eo tactum vel respérsum fúerit, cáreat omni immundítia, omníque impugnatióne spiritális nequítiæ. Per Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, we humbly implore Your boundless mercy, that in Your goodness You would deign to ✠ bless and ✠ sanctify this creature of salt, which You have given for the use of mankind, so that it may be health of mind and body to all who take it; and that whatever is touched or sprinkled with it may be free from all uncleanness and from every attack of spiritual wickedness. Through our Lord. ℟. Amen."], ["h", "Exorcismus aquæ (dicitur absolute)", "Exorcism of the water (said directly)"], ["t", "Exorcízo te, creatúra aquæ, in nómine Dei ✠ Patris omnipoténtis, et in nómine Jesu ✠ Christi, Fílii ejus, Dómini nostri, et in virtúte Spíritus ✠ Sancti: ut fias aqua exorcizáta ad effugándam omnem potestátem inimíci, et ipsum inimícum eradicáre et explantáre váleas cum ángelis suis apostáticis, per virtútem ejúsdem Dómini nostri Jesu Christi: qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of water, in the name of God the ✠ Father almighty, and in the name of Jesus ✠ Christ, His Son, our Lord, and in the power of the Holy ✠ Spirit: that you may become water exorcised to put to flight every power of the enemy, and that you may be able to uproot and cast out the enemy himself with his apostate angels, by the power of the same Jesus Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui ad salútem humáni géneris, máxima quæque sacraménta in aquárum substántia condidísti: adésto propítius invocatiónibus nostris, et eleménto huic multímodis purificatiónibus præparáto, virtútem tuæ bene✠dictiónis infúnde; ut creatúra tua, mystériis tuis sérviens, ad abigéndos dæmones, morbósque pelléndos, divínæ grátiæ sumat efféctum; ut quidquid in dómibus, vel in locis fidélium, hæc unda respérserit, cáreat omni immundítia, liberétur a noxa: non illic resídeat spíritus péstilens, non aura corrúmpens: discédant omnes insídiæ laténtis inimíci; et si quid est, quod aut incolumitáti habitántium ínvidet, aut quiéti, aspersióne hujus aquæ effúgiat: ut salúbritas per invocatiónem sancti tui nóminis expetíta, ab ómnibus sit impugnatiónibus defénsa. Per Dóminum nostrum. ℟. Amen.", "O God, who for the salvation of mankind have built Your greatest sacraments upon the substance of water: graciously hear our prayers, and pour forth the power of Your ✠ blessing upon this element, prepared by many kinds of purification; so that this Your creature, serving Your mysteries, may receive the effect of divine grace to drive away demons and to banish sickness; that whatever this water sprinkles in the homes or places of the faithful may be freed from all uncleanness and delivered from harm. Let no pestilent spirit, no corrupting air remain there; let all the snares of the hidden enemy depart; and if there is anything that begrudges the safety or the peace of those who dwell there, let it flee at the sprinkling of this water; so that the well-being sought by calling upon Your holy name may be defended against every attack. Through our Lord. ℟. Amen."], ["r", "3. Hic ter mittat sal in aquam in modum crucis, dicendo semel:", "3. Here he puts the salt into the water three times in the form of a cross, saying once:"], ["t", "Commíxtio salis et aquæ páriter fiat, in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti. ℟. Amen.", "May this mingling of salt and water be made, in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit. ℟. Amen."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum s
