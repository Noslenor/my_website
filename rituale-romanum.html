Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "homes-epiphany", "la": "Benedictio Domorum in Festo Epiphaniæ", "en": "Blessing of Homes on the Epiphany", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 6", "b": [["r", "In ingressu:", "On entering:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["t", "*Ant.* Ab Oriénte venérunt Magi in Béthlehem, adoráre Dóminum: et apértis thesáuris suis pretiósa múnera obtulérunt, aurum Regi magno, thus Deo vero, myrrham sepultúræ ejus. Allelúja.", "*Ant.* From the East came Magi to Bethlehem to adore the Lord; and opening their treasures they offered precious gifts: gold to the great King, incense to the true God, and myrrh for His burial. Alleluia."], ["h", "Canticum beatæ Mariæ Virginis (Luc. 1, 46-55)", "The Canticle of the Blessed Virgin Mary (Luke 1:46-55)"], ["t", "Magníficat * ánima mea Dóminum:", "My soul * magnifies the Lord,"], ["t", "Et exsultávit spíritus meus * in Deo, salutári meo.", "And my spirit has rejoiced * in God my Savior."], ["t", "Quia respéxit humilitátem ancíllæ suæ: * ecce enim ex hoc beátam me dicent omnes generatiónes.", "For He has regarded the lowliness of His handmaid; * for behold, from henceforth all generations shall call me blessed."], ["t", "Quia fecit mihi magna qui potens est: * et sanctum nomen ejus.", "For He who is mighty has done great things for me, * and holy is His name."], ["t", "Et misericórdia ejus a progénie in progénies * timéntibus eum.", "And His mercy is from generation to generation * on those who fear Him."], ["t", "Fecit poténtiam in bráchio suo: * dispérsit supérbos mente cordis sui.", "He has shown might with His arm; * He has scattered the proud in the conceit of their heart."], ["t", "Depósuit poténtes de sede, * et exaltávit húmiles.", "He has put down the mighty from their throne, * and has exalted the lowly."], ["t", "Esuriéntes implévit bonis: * et dívites dimísit inánes.", "He has filled the hungry with good things, * and the rich He has sent away empty."], ["t", "Suscépit Israel, púerum suum, * recordátus misericórdiæ suæ.", "He has received Israel His servant, * being mindful of His mercy,"], ["t", "Sicut locútus est ad patres nostros, * Abraham, et sémini ejus in sǽcula.", "As He spoke to our fathers, * to Abraham and to his seed for ever."], ["t", "Glória Patri.", "Glory be to the Father."], ["r", "Interea aspergitur, et incensatur domus, et in fine repetitur Antiphona: Ab Oriénte venérunt, etc.", "Meanwhile the house is sprinkled and incensed, and at the end the antiphon \"From the East came,\" etc., is repeated."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Omnes de Saba vénient.", "All they from Saba shall come,"], ["x", "Aurum et thus deferéntes.", "Bringing gold and frankincense."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui hodiérna die Unigénitum tuum géntibus stella duce revelásti: concéde propítius; ut, qui jam te ex fide cognóvimus, usque ad contemplándam spéciem tuæ celsitúdinis perducámur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who on this day revealed Your only-begotten Son to the nations by the guidance of a star: mercifully grant that we, who already know You by faith, may be led on to contemplate the beauty of Your majesty. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "*Responsorium.* Illumináre, illumináre, Jerúsalem, quia venit lux tua: et glória Dómini super te orta est, Jesus Christus ex María Vírgine.", "*Responsory.* Arise, be enlightened, O Jerusalem, for your light has come, and the glory of the Lord has risen upon you: Jesus Christ, born of the Virgin Mary."], ["v", "Et ambulábunt gentes in lúmine tuo: et reges in splendóre ortus tui.", "And the nations shall walk in your light, and kings in the brightness of your rising."], ["x", "Et glória Dómini super te orta est.", "And the glory of the Lord has risen upon you."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, Deus omnípotens, locum istum (vel domum istam): ut sit in eo (ea) sánitas, cástitas, victória, virtus, humílitas, bónitas, et mansuetúdo, plenitúdo legis, et gratiárum áctio Deo Patri, et Fílio, et Spirítui Sancto; et hæc benedíctio máneat super hunc locum (vel hanc domum), et super habitántes in eo (ea). Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord God almighty, this place (or this house), that in it there may be health, chastity, victory, strength, humility, goodness and gentleness, the fullness of the law, and thanksgiving to God the Father, and to the Son, and to the Holy Spirit; and may this blessing remain upon this place (or this house) and upon those who dwell in it. Through Christ our Lord. ℟. Amen."]]}, {"id": "candles-st-blaise", "la": "Benedictio Candelarum in Festo S. Blasii Episcopi et Martyris", "en": "Blessing of Candles on the Feast of St. Blaise, and the Blessing of Throats", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 7", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et mitíssime Deus, qui ómnium mundi rerum diversitátes solo Verbo creásti, et ad hóminum reformatiónem illud idem Verbum, per quod facta sunt ómnia, incarnári voluísti; qui magnus es, et imménsus, terríbilis atque laudábilis, ac fáciens mirabília: pro cujus fídei confessióne gloriósus Martyr et Póntifex Blásius, diversórum tormentórum génera non pavéscens, martyrii palmam felíciter est adéptus: quique eídem, inter céteras grátias, hanc prærogatívam contulísti, ut quoscúmque gútturis morbos tua virtúte curáret; majestátem tuam supplíciter exorámus, ut non inspéctu reátus nostri, sed ejus placátus méritis et précibus, hanc ceræ creatúram bene✠dícere, ac sancti✠ficáre tua venerábili pietáte dignéris, tuam grátiam infundéndo; ut omnes, quorum colla per eam ex bona fide tacta fúerint, a quocúmque gútturis morbo ipsíus passiónis méritis liberéntur, et in Ecclésia sancta tua sani et hílares tibi gratiárum réferant actiónes, laudéntque nomen tuum gloriósum, quod est benedíctum in sǽcula sæculórum. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty and most gentle God, who created the diversity of all things in the world by Your Word alone, and willed that the same Word, by whom all things were made, should take flesh for the renewal of mankind; who are great and boundless, awesome and worthy of praise, the doer of wonders: for the confession of whose faith the glorious martyr and bishop Blaise, not dreading tortures of every kind, happily won the palm of martyrdom; and on whom, among other graces, You bestowed this privilege, that by Your power he should cure all ailments of the throat: we humbly beseech Your majesty that, looking not on our guilt but appeased by his merits and prayers, You would deign in Your venerable goodness to ✠ bless and ✠ sanctify this creature of wax, pouring in Your grace; so that all whose throats are touched with it in good faith may, by the merits of his passion, be delivered from every ailment of the throat, and, healthy and joyful, give thanks to You in Your holy Church and praise Your glorious name, which is blessed for ever and ever. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta. Deinde Sacerdos duos cereos in modum crucis aptatos apponit sub mento gutturi singulorum, qui benedicendi sunt, ipsis ante Altare genuflectentibus, dicens:", "And they are sprinkled with holy water. Then the priest places two candles, arranged in the form of a cross, under the chin against the throat of each person to be blessed, as they kneel before the altar, saying:"], ["t", "Per intercessiónem sancti Blásii, Epíscopi et Mártyris, líberet te Deus a malo gútturis, et a quólibet álio malo. In nómine Patris, et Fílii, ✠ et Spíritus Sancti. ℟. Amen.", "Through the intercession of Saint Blaise, bishop and martyr, may God deliver you from ailments of the throat and from every other evil. In the name of the Father, and of the Son, ✠ and of the Holy Spirit. ℟. Amen."]]}, {"id": "bread-wine-st-blaise", "la": "Benedictio Panis, Vini, Aquæ et Fructuum contra Gutturis Ægritudinem in Festo S. Blasii", "en": "Blessing of Bread, Wine, Water and Fruit against Ailments of the Throat on the Feast of St. Blaise", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 8", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Salvátor mundi Deus, qui hodiérnam diem beatíssimi Blásii martyrio consecrásti, quique eídem inter céteras grátias, hanc prærogatívam contulísti, ut quoscúmque gútturis morbos tua virtúte curáret: ineffábilem misericórdiam tuam supplíciter exorámus, et pétimus; ut hos panes, vinum, aquam et fructus, quæ plebs fidélis tibi devóte hódie ad sanctificándum áttulit, tua pietáte bene✠dícere et sancti✠ficáre dignéris: ut, qui ex his gustáverint, ab omni gútturis plaga, et quávis ália ánimæ et córporis infirmitáte, méritis et intercessióne ejúsdem beáti Blásii Mártyris tui atque Pontíficis, plenam recípiant sanitátem: Qui vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "O God, Savior of the world, who consecrated this day by the martyrdom of most blessed Blaise, and on whom, among other graces, You bestowed this privilege, that by Your power he should cure all ailments of the throat: we humbly beseech and entreat Your ineffable mercy that in Your goodness You would deign to ✠ bless and ✠ sanctify these loaves, this wine, water, and fruit, which Your faithful people have devoutly brought to You today to be sanctified; so that those who taste of them may, by the merits and intercession of the same blessed Blaise, Your martyr and bishop, receive full health from every affliction of the throat and every other infirmity of soul and body. Who live and reign, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "field-crosses", "la": "Benedictio Crucium in Agris, Vineis, etc. Plantandarum", "en": "Blessing of Crosses to be Set Up in Fields, Vineyards, etc. (Finding of the Holy Cross)", "cat": "Fields & Animals", "ref": "Appendix, Benedictiones non reservatæ, 9", "b": [["r", "Quæ fit in Festo Inventionis S. Crucis vel Dominica proxima.", "Given on the feast of the Finding of the Holy Cross, or on the nearest Sunday."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, Pater totíus consolatiónis et pietátis, per unigéniti Fílii tui Dómini nostri Jesu Christi acerbíssimæ Passiónis méritum, quam pro nobis peccatóribus in ligno Crucis sustinére dignátus est: béne✠dic has Cruces, quas tui fidéles in hortis, víneis, agris, aliísve locis plantándas áfferunt, ut a prǽdiis quibus defíxæ fúerint, fragor absit grándinum, procélla túrbinum, ímpetus tempestátum, et omnis infestátio inimíci: quátenus eórum fructus ad maturitátem perdúcti, in tui nóminis honórem colligántur a sperántibus in virtúte sanctæ Crucis ejúsdem Fílii tui Dómini nostri Jesu Christi, qui tecum vivit et regnat in sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, Father of all consolation and mercy, by the merit of the most bitter Passion of Your only-begotten Son, our Lord Jesus Christ, which He deigned to endure for us sinners on the wood of the Cross: ✠ bless these crosses, which Your faithful bring to be set up in gardens, vineyards, fields, and other places, so that from the lands where they are planted may be kept away the crash of hail, the whirlwind's blast, the violence of storms, and every attack of the enemy; that their fruits, brought to ripeness, may be gathered in honor of Your name by those who hope in the power of the holy Cross of the same Son, our Lord Jesus Christ, who lives and reigns with You for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "bonfire-st-john", "la": "Benedictio Rogi in Vigilia Nativitatis S. Joannis Baptistæ", "en": "Blessing of the Bonfire on the Vigil of the Nativity of St. John the Baptist", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 10", "b": [["r", "Quæ fit a Clero extra ecclesiam.", "Given by the clergy outside the church."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus, Pater omnípotens, lumen indefíciens, qui es cónditor ómnium lúminum: novum hunc ignem sancti✠fica, et præsta; ut ad te, qui es lumen indefíciens, puris méntibus post hujus sǽculi calíginem perveníre valeámus. Per Christum, Dóminum nostrum. ℟. Amen.", "O Lord God, Father almighty, unfailing light and maker of all lights: ✠ sanctify this new fire, and grant that after the darkness of this world we may come with pure minds to You, who are the unfailing light. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta. Deinde a Clero cantetur sequens Hymnus:", "And it is sprinkled with holy water. Then the clergy sing the following hymn:"], ["t", "Ut queant laxis resonáre fibris / Mira gestórum fámuli tuórum, / Solve pollúti lábii reátum, / Sancte Joánnes.", "That your servants may with loosened voices / sound forth the wonders of your deeds, / take away the guilt of our unclean lips, / O holy John."], ["t", "Núntius celso véniens Olýmpo, / Te patri magnum fore nascitúrum, / Nomen, et vitæ sériem geréndæ, / Ordine promit.", "A messenger coming from high heaven / tells your father that you will be born great, / and sets out in order your name / and the course of your life."], ["t", "Ille promíssi dúbius supérni, / Pérdidit promptæ módulos loquélæ; / Sed reformásti génitus perémptæ / Organa vocis.", "He, doubting the heavenly promise, / lost the ready use of speech; / but at your birth you restored / the powers of his lost voice."], ["t", "Ventris obstrúso récubans cubíli, / Sénseras Regem thálamo manéntem; / Hinc parens nati méritis utérque / Abdita pandit.", "Lying in the hidden chamber of the womb, / you perceived the King abiding in His chamber; / and so, through the merits of their son, / both parents revealed hidden things."], ["t", "Sit decus Patri, genitǽque Proli, / Et tibi compar utriúsque virtus, / Spíritus semper, Deus unus, omni / Témporis ævo. Amen.", "Glory be to the Father and to the begotten Son, / and to You, O Spirit, equal in power with both, / one God for ever, / through every age of time. Amen."], ["v", "Fuit homo missus a Deo.", "There was a man sent from God,"], ["x", "Cui nomen erat Joánnes.", "Whose name was John."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui præséntem diem honorábilem nobis in beáti Joánnis nativitáte fecísti: da pópulis tuis spirituálium grátiam gaudiórum; et ómnium fidélium mentes dírige in viam salútis ætérnæ. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who have made this day honorable for us by the birth of blessed John: give Your peoples the grace of spiritual joys, and direct the minds of all the faithful into the way of eternal salvation. Through Christ our Lord. ℟. Amen."]]}, {"id": "herbs-assumption", "la": "Benedictio Herbarum in Festo Assumptionis B. Mariæ V.", "en": "Blessing of Herbs on the Feast of the Assumption", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 11", "b": [["r", "Absoluta aspersione, si Festum venerit in Dominica, alioquin immediate ante Missam, Sacerdos stans ante Altare, conversus ad populum tenentem herbas vel fructus, dicit voce intellegibili:", "When the sprinkling is finished (if the feast falls on a Sunday), or otherwise immediately before Mass, the priest, standing before the altar and turned toward the people, who hold the herbs or fruits, says in an audible voice:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["h", "Psalmus 64", "Psalm 64"], ["t", "Te decet hymnus, Deus, in Sion: * et tibi reddétur votum in Jerúsalem.", "A hymn befits You, O God, in Sion; * and a vow shall be paid to You in Jerusalem."], ["t", "Exáudi oratiónem meam: * ad te omnis caro véniet.", "Hear my prayer; * all flesh shall come to You."], ["t", "Verba iniquórum prævaluérunt super nos: * et impietátibus nostris tu propitiáberis.", "The words of the wicked have prevailed over us, * but You will pardon our transgressions."], ["t", "Beátus, quem elegísti, et assumpsísti: * inhabitábit in átriis tuis.", "Blessed is he whom You have chosen and taken to Yourself; * he shall dwell in Your courts."], ["t", "Replébimur in bonis domus tuæ: * sanctum est templum tuum, mirábile in æquitáte.", "We shall be filled with the good things of Your house; * holy is Your temple, wonderful in justice."], ["t", "Exáudi nos, Deus, salutáris noster, * spes ómnium fínium terræ, et in mari longe.", "Hear us, O God our Savior, * the hope of all the ends of the earth and of those far off on the sea."], ["t", "Præparans montes in virtúte tua, accínctus poténtia: * qui contúrbas profúndum maris sonum flúctuum ejus.", "You prepare the mountains by Your strength, girded with power; * You stir up the depth of the sea, the roar of its waves."], ["t", "Turbabúntur gentes, et timébunt qui hábitant términos a signis tuis: * éxitus matutíni, et véspere delectábis.", "The nations shall be troubled, and those who dwell at the ends of the earth shall fear Your signs; * You shall make the going forth of the morning and the evening rejoice."], ["t", "Visitásti terram, et inebriásti eam: * multiplicásti locupletáre eam.", "You have visited the earth and watered it abundantly; * You have greatly enriched it."], ["t", "Flumen Dei replétum est aquis, parásti cibum illórum: * quóniam ita est præparátio ejus.", "The river of God is filled with water; You have prepared their food, * for so is its preparation."], ["t", "Rivos ejus inébria, multíplica genímina ejus: * in stillicídiis ejus lætábitur gérminans.", "Fill its streams to overflowing, multiply its yield; * the sprouting seed shall rejoice in its showers."], ["t", "Benedíces corónæ anni benignitátis tuæ: * et campi tui replebúntur ubertáte.", "You shall bless the crown of the year with Your goodness, * and Your fields shall be filled with plenty."], ["t", "Pinguéscent speciósa desérti: * et exsultatióne colles accingéntur.", "The beautiful places of the wilderness shall grow rich, * and the hills shall be girded with gladness."], ["t", "Indúti sunt aríetes óvium, et valles abundábunt fruménto: * clamábunt, étenim hymnum dicent.", "The rams of the flock are clothed, and the valleys shall abound with grain; * they shall shout, yes, they shall sing a hymn."], ["t", "Glória Patri.", "Glory be to the Father."], ["v", "Dóminus dabit benignitátem.", "The Lord will give His goodness,"], ["x", "Et terra nostra dabit fructum suum.", "And our earth shall yield its fruit."], ["v", "Rigans montes de superióribus suis.", "You water the hills from Your upper rooms;"], ["x", "De fructu óperum tuórum satiábitur terra.", "The earth shall be filled with the fruit of Your works."], ["v", "Prodúcens fœnum juméntis.", "Bringing forth grass for the cattle,"], ["x", "Et herbam servitúti hóminum.", "And plants for the service of men."], ["v", "Ut edúcas panem de terra.", "That You may bring bread out of the earth,"], ["x", "Et vinum lætíficet cor hóminis.", "And that wine may gladden the heart of man."], ["v", "Ut exhílaret fáciem in óleo.", "That he may make his face cheerful with oil,"], ["x", "Et panis cor hóminis confírmet.", "And that bread may strengthen man's heart."], ["v", "Misit verbum suum, et sanávit eos.", "He sent His word and healed them,"], ["x", "Et erípuit eos de ómnibus interitiónibus eórum.", "And delivered them from all their destruction."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui cælum, terram, mare, visibília et invisibília verbo tuo ex níhilo creásti, quique herbas, arborésque ad usus hóminum animaliúmque terram gígnere, et unumquódque juxta seméntem in semetípso fructum habére præcepísti; atque non solum ut herbæ animántibus ad victum, sed ægris étiam corpóribus prodéssent ad medicaméntum, tua ineffábili pietáte concessísti: te súpplici mente et ore deprecámur, ut has divérsi géneris herbas et fructus tua cleméntia bene✠dícas, et supra naturálem a te índitam virtútem, eis benedictiónis tuæ novæ grátiam infúndas; ut ad usum homínibus et juméntis in nómine tuo applicátæ, ómnium morbórum et adversitátum efficiántur præsídium. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, who by Your word created out of nothing heaven, earth, and sea, things visible and invisible; who commanded the earth to bring forth plants and trees for the use of men and animals, each bearing fruit with its seed in itself; and who in Your ineffable goodness granted that plants should serve not only as food for living creatures but also as medicine for sick bodies: with humble heart and voice we beseech You that in Your mercy You would ✠ bless these herbs and fruits of various kinds, and pour into them, beyond the natural power You have given them, the grace of Your new blessing; so that, used in Your name for men and beasts, they may become a protection against all diseases and adversities. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui per Móysen fámulum tuum mandásti fíliis Israel, ut manípulos novórum frúctuum benedicéndos deférrent ad sacerdótes, tolleréntque fructus árboris pulchérrimæ, et lætaréntur coram te Dómino Deo suo: adésto propítius invocatiónibus nostris, et infúnde tuæ bene✠dictiónis abundántiam super nos, et super manípulos novárum frugum, novárum herbárum, et frúctuum collectiónem, quæ cum gratiárum actióne tibi repræsentámus, et in nómine tuo in hac sollemnitáte bene✠dícimus; et concéde, ut homínibus, pecóribus, pecúdibus et juméntis contra morbos, pestes, úlcera, malefícia, incantatiónes, venefícia serpéntum, et aliórum venenosórum animálium et bestiárum morsus, nec non quæcúmque venéna, remédium præstent; atque contra diabólicas illusiónes, et machinatiónes, et fraudes tutámen ferant, in quocúmque loco pósitum vel portátum aut hábitum áliquid ex eis fúerit: quátenus cum manípulis bonórum óperum, méritis beátæ Maríæ Vírginis, cujus assumptiónis festum cólimus, quo ipsa assúmpta est, súscipi mereámur. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who through Moses Your servant commanded the children of Israel to bring their sheaves of new fruits to the priests to be blessed, and to take the fruits of the fairest tree and rejoice before You, the Lord their God: graciously hear our prayers, and pour out the abundance of Your ✠ blessing upon us and upon these sheaves of new grain, new herbs, and the gathered fruits, which we present to You with thanksgiving and ✠ bless in Your name on this feast. Grant that they may be a remedy for men, flocks, herds, and beasts of burden against sickness, pestilence, sores, curses, spells, the poison of serpents and the bites of other venomous animals and beasts, and against every poison; and that they may be a safeguard against the illusions, schemes, and deceits of the devil, wherever any part of them is placed, carried, or kept; so that, with the sheaves of good works, by the merits of the Blessed Virgin Mary, the feast of whose Assumption we keep, we may be worthy to be taken up to where she has been assumed. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui virgam Jesse, Genetrícem Fílii tui Dómini nostri Jesu Christi, hodiérna die ad cælórum fastígia ídeo evexísti, ut per ejus suffrágia et patrocínia fructum ventris illíus, eúndem Fílium tuum, mortalitáti nostræ communicáres: te súpplices exorámus; ut ejúsdem Fílii tui virtúte, ejúsque Genetrícis glorióso patrocínio, istórum terræ frúctuum præsídiis per temporálem ad ætérnam salútem disponámur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who on this day raised to the heights of heaven the rod of Jesse, the Mother of Your Son, our Lord Jesus Christ, so that through her prayers and patronage You might share with our mortal nature the fruit of her womb, Your same Son: we humbly beseech You that by the power of Your Son and the glorious patronage of His Mother, we may, with the help of these fruits of the earth, be made ready through temporal well-being for eternal salvation. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super has creatúras, et máneat semper. ℟. Amen.", "And may the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon these creatures and remain for ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta, et thurificentur.", "And they are sprinkled with holy water and incensed."]]}, {"id": "seeds-nativity-bvm", "la": "Benedictio Seminum et Segetum in Festo Nativitatis B. Mariæ Virg.", "en": "Blessing of Seeds and Seedlings on the Feast of the Nativity of the Blessed Virgin Mary", "cat": "Fields & Animals", "ref": "Appendix, Benedictiones non reservatæ, 12", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine sancte, Pater omnípotens, sempitérne Deus: pétimus ac rogámus, ut hos fructus ségetum ac séminum tuis serénis óculis, hilaríque vultu aspícere dignéris: et sicut testátus es Móysi fámulo tuo in terra Ægýpti, dicens: Dic fíliis Israel, cum ingréssi fúerint terram promissiónis, quam eis dabo, ut primítias frúctuum suórum ófferant sacerdótibus, et erunt benedícti: sic et nos rogámus te, Dómine, ut per auxílium misericórdiæ tuæ emíttas super hunc fructum ségetum déxteræ tuæ bene✠dictiónem, quem ad exhibéndum proférre dignéris, ut non súbruat grando, nec aëris inundátio extérminet, sed semper incólumis permáneat, propter usum animárum et córporum, et ad bene abundántem et pleníssimam maturitátem perdúcere dignéris: Qui in Trinitáte perfécta vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Holy Lord, Father almighty, everlasting God, we beg and beseech You to look upon these seeds and seedlings with Your serene eyes and gracious countenance; and as You declared to Your servant Moses in the land of Egypt, saying, \"Tell the children of Israel that when they have entered the land of promise which I will give them, they are to offer the first fruits of their harvest to the priests, and they shall be blessed,\" so we too ask You, O Lord, by the help of Your mercy, to send upon this growing crop the ✠ blessing of Your right hand; that You may deign to bring it forth, that hail may not beat it down nor floods destroy it, but that it may always remain unharmed for the needs of souls and bodies, and that You may bring it to rich and abundant ripeness. Who in perfect Trinity live and reign for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, cæléstis verbi seminátor et cultor, qui nostri cordis áream spiritálibus rastris exérces: adésto propítius précibus nostris, et super agros, quibus si fúerint sémina ínsita, tuam largam benedictiónem infúnde, ac ab eis omnem vim procellárum grátia tuæ defensiónis avérte: ut omnis hic fructus et tua bene✠dictióne repleátur, et ad hórrea sine impediménto pervéniat. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, sower and tender of the heavenly word, who work the field of our hearts with spiritual rakes: graciously hear our prayers, and pour out Your abundant blessing upon the fields in which the seeds are sown, and by the grace of Your protection turn away from them every violent storm; so that all this harvest may be filled with Your ✠ blessing and reach the barns without hindrance. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta, et, si fieri potest, thurificentur.", "And they are sprinkled with holy water and, if possible, incensed."]]}, {"id": "rosary", "la": "Benedictio Coronarum Sacratissimi Rosarii B. M. V.", "en": "Blessing of Rosaries", "cat": "Objects of Devotion", "ref": "Appendix, Benedictiones propriæ (Ord. Prædicatorum)", "b": [["n", "", "Proper to the Dominican Order. Priests of the Order, and others with the faculty from the Holy See, used this form; the shorter form follows below."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et miséricors Deus, qui propter exímiam caritátem tuam, qua dilexísti nos, Fílium tuum unigénitum, Dóminum nostrum Jesum Christum, de cælis in terram descéndere, et de beatíssimæ Vírginis Maríæ Dóminæ nostræ útero sacratíssimo, Angelo nuntiánte, carnem suscípere, crucémque ac mortem subíre, et tértia die glorióse a mórtuis resúrgere voluísti, ut nos eríperes de potestáte diáboli: obsecrámus imménsam cleméntiam tuam; ut hæc signa Rosárii, in honórem et laudem ejúsdem Genetrícis Fílii tui ab Ecclésia tua fidéli dicáta, bene✠dícas, et sancti✠fices, eísque tantam infúndas virtútem Spíritus ✠ Sancti, ut, quicúmque horum quódlibet secum portáverit, atque in domo sua reverénter tenúerit, et in eis ad te, secúndum hujus sanctæ Societátis institúta, divína contemplándo mystéria devóte oráverit, salúbri et perseveránti devotióne abúndet, sitque consors et párticeps ómnium gratiárum, privilegiórum, et indulgentiárum, quæ eídem Societáti per sanctam Sedem Apostólicam concéssa fuérunt, ab omni hoste visíbili et invisíbili semper et ubíque in hoc sǽculo liberétur, et in éxitu suo ab ipsa beatíssima Vírgine María Dei Genetríce tibi plenus bonis opéribus præsentári mereátur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty and merciful God, who, because of the exceeding love with which You loved us, willed that Your only-begotten Son, our Lord Jesus Christ, should come down from heaven to earth, take flesh at the message of an Angel in the most sacred womb of our Lady, the most blessed Virgin Mary, undergo the Cross and death, and rise gloriously from the dead on the third day, to rescue us from the power of the devil: we implore Your boundless mercy that You would ✠ bless and ✠ sanctify these rosaries, dedicated by Your faithful Church to the honor and praise of the same Mother of Your Son, and pour into them such power of the Holy ✠ Spirit that whoever carries any one of them, keeps it reverently in his home, and devoutly prays to You with it, contemplating the divine mysteries according to the rules of this holy Society, may abound in wholesome and persevering devotion; may share and partake in all the graces, privileges, and indulgences granted to this Society by the holy Apostolic See; may be delivered always and everywhere in this world from every enemy, visible and invisible; and at his departure may be worthy to be presented to You, full of good works, by the most blessed Virgin Mary, Mother of God, herself. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."], ["h", "Formula brevior benedicendi coronam sacratissimi Rosarii B. M. V.", "Shorter form for blessing a rosary"], ["t", "Ad laudem et glóriam Deíparæ Vírginis Maríæ, in memóriam mysteriórum vitæ, mortis et resurrectiónis ejúsdem Dómini nostri Jesu Christi, bene✠dicátur et sancti✠ficétur hæc sacratíssimi Rosárii coróna: in nómine Patris, et Fílii, ✠ et Spíritus Sancti. Amen.", "To the praise and glory of the Virgin Mary, Mother of God, in memory of the mysteries of the life, death, and resurrection of our same Lord Jesus Christ, may this rosary of the most holy Rosary be ✠ blessed and ✠ sanctified: in the name of the Father, and of the Son, ✠ and of the Holy Spirit. Amen."]]}, {"id": "brown-scapular", "la": "Benedictio et Impositio Scapularis B. M. V. de Monte Carmelo", "en": "Blessing and Investiture with the Brown Scapular of Our Lady of Mount Carmel", "cat": "Sacramentals & Scapulars", "ref": "Appendix, Benedictiones propriæ (Ord. Carmelitarum Discalceatorum)", "b": [["r", "Persona recipienda ad Habitum genuflexa, Sacerdos superpelliceo et stola alba indutus dicat:", "The person to be received into the habit kneels, and the priest, vested in surplice and white stole, says:"], ["t", "*Ant.* Suscépimus, Deus, misericórdiam tuam in médio templi tui: secúndum nomen tuum, Deus, sic et laus tua in fines terræ, justítia plena est déxtera tua.", "*Ant.* We have received Your mercy, O God, in the midst of Your temple; as is Your name, O God, so also is Your praise to the ends of the earth; Your right hand is full of justice."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvum (-am) fac servum tuum (ancíllam tuam).", "Save Your servant (handmaid),"], ["x", "Deus meus, sperántem in te.", "Who hopes in You, O my God."], ["v", "Mitte ei, Dómine, auxílium de sancto.", "Send him (her) help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eum (eam).", "And defend him (her) out of Sion."], ["v", "Nihil profíciat inimícus in eo (ea).", "Let the enemy have no power over him (her)."], ["x", "Et fílius iniquitátis non appónat nocére ei.", "And let the son of iniquity do nothing to harm him (her)."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Suscípiat te Christus in número fidélium suórum, et nos, licet indígni, te suscípimus in oratiónibus nostris. Concédat tibi Deus per Unigénitum suum, mediatórem Dei et hóminum, tempus bene vivéndi, locum bene agéndi, constántiam bene perseverándi, et ad ætérnæ vitæ hereditátem felíciter perveniéndi: et sicut nos hódie fratérna cáritas spirituáliter jungit in terris, ita divína píetas, quæ dilectiónis est auctrix et amátrix, nos cum fidélibus suis conjúngere dignétur in cælis. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "May Christ receive you into the number of His faithful; and we, though unworthy, receive you into our prayers. May God, through His only-begotten Son, the mediator between God and men, grant you time to live well, a place to do good, constancy to persevere in good, and a happy arrival at the inheritance of eternal life. And as fraternal charity unites us spiritually on earth today, so may the divine goodness, which is the author and lover of love, deign to unite us with His faithful in heaven. Through the same Christ our Lord. ℟. Amen."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Sit nomen Dómini benedíctum.", "Blessed be the name of the Lord."], ["x", "Ex hoc nunc, et usque in sǽculum.", "Now and for ever."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Ætérne Pater et omnípotens Deus, qui Unigénitum tuum vestem nostræ mortalitátis indúere voluísti: obsecrámus, imménsæ tuæ largitátis bene✠dictiónem in hoc genus efflúere vestiménti, quod sancti Patres ad innocéntiæ et humilitátis indícium a renuntiántibus sǽculo gestári sanxérunt; et sic ipsum bene✠dícere dignéris, ut, quicúmque eo usus fúerit, indúere mereátur ipsum Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Eternal Father and almighty God, who willed that Your only-begotten Son should put on the garment of our mortality: we implore that the ✠ blessing of Your boundless generosity may flow upon this kind of garment, which the holy Fathers decreed should be worn by those who renounce the world as a sign of innocence and humility; and deign so to ✠ bless it that whoever wears it may be worthy to put on our Lord Jesus Christ Himself, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Supplíciter te, Dómine, rogámus, ut super hunc hábitum servo tuo (ancíllæ tuæ) imponéndum bene✠díctio tua benígna descéndat, ut sit bene✠díctus, atque divína virtúte procul pellántur hóstium nostrórum visibílium et invisibílium tela nequíssima. ℟. Amen.", "We humbly beseech You, O Lord, that Your kindly ✠ blessing may come down upon this habit, to be placed upon Your servant (handmaid), so that it may be ✠ blessed, and that by divine power the most wicked weapons of our enemies, visible and invisible, may be driven far away. ℟. Amen."], ["r", "Aspergat Habitum aqua benedicta. Si autem Habitus solum sit benedicendus, incipit a ℣. Adjutórium nostrum, usque ad Orationem Supplíciter, inclusive. Imponens ei Habitum, dicat:", "He sprinkles the habit with holy water. If the habit is only to be blessed, he begins at ℣. \"Our help\" and continues through the prayer \"We humbly beseech,\" inclusive. Placing the habit upon the person, he says:"], ["t", "Accipe, vir devóte (múlier devóta), hunc hábitum benedíctum: precans sanctíssimam Vírginem, ut ejus méritis illum pérferas sine mácula, et te ab omni adversitáte deféndat, atque ad vitam perdúcat ætérnam. ℟. Amen.", "Receive, devout man (woman), this blessed habit, asking the most holy Virgin that by her merits you may wear it without stain, and that she may defend you from all adversity and lead you to life everlasting. ℟. Amen."], ["t", "Adésto, Dómine, supplicatiónibus nostris: et hunc fámulum tuum, quem (hanc fámulam tuam, quam) Sodalitáti sanctæ Religiónis Carmelitárum sociámus, perpétua tríbue firmitáte corroborári, ut, perseveránti propósito, in omni sanctitáte tibi váleat famulári.", "Be attentive, O Lord, to our prayers, and grant that this Your servant, whom we are associating with the Confraternity of the holy Order of Carmelites, may be strengthened with lasting steadfastness, so that with persevering purpose he (she) may serve You in all holiness."], ["t", "Prótege, Dómine, fámulum tuum (fámulam tuam) subsídiis pacis, et beátæ Maríæ semper Vírginis patrocíniis confidéntem, a cunctis hóstibus redde secúrum (-am).", "Protect, O Lord, with the help of peace, Your servant who trusts in the patronage of blessed Mary ever Virgin, and make him (her) safe from all enemies."], ["t", "Bene✠dícat te Cónditor cæli et terræ, Deus omnípotens, qui te elígere dignátus est ad beatíssimæ Vírginis Maríæ de Monte Carmélo Societátem et Confraternitátem: quam precámur, ut in hora óbitus tui cónterat caput serpéntis, qui tibi est adversárius, et tandem tamquam victor (victrix) palmam, et corónam sempitérnæ hereditátis consequáris. Per Christum, Dóminum nostrum. ℟. Amen.", "May the Creator of heaven and earth, God almighty, who has deigned to choose you for the Society and Confraternity of the most blessed Virgin Mary of Mount Carmel, ✠ bless you; and may she, we pray, crush at the hour of your death the head of the serpent who is your adversary, so that at last, as a victor, you may win the palm and the crown of the everlasting inheritance. Through Christ our Lord. ℟. Amen."], ["r", "Deinde aspergat Confratrem aqua benedicta, et subjungat:", "Then he sprinkles the new member with holy water, and adds:"], ["t", "Ego auctoritáte, qua fungor, et mihi concéssa, recípio te ad Confraternitátem sacræ Religiónis Carmelitárum, et invéstio, ac partícipem te fácio ómnium bonórum spirituálium ejúsdem Ordinis. In nómine Patris, et Fílii, ✠ et Spíritus Sancti. ℟. Amen.", "By the authority which I exercise and which has been granted to me, I receive you into the Confraternity of the holy Order of Carmelites, I invest you, and I make you a sharer in all the spiritual goods of the same Order. In the name of the Father, and of the Son, ✠ and of the Holy Spirit. ℟. Amen."], ["r", "His expletis, Sacerdos Confratrem paucis sed efficacioribus verbis adhortetur ad caute, pie, sancteque vivendum, ad onera omnia adimplenda tum generalia pro omnibus Confratribus, tum specialia pro iis, qui gaudere volunt privilegio, vulgo nuncupato Sabbatino (circa quæ eundem sufficienter instruat), atque ad Virginem Deiparam in posterum peculiaribus devotionis obsequiis assidue colendam, eamque veluti singularem ac dulcissimam Matrem filiali et sincero affectu prosequendam.", "When this is finished, the priest, in few but forceful words, exhorts the new member to live carefully, piously, and holily; to fulfill all the obligations, both those general to all members and those particular to those who wish to enjoy the privilege commonly called \"Sabbatine\" (on which he should instruct him sufficiently); and from now on to honor the Virgin Mother of God assiduously with special acts of devotion, and to love her with sincere, filial affection as a singular and most sweet Mother."], ["h", "Formula brevior benedicendi et imponendi Scapulare B. M. V. de Monte Carmelo", "Shorter form for blessing and imposing the scapular"], ["r", "Quæ adhiberi potest, præsertim in privatis receptionibus, vel occasione magni concursus. Persona recipienda ad Habitum genuflexa, Sacerdos superpelliceo et stola albi coloris, aut saltem stola indutus, dicat:", "This may be used especially for private receptions, or when many are to be received. The person to be received kneels, and the priest, vested in surplice and white stole, or at least in a stole, says:"], ["v", "Osténde nobis, Dómine, misericórdiam tuam.", "Show us, O Lord, Your mercy."], ["x", "Et salutáre tuum da nobis.", "And grant us Your salvation."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, humáni géneris Salvátor, hunc hábitum, quem propter tuum tuǽque Genetrícis Vírginis Maríæ de Monte Carmélo amórem servus tuus (ancílla tua) devóte est delatúrus (-a), déxtera tua sancti✠fica, ut eádem Genetríce tua intercedénte, ab hoste malígno defénsus (-a) in tua grátia usque ad mortem persevéret: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Savior of mankind, with Your right hand ✠ sanctify this habit, which Your servant (handmaid) will devoutly wear for love of You and of Your Mother, the Virgin Mary of Mount Carmel; so that, by the intercession of Your same Mother, he (she) may be defended from the evil enemy and persevere in Your grace until death. Who live and reign for ever and ever. ℟. Amen."], ["r", "Deinde aspergat Habitum aqua benedicta, et postea illum imponat personæ, vel personis (cuilibet separatim), dicens:", "Then he sprinkles the habit with holy water, and afterward places it upon the person or persons (each one separately), saying:"], ["t", "Accipe hunc hábitum benedíctum precans sanctíssimam Vírginem, ut ejus méritis illum pérferas sine mácula, et te ab omni adversitáte deféndat, atque ad vitam perdúcat ætérnam. ℟. Amen.", "Receive this blessed habit, asking the most holy Virgin that by her merits you may wear it without stain, and that she may defend you from all adversity and lead you to life everlasting. ℟. Amen."], ["r", "Postea subjungat:", "Then he adds:"], ["t", "Ego, ex potestáte mihi concéssa, recípio te (vos) ad participatiónem ómnium bonórum spirituálium, quæ, cooperánte misericórdia Jesu Christi, a Religiósis de Monte Carmélo peragúntur. In nómine Patris, et Fílii, et Spíritus Sancti. ℟. Amen.", "By the power granted to me, I receive you to a share in all the spiritual goods which, with the help of the mercy of Jesus Christ, are performed by the Religious of Mount Carmel. In the name of the Father, and of the Son, and of the Holy Spirit. ℟. Amen."], ["t", "Bene✠dícat te (vos) Cónditor cæli et terræ, Deus omnípotens, qui te (vos) cooptáre dignátus est in Confraternitátem beátæ Maríæ Vírginis de Monte Carmélo: quam exorámus, ut in hora óbitus tui (vestri) cónterat caput serpéntis antíqui, atque palmam et corónam sempitérnæ hereditátis tandem consequáris (consequámini). Per Christum, Dóminum nostrum. ℟. Amen.", "May the Creator of heaven and earth, God almighty, who has deigned to admit you into the Confraternity of the Blessed Virgin Mary of Mount Carmel, ✠ bless you; and may she, we beseech, crush at the hour of your death the head of the ancient serpent, so that you may at last win the palm and the crown of the everlasting inheritance. Through Christ our Lord. ℟. Amen."], ["r", "Aspergatur persona aqua benedicta. Si plures simul recipiendi sint, mutetur numerus. Si Habitus solummodo benedicendus sit, tunc benedictio incipit a ℣. Osténde, et concluditur cum Oratione Dómine Jesu Christe.", "The person is sprinkled with holy water. If several are received together, the number is changed. If the habit is only to be blessed, the blessing begins with ℣. \"Show us\" and ends with the prayer \"Lord Jesus Christ.\""]]}, {"id": "miraculous-medal", "la": "Benedictio et Impositio Sacri Numismatis B. M. V. Immaculatæ (Médaille miraculeuse)", "en": "Blessing and Imposition of the Miraculous Medal", "cat": "Objects of Devotion", "ref": "Appendix, Benedictiones propriæ (Congr. Missionis)", "b": [["r", "Sacerdos benedicturus sacrum Numisma immaculatæ Virginis Mariæ Conceptionis, superpelliceo et stola alba indutus, dicit:", "The priest who is to bless the sacred Medal of the Immaculate Conception of the Virgin Mary, vested in surplice and white stole, says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et miséricors Deus, qui per multíplices immaculátæ Maríæ Vírginis apparitiónes in terris mirabília júgiter pro animárum salúte operári dignátus es: super hoc numísmatis signum, tuam bene✠dictiónem benígnus infúnde; ut pie hoc recoléntes ac devóte gestántes et illíus patrocínium séntiant et tuam misericórdiam consequántur. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty and merciful God, who through the many apparitions on earth of the immaculate Virgin Mary have deigned to work wonders continually for the salvation of souls: graciously pour Your ✠ blessing upon this medal, so that those who piously remember its meaning and devoutly wear it may feel her protection and obtain Your mercy. Through Christ our Lord. ℟. Amen."], ["r", "Deinde Numisma aspergit aqua benedicta, et ipsum postea imponens dicit, si uni tantum imponatur:", "Then he sprinkles the medal with holy water, and afterward, placing it on the person, says, if it is given to one only:"], ["t", "Accipe sanctum Numísma, gesta fidéliter, et digna veneratióne proséquere: ut piíssima et immaculáta cælórum Dómina te prótegat atque deféndat; et pietátis suæ prodígia rénovans, quæ a Deo supplíciter postuláveris, tibi misericórditer ímpetret, ut vivens ac móriens in matérno ejus ampléxu felíciter requiéscas. Amen.", "Receive this holy medal; wear it faithfully and honor it with fitting reverence, so that the most loving and immaculate Queen of heaven may protect and defend you; and, renewing the wonders of her goodness, may mercifully obtain for you whatever you humbly ask of God, so that, living and dying, you may rest happily in her motherly embrace. Amen."], ["r", "Si vero pluribus imponatur, dicit:", "If it is given to several, he says:"], ["t", "Accípite sanctum Numísma, gestáte fidéliter, et digna veneratióne prosequímini: ut piíssima et immaculáta cælórum Dómina vos prótegat atque deféndat; et pietátis suæ prodígia rénovans, quæ a Deo supplíciter postulavéritis, vobis misericórditer ímpetret, ut vivéntes ac moriéntes in matérno ejus ampléxu felíciter requiescátis. Amen.", "Receive this holy medal; wear it faithfully and honor it with fitting reverence, so that the most loving and immaculate Queen of heaven may protect and defend you; and, renewing the wonders of her goodness, may mercifully obtain for you whatever you humbly ask of God, so that, living and dying, you may rest happily in her motherly embrace. Amen."], ["r", "Inde prosequitur:", "He then continues:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Regína sine labe origináli concépta.", "Queen conceived without original sin,"], ["x", "Ora pro nobis.", "Pray for us."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui beatíssimam Vírginem Maríam matrem tuam ab orígine immaculátam innúmeris miráculis claréscere voluísti: concéde; ut ejúsdem patrocínium semper implorántes, gáudia consequámur ætérna: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who willed that the most blessed Virgin Mary, Your Mother, immaculate from her origin, should become renowned through countless miracles: grant that, always imploring her protection, we may attain everlasting joys. Who live and reign for ever and ever. ℟. Amen."]]}, {"id": "st-benedict-medal", "la": "Benedictio Numismatum S. Benedicti", "en": "Blessing of St. Benedict Medals", "cat": "Objects of Devotion", "ref": "Appendix, Benedictiones propriæ (Ord. S. Benedicti)", "b": [["r", "Sacerdos benedicturus numismata sancti Benedicti, dicit:", "The priest who is to bless medals of St. Benedict says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "Exorcízo vos, numísmata, per Deum ✠ Patrem omnipoténtem, qui fecit cælum et terram, mare et ómnia, quæ in eis sunt. Omnis virtus adversárii, omnis exércitus diáboli, et omnis incúrsus, omne phantásma sátanæ, eradicáre et effugáre ab his numismátibus: ut fiant ómnibus, qui eis usúri sunt, salus mentis et córporis: in nómine Pa✠tris omnipoténtis, et Jesu ✠ Christi Fílii ejus, Dómini nostri, et Spíritus ✠ Sancti Parácliti, et in caritáte ejúsdem Dómini nostri Jesu Christi, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, medals, by God the ✠ Father almighty, who made heaven and earth, the sea, and all that is in them. May every power of the adversary, every host of the devil, every assault and every phantom of Satan be uprooted and put to flight from these medals, so that they may be health of mind and body to all who will use them: in the name of the ✠ Father almighty, and of Jesus ✠ Christ, His Son, our Lord, and of the Holy ✠ Spirit, the Paraclete, and in the love of the same Jesus Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants."], ["x", "Deus meus, sperántes in te.", "Who hope in You, O my God."], ["v", "Esto nobis, Dómine, turris fortitúdinis.", "Be to us, O Lord, a tower of strength."], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Dóminus virtútem pópulo suo dabit.", "The Lord will give strength to His people."], ["x", "Dóminus benedícet pópulum suum in pace.", "The Lord will bless His people with peace."], ["v", "Mitte nobis, Dómine, auxílium de sancto.", "Send us help, O Lord, from Your holy place."], ["x", "Et de Sion tuére nos.", "And defend us out of Sion."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus omnípotens, bonórum ómnium largítor, súpplices te rogámus, ut per intercessiónem sancti Benedícti, his sacris numismátibus, lítteris ac charactéribus a te designátis, tuam bene✠dictiónem infúndas: ut omnes, qui ea gestáverint ac bonis opéribus inténti fúerint, sanitátem mentis et córporis, et grátiam sanctificatiónis, atque indulgéntias (nobis) concéssas cónsequi mereántur; omnésque diáboli insídias et fraudes, per auxílium misericórdiæ tuæ, effúgere váleant, et in conspéctu tuo sancti et immaculáti appáreant. ℟. Amen.", "Almighty God, giver of all good things, we humbly beseech You, through the intercession of Saint Benedict, to pour out Your ✠ blessing upon these sacred medals, marked with the letters and signs designated by You; so that all who wear them and devote themselves to good works may be worthy to obtain health of mind and body, the grace of sanctification, and the indulgences granted (to us); and that by the help of Your mercy they may escape all the snares and deceits of the devil, and appear holy and spotless in Your sight. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui voluísti pro totíus mundi redemptióne de Vírgine nasci, circumcídi, a Judǽis reprobári, Judæ ósculo tradi, vínculis alligári, spinis coronári, clavis perforári, inter latrónes crucifígi, láncea vulnerári, et tandem in Cruce mori: per hanc tuam sanctíssimam passiónem humíliter exóro; ut omnes diabólicas insídias et fraudes expéllas ab eo, qui nomen sanctum tuum, his lítteris ac charactéribus a te designátis, devóte invocáverit, et eum ad salútis portum perdúcere dignéris: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who for the redemption of the whole world willed to be born of a Virgin, to be circumcised, rejected by the Jews, betrayed by the kiss of Judas, bound with chains, crowned with thorns, pierced with nails, crucified between thieves, wounded with a lance, and at last to die on the Cross: by this Your most holy Passion I humbly pray that You would drive away all the snares and deceits of the devil from whoever devoutly calls on Your holy name with these letters and signs designated by You, and deign to bring him to the harbor of salvation. Who live and reign for ever and ever. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super hæc numísmata, ac ea gestántes, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon these medals and those who wear them, and remain for ever. ℟. Amen."], ["r", "Deinde Sacerdos aspergit numismata aqua benedicta.", "Then the priest sprinkles the medals with holy water."], ["h", "Formula brevior benedicendi numismata S. Benedicti", "Shorter form for blessing St. Benedict medals"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["r", "Exorcízo vos, numísmata, etc., ut supra, usque ad Kýrie, eléison exclusive.", "\"I exorcise you, medals,\" etc., as above, up to \"Lord, have mercy,\" exclusive."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus omnípotens, bonórum ómnium largítor, súpplices te rogámus, ut per intercessiónem sancti Benedícti his sacris numismátibus tuam bene✠dictiónem infúndas, ut omnes qui ea gestáverint ac bonis opéribus inténti fúerint, sanitátem mentis et córporis, et grátiam sanctificatiónis, atque indulgéntias (nobis) concéssas cónsequi mereántur, omnésque diáboli insídias et fraudes, per auxílium misericórdiæ tuæ, stúdeant devitáre et in conspéctu tuo sancti et immaculáti váleant apparére. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty God, giver of all good things, we humbly beseech You, through the intercession of Saint Benedict, to pour out Your ✠ blessing upon these sacred medals, so that all who wear them and devote themselves to good works may be worthy to obtain health of mind and body, the grace of sanctification, and the indulgences granted (to us); and that by the help of Your mercy they may strive to avoid all the snares and deceits of the devil, and be able to appear holy and spotless in Your sight. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "cross", "la": "Sollemnis Benedictio Crucis", "en": "Solemn Blessing of a Cross", "cat": "Objects of Devotion", "ref": "Tit. VIII, cap. 24", "b": [["r", "Si Cruces, publicæ venerationi expositæ, sollemniter benedicantur, hæc benedictio Ordinario reservatur, qui tamen potest eam cuilibet Sacerdoti committere. Privatim autem hæc benedictio a quolibet Sacerdote fieri potest sine ulla Ordinarii licentia.", "If crosses exposed for public veneration are blessed solemnly, this blessing is reserved to the Ordinary, who may, however, entrust it to any priest. Privately, however, this blessing may be given by any priest without any permission from the Ordinary."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Rogámus te, Dómine sancte, Pater omnípotens, ætérne Deus: ut dignéris bene✠dícere hoc signum Crucis, ut sit remédium salutáre géneri humáno; sit solíditas fídei, proféctus bonórum óperum, redémptio animárum; sit solámen, et protéctio, ac tutéla contra sæva jácula inimicórum. Per Christum, Dóminum nostrum. ℟. Amen.", "We beseech You, holy Lord, Father almighty, everlasting God, that You would deign to ✠ bless this sign of the Cross, that it may be a saving remedy for mankind; that it may be the steadfastness of faith, the increase of good works, the redemption of souls; and that it may be a comfort, protection, and safeguard against the cruel darts of the enemy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine Jesu Christe, hanc Crucem, per quam eripuísti mundum a potestáte dæmonum, et superásti passióne tua suggestórem peccáti, qui gaudébat in prævaricatióne primi hóminis per ligni vétiti sumptiónem. *(Hic aspergatur aqua benedicta.)* Sanctificétur hoc signum Crucis in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti; ut orántes, inclinantésque se propter Dóminum ante istam Crucem, invéniant córporis et ánimæ sanitátem. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, Lord Jesus Christ, this Cross, by which You rescued the world from the power of demons and by Your Passion overcame the tempter to sin, who rejoiced in the fall of the first man through his eating of the forbidden tree. *(Here it is sprinkled with holy water.)* May this sign of the Cross be sanctified in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit; so that those who pray and bow before this Cross for the Lord's sake may find health of body and soul. Through the same Christ our Lord. ℟. Amen."], ["r", "2. Postea Sacerdos ante Crucem genuflexus ipsam devote adorat, et osculatur, et idem faciunt quicumque voluerint.", "2. Afterward the priest, kneeling before the Cross, devoutly venerates and kisses it, and all who wish do the same."]]}, {"id": "image", "la": "Sollemnis Benedictio Imaginis Jesu Christi Domini nostri vel B. Mariæ Virginis vel alius Sancti", "en": "Solemn Blessing of an Image of Our Lord, of the Blessed Virgin Mary, or of a Saint", "cat": "Objects of Devotion", "ref": "Tit. VIII, cap. 25", "b": [["r", "Si imagines, publicæ venerationi expositæ, sollemniter benedicantur, hæc benedictio Ordinario reservatur, qui tamen potest eam cuilibet Sacerdoti committere. Privatim autem hæc benedictio a quolibet Sacerdote fieri potest sine ulla Ordinarii licentia.", "If images exposed for public veneration are blessed solemnly, this blessing is reserved to the Ordinary, who may, however, entrust it to any priest. Privately, however, this blessing may be given by any priest without any permission from the Ordinary."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui Sanctórum tuórum imágines (sive effígies) sculpi, aut pingi non réprobas, ut quóties illas óculis córporis intuémur, tóties eórum actus et sanctitátem ad imitándum memóriæ óculis meditémur: hanc, quǽsumus, imáginem (seu sculptúram) in honórem et memóriam unigéniti Fílii tui Dómini nostri Jesu Christi (vel beatíssimæ Vírginis Maríæ, Matris Dómini nostri Jesu Christi, vel beáti N. Apóstoli tui, vel Mártyris, vel Pontíficis, vel Confessóris, vel beátæ N. Vírginis, vel Mártyris) adaptátam bene✠dícere, et sancti✠ficáre dignéris: et præsta; ut quicúmque coram illa unigénitum Fílium tuum (vel beatíssimam Vírginem, vel gloriósum Apóstolum, vel Mártyrem, vel Pontíficem, vel Confessórem, vel gloriósam Vírginem, vel Mártyrem) supplíciter cólere et honoráre studúerit, illíus méritis et obténtu a te grátiam in præsénti, et ætérnam glóriam obtíneat in futúrum. Per (eúndem) Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who do not disapprove of the carving or painting of images (or likenesses) of Your Saints, so that as often as we look upon them with bodily eyes we may meditate with the eyes of memory on their deeds and holiness, in order to imitate them: deign, we beseech You, to ✠ bless and ✠ sanctify this image (or statue), made in honor and memory of Your only-begotten Son, our Lord Jesus Christ (or of the most blessed Virgin Mary, Mother of our Lord Jesus Christ; or of blessed N., Your Apostle, or Martyr, or Bishop, or Confessor; or of blessed N., Virgin, or Martyr); and grant that whoever humbly strives to worship and honor Your only-begotten Son (or the most blessed Virgin, or the glorious Apostle, Martyr, Bishop, Confessor, Virgin, or Martyr) before it may, by his (her) merits and intercession, obtain from You grace in the present life and eternal glory in the life to come. Through (the same) Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "sick-adult", "la": "Benedictio Adulti Ægrotantis", "en": "Blessing of a Sick Adult", "cat": "The Sick", "ref": "Appendix, Benedictiones non reservatæ, 41", "b": [["r", "Sacerdos cubiculum ægrotantis ingrediens dicat:", "The priest, entering the sick person's room, says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "Et continuo ad infirmum accedens subjungat:", "And going straight to the sick person, he adds:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Intróeat, Dómine Jesu Christe, domum hanc ad nostræ humilitátis ingréssum pax et misericórdia tua; effúgiat ex hoc loco omnis nequítia dæmonum, adsint Angeli pacis, domúmque hanc déserat omnis malígna discórdia. Magnífica, Dómine, super nos nomen sanctum tuum: et bénedic nostræ conversatióni: Qui sanctus et pius es, et pérmanes cum Patre et Spíritu Sancto in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, as we in our lowliness enter this house, may Your peace and mercy enter with us. Let every wickedness of the demons flee from this place; let the Angels of peace be present, and let all evil discord depart from this house. Magnify Your holy name upon us, O Lord, and bless our coming among them; who are holy and merciful, and abide with the Father and the Holy Spirit for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Réspice, Dómine, fámulum tuum (fámulam tuam) in infirmitáte córporis laborántem, et ánimam réfove quam creásti: ut castigatiónibus emendátus (-a), contínuo se séntiat tua miseratióne salvátum (-am). Per Christum, Dóminum nostrum. ℟. Amen.", "Look down, O Lord, upon Your servant, laboring under bodily illness, and revive the soul You created; so that, made better by these trials, he (she) may soon feel himself (herself) restored by Your mercy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Miséricors, Dómine, fidélium consolátor, quǽsumus imménsam pietátem tuam, ut ad intróitum humilitátis nostræ hunc fámulum tuum (hanc fámulam tuam) super lectum dolóris sui jacéntem, visitáre dignéris, sicut socrum Simónis visitásti: propítius adésto ei, Dómine, quátenus prístina sanitáte recépta, gratiárum tibi in Ecclésia tua réferat actiónes: Qui vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "O merciful Lord, consoler of the faithful, we beseech Your boundless goodness that, as we in our lowliness enter, You would deign to visit this Your servant lying on his (her) bed of pain, as You visited Simon's mother-in-law. Graciously stand by him (her), O Lord, so that, his (her) former health restored, he (she) may give thanks to You in Your Church. Who live and reign, God, for ever and ever. ℟. Amen."], ["r", "Deinde, extendens dexteram versus ægrotum, dicat:", "Then, extending his right hand toward the sick person, he says:"], ["t", "Dóminus Jesus Christus apud te sit, ut te deféndat: intra te sit, ut te consérvet: ante te sit, ut te ducat: post te sit, ut te custódiat: super te sit, ut te benedícat: Qui cum Patre et Spíritu Sancto vivit et regnat in sǽcula sæculórum. ℟. Amen.", "May the Lord Jesus Christ be with you to defend you, within you to sustain you, before you to lead you, behind you to guard you, above you to bless you; who with the Father and the Holy Spirit lives and reigns for ever and ever. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Demum aspergat infirmum aqua benedicta.", "Finally he sprinkles the sick person with holy water."]]}, {"id": "sick-several", "la": "Eadem Benedictio pro Pluribus Infirmis", "en": "The Same Blessing for Several Sick Persons", "cat": "The Sick", "ref": "Appendix, Benedictiones non reservatæ, 42", "b": [["r", "Sacerdos cubiculum ægrotantium ingrediens dicat:", "The priest, entering the room of the sick, says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "Et continuo ad infirmos accedens subjungat:", "And going straight to the sick, he adds:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Intróeat, Dómine Jesu Christe, domum hanc ad nostræ humilitátis ingréssum pax et misericórdia tua: effúgiat ex hoc loco omnis nequítia dæmonum, adsint Angeli pacis, domúmque hanc déserat omnis malígna discórdia. Magnífica, Dómine, super nos nomen sanctum tuum: et bénedic nostræ conversatióni: Qui sanctus et pius es, et pérmanes cum Patre et Spíritu Sancto in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, as we in our lowliness enter this house, may Your peace and mercy enter with us. Let every wickedness of the demons flee from this place; let the Angels of peace be present, and let all evil discord depart from this house. Magnify Your holy name upon us, O Lord, and bless our coming among them; who are holy and merciful, and abide with the Father and the Holy Spirit for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Réspice, Dómine, fámulos tuos (fámulas tuas) in infirmitáte córporis laborántes, et ánimas réfove, quas creásti: ut castigatiónibus emendáti (-æ), contínuo se séntiant tua miseratióne salvátos (-as). Per Christum, Dóminum nostrum. ℟. Amen.", "Look down, O Lord, upon Your servants, laboring under bodily illness, and revive the souls You created; so that, made better by these trials, they may soon feel themselves restored by Your mercy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Miséricors, Dómine, fidélium consolátor, quǽsumus imménsam pietátem tuam, ut ad intróitum humilitátis nostræ hos fámulos tuos (has fámulas tuas) super lectum dolóris sui jacéntes, visitáre dignéris, sicut socrum Simónis visitásti: propítius adésto eis, Dómine, quátenus prístina sanitáte recépta, gratiárum tibi in Ecclésia tua réferant actiónes: Qui vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "O merciful Lord, consoler of the faithful, we beseech Your boundless goodness that, as we in our lowliness enter, You would deign to visit these Your servants lying on their beds of pain, as You visited Simon's mother-in-law. Graciously stand by them, O Lord, so that, their former health restored, they may give thanks to You in Your Church. Who live and reign, God, for ever and ever. ℟. Amen."], ["r", "Deinde, extendens dexteram versus ægrotos, dicat:", "Then, extending his right hand toward the sick, he says:"], ["t", "Dóminus Jesus Christus apud vos sit, ut vos deféndat: intra vos sit, ut vos consérvet: ante vos sit, ut vos ducat: post vos sit, ut vos custódiat: super vos sit, ut vos benedícat: Qui cum Patre et Spíritu Sancto vivit et regnat in sǽcula sæculórum. ℟. Amen.", "May the Lord Jesus Christ be with you to defend you, within you to sustain you, before you to lead you, behind you to guard you, above you to bless you; who with the Father and the Holy Spirit lives and reigns for ever and ever. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super vos, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Demum aspergat infirmos aqua benedicta.", "Finally he sprinkles the sick with holy water."]]}, {"id": "sick-pilgrims", "la": "Benedictio Peregrinorum Ægrotantium", "en": "Blessing of Sick Pilgrims", "cat": "The Sick", "ref": "Appendix, Benedictiones non reservatæ, 43", "b": [["r", "Sacerdos indutus superpelliceo et stola albi coloris, ponat extremitatem stolæ super caput infirmi, Evangeliumque recitet modo sequenti; si vero plures sint infirmi, stolam ipse teneat elevatam manu dextera, et benedictiones dicat in plurali.", "The priest, vested in surplice and white stole, places the end of the stole on the sick person's head and reads the Gospel as follows; if there are several sick persons, he holds the stole raised in his right hand and says the blessings in the plural."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "✠ Sequéntia sancti Evangélii secúndum Matthǽum. *(Cap. 13, 44-52)*", "✠ The continuation of the holy Gospel according to Matthew. *(Chapter 13:44-52)*"], ["x", "Glória tibi, Dómine.", "Glory to You, O Lord."], ["t", "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile est regnum cælórum thesáuro abscóndito in agro: quem qui invénit homo, abscóndit, et præ gáudio illíus vadit, et vendit univérsa, quæ habet, et emit agrum illum. Iterum símile est regnum cælórum hómini negotiatóri, quærénti bonas margarítas. Invénta autem una pretiósa margaríta, ábiit, et véndidit ómnia, quæ hábuit, et emit eam. Iterum símile est regnum cælórum sagénæ missæ in mare, et ex omni génere píscium congregánti. Quam, cum impléta esset, educéntes, et secus litus sedéntes, elegérunt bonos in vasa, malos autem foras misérunt. Sic erit in consummatióne sǽculi: exíbunt Angeli, et separábunt malos de médio justórum, et mittent eos in camínum ignis: ibi erit fletus, et stridor déntium. Intellexístis hæc ómnia? Dicunt ei: Etiam. Ait illis: Ideo omnis scriba doctus in regno cælórum símilis est hómini patrifamílias, qui profert de thesáuro suo nova et vétera.", "At that time Jesus told His disciples this parable: The kingdom of heaven is like a treasure hidden in a field, which a man found and hid; and in his joy he goes and sells all that he has and buys that field. Again, the kingdom of heaven is like a merchant seeking fine pearls; who, on finding one pearl of great price, went and sold all that he had and bought it. Again, the kingdom of heaven is like a net cast into the sea that gathered in fish of every kind. When it was full, they drew it ashore, sat down, and gathered the good into vessels, but threw the bad away. So it will be at the end of the world: the Angels will go out and separate the wicked from among the just, and cast them into the furnace of fire; there will be weeping and gnashing of teeth. Have you understood all these things? They said to Him: Yes. And He said to them: Therefore every scribe instructed in the kingdom of heaven is like a householder who brings out of his treasure things new and old."], ["r", "Post Evangelium benedicit infirmum dicens:", "After the Gospel he blesses the sick person, saying:"], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te (vos), et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Deinde porrigit extremitatem stolæ deosculandam infirmo, ipsumque aspergit aqua benedicta, dicens:", "Then he offers the end of the stole to the sick person to kiss, and sprinkles him with holy water, saying:"], ["t", "Aspérgat te (vos) Deus rore grátiæ suæ in vitam ætérnam. ℟. Amen.", "May God sprinkle you with the dew of His grace unto life everlasting. ℟. Amen."]]}, {"id": "pregnant-woman", "la": "Benedictio Mulieris Prægnantis in periculis partus", "en": "Blessing of an Expectant Mother in Danger of Childbirth", "cat": "Mothers & Children", "ref": "Appendix, Benedictiones non reservatæ, 44", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Salvam fac ancíllam tuam.", "Save Your handmaid,"], ["x", "Deus meus, sperántem in te.", "O my God, who hopes in You."], ["v", "Esto illi, Dómine, turris fortitúdinis.", "Be unto her, O Lord, a tower of strength"], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Nihil profíciat inimícus in ea.", "Let the enemy have no power over her,"], ["x", "Et fílius iniquitátis non appónat nocére ei.", "Nor the son of iniquity draw near to harm her."], ["v", "Mitte ei, Dómine, auxílium de sancto.", "Se
