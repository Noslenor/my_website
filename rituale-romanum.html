der and in the plural. But the first questioning by name, the breathing, the imposition or signing of the cross, the touching of the ears and nostrils with spittle, the questioning on the renunciation, the anointing with the oil of catechumens, the questioning on the faith or Creed, the Baptism itself, the anointing with chrism, the giving of the white garment, and the handing over of the lighted candle are to be done for each individually, first for the boys and then for the girls."], ["r", "Sed pro majori commoditate adnotatum est propriis locis in rubricis parenthesi notatis; ita ut quando dicitur in tali rubrica singulariter singulis, intellegatur quod illa verba, vel actiones, usque ad aliam rubricam dici, vel fieri debent singulariter singulis, et primum masculis, deinde feminis, mutato solum genere, ut dictum est supra. Quando vero in simili rubrica dicitur in plurali pro pluribus, intellegatur, quod illa verba usque ad aliam rubricam dici debent semel, sed pro pluribus in plurali, mutato solum genere, si omnes sint feminæ.", "For greater convenience this is noted in parentheses in the rubrics at the proper places: when such a rubric says \"to each individually,\" the words or actions up to the next rubric are to be said or done for each individually, first for the boys and then for the girls, changing only the gender, as said above. When a similar rubric says \"in the plural for several,\" the words up to the next rubric are said once, but in the plural for all, changing only the gender if all are girls."], ["r", "29. Si infans, vel adultus ægrotus adeo graviter laboret, ut periculum immineat, ne pereat antequam Baptismus perficiatur, Sacerdos, omissis quæ Baptismum præcedunt, eum baptizet, ter, vel etiam semel infundens aquam super caput ejus in modum crucis, dicens: Ego te baptízo in nómine Patris, etc., ut supra. Si non habeatur aqua Baptismalis, et periculum impendeat, Sacerdos utatur aqua simplici. Deinde si habeat Chrisma, liniat eum in vertice, dicens: Deus omnípotens, etc., ut supra. Postea dat ei linteolum candidum, dicens: Accipe vestem, etc., ut supra. Ac demum dat ei ceream candelam accensam, dicens: Accipe lámpadem, ut supra. Si supervixerit, suppleantur alii ritus omissi.", "29. If a child, or a sick adult, is in such grave danger that he may die before the Baptism is completed, the priest, omitting what precedes the Baptism, baptizes him, pouring water on his head three times, or even once, in the form of a cross, saying: N., I baptize you in the name of the Father, etc., as above. If baptismal water is not at hand and danger is imminent, the priest uses ordinary water. Then, if he has the chrism, he anoints him on the crown of the head, saying: May almighty God, etc., as above. Afterward he gives him the white cloth, saying: Receive this white garment, etc., as above. Finally he gives him a lighted wax candle, saying: Receive this burning light, as above. If the person survives, the other rites that were omitted are to be supplied."], ["r", "30. Si plures sint baptizandi, et periculum mortis immineat, tempusque non suppetat, ut singuli separatim baptizentur, poterit minister singulorum capitibus aquam infundens omnes simul baptizare, dicendo: Ego vos baptízo in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti. Quam tamen formam ad plures simul baptizandos solum in mortis periculo, et ubi tempus non patiatur, ut singuli separatim baptizentur, alias numquam licet adhibere.", "30. If there are several to be baptized, danger of death is imminent, and there is not time to baptize each one separately, the minister may baptize them all together, pouring water on the head of each and saying: I baptize you all in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit. This form for baptizing several at once may be used only in danger of death and when time does not allow each to be baptized separately; otherwise it is never permitted."], ["r", "31. Admonendi sunt susceptores de spirituali cognatione, quam contraxerunt cum baptizato; quæ cognatio impedit Matrimonium, ac dirimit.", "31. The sponsors are to be reminded of the spiritual relationship they have contracted with the one baptized, a relationship that is an impediment to marriage and renders it invalid."], ["r", "32. Curet Parochus parentes infantis admoneri, ne in lecto secum ipsi, vel nutrices parvulum habeant, propter oppressionis periculum; sed eum diligenter custodiant, et opportune ad christianam disciplinam instituant.", "32. The pastor should see that the child's parents are warned not to keep the little one in bed with them, nor let nurses do so, because of the danger of smothering; but to watch over it carefully and, in due time, bring it up in the Christian way of life."], ["r", "33. Commonendi sunt etiam parentes, et alii, si opus fuerit, ne filios hebræis, aliisve infidelibus, vel hæreticis mulieribus ullo modo lactandos, aut nutriendos tradant.", "33. Parents and others are also to be warned, if need be, not to give their children in any way to be nursed or raised by Jewish, other non-Christian, or heretical women."], ["r", "34. Antequam infans ex ecclesia asportetur, aut susceptores discedant, eorum nomina, et alia de administrato Baptismo ad præscriptam formam in Baptismali libro Parochus accurate describat.", "34. Before the child is carried out of the church or the sponsors leave, the pastor is carefully to record their names and the other particulars of the Baptism in the baptismal register, in the prescribed form."], ["r", "35. Si Baptismus nec a proprio Parocho nec eo præsente administratus fuerit, minister de ipso collato quamprimum proprium ratione domicilii Parochum baptizati certiorem reddat.", "35. If the Baptism was administered neither by the proper pastor nor in his presence, the minister is to inform the pastor of the baptized person's domicile as soon as possible that it has been conferred."], ["r", "36. Ad collatum Baptismum comprobandum, si nemini fiat præjudicium, satis est unus testis omni exceptione major, vel ipsius baptizati jusjurandum, si ipse in adulta ætate Baptismum receperit.", "36. To prove that Baptism has been conferred, provided no one's rights are prejudiced, one entirely trustworthy witness suffices, or the sworn statement of the baptized person himself if he received Baptism as an adult."]]}, {"id": "marriage", "la": "Ritus Celebrandi Matrimonii Sacramentum", "en": "The Rite for Celebrating the Sacrament of Matrimony", "cat": "Sacraments", "ref": "Tit. VII, cap. 2", "b": [["r", "1. Parochus Matrimonio adfuturus, publicationibus factis ut dictum est, si nullum obstet legitimum impedimentum, in ecclesia, superpelliceo et stola alba indutus, adhibito uno saltem Clerico superpelliceo pariter induto, qui librum et vas aquæ benedictæ cum aspersorio deferat, coram duobus saltem testibus, virum et mulierem ante altare genuflexos, quos parentum vel propinquorum suorum præsentia cohonestari decet, de consensu in Matrimonium interroget, utrumque singillatim in hunc modum vulgari sermone:", "1. The pastor who is to assist at the marriage, the banns having been published as prescribed, and no lawful impediment standing in the way, vested in surplice and white stole in the church, and attended by at least one cleric likewise in surplice who carries the book and the vessel of holy water with the sprinkler, in the presence of at least two witnesses, questions the man and the woman, kneeling before the altar (whom the presence of their parents or relatives should honor), about their consent to marriage, each one separately, in the vernacular, in this manner:"], ["r", "Et primo quidem sponsum interroget:", "And first he questions the bridegroom:"], ["t", "N., Vis accípere N., hic præséntem, in tuam legítimam uxórem juxta ritum sanctæ matris Ecclésiæ?", "N., will you take N., here present, for your lawful wife, according to the rite of our holy Mother the Church?"], ["t", "*Respondeat sponsus:* Volo.", "*The bridegroom answers:* I will."], ["r", "2. Mox Sacerdos sponsam interroget:", "2. Then the priest questions the bride:"], ["t", "N., Vis accípere N., hic præséntem, in tuum legítimum marítum juxta ritum sanctæ matris Ecclésiæ?", "N., will you take N., here present, for your lawful husband, according to the rite of our holy Mother the Church?"], ["t", "*Respondeat sponsa:* Volo.", "*The bride answers:* I will."], ["r", "Nec sufficit consensus unius, sed debet esse amborum, et expressus verbis, si loqui possint, aut, secus, æquipollentibus signis, sive fiat per se, sive per procuratorem.", "The consent of one alone does not suffice; it must be the consent of both, expressed in words if they can speak, or otherwise by equivalent signs, whether given in person or through a proxy."], ["r", "Mutuo autem contrahentium consensu intellecto, Sacerdos jubeat eos invicem jungere dexteras, et dicat:", "The mutual consent of the parties having been ascertained, the priest bids them join their right hands, and says:"], ["t", "Ego conjúngo vos in matrimónium. In nómine Patris, ✠ et Fílii, et Spíritus Sancti. Amen.", "I join you together in marriage. In the name of the Father, ✠ and of the Son, and of the Holy Spirit. Amen."], ["r", "Vel aliis utatur verbis juxta receptum uniuscujusque loci ritum. Postea eos aspergat aqua benedicta. Mox benedicat anulum, dicens:", "Or he may use other words according to the accepted rite of each place. Then he sprinkles them with holy water. Next he blesses the ring, saying:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Bene✠dic, Dómine, ánulum hunc, quem nos in tuo nómine bene✠dícimus, ut, quæ eum gestáverit, fidelitátem íntegram suo sponso tenens, in pace et voluntáte tua permáneat atque in mútua caritáte semper vivat. Per Christum, Dóminum nostrum. ℟. Amen.", "Bless ✠, O Lord, this ring, which we ✠ bless in Your name, so that she who wears it, keeping faith unbroken with her husband, may abide in peace and in Your will, and live always in mutual love. Through Christ our Lord. ℟. Amen."], ["r", "3. Deinde Sacerdos aspergat anulum aqua benedicta; et sponsus acceptum anulum de manu Sacerdotis imponat in digito anulari sinistræ manus sponsæ, Sacerdote dicente:", "3. Then the priest sprinkles the ring with holy water; and the bridegroom, receiving the ring from the hand of the priest, places it on the ring finger of the bride's left hand, while the priest says:"], ["t", "In nómine Patris, et Fílii, ✠ et Spíritus Sancti. Amen.", "In the name of the Father, and of the Son, ✠ and of the Holy Spirit. Amen."], ["r", "Mox Sacerdos subjungat:", "Then the priest adds:"], ["v", "Confírma hoc, Deus, quod operátus es in nobis.", "Confirm, O God, what You have wrought in us."], ["x", "A templo sancto tuo, quod est in Jerúsalem.", "From Your holy temple, which is in Jerusalem."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants."], ["x", "Deus meus, sperántes in te.", "Who hope in You, O my God."], ["v", "Mitte eis, Dómine, auxílium de sancto.", "Send them help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eos.", "And defend them out of Sion."], ["v", "Esto eis, Dómine, turris fortitúdinis.", "Be to them, O Lord, a tower of strength."], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Réspice, quǽsumus, Dómine, super hos fámulos tuos: et institútis tuis, quibus propagatiónem humáni géneris ordinásti, benígnus assíste; ut, qui te auctóre jungúntur, te auxiliánte servéntur. Per Christum, Dóminum nostrum. ℟. Amen.", "Look down, we beseech You, O Lord, upon these Your servants, and graciously uphold the institution You established for the continuance of the human race; so that those who are joined together by Your authority may be preserved by Your help. Through Christ our Lord. ℟. Amen."], ["r", "4. His expletis, si benedicendæ sint nuptiæ, Parochus Missam pro Sponso et Sponsa, ut in Missali Romano, celebret, servatis omnibus quæ ibi præscribuntur.", "4. When this is finished, if the nuptial blessing is to be given, the pastor celebrates the Mass for the Bridegroom and Bride as in the Roman Missal, observing everything prescribed there."], ["r", "5. Quando plures simul copulantur, accepto primum singulorum consensu, et rite celebratis singulis Matrimoniis, dictoque pro singulis a Parocho Ego conjúngo vos in matrimónium, etc., benedictiones anulorum et reliquæ benedictiones plurali numero semel fiunt.", "5. When several couples are married together, the consent of each couple is first received and each marriage duly celebrated, the pastor saying \"I join you together in marriage,\" etc., for each; the blessings of the rings and the remaining blessings are then given once, in the plural."], ["r", "6. Ceterum, sicubi aliæ laudabiles consuetudines et cæremoniæ in celebrando Matrimonii Sacramento adhibentur, eas convenit retineri.", "6. Moreover, wherever other praiseworthy customs and ceremonies are used in celebrating the Sacrament of Matrimony, it is fitting that they be retained."], ["r", "7. Celebrato Matrimonio, Parochus vel qui ejus vices gerit, quamprimum describat in libro Matrimoniorum nomina conjugum ac testium, locum et diem celebrati Matrimonii, atque alia juxta formulam præscriptam; idque licet alius Sacerdos vel a se vel ab Ordinario delegatus Matrimonio adstiterit. Præterea Parochus in libro quoque Baptizatorum adnotet conjugem tali die in sua parœcia Matrimonium contraxisse. Quod si conjux alibi baptizatus fuerit, Matrimonii Parochus notitiam initi contractus ad Parochum Baptismi sive per se sive per Curiam episcopalem transmittat, ut Matrimonium in Baptizatorum librum referatur.", "7. After the marriage, the pastor or the one taking his place is to record as soon as possible in the marriage register the names of the spouses and the witnesses, the place and date of the marriage, and the other particulars according to the prescribed form; and this even if another priest, delegated by him or by the Ordinary, assisted at the marriage. The pastor is also to note in the baptismal register that the spouse contracted marriage in his parish on such a day. If the spouse was baptized elsewhere, the pastor of the marriage is to send notice of it to the pastor of the place of baptism, either directly or through the diocesan curia, so that the marriage may be entered in the baptismal register."], ["h", "Ex Missali Romano: Missa pro Sponso et Sponsa", "From the Roman Missal: the Mass for the Bridegroom and Bride"], ["n", "", "Note: these prayers come from the Roman Missal, not the Rituale. After the Our Father of the Mass, before \"Deliver us, we beseech You,\" the priest turns to the bridegroom and bride kneeling before the altar and says over them the following prayers."], ["t", "Orémus.", "Let us pray."], ["t", "Propitiáre, Dómine, supplicatiónibus nostris, et institútis tuis, quibus propagatiónem humáni géneris ordinásti, benígnus assíste: ut, quod te auctóre júngitur, te auxiliánte servétur. Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Be favorable, O Lord, to our prayers, and graciously uphold the institution You established for the continuance of the human race; so that what is joined together by Your authority may be preserved by Your help. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui potestáte virtútis tuæ de níhilo cuncta fecísti: qui, dispósitis universitátis exórdiis, hómini, ad imáginem Dei facto, ídeo inseparábile mulíeris adjutórium condidísti, ut femíneo córpori de viríli dares carne princípium, docens, quod ex uno placuísset ínstitui, numquam licére disjúngi: Deus, qui tam excellénti mystério conjugálem cópulam consecrásti, ut Christi et Ecclésiæ sacraméntum præsignáres in fœdere nuptiárum: Deus, per quem múlier júngitur viro, et socíetas principáliter ordináta ea benedictióne donátur, quæ sola nec per originális peccáti pœnam nec per dilúvii est abláta senténtiam: réspice propítius super hanc fámulam tuam, quæ maritáli jungénda consórtio, tua se éxpetit protectióne muníri: sit in ea jugum dilectiónis et pacis: fidélis et casta nubat in Christo, imitatríxque sanctárum permáneat feminárum: sit amábilis viro suo, ut Rachel: sápiens, ut Rebécca: longǽva et fidélis, ut Sara: nihil in ea ex áctibus suis ille auctor prævaricatiónis usúrpet: nexa fídei mandatísque permáneat: uni thoro juncta, contáctus illícitos fúgiat: múniat infirmitátem suam róbore disciplínæ: sit verecúndia gravis, pudóre venerábilis, doctrínis cæléstibus erudíta: sit fœcúnda in sóbole, sit probáta et ínnocens: et ad beatórum réquiem atque ad cæléstia regna pervéniat: et vídeant ambo fílios filiórum suórum, usque in tértiam et quartam generatiónem, et ad optátam pervéniant senectútem. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte Spíritus Sancti, Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who by the might of Your power made all things out of nothing; who, when the beginnings of the universe had been set in order, made for man, created in the image of God, the inseparable help of woman, giving the woman's body its origin from the flesh of man, and teaching that what it had pleased You to form from one may never lawfully be separated: O God, who consecrated the union of marriage by so excellent a mystery that in the covenant of wedlock You foreshadowed the sacrament of Christ and the Church: O God, by whom woman is joined to man, and that partnership, ordained from the beginning, is endowed with the one blessing that was taken away neither by the penalty of original sin nor by the sentence of the flood: look kindly upon this Your handmaid, who, about to be joined in marriage, seeks to be strengthened by Your protection. May the yoke she bears be one of love and peace. Faithful and chaste, may she marry in Christ, and remain a follower of holy women. May she be beloved of her husband, like Rachel; wise, like Rebecca; long-lived and faithful, like Sarah. May the author of sin claim nothing in her by her deeds. May she remain bound to the faith and the commandments; united to one husband, may she shun all unlawful contact; may she fortify her weakness with the strength of discipline. May she be grave in modesty, honorable in purity, learned in heavenly doctrine. May she be fruitful in offspring; may she be approved and innocent, and come at last to the rest of the blessed and to the kingdom of heaven. And may they both see their children's children to the third and fourth generation, and reach the old age they desire. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["n", "", "At the end of Mass, before the final blessing, the priest turns to the newly married and says:"], ["t", "Deus Abraham, Deus Isaac, et Deus Jacob sit vobíscum: et ipse adímpleat benedictiónem suam in vobis: ut videátis fílios filiórum vestrórum usque ad tértiam et quartam generatiónem, et póstea vitam ætérnam habeátis sine fine: adjuvánte Dómino nostro Jesu Christo, qui cum Patre et Spíritu Sancto vivit et regnat Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "May the God of Abraham, the God of Isaac, and the God of Jacob be with you, and may He fulfill His blessing in you, so that you may see your children's children to the third and fourth generation, and afterward have life everlasting without end; by the help of our Lord Jesus Christ, who with the Father and the Holy Spirit lives and reigns, God, for ever and ever. ℟. Amen."], ["n", "", "The Missal then directs the priest to exhort the couple to remain faithful to one another and to live in the fear of the Lord, and to sprinkle them with holy water."]]}, {"id": "nuptial-blessing-outside-mass", "la": "Benedictio Nuptialis extra Missam", "en": "The Nuptial Blessing outside Mass", "cat": "Sacraments", "ref": "Appendix, De Matrimonio, I", "b": [["r", "Expleto ritu celebrandi Matrimonii sacramentum, post Orationem Réspice, etc., si permittatur benedictio nuptialis, sed non dicatur Missa, Sacerdos qui speciale indultum a Sancta Sede obtinuerit, ad neo-conjugatos conversus, dicit Psalmum sequentem:", "When the rite of celebrating the Sacrament of Matrimony is finished, after the prayer \"Look down,\" etc., if the nuptial blessing is permitted but Mass is not said, a priest who has obtained a special indult from the Holy See, turning to the newly married, says the following psalm:"], ["h", "Psalmus 127", "Psalm 127"], ["t", "Beáti omnes, qui timent Dóminum, * qui ámbulant in viis ejus.", "Blessed are all who fear the Lord, * who walk in His ways."], ["t", "Labóres mánuum tuárum quia manducábis: * beátus es, et bene tibi erit.", "For you shall eat the labors of your hands; * blessed are you, and it shall be well with you."], ["t", "Uxor tua sicut vitis abúndans, * in latéribus domus tuæ.", "Your wife shall be like a fruitful vine * on the sides of your house."], ["t", "Fílii tui sicut novéllæ olivárum, * in circúitu mensæ tuæ.", "Your children like olive shoots * round about your table."], ["t", "Ecce, sic benedicétur homo, * qui timet Dóminum.", "Behold, thus shall the man be blessed * who fears the Lord."], ["t", "Benedícat tibi Dóminus ex Sion: * et vídeas bona Jerúsalem ómnibus diébus vitæ tuæ.", "May the Lord bless you out of Sion, * and may you see the good things of Jerusalem all the days of your life."], ["t", "Et vídeas fílios filiórum tuórum, * pacem super Israel.", "And may you see your children's children, * peace upon Israel."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Bene✠dic, Dómine, et réspice de cælis super hanc conjunctiónem: et sicut misísti sanctum Angelum tuum Raphaélem pacíficum ad Tobíam et Saram, fíliam Raguélis; ita dignéris, Dómine, míttere benedictiónem tuam super hos cónjuges, ut in tua benedictióne permáneant, in tua voluntáte persístant, et in tuo amóre vivant. Per Christum, Dóminum nostrum. ℟. Amen.", "Bless ✠, O Lord, and look down from heaven upon this union; and as You sent Your holy Angel Raphael, the bringer of peace, to Tobias and Sara, the daughter of Raguel, so deign, O Lord, to send Your blessing upon this husband and wife, that they may abide in Your blessing, persevere in Your will, and live in Your love. Through Christ our Lord. ℟. Amen."], ["r", "Deinde elevatis manibus et extensis super capita eorum, ministro librum tenente, dicit:", "Then, with hands raised and extended over their heads, the server holding the book, he says:"], ["t", "Dóminus Deus omnípotens benedícat vos, impleátque benedictiónem in vobis, et videátis fílios filiórum vestrórum usque in tértiam et quartam generatiónem et progéniem, et ad optátam perveniátis senectútem. Per Christum, Dóminum nostrum. ℟. Amen.", "May the Lord God almighty bless you and fulfill His blessing in you; may you see your children's children to the third and fourth generation and beyond, and reach the old age you desire. Through Christ our Lord. ℟. Amen."]]}, {"id": "prayers-over-spouses", "la": "Preces super Conjuges", "en": "Prayers over the Spouses when the Nuptial Blessing is not Permitted", "cat": "Sacraments", "ref": "Appendix, De Matrimonio, II", "b": [["r", "Si sponsa sit vidua jam in primis nuptiis benedicta, vel etiam si prima vice nubat, sed tempore clauso, expleto ritu celebrandi Matrimonii sacramentum, post Orationem Réspice, etc., Sacerdos, qui speciale indultum a Sancta Sede obtinuerit, ad neo-conjugatos conversus, dicit Psalmum 127, Beáti omnes, ut supra, cum Glória Patri; deinde:", "If the bride is a widow who already received the blessing at her first marriage, or if she is marrying for the first time but during the closed season, then after the rite of celebrating the Sacrament of Matrimony and the prayer \"Look down,\" etc., a priest who has obtained a special indult from the Holy See, turning to the newly married, says Psalm 127, \"Blessed are all,\" as above, with the Glory be; then:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Preténde, quǽsumus, Dómine, fidélibus tuis déxteram cæléstis auxílii, ut te toto corde perquírant, et quæ digne póstulant, assequántur. Per Christum, Dóminum nostrum. ℟. Amen.", "Stretch forth, O Lord, we beseech You, the right hand of heavenly help to Your faithful, that they may seek You with all their heart and obtain what they worthily ask. Through Christ our Lord. ℟. Amen."]]}, {"id": "churching", "la": "Benedictio Mulieris post Partum", "en": "The Blessing of a Mother after Childbirth (Churching)", "cat": "Sacraments", "ref": "Tit. VII, cap. 3", "b": [["r", "1. Si qua puerpera post partum, juxta piam ac laudabilem consuetudinem, ad ecclesiam venire voluerit, pro incolumitate sua Deo gratias actura, petieritque a Sacerdote benedictionem, ipse superpelliceo et stola alba indutus, cum ministro aspersorium deferente, ad fores ecclesiæ accedat, ubi illam foris ad limina genuflectentem et candelam accensam in manu tenentem, aqua benedicta aspergat, deinde dicat:", "1. If a mother after childbirth, following the pious and praiseworthy custom, wishes to come to the church to give thanks to God for her safe delivery, and asks the priest for a blessing, he, vested in surplice and white stole, with a server carrying the sprinkler, goes to the door of the church, where she kneels outside at the threshold holding a lighted candle in her hand. He sprinkles her with holy water and then says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "*Ant.* Hæc accípiet.", "*Ant.* She shall receive."], ["h", "Psalmus 23", "Psalm 23"], ["t", "Dómini est terra, et plenitúdo ejus: * orbis terrárum, et univérsi qui hábitant in eo.", "The earth is the Lord's and the fullness thereof, * the world and all who dwell in it."], ["t", "Quia ipse super mária fundávit eum: * et super flúmina præparávit eum.", "For He has founded it upon the seas, * and established it upon the rivers."], ["t", "Quis ascéndet in montem Dómini? * aut quis stabit in loco sancto ejus?", "Who shall ascend the mountain of the Lord? * Or who shall stand in His holy place?"], ["t", "Innocens mánibus et mundo corde, * qui non accépit in vano ánimam suam, nec jurávit in dolo próximo suo.", "The innocent of hands and clean of heart, * who has not set his soul on vain things, nor sworn deceitfully to his neighbor."], ["t", "Hic accípiet benedictiónem a Dómino: * et misericórdiam a Deo, salutári suo.", "He shall receive a blessing from the Lord, * and mercy from God his Savior."], ["t", "Hæc est generátio quæréntium eum, * quæréntium fáciem Dei Jacob.", "Such is the generation of those who seek Him, * who seek the face of the God of Jacob."], ["t", "Attóllite portas, príncipes, vestras, et elevámini, portæ æternáles: * et introíbit Rex glóriæ.", "Lift up your gates, O princes, and be lifted up, O eternal gates, * and the King of glory shall enter in."], ["t", "Quis est iste Rex glóriæ? * Dóminus fortis et potens: Dóminus potens in prǽlio.", "Who is this King of glory? * The Lord, strong and mighty; the Lord, mighty in battle."], ["t", "Attóllite portas, príncipes, vestras, et elevámini, portæ æternáles: * et introíbit Rex glóriæ.", "Lift up your gates, O princes, and be lifted up, O eternal gates, * and the King of glory shall enter in."], ["t", "Quis est iste Rex glóriæ? * Dóminus virtútum ipse est Rex glóriæ.", "Who is this King of glory? * The Lord of hosts, He is the King of glory."], ["t", "Glória Patri.", "Glory be to the Father."], ["r", "Et repetitur Antiphona:", "And the antiphon is repeated:"], ["t", "*Ant.* Hæc accípiet benedictiónem a Dómino, et misericórdiam a Deo, salutári suo: quia hæc est generátio quæréntium Dóminum.", "*Ant.* She shall receive a blessing from the Lord, and mercy from God her Savior; for she is of the generation of those who seek the Lord."], ["r", "2. Deinde porrigens ad manum mulieris extremam partem stolæ, ex humero sinistro pendentem, eam introducit in ecclesiam, dicens:", "2. Then, extending to the woman's hand the end of the stole hanging from his left shoulder, he leads her into the church, saying:"], ["t", "Ingrédere in templum Dei, adóra Fílium beátæ Maríæ Vírginis, qui tibi fecunditátem tríbuit prolis.", "Enter into the temple of God; adore the Son of the Blessed Virgin Mary, who has given you the blessing of a child."], ["r", "3. Et ipsa, ingressa, genuflectit coram Altari et orat, gratias agens Deo de beneficiis sibi collatis; tunc Sacerdos dicit:", "3. Having entered, she kneels before the altar and prays, thanking God for the blessings bestowed on her; then the priest says:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvam fac ancíllam tuam, Dómine.", "Save Your handmaid, O Lord."], ["x", "Deus meus, sperántem in te.", "Who hopes in You, O my God."], ["v", "Mitte ei, Dómine, auxílium de sancto.", "Send her help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eam.", "And defend her out of Sion."], ["v", "Nihil profíciat inimícus in ea.", "Let the enemy have no power over her."], ["x", "Et fílius iniquitátis non appónat nocére ei.", "And let the son of iniquity do nothing to harm her."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui per beátæ Maríæ Vírginis partum fidélium pariéntium dolóres in gáudium vertísti: réspice propítius super hanc fámulam tuam, ad templum sanctum tuum pro gratiárum actióne lætam accedéntem, et præsta; ut post hanc vitam, ejúsdem beátæ Maríæ méritis et intercessióne, ad ætérnæ beatitúdinis gáudia cum prole sua perveníre mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who through the child-bearing of the Blessed Virgin Mary have turned into joy the pains of the faithful in childbirth, look kindly upon this Your handmaid, who comes joyfully to Your holy temple to give thanks; and grant that after this life, by the merits and intercession of the same Blessed Mary, she may be worthy to attain, together with her child, the joys of everlasting happiness. Through Christ our Lord. ℟. Amen."], ["r", "4. Deinde illam aspergit iterum aqua benedicta, dicens:", "4. Then he sprinkles her again with holy water, saying:"], ["t", "Pax et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the peace and blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "5. Prædicta benedictio mulieris post partum fieri debet a Parocho, si expetitus ipse fuerit: potest autem fieri a quocumque Sacerdote, si expetitus pariter fuerit, in quacumque ecclesia vel oratorio publico, certiore facto Superiore ecclesiæ.", "5. This blessing of a mother after childbirth should be given by the pastor if he is asked; but it may be given by any priest who is likewise asked, in any church or public oratory, the rector of the church having been informed."]]}, {"id": "general-rules", "la": "De Benedictionibus: Regulæ Generales", "en": "On Blessings: General Rules", "cat": "General", "ref": "Tit. VIII, cap. 1", "b": [["r", "1. Benedictiones impertire potest quilibet Presbyter, exceptis iis quæ Romano Pontifici aut Episcopis aliisve reserventur. Benedictio reservata quæ a Presbytero detur sine necessaria licentia, illicita est, sed valida, nisi in reservatione Sedes Apostolica aliud expresserit. Diaconi et Lectores illas tantum valide et licite benedictiones dare possunt, quæ ipsis expresse a jure permittuntur.", "1. Any priest may impart blessings, except those reserved to the Roman Pontiff, to bishops, or to others. A reserved blessing given by a priest without the necessary permission is unlawful but valid, unless the Apostolic See has stated otherwise in making the reservation. Deacons and lectors can validly and lawfully give only those blessings expressly permitted to them by law."], ["r", "2. Benedictiones sive constitutivæ sive invocativæ invalidæ sunt, si adhibita non fuerit formula ab Ecclesia præscripta.", "2. Blessings, whether constitutive or invocative, are invalid if the formula prescribed by the Church has not been used."], ["r", "3. Benedictiones, imprimis impertiendæ catholicis, dari quoque possunt catechumenis, immo, nisi obstet Ecclesiæ prohibitio, etiam acatholicis ad obtinendum fidei lumen vel, una cum illo, corporis sanitatem.", "3. Blessings, which are to be given first of all to Catholics, may also be given to catechumens, and even, unless a prohibition of the Church stands in the way, to non-Catholics, to obtain for them the light of faith or, together with it, bodily health."], ["r", "4. Res benedictæ constitutiva benedictione, reverenter tractentur neque ad usum profanum vel non proprium adhibeantur, etiamsi in dominio privatorum sint.", "4. Things blessed with a constitutive blessing are to be treated with reverence and are not to be put to profane or improper use, even if they are privately owned."], ["r", "5. Benedictionem illius sacræ supellectilis quæ ad normam legum liturgicarum benedici debet antequam ad usum sibi proprium adhibeatur, impertire possunt: 1° S. R. E. Cardinales et Episcopi omnes; 2° Locorum Ordinarii, charactere episcopali carentes, pro ecclesiis et oratoriis proprii territorii; 3° Parochus pro ecclesiis et oratoriis in territorio suæ parœciæ positis, et rectores ecclesiarum pro suis ecclesiis; 4° Sacerdotes a loci Ordinario delegati, intra fines delegationis et jurisdictionis delegantis; 5° Superiores religiosi, et Sacerdotes ejusdem religionis ab ipsis delegati, pro propriis ecclesiis et oratoriis ac pro ecclesiis monialium sibi subjectarum.", "5. The blessing of those sacred furnishings which, according to the liturgical laws, must be blessed before being put to their proper use may be given by: (1) the Cardinals of the Holy Roman Church and all bishops; (2) local Ordinaries who are not bishops, for the churches and oratories of their own territory; (3) the pastor, for the churches and oratories within the territory of his parish, and rectors of churches for their own churches; (4) priests delegated by the local Ordinary, within the limits of the delegation and of the delegating person's jurisdiction; (5) religious superiors, and priests of the same institute delegated by them, for their own churches and oratories and for the churches of nuns subject to them."], ["r", "6. In omni benedictione extra Missam, Sacerdos saltem superpelliceo et stola coloris tempori convenientis utatur, nisi aliter notetur.", "6. For every blessing outside Mass the priest wears at least a surplice and a stole of the color suited to the season, unless otherwise noted."], ["r", "7. Stando semper benedicat, et aperto capite. In principio cujusque benedictionis, nisi aliter notetur, dicat:", "7. He always blesses standing and with head uncovered. At the beginning of each blessing, unless otherwise noted, he says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["r", "Deinde dicat Orationem propriam, unam vel plures, prout suo loco notatum fuerit. Postea rem aspergat aqua benedicta, et, ubi notatum fuerit, pariter incenset, nihil dicendo.", "Then he says the proper prayer, one or more, as noted in each place. Afterward he sprinkles the object with holy water and, where so noted, incenses it as well, saying nothing."], ["r", "8. Cum Sacerdos aliquid benedicturus est, habeat ministrum cum vase aquæ benedictæ et aspersorio, et cum hoc Rituali libro, seu Missali.", "8. When the priest is about to bless something, he should have a server with the vessel of holy water and the sprinkler, and with this Ritual or the Missal."], ["r", "9. Caveat, ne benedictionis causa ponat aliquid indecens super Altare, veluti esculenta; sed quod ejusmodi est, ponatur super mensam, commodo loco paratam.", "9. He must take care not to place anything unbecoming on the altar for the purpose of blessing it, such as food; things of that kind are to be placed on a table prepared in a convenient place."]]}, {"id": "holy-water", "la": "Ordo ad Faciendam Aquam Benedictam", "en": "The Order for Making Holy Water", "cat": "Holy Water", "ref": "Tit. VIII, cap. 2", "b": [["r", "1. Diebus Dominicis, et quandocumque opus sit, præparato sale et aqua munda benedicenda in ecclesia, vel in sacristia, Sacerdos, superpelliceo et stola violacea indutus, primo dicit:", "1. On Sundays, and whenever it is needed, salt and clean water to be blessed having been prepared in the church or in the sacristy, the priest, vested in surplice and violet stole, first says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["r", "2. Deinde absolute incipit exorcismum salis.", "2. Then he begins the exorcism of the salt directly."], ["h", "Exorcismus salis", "Exorcism of the salt"], ["t", "Exorcízo te, creatúra salis, per Deum ✠ vivum, per Deum ✠ verum, per Deum ✠ sanctum, per Deum, qui te per Eliséum Prophétam in aquam mitti jussit, ut sanarétur sterílitas aquæ: ut efficiáris sal exorcizátum in salútem credéntium; et sis ómnibus suméntibus te sánitas ánimæ et córporis; et effúgiat, atque discédat a loco, in quo aspérsum fúeris, omnis phantásia, et nequítia, vel versútia diabólicæ fraudis, omnísque spíritus immúndus, adjurátus per eum, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of salt, by the ✠ living God, by the ✠ true God, by the ✠ holy God, by God who commanded you to be cast into the water by the prophet Elisha, that its barrenness might be healed: that you may become exorcised salt for the salvation of believers; that you may be health of soul and body to all who take you; and that from the place where you are sprinkled every illusion and wickedness and cunning of the devil's deceit may flee and depart, together with every unclean spirit, adjured by Him who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Imménsam cleméntiam tuam, omnípotens ætérne Deus, humíliter implorámus, ut hanc creatúram salis, quam in usum géneris humáni tribuísti, bene✠dícere et sancti✠ficáre tua pietáte dignéris: ut sit ómnibus suméntibus salus mentis et córporis; et quidquid ex eo tactum vel respérsum fúerit, cáreat omni immundítia, omníque impugnatióne spiritális nequítiæ. Per Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, we humbly implore Your boundless mercy, that in Your goodness You would deign to ✠ bless and ✠ sanctify this creature of salt, which You have given for the use of mankind, so that it may be health of mind and body to all who take it; and that whatever is touched or sprinkled with it may be free from all uncleanness and from every attack of spiritual wickedness. Through our Lord. ℟. Amen."], ["h", "Exorcismus aquæ (dicitur absolute)", "Exorcism of the water (said directly)"], ["t", "Exorcízo te, creatúra aquæ, in nómine Dei ✠ Patris omnipoténtis, et in nómine Jesu ✠ Christi, Fílii ejus, Dómini nostri, et in virtúte Spíritus ✠ Sancti: ut fias aqua exorcizáta ad effugándam omnem potestátem inimíci, et ipsum inimícum eradicáre et explantáre váleas cum ángelis suis apostáticis, per virtútem ejúsdem Dómini nostri Jesu Christi: qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of water, in the name of God the ✠ Father almighty, and in the name of Jesus ✠ Christ, His Son, our Lord, and in the power of the Holy ✠ Spirit: that you may become water exorcised to put to flight every power of the enemy, and that you may be able to uproot and cast out the enemy himself with his apostate angels, by the power of the same Jesus Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui ad salútem humáni géneris, máxima quæque sacraménta in aquárum substántia condidísti: adésto propítius invocatiónibus nostris, et eleménto huic multímodis purificatiónibus præparáto, virtútem tuæ bene✠dictiónis infúnde; ut creatúra tua, mystériis tuis sérviens, ad abigéndos dæmones, morbósque pelléndos, divínæ grátiæ sumat efféctum; ut quidquid in dómibus, vel in locis fidélium, hæc unda respérserit, cáreat omni immundítia, liberétur a noxa: non illic resídeat spíritus péstilens, non aura corrúmpens: discédant omnes insídiæ laténtis inimíci; et si quid est, quod aut incolumitáti habitántium ínvidet, aut quiéti, aspersióne hujus aquæ effúgiat: ut salúbritas per invocatiónem sancti tui nóminis expetíta, ab ómnibus sit impugnatiónibus defénsa. Per Dóminum nostrum. ℟. Amen.", "O God, who for the salvation of mankind have built Your greatest sacraments upon the substance of water: graciously hear our prayers, and pour forth the power of Your ✠ blessing upon this element, prepared by many kinds of purification; so that this Your creature, serving Your mysteries, may receive the effect of divine grace to drive away demons and to banish sickness; that whatever this water sprinkles in the homes or places of the faithful may be freed from all uncleanness and delivered from harm. Let no pestilent spirit, no corrupting air remain there; let all the snares of the hidden enemy depart; and if there is anything that begrudges the safety or the peace of those who dwell there, let it flee at the sprinkling of this water; so that the well-being sought by calling upon Your holy name may be defended against every attack. Through our Lord. ℟. Amen."], ["r", "3. Hic ter mittat sal in aquam in modum crucis, dicendo semel:", "3. Here he puts the salt into the water three times in the form of a cross, saying once:"], ["t", "Commíxtio salis et aquæ páriter fiat, in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti. ℟. Amen.", "May this mingling of salt and water be made, in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit. ℟. Amen."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, invíctæ virtútis auctor, et insuperábilis impérii Rex, ac semper magníficus triumphátor: qui advérsæ dominatiónis vires réprimis: qui inimíci rugiéntis sævítiam súperas: qui hostíles nequítias poténter expúgnas: te, Dómine, treméntes et súpplices deprecámur, ac pétimus: ut hanc creatúram salis et aquæ dignánter aspícias, benígnus illústres, pietátis tuæ rore sanctífices; ut, ubicúmque fúerit aspérsa, per invocatiónem sancti nóminis tui, omnis infestátio immúndi spíritus abigátur: terrórque venenósi serpéntis procul pellátur: et præséntia Sancti Spíritus nobis, misericórdiam tuam poscéntibus, ubíque adésse dignétur. Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, author of invincible power, King of an empire that cannot be overcome, and ever glorious conqueror; who hold in check the forces of the adversary's dominion; who overcome the fury of the roaring enemy; who mightily vanquish his hostile wickedness: trembling and humbly we beseech and entreat You, O Lord, graciously to look upon this creature of salt and water, kindly to make it shine, and to sanctify it with the dew of Your goodness; so that wherever it is sprinkled, every assault of the unclean spirit may be driven off by the invocation of Your holy name, the dread of the poisonous serpent may be cast far away, and the presence of the Holy Spirit may everywhere be with us who ask for Your mercy. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "4. Post benedictionem aquæ, Sacerdos Dominicis diebus, antequam incipiat Missam, aspergit Altare, deinde se, et Ministros, ac populum, prout in Missali præscribitur, et in Appendice hujus Ritualis habetur.", "4. After the blessing of the water, on Sundays before beginning Mass, the priest sprinkles the altar, then himself, the ministers, and the people, as prescribed in the Missal and given in the Appendix of this Ritual."], ["r", "5. Christifideles autem possunt de ista aqua benedicta in vasculis suis accipere, et secum deferre ad aspergendos ægros, domos, agros, vineas, et alia, et ad eam habendam in cubiculis suis, ut ea cotidie et sæpius aspergi possint.", "5. The faithful may take some of this holy water in their own containers and carry it home to sprinkle the sick, their homes, fields, vineyards, and other things, and to keep it in their rooms, so that they may be sprinkled with it daily and often."]]}, {"id": "candles", "la": "Benedictio Candelarum", "en": "Blessing of Candles", "cat": "Objects of Devotion", "ref": "Tit. VIII, cap. 3", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, béne✠dic candélas istas supplicatiónibus nostris: infúnde eis, Dómine, per virtútem sanctæ Cru✠cis, benedictiónem cæléstem, qui eas ad repelléndas ténebras humáno géneri tribuísti; talémque benedictiónem signáculo sanctæ Cru✠cis accípiant, ut quibuscúmque locis accénsæ, sive pósitæ fúerint, discédant príncipes tenebrárum, et contremíscant, et fúgiant pávidi cum ómnibus minístris suis ab habitatiónibus illis, nec præsúmant ámplius inquietáre, aut molestáre serviéntes tibi omnipoténti Deo: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, ✠ bless these candles at our humble request. By the power of the holy ✠ Cross, O Lord, pour upon them a heavenly blessing, You who gave them to mankind to dispel the darkness; and may they receive such a blessing through the sign of the holy ✠ Cross that, wherever they are lighted or placed, the princes of darkness may depart, tremble, and flee in terror with all their ministers from those dwellings, and no longer presume to disturb or molest those who serve You, the almighty God, who live and reign for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "homes-easter", "la": "Benedictio Domorum in Sabbato Sancto et reliquo Tempore Paschali", "en": "Blessing of Homes on Holy Saturday and during Eastertide", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 4", "b": [["r", "1. Parochus, seu alius Sacerdos de Parochi licentia, superpelliceo et stola alba indutus, cum ministro deferente vas aquæ benedictæ in Fonte baptismali, atque ante infusionem Olei et Chrismatis acceptæ, Sabbato Sancto visitat domos suæ parœciæ, aspergens eas eadem aqua benedicta. Ingrediens domum dicit:", "1. The pastor, or another priest with the pastor's permission, vested in surplice and white stole, with a server carrying a vessel of the water blessed in the baptismal font and taken before the pouring in of the oil and chrism, visits the homes of his parish on Holy Saturday, sprinkling them with this holy water. Entering the house, he says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "2. Deinde aspergens loca præcipua domus, et habitantes in ea, dicit Antiphonam:", "2. Then, sprinkling the principal rooms of the house and those who live there, he says the antiphon:"], ["t", "*Ant.* Vidi aquam egrediéntem de templo, a látere dextro, allelúja: et omnes, ad quos pervénit aqua ista, salvi facti sunt, et dicent: allelúja, allelúja.", "*Ant.* I saw water flowing from the temple, from its right side, alleluia; and all to whom that water came were saved, and they shall say: alleluia, alleluia."], ["t", "*Ps. 117, 1.* Confitémini Dómino, quóniam bonus: quóniam in sǽculum misericórdia ejus.", "*Ps. 117, 1.* Give praise to the Lord, for He is good; for His mercy endures for ever."], ["t", "Glória Patri, etc.", "Glory be to the Father, etc."], ["r", "Repetitur Antiphona: Vidi aquam, etc. Deinde dicit:", "The antiphon \"I saw water,\" etc., is repeated. Then he says:"], ["v", "Osténde nobis, Dómine, misericórdiam tuam, allelúja.", "Show us, O Lord, Your mercy, alleluia."], ["x", "Et salutáre tuum da nobis, allelúja.", "And grant us Your salvation, alleluia."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi nos, Dómine sancte, Pater omnípotens, ætérne Deus: et sicut domos Hebræórum in éxitu de Ægýpto, agni sánguine linítas (quod pascha nostrum, in quo immolátus est Christus, figurábat), ab Angelo percutiénte custodísti; ita míttere dignéris sanctum Angelum tuum de cælis, qui custódiat, fóveat, prótegat, vísitet, atque deféndat omnes habitántes in hoc habitáculo. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "Hear us, holy Lord, Father almighty, everlasting God; and as You protected from the destroying Angel the houses of the Hebrews that were marked with the blood of the lamb at the departure from Egypt (a figure of our Pasch, in which Christ was sacrificed), so deign to send Your holy Angel from heaven to guard, cherish, protect, visit, and defend all who dwell in this house. Through the same Christ our Lord. ℟. Amen."], ["r", "3. Ritus superius descriptus adhibetur, etiamsi benedictio domorum fiat alia die intra Tempus Paschale pro locorum consuetudine.", "3. The rite described above is used even if, according to local custom, the blessing of homes takes place on another day within Eastertide."]]}, {"id": "homes", "la": "Benedictio Domorum extra Tempus Paschale", "en": "Blessing of Homes outside Eastertide", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 5", "b": [["r", "1. Parochus, seu alius Sacerdos, volens aliquam particularem domum, vel generaliter domos fidelium, extra Tempus Paschale aspergere aqua benedicta, ingrediens domum dicit:", "1. The pastor, or another priest, wishing to sprinkle with holy water a particular house, or the homes of the faithful generally, outside Eastertide, says on entering the house:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "2. Deinde loca præcipua domus aspergendo, dicit Antiphonam:", "2. Then, sprinkling the principal rooms of the house, he says the antiphon:"], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* Sprinkle me, O Lord, with hyssop, and I shall be cleansed; wash me, and I shall be made whiter than snow."], ["t", "*Ps. 50, 3.* Miserére mei, Deus, secúndum magnam misericórdiam tuam. Glória Patri, etc.", "*Ps. 50, 3.* Have mercy on me, O God, according to Your great mercy. Glory be to the Father, etc."], ["r", "Et repetitur Antiphona: Aspérges me, etc.", "And the antiphon \"Sprinkle me,\" etc., is repeated."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi nos, Dómine sancte, Pater omnípotens, ætérne Deus: et míttere dignéris sanctum Angelum tuum de cælis, qui custódiat, fóveat, prótegat, vísitet, atque deféndat omnes habitántes in hoc habitáculo. Per Christum, Dóminum nostrum. ℟. Amen.", "Hear us, holy Lord, Father almighty, everlasting God, and deign to send Your holy Angel from heaven to guard, cherish, protect, visit, and defend all who dwell in this house. Through Christ our Lord. ℟. Amen."]]}, {"id": "place-or-house", "la": "Benedictio Loci vel Domus", "en": "Blessing of a Place or a House", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 6", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, Deus omnípotens, locum istum (vel domum istam): ut sit in eo (ea) sánitas, cástitas, victória, virtus, humílitas, bónitas, et mansuetúdo, plenitúdo legis, et gratiárum áctio Deo Patri, et Fílio, et Spirítui Sancto; et hæc benedíctio máneat super hunc locum (vel super hanc domum) et super habitántes in eo (ea) nunc et in ómnia sǽcula sæculórum. ℟. Amen.", "✠ Bless, O Lord God almighty, this place (or this house), that in it there may be health, chastity, victory, strength, humility, goodness and gentleness, the fullness of the law, and thanksgiving to God the Father, and to the Son, and to the Holy Spirit; and may this blessing remain upon this place (or this house) and upon those who dwell in it, now and for all ages. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "house-another", "la": "Alia Benedictio Domus", "en": "Another Blessing of a House", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 7", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Te Deum Patrem omnipoténtem supplíciter exorámus pro hac domo, et habitatóribus ejus, ac rebus: ut eam bene✠dícere, et sancti✠ficáre, ac bonis ómnibus ampliáre dignéris: tríbue eis, Dómine, de rore cæli abundántiam, et de pinguédine terræ vitæ substántiam, et desidéria voti eórum ad efféctum tuæ miseratiónis perdúcas. Ad intróitum ergo nostrum bene✠dícere, et sancti✠ficáre dignéris hanc domum, sicut benedícere dignátus es domum Abraham, Isaac, et Jacob: et intra paríetes domus istíus Angeli tuæ lucis inhábitent, eámque, et ejus habitatóres custódiant. Per Christum, Dóminum nostrum. ℟. Amen.", "We humbly beseech You, God the Father almighty, for this house, its inhabitants, and its goods: that You would deign to ✠ bless and ✠ sanctify it and enrich it with every good thing. Grant them, O Lord, abundance from the dew of heaven and the substance of life from the fatness of the earth, and bring the desires of their prayers to fulfillment through Your mercy. At our coming in, then, deign to ✠ bless and ✠ sanctify this house, as You deigned to bless the house of Abraham, Isaac, and Jacob; and within the walls of this house may the Angels of Your light dwell, and guard it and those who live in it. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "bridal-chamber", "la": "Benedictio Thalami", "en": "Blessing of a Bridal Chamber", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 8", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, thálamum hunc: ut omnes habitántes in eo, in tua pace consístant, et in tua voluntáte permáneant, et senéscant, et multiplicéntur in longitúdinem diérum, et ad regna cælórum pervéniant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, this bridal chamber, that all who dwell in it may abide in Your peace and persevere in Your will, may grow old and be multiplied in length of days, and come at last to the kingdom of heaven. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "asperges", "la": "Benedictio Populi cum Aqua Benedicta diebus Dominicis", "en": "The Sprinkling of the People with Holy Water on Sundays (Asperges)", "cat": "Holy Water", "ref": "Appendix, Benedictiones non reservatæ, 1", "b": [["r", "Sacerdos celebraturus, indutus pluviali coloris Officio convenientis, accedit ad Altare, et ibi ad gradus cum Ministris genuflexus, etiam Tempore Paschali, accipit a Diacono aspersorium, et primo ter aspergit Altare, deinde se, et erectus Ministros, incipiens Antiphonam: Aspérges me. Et chorus prosequitur: Dómine, hyssópo, etc., ut infra. Interim Celebrans aspergit clerum, deinde populum, dicens submissa voce cum Ministris Psalmum Miserére mei, Deus.", "The priest who is to celebrate, vested in a cope of the color proper to the Office, goes to the altar and, kneeling there on the steps with the ministers (even in Eastertide), receives the sprinkler from the deacon. He first sprinkles the altar three times, then himself, and then, standing, the ministers, intoning the antiphon \"Sprinkle me.\" The choir continues \"O Lord, with hyssop,\" etc., as below. Meanwhile the celebrant sprinkles the clergy and then the people, saying in a low voice with the ministers the psalm \"Have mercy on me, O God.\""], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* Sprinkle me, O Lord, with hyssop, and I shall be cleansed; wash me, and I shall be made whiter than snow."], ["t", "*Ps. 50, 3.* Miserére mei, Deus, secúndum magnam misericórdiam tuam. Glória Patri.", "*Ps. 50, 3.* Have mercy on me, O God, according to Your great mercy. Glory be to the Father."], ["r", "Et repetitur Antiphona Aspérges me. Hæc Antiphona prædicto modo dicitur ad aspersionem aquæ benedictæ in Dominicis per totum annum: excepta Dominica de Passione, et Dominica Palmarum, in quibus non dicitur Glória Patri; sed post Psalmum Miserére repetitur immediate Antiphona Aspérges me. Excepto etiam Tempore Paschali, scilicet a Dominica Paschæ usque ad Pentecosten inclusive, quo tempore cantatur sequens Antiphona:", "The antiphon \"Sprinkle me\" is repeated. This antiphon is said in this way at the sprinkling of holy water on Sundays throughout the year, except Passion Sunday and Palm Sunday, on which the \"Glory be\" is not said, but the antiphon is repeated immediately after the psalm \"Have mercy.\" Eastertide is also excepted, that is, from Easter Sunday through Pentecost inclusive, during which the following antiphon is sung:"], ["t", "*Ant.* Vidi aquam egrediéntem de templo, a látere dextro, allelúja: et omnes, ad quos pervénit aqua ista, salvi facti sunt, et dicent: allelúja, allelúja.", "*Ant.* I saw water flowing from the temple, from its right side, alleluia; and all to whom that water came were saved, and they shall say: alleluia, alleluia."], ["t", "*Ps. 117, 1.* Confitémini Dómino, quóniam bonus: quóniam in sǽculum misericórdia ejus. Glória Patri.", "*Ps. 117, 1.* Give praise to the Lord, for He is good; for His mercy endures for ever. Glory be to the Father."], ["r", "Repetitur Antiphona: Vidi aquam. In Dominica vero Trinitatis resumitur Antiphona Aspérges me, Dómine, etc., ut supra. In die sancto Paschæ, et Pentecostes, ubi est fons baptismalis, fit aspersio cum aqua pridie benedicta in fonte Baptismi, et ante infusionem Olei et Chrismatis accepta. Finita Antiphona supradicto modo, Sacerdos qui aspersit aquam, reversus ad Altare, stans ante gradus Altaris junctis manibus dicat:", "The antiphon \"I saw water\" is repeated. On Trinity Sunday the antiphon \"Sprinkle me, O Lord\" is resumed, as above. On Easter Sunday and on Pentecost, where there is a baptismal font, the sprinkling is done with the water blessed in the font the day before and taken before the oil and chrism were poured in. When the antiphon has been finished as described, the priest who sprinkled the water returns to the altar and, standing before the altar steps with hands joined, says:"], ["v", "Osténde nobis, Dómine, misericórdiam tuam. *(T. P.* Allelúja.*)*", "Show us, O Lord, Your mercy. *(In Eastertide:* Alleluia.*)*"], ["x", "Et salutáre tuum da nobis. *(T. P.* Allelúja.*)*", "And grant us Your salvation. *(In Eastertide:* Alleluia.*)*"], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi nos, Dómine sancte, Pater omnípotens, ætérne Deus: et míttere dignéris sanctum Angelum tuum de cælis; qui custódiat, fóveat, prótegat, vísitet, atque deféndat omnes habitántes in hoc habitáculo. Per Christum, Dóminum nostrum. ℟. Amen.", "Hear us, holy Lord, Father almighty, everlasting God, and deign to send Your holy Angel from heaven to guard, cherish, protect, visit, and defend all who dwell in this house. Through Christ our Lord. ℟. Amen."]]}, {"id": "wine-st-john", "la": "Benedictio Vini in Festo S. Joannis Apostoli et Evangelistæ", "en": "Blessing of Wine on the Feast of St. John, Apostle and Evangelist", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 2", "b": [["r", "In Festo sancti Joannis Ap. et Evang., expleta omnino Missa majore, hoc est post ultimum Evangelium, Sacerdos, retentis omnibus paramentis, excepto manipulo, vinum a populo oblatum, in memoriam et honorem S. Joannis, qui venenum innocue sumpsit, benedicit hoc modo:", "On the feast of St. John, Apostle and Evangelist, when the principal Mass is completely finished, that is, after the last Gospel, the priest, keeping on all his vestments except the maniple, blesses the wine brought by the people in memory and honor of St. John, who drank poison without harm, in this way:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Bene✠dícere et conse✠cráre dignéris, Dómine Deus, déxtera tua hunc cálicem vini, et cujúslibet potus: et præsta; ut per mérita sancti Joánnis Apóstoli et Evangelístæ, omnes in te credéntes et de cálice isto bibéntes benedicántur, et protegántur. Et sicut beátus Joánnes de cálice bibens venénum, illǽsus omníno permánsit, ita omnes, hac die in honórem beáti Joánnis de cálice isto bibéntes, méritis ipsíus ab omni ægritúdine venéni, et nóxiis quibúsvis absolvántur, et córpore ac ánima se offeréntes, ab omni culpa liberéntur. Per Christum, Dóminum nostrum. ℟. Amen.", "Deign, O Lord God, to ✠ bless and ✠ consecrate with Your right hand this cup of wine and of every drink; and grant that, through the merits of Saint John, Apostle and Evangelist, all who believe in You and drink from this cup may be blessed and protected. And as blessed John drank poison from the cup and remained entirely unharmed, so may all who on this day drink from this cup in honor of blessed John be freed by his merits from every sickness caused by poison and from all harmful things, and, offering themselves in body and soul, be delivered from all guilt. Through Christ our Lord. ℟. Amen."], ["t", "Béne✠dic, Dómine, hanc creatúram potus: ut sit remédium salutáre ómnibus suméntibus: et præsta per invocatiónem sancti nóminis tui; ut, quicúmque ex eo gustáverint, tam ánimæ quam córporis sanitátem te donánte percípiant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, this creature of drink, that it may be a saving remedy to all who take it; and grant, through the invocation of Your holy name, that whoever tastes of it may, by Your gift, receive health of soul as well as of body. Through Christ our Lord. ℟. Amen."], ["t", "Et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super hanc creatúram vini, et cujúslibet potus, et máneat semper. ℟. Amen.", "And may the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon this creature of wine and of every drink, and remain for ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta. Quod si benedictio illa fiat privatim extra Missam, Sacerdos, superpelliceo et stola indutus, eam conficiat modo superius tradito.", "And it is sprinkled with holy water. If this blessing is given privately outside Mass, the priest, vested in surplice and stole, performs it in the manner given above."]]}, {"id": "wine-st-john-another", "la": "Alia Benedictio Vini in Festo S. Joannis Apostoli et Evangelistæ", "en": "Another Blessing of Wine on the Feast of St. John", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 3", "b": [["r", "In fine Missæ post Evangelium sancti Joannis, In princípio erat Verbum, dicitur:", "At the end of Mass, after the Gospel of St. John, \"In the beginning was the Word,\" there is said:"], ["h", "Psalmus 22", "Psalm 22"], ["t", "Dóminus regit me, et nihil mihi déerit: * in loco páscuæ ibi me collocávit.", "The Lord rules me, and I shall want nothing; * He has set me in a place of pasture."], ["t", "Super aquam refectiónis educávit me: * ánimam meam convértit.", "He has brought me up on the water of refreshment; * He has restored my soul."], ["t", "Dedúxit me super sémitas justítiæ, * propter nomen suum.", "He has led me on the paths of justice, * for His own name's sake."], ["t", "Nam, et si ambulávero in médio umbræ mortis, non timébo mala: * quóniam tu mecum es.", "For though I should walk in the midst of the shadow of death, I will fear no evils, * for You are with me."], ["t", "Virga tua, et báculus tuus: * ipsa me consoláta sunt.", "Your rod and Your staff, * they have comforted me."], ["t", "Parásti in conspéctu meo mensam, * advérsus eos, qui tríbulant me.", "You have prepared a table before me * against those who afflict me."], ["t", "Impinguásti in óleo caput meum: * et calix meus inébrians quam præclárus est!", "You have anointed my head with oil; * and my chalice which inebriates, how goodly it is!"], ["t", "Et misericórdia tua subsequétur me * ómnibus diébus vitæ meæ.", "And Your mercy will follow me * all the days of my life."], ["t", "Et ut inhábitem in domo Dómini, * in longitúdinem diérum.", "And that I may dwell in the house of the Lord * unto length of days."], ["t", "Glória Patri.", "Glory be to the Father."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants."], ["x", "Deus meus, sperántes in te.", "Who hope in You, O my God."], ["v", "Mitte eis, Dómine, auxílium de sancto.", "Send them help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eos.", "And defend them out of Sion."], ["v", "Nihil profíciat inimícus in eis.", "Let the enemy have no power over them."], ["x", "Et fílius iniquitátis non appónat nocére eis.", "And let the son of iniquity do nothing to harm them."], ["v", "Et si mortíferum quid bíberint.", "And if they drink anything deadly,"], ["x", "Non eis nocébit.", "It shall not harm them."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine sancte, Pater omnípotens, ætérne Deus: qui Fílium tuum tibi coætérnum et consubstantiálem de cælis descéndere, et de sacratíssima Vírgine María in hoc témpore plenitúdinis incarnári temporáliter voluísti, ut ovem pérditam et errántem quǽreret, et in húmeris própriis ad ovíle reportáret; nec non ut eum, qui in latrónes íncidit, a vúlnerum suórum dolóre, infúndens ipsi vinum et óleum, curáret; béne✠dic et sanctí✠fica hoc vinum: quod de vite in potum hóminum produxísti, et præsta: ut, quisquis in hac sacra sollemnitáte de eo súmpserit vel bíberit, salútem ánimæ et córporis consequátur: et si in peregrinatióne fúerit, ab eódem, tua grátia mediánte, confortétur; ut via ejus in omni prosperitáte dirigátur. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "Holy Lord, Father almighty, everlasting God, who willed that Your Son, coeternal and consubstantial with You, should come down from heaven and in this fullness of time take flesh of the most holy Virgin Mary, to seek the lost and straying sheep and carry it back to the fold on His own shoulders, and to heal the man who fell among robbers of the pain of his wounds by pouring in wine and oil: ✠ bless and ✠ sanctify this wine, which You have brought forth from the vine for the drink of men; and grant that whoever takes or drinks of it on this holy feast may obtain health of soul and body; and that, if he is on a journey, he may be strengthened by it through Your grace, so that his way may be directed in all prosperity. Through the same Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui te vitem veram, et sanctos Apóstolos tuos pálmites appellári, et de ómnibus te diligéntibus víneam eléctam plantáre voluísti; béne✠dic hoc vinum, et virtútem ei tuæ benedictiónis infúnde: ut, quicúmque ex eo súmpserit vel bíberit, intercedénte dilécto discípulo tuo Joánne Apóstolo et Evangelísta, síngulis morbis et venénis pestíferis effugátis, sanitátem inde córporis et ánimæ consequátur: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who willed to call Yourself the true vine and Your holy Apostles the branches, and to plant a chosen vineyard of all who love You: ✠ bless this wine and pour into it the power of Your blessing, so that whoever takes or drinks of it may, through the intercession of Your beloved disciple John, Apostle and Evangelist, be rid of every sickness and deadly poison and obtain health of body and soul. Who live and reign for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui humáno géneri panem in cibum, et vinum in potum procreásti, ut panis corpus confórtet, et vinum cor hóminis lætíficet; quique beáto Joánni prædilécto discípulo tuo tantam grátiam contulísti, ut non solum haustum venéni illǽsus eváderet, sed étiam in tua virtúte venéno prostrátos a morte resuscitáret: præsta ómnibus hoc vinum bibéntibus, ut spirituálem lætítiam et vitam cónsequi mereántur ætérnam. Per Dóminum. ℟. Amen.", "O God, who created bread as food and wine as drink for mankind, that bread might strengthen the body and wine gladden the heart of man; and who gave such grace to blessed John, Your beloved disciple, that he not only escaped unharmed after drinking poison but even, by Your power, raised from death those laid low by poison: grant to all who drink this wine that they may be worthy to obtain spiritual joy and life everlasting. Through our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "gold-frankincense-myrrh", "la": "Benedictio Auri, Thuris et Myrrhæ in Festo Epiphaniæ", "en": "Blessing of Gold, Frankincense and Myrrh on the Epiphany", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 4", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Súscipe, sancte Pater, a me indígno fámulo tuo hæc múnera, quæ in honórem nóminis tui sancti, et in títulum omnipoténtiæ tuæ majestátis, humíliter tibi óffero: sicut suscepísti sacrifícium Abel justi, et sicut eádem múnera a tribus Magis tibi quondam offeréntibus suscepísti.", "Receive, holy Father, from me, Your unworthy servant, these gifts which I humbly offer You in honor of Your holy name and in acknowledgment of Your almighty majesty, as You received the sacrifice of just Abel, and as You once received these same gifts from the three Magi who offered them to You."], ["t", "Exorcízo te, creatúra auri, thuris et myrrhæ, per Pa✠trem omnipoténtem, per Jesum ✠ Christum, Fílium ejus unigénitum, et per Spíritum ✠ Sanctum Paráclitum: ut a te discédat omnis fraus, dolus, et nequítia diáboli, et sis remédium salutáre humáno géneri contra insídias inimíci: et quicúmque divíno freti auxílio te in suis lóculis, dómibus, aut circa se habúerint, per virtútem et mérita Dómini et Salvatóris nostri, ac intercessiónem ejus sanctíssimæ Genetrícis et Vírginis Maríæ, ac eórum, qui hódie simílibus munéribus Christum Dóminum veneráti sunt, omniúmque Sanctórum, ab ómnibus perículis ánimæ et córporis liberéntur, et bonis ómnibus pérfrui mereántur. ℟. Amen.", "I exorcise you, creature of gold, frankincense, and myrrh, by the ✠ Father almighty, by Jesus ✠ Christ, His only-begotten Son, and by the Holy ✠ Spirit, the Paraclete: that all deceit, guile, and wickedness of the devil may depart from you, and that you may be a saving remedy to mankind against the snares of the enemy; and that all who, trusting in divine help, keep you in their chests, their homes, or about their persons may, by the power and merits of our Lord and Savior, by the intercession of His most holy Mother, the Virgin Mary, of those who on this day honored Christ the Lord with like gifts, and of all the Saints, be delivered from all dangers of soul and body and be worthy to enjoy all good things. ℟. Amen."], ["t", "Deus invisíbilis et interminábilis, pietátem tuam per sanctum et treméndum Fílii tui nomen, supplíciter deprecámur: ut in hanc creatúram auri, thuris, myrrhæ bene✠dictiónem ac operatiónem tuæ virtútis infúndas: ut, qui ea penes se habúerint, ab omni ægritúdinis et læsiónis incúrsu tuti sint; et omnes morbos córporis et ánimæ effúgiant, nullum dominétur eis perículum, et læti, ac incólumes tibi in Ecclésia tua desérviant: Qui in Trinitáte perfécta vivis et regnas Deus per ómnia sǽcula sæculórum. ℟. Amen.", "O God, invisible and without end, we humbly beseech Your mercy, by the holy and awesome name of Your Son, that You would pour into this creature of gold, frankincense, and myrrh the ✠ blessing and working of Your power, so that those who keep them may be safe from every onset of sickness and injury, may escape all diseases of body and soul, may be ruled by no danger, and may serve You in Your Church joyful and unharmed. Who in perfect Trinity live and reign, God, for ever and ever. ℟. Amen."], ["t", "Et benedíctio Dei omnipoténtis, Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti, descéndat super hanc creatúram auri, thuris et myrrhæ, et máneat semper. ℟. Amen.", "And may the blessing of almighty God, the ✠ Father, and the ✠ Son, and the Holy ✠ Spirit, come down upon this creature of gold, frankincense, and myrrh, and remain for ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "chalk-epiphany", "la": "Benedictio Cretæ in Festo Epiphaniæ", "en": "Blessing of Chalk on the Epiphany", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 5", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine Deus, creatúram istam cretæ: ut sit salutáris humáno géneri; et præsta per invocatiónem nóminis tui sanctíssimi, ut, quicúmque ex ea súmpserint, vel in ea in domus suæ portis scrípserint nómina sanctórum tuórum Gásparis, Melchióris et Baltássar, per eórum intercessiónem et mérita, córporis sanitátem, et ánimæ tutélam percípiant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord God, this creature of chalk, that it may be a means of salvation to mankind; and grant, through the invocation of Your most holy name, that whoever takes some of it, or writes with it on the doors of his house the names of Your saints Gaspar, Melchior, and Balthasar, may through their intercession and merits receive health of body and protection of soul. Through Christ our Lord. ℟.
