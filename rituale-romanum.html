<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituale Romanum</title>
<meta name="description" content="Rites and blessings of the traditional Rituale Romanum in Latin, with an English translation side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e7; --page: #fffdf8; --ink: #2b2420; --muted: #75695d; --line: #e5dccb;
    --rubric: #a3221b; --accent: #7b1e1a; --hl: #f3e3b5;
    --shadow: 0 1px 2px rgba(50,30,10,.06), 0 8px 26px rgba(50,30,10,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #16120f; --page: #1f1a16; --ink: #ece4d6; --muted: #a89a88; --line: #3a3129; --rubric: #e9776c; --accent: #e9776c; --hl: #4a3b1a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 "EB Garamond", Georgia, serif; }
  button, input, select { font: inherit; color: inherit; }
  .ui { font-family: Inter, system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }
  /* Sidebar */
  aside { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--page); padding: 18px 14px 40px; }
  .brand { font-size: 1.6rem; font-weight: 600; letter-spacing: .3px; color: var(--accent); line-height: 1.1; }
  .brand small { display: block; font-family: Inter, sans-serif; font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; font-weight: 500; }
  .back { font-size: .8rem; color: var(--muted); text-decoration: none; display: inline-block; margin: 6px 0 14px; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 11px; font-size: .9rem; }
  .cat { margin: 16px 0 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .toc a { display: block; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 8px; line-height: 1.25; }
  .toc a .la { display: block; font-size: .98rem; }
  .toc a .en { display: block; font-family: Inter, sans-serif; font-size: .74rem; color: var(--muted); }
  .toc a:hover { background: var(--paper); }
  .toc a[aria-current="true"] { background: var(--hl); }
  .toc .none { font-size: .85rem; color: var(--muted); padding: 8px; }
  /* Main */
  main { padding: 26px 34px 80px; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--page); }
  .seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .btn { border: 1px solid var(--line); background: var(--page); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
  .menu-btn { display: none; }
  article.rite { background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 34px 34px; }
  .ref { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 2px; font-weight: 600; font-size: clamp(1.7rem, 3.4vw, 2.4rem); line-height: 1.12; color: var(--accent); }
  h1 + .sub { font-size: 1.25rem; font-style: italic; color: var(--muted); margin-bottom: 18px; }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 34px; }
  .rows.only-la, .rows.only-en { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
  .rows.only-la .en, .rows.only-en .la { display: none; }
  .colhead { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
  .rows.only-la .colhead.en, .rows.only-en .colhead.la { display: none; }
  .row { display: contents; }
  .row > div { padding: 5px 0; }
  .la { font-feature-settings: "liga", "dlig"; }
  .r > div { color: var(--rubric); font-size: .92rem; font-style: italic; }
  .h > div { font-weight: 600; font-size: 1.12rem; padding-top: 16px; color: var(--accent); font-variant: small-caps; letter-spacing: .03em; }
  .t > div, .v > div, .x > div { }
  .v > div, .x > div { padding: 1px 0; }
  .sym, .cross { color: var(--rubric); font-weight: 600; }
  em.rb { color: var(--rubric); }
  .n { grid-column: 1 / -1; font-family: Inter, sans-serif; font-size: .82rem; color: var(--muted); background: var(--paper); border-left: 3px solid var(--rubric); border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
  .first-letter::first-letter { }
  .intro { background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 34px; }
  .intro h1 { margin-top: 0; }
  .intro p, .intro li { font-size: 1.05rem; max-width: 72ch; }
  .grid-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 18px 0; font-family: Inter, sans-serif; }
  .grid-cats a { display: block; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .grid-cats a b { display: block; font-size: .95rem; }
  .grid-cats a span { font-size: .78rem; color: var(--muted); }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; font-family: Inter, sans-serif; font-size: .85rem; }
  .pager a { text-decoration: none; max-width: 48%; }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(330px, 88vw); z-index: 20; transform: translateX(-102%); transition: transform .25s; box-shadow: var(--shadow); }
    body.menu-open aside { transform: none; }
    .menu-btn { display: inline-block; }
    main { padding: 16px 16px 60px; }
    article.rite, .intro { padding: 22px 18px; border-radius: 12px; }
    .rows { grid-template-columns: minmax(0, 1fr); }
    .rows .row > .en { padding-top: 0; padding-bottom: 12px; color: var(--muted); }
    .rows .r > .en { color: var(--rubric); opacity: .8; }
    .rows.only-la .row > .en, .rows.only-en .row > .la { display: none; }
    .rows.only-en .row > .en { color: var(--ink); padding-bottom: 5px; }
    .colhead { display: none; }
  }
  @media print {
    aside, .bar, .pager { display: none !important; }
    .shell { display: block; }
    main { padding: 0; max-width: none; }
    article.rite { border: 0; box-shadow: none; padding: 0; }
    body { background: #fff; color: #000; font-size: 11.5pt; }
    :root { --rubric: #a3221b; --accent: #7b1e1a; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside id="side" aria-label="Contents">
    <div class="brand">Rituale Romanum<small>Latin · English</small></div>
    <a class="back ui" href="index.html">← Game Room</a>
    <input class="search ui" id="q" type="search" placeholder="Search Latin or English…" aria-label="Search the rites">
    <nav class="toc" id="toc"></nav>
  </aside>
  <main>
    <div class="bar ui">
      <button class="btn menu-btn" id="menuBtn" aria-controls="side">☰ Contents</button>
      <div class="seg" role="group" aria-label="Language">
        <button data-view="both" aria-pressed="true">Latin &amp; English</button>
        <button data-view="la" aria-pressed="false">Latin</button>
        <button data-view="en" aria-pressed="false">English</button>
      </div>
      <button class="btn" id="printBtn">Print</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<script>
const RITES = [{"id": "litany-saints", "la": "Septem Psalmi Pœnitentiales cum Litaniis Sanctorum", "en": "The Seven Penitential Psalms with the Litany of the Saints", "cat": "Litanies & Prayers", "ref": "Tit. V, cap. 3", "b": [["r", "Pro infirmis, dum sacro liniuntur Oleo, seu pro alia necessitate dicuntur flexis genibus.", "They are said kneeling, for the sick while they are being anointed with the holy oil, or for any other need."], ["n", "", "Many other rites in this book call for \"the ordinary Litany\" (Litaniæ ordinariæ); this is the text meant. When a rite says the Litany is said without the prayers at the end, it ends at the final Kyrie."], ["t", "*Ant.* Ne reminiscáris.", "*Ant.* Remember not."], ["h", "Psalmus 6", "Psalm 6"], ["t", "Dómine, ne in furóre tuo árguas me, * neque in ira tua corrípias me.", "O Lord, rebuke me not in Your fury, * nor chastise me in Your wrath."], ["t", "Miserére mei, Dómine, quóniam infírmus sum: * sana me, Dómine, quóniam conturbáta sunt ossa mea.", "Have mercy on me, O Lord, for I am weak; * heal me, O Lord, for my bones are troubled."], ["t", "Et ánima mea turbáta est valde: * sed tu, Dómine, úsquequo?", "And my soul is greatly troubled; * but You, O Lord, how long?"], ["t", "Convértere, Dómine, et éripe ánimam meam: * salvum me fac propter misericórdiam tuam.", "Turn to me, O Lord, and deliver my soul; * save me for Your mercy's sake."], ["t", "Quóniam non est in morte qui memor sit tui: * in inférno autem quis confitébitur tibi?", "For in death there is no one who remembers You; * and who shall give You praise in the grave?"], ["t", "Laborávi in gémitu meo, lavábo per síngulas noctes lectum meum: * lácrimis meis stratum meum rigábo.", "I have labored in my groaning; every night I will wash my bed; * I will water my couch with my tears."], ["t", "Turbátus est a furóre óculus meus: * inveterávi inter omnes inimícos meos.", "My eye is troubled through indignation; * I have grown old among all my enemies."], ["t", "Discédite a me, omnes, qui operámini iniquitátem: * quóniam exaudívit Dóminus vocem fletus mei.", "Depart from me, all you who work iniquity, * for the Lord has heard the voice of my weeping."], ["t", "Exaudívit Dóminus deprecatiónem meam, * Dóminus oratiónem meam suscépit.", "The Lord has heard my supplication; * the Lord has received my prayer."], ["t", "Erubéscant, et conturbéntur veheménter omnes inimíci mei: * convertántur et erubéscant valde velóciter.", "Let all my enemies be ashamed and greatly troubled; * let them be turned back and put to shame very speedily."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 31", "Psalm 31"], ["t", "Beáti, quorum remíssæ sunt iniquitátes: * et quorum tecta sunt peccáta.", "Blessed are they whose iniquities are forgiven, * and whose sins are covered."], ["t", "Beátus vir, cui non imputávit Dóminus peccátum, * nec est in spíritu ejus dolus.", "Blessed is the man to whom the Lord has not imputed sin, * and in whose spirit there is no guile."], ["t", "Quóniam tácui, inveteravérunt ossa mea, * dum clamárem tota die.", "Because I kept silence, my bones grew old, * while I cried out all the day long."], ["t", "Quóniam die ac nocte graváta est super me manus tua: * convérsus sum in ærúmna mea, dum confígitur spina.", "For day and night Your hand was heavy upon me; * I am turned in my anguish, while the thorn is fastened."], ["t", "Delíctum meum cógnitum tibi feci: * et injustítiam meam non abscóndi.", "I have made known my sin to You, * and my injustice I have not concealed."], ["t", "Dixi: Confitébor advérsum me injustítiam meam Dómino: * et tu remisísti impietátem peccáti mei.", "I said: I will confess against myself my injustice to the Lord; * and You forgave the wickedness of my sin."], ["t", "Pro hac orábit ad te omnis sanctus, * in témpore opportúno.", "For this shall every holy one pray to You * in due time."], ["t", "Verúmtamen in dilúvio aquárum multárum, * ad eum non approximábunt.", "And yet in a flood of many waters * they shall not come near him."], ["t", "Tu es refúgium meum a tribulatióne, quæ circúmdedit me: * exsultátio mea, érue me a circumdántibus me.", "You are my refuge from the trouble that surrounds me; * my joy, deliver me from those who surround me."], ["t", "Intelléctum tibi dabo, et ínstruam te in via hac, qua gradiéris: * firmábo super te óculos meos.", "I will give you understanding, and I will instruct you in the way in which you shall go; * I will fix My eyes upon you."], ["t", "Nolíte fíeri sicut equus et mulus, * quibus non est intelléctus.", "Do not become like the horse and the mule, * which have no understanding."], ["t", "In camo et freno maxíllas eórum constrínge, * qui non appróximant ad te.", "With bit and bridle bind fast their jaws, * who do not come near to You."], ["t", "Multa flagélla peccatóris, * sperántem autem in Dómino misericórdia circúmdabit.", "Many are the scourges of the sinner, * but mercy shall surround him who hopes in the Lord."], ["t", "Lætámini in Dómino et exsultáte, justi, * et gloriámini, omnes recti corde.", "Be glad in the Lord and rejoice, you just, * and glory, all you upright of heart."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 37", "Psalm 37"], ["t", "Dómine, ne in furóre tuo árguas me, * neque in ira tua corrípias me.", "O Lord, rebuke me not in Your fury, * nor chastise me in Your wrath."], ["t", "Quóniam sagíttæ tuæ infíxæ sunt mihi: * et confirmásti super me manum tuam.", "For Your arrows have pierced me, * and You have laid Your hand heavily upon me."], ["t", "Non est sánitas in carne mea a fácie iræ tuæ: * non est pax óssibus meis a fácie peccatórum meórum.", "There is no health in my flesh because of Your wrath; * there is no peace in my bones because of my sins."], ["t", "Quóniam iniquitátes meæ supergréssæ sunt caput meum: * et sicut onus grave gravátæ sunt super me.", "For my iniquities have gone over my head, * and like a heavy burden they weigh me down."], ["t", "Putruérunt et corrúptæ sunt cicatríces meæ, * a fácie insipiéntiæ meæ.", "My sores are putrid and corrupt * because of my foolishness."], ["t", "Miser factus sum, et curvátus sum usque in finem: * tota die contristátus ingrediébar.", "I am made wretched and bowed down to the end; * I went about sorrowful all the day."], ["t", "Quóniam lumbi mei impléti sunt illusiónibus: * et non est sánitas in carne mea.", "For my loins are filled with mockery, * and there is no health in my flesh."], ["t", "Afflíctus sum, et humiliátus sum nimis: * rugiébam a gémitu cordis mei.", "I am afflicted and humbled exceedingly; * I roared with the groaning of my heart."], ["t", "Dómine, ante te omne desidérium meum: * et gémitus meus a te non est abscónditus.", "O Lord, all my desire is before You, * and my groaning is not hidden from You."], ["t", "Cor meum conturbátum est, derelíquit me virtus mea: * et lumen oculórum meórum, et ipsum non est mecum.", "My heart is troubled, my strength has left me, * and the light of my eyes itself is not with me."], ["t", "Amíci mei, et próximi mei * advérsum me appropinquavérunt, et stetérunt.", "My friends and my neighbors * have drawn near and stood against me."], ["t", "Et qui juxta me erant, de longe stetérunt: * et vim faciébant qui quærébant ánimam meam.", "And those who were near me stood afar off; * and those who sought my life used violence."], ["t", "Et qui inquirébant mala mihi, locúti sunt vanitátes: * et dolos tota die meditabántur.", "And those who sought evil for me spoke vain things, * and plotted deceits all the day."], ["t", "Ego autem tamquam surdus non audiébam: * et sicut mutus non apériens os suum.", "But I, like a deaf man, heard not, * and was as a dumb man who opens not his mouth."], ["t", "Et factus sum sicut homo non áudiens: * et non habens in ore suo redargutiónes.", "And I became as a man who does not hear, * and who has no reproofs in his mouth."], ["t", "Quóniam in te, Dómine, sperávi: * tu exáudies me, Dómine, Deus meus.", "For in You, O Lord, have I hoped; * You will hear me, O Lord my God."], ["t", "Quia dixi: Nequándo supergáudeant mihi inimíci mei: * et dum commovéntur pedes mei, super me magna locúti sunt.", "For I said: Let not my enemies rejoice over me; * for when my feet slipped, they spoke great things against me."], ["t", "Quóniam ego in flagélla parátus sum: * et dolor meus in conspéctu meo semper.", "For I am ready for scourges, * and my sorrow is continually before me."], ["t", "Quóniam iniquitátem meam annuntiábo: * et cogitábo pro peccáto meo.", "For I will declare my iniquity, * and I will think about my sin."], ["t", "Inimíci autem mei vivunt, et confirmáti sunt super me: * et multiplicáti sunt qui odérunt me iníque.", "But my enemies live and are stronger than I, * and those who hate me wrongfully are multiplied."], ["t", "Qui retríbuunt mala pro bonis, detrahébant mihi: * quóniam sequébar bonitátem.", "Those who render evil for good have slandered me, * because I followed goodness."], ["t", "Ne derelínquas me, Dómine, Deus meus: * ne discésseris a me.", "Forsake me not, O Lord my God; * do not depart from me."], ["t", "Inténde in adjutórium meum, * Dómine, Deus salútis meæ.", "Make haste to help me, * O Lord, the God of my salvation."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 50", "Psalm 50"], ["t", "Miserére mei, Deus, * secúndum magnam misericórdiam tuam.", "Have mercy on me, O God, * according to Your great mercy."], ["t", "Et secúndum multitúdinem miseratiónum tuárum, * dele iniquitátem meam.", "And according to the multitude of Your tender mercies * blot out my iniquity."], ["t", "Ámplius lava me ab iniquitáte mea: * et a peccáto meo munda me.", "Wash me yet more from my iniquity, * and cleanse me from my sin."], ["t", "Quóniam iniquitátem meam ego cognósco: * et peccátum meum contra me est semper.", "For I know my iniquity, * and my sin is always before me."], ["t", "Tibi soli peccávi, et malum coram te feci: * ut justificéris in sermónibus tuis, et vincas cum judicáris.", "Against You alone have I sinned and done evil in Your sight, * that You may be justified in Your words and prevail when You are judged."], ["t", "Ecce enim in iniquitátibus concéptus sum: * et in peccátis concépit me mater mea.", "For behold, I was conceived in iniquities, * and in sins did my mother conceive me."], ["t", "Ecce enim veritátem dilexísti: * incérta et occúlta sapiéntiæ tuæ manifestásti mihi.", "For behold, You have loved truth; * the uncertain and hidden things of Your wisdom You have made known to me."], ["t", "Aspérges me hyssópo, et mundábor: * lavábis me, et super nivem dealbábor.", "You will sprinkle me with hyssop, and I shall be cleansed; * You will wash me, and I shall be made whiter than snow."], ["t", "Audítui meo dabis gáudium et lætítiam: * et exsultábunt ossa humiliáta.", "To my hearing You will give joy and gladness, * and the bones that were humbled shall rejoice."], ["t", "Avérte fáciem tuam a peccátis meis: * et omnes iniquitátes meas dele.", "Turn away Your face from my sins, * and blot out all my iniquities."], ["t", "Cor mundum crea in me, Deus: * et spíritum rectum ínnova in viscéribus meis.", "Create a clean heart in me, O God, * and renew a right spirit within me."], ["t", "Ne projícias me a fácie tua: * et spíritum sanctum tuum ne áuferas a me.", "Cast me not away from Your face, * and take not Your holy spirit from me."], ["t", "Redde mihi lætítiam salutáris tui: * et spíritu principáli confírma me.", "Restore to me the joy of Your salvation, * and strengthen me with a willing spirit."], ["t", "Docébo iníquos vias tuas: * et ímpii ad te converténtur.", "I will teach the unjust Your ways, * and the wicked shall be converted to You."], ["t", "Líbera me de sanguínibus, Deus, Deus salútis meæ: * et exsultábit lingua mea justítiam tuam.", "Deliver me from blood, O God, the God of my salvation, * and my tongue shall extol Your justice."], ["t", "Dómine, lábia mea apéries: * et os meum annuntiábit laudem tuam.", "O Lord, You will open my lips, * and my mouth shall declare Your praise."], ["t", "Quóniam si voluísses sacrifícium, dedíssem útique: * holocáustis non delectáberis.", "For if You had desired sacrifice, I would surely have given it; * with burnt offerings You will not be delighted."], ["t", "Sacrifícium Deo spíritus contribulátus: * cor contrítum, et humiliátum, Deus, non despícies.", "A sacrifice to God is an afflicted spirit; * a contrite and humbled heart, O God, You will not despise."], ["t", "Benígne fac, Dómine, in bona voluntáte tua Sion: * ut ædificéntur muri Jerúsalem.", "Deal favorably, O Lord, in Your good will with Sion, * that the walls of Jerusalem may be built up."], ["t", "Tunc acceptábis sacrifícium justítiæ, oblatiónes, et holocáusta: * tunc impónent super altáre tuum vítulos.", "Then You will accept the sacrifice of justice, oblations and whole burnt offerings; * then shall they lay calves upon Your altar."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 101", "Psalm 101"], ["t", "Dómine, exáudi oratiónem meam: * et clamor meus ad te véniat.", "O Lord, hear my prayer, * and let my cry come unto You."], ["t", "Non avértas fáciem tuam a me: * in quacúmque die tríbulor, inclína ad me aurem tuam.", "Turn not Your face away from me; * in whatever day I am in trouble, incline Your ear to me."], ["t", "In quacúmque die invocávero te, * velóciter exáudi me.", "In whatever day I call upon You, * hear me speedily."], ["t", "Quia defecérunt sicut fumus dies mei: * et ossa mea sicut crémium aruérunt.", "For my days have vanished like smoke, * and my bones are dried up like kindling."], ["t", "Percússus sum ut fœnum, et áruit cor meum: * quia oblítus sum comédere panem meum.", "I am smitten like grass, and my heart is withered, * because I forgot to eat my bread."], ["t", "A voce gémitus mei * adhæsit os meum carni meæ.", "Through the voice of my groaning * my bone has cleaved to my flesh."], ["t", "Símilis factus sum pellicáno solitúdinis: * factus sum sicut nyctícorax in domicílio.", "I have become like a pelican of the wilderness; * I am like a night raven in the house."], ["t", "Vigilávi, * et factus sum sicut passer solitárius in tecto.", "I have watched, * and have become like a sparrow alone on the housetop."], ["t", "Tota die exprobrábant mihi inimíci mei: * et qui laudábant me, advérsum me jurábant.", "All the day long my enemies reproached me, * and those who praised me swore against me."], ["t", "Quia cínerem tamquam panem manducábam, * et potum meum cum fletu miscébam.", "For I ate ashes like bread, * and mingled my drink with weeping,"], ["t", "A fácie iræ et indignatiónis tuæ: * quia élevans allisísti me.", "Because of Your anger and indignation; * for having lifted me up, You have cast me down."], ["t", "Dies mei sicut umbra declinavérunt: * et ego sicut fœnum árui.", "My days have declined like a shadow, * and I am withered like grass."], ["t", "Tu autem, Dómine, in ætérnum pérmanes: * et memoriále tuum in generatiónem et generatiónem.", "But You, O Lord, endure for ever, * and Your memory from generation to generation."], ["t", "Tu exsúrgens miseréberis Sion: * quia tempus miseréndi ejus, quia venit tempus.", "You will arise and have mercy on Sion, * for it is time to have mercy on it, for the time has come."], ["t", "Quóniam placuérunt servis tuis lápides ejus: * et terræ ejus miserebúntur.", "For its stones have pleased Your servants, * and they shall have pity on its dust."], ["t", "Et timébunt gentes nomen tuum, Dómine, * et omnes reges terræ glóriam tuam.", "And the nations shall fear Your name, O Lord, * and all the kings of the earth Your glory."], ["t", "Quia ædificávit Dóminus Sion: * et vidébitur in glória sua.", "For the Lord has built up Sion, * and He shall be seen in His glory."], ["t", "Respéxit in oratiónem humílium: * et non sprevit precem eórum.", "He has regarded the prayer of the lowly, * and has not despised their petition."], ["t", "Scribántur hæc in generatióne áltera: * et pópulus, qui creábitur, laudábit Dóminum:", "Let these things be written for another generation, * and the people yet to be created shall praise the Lord."], ["t", "Quia prospéxit de excélso sancto suo: * Dóminus de cælo in terram aspéxit:", "For He has looked forth from His high sanctuary; * from heaven the Lord has looked upon the earth,"], ["t", "Ut audíret gémitus compeditórum: * ut sólveret fílios interemptórum:", "To hear the groans of those in fetters, * to release the children of the slain,"], ["t", "Ut annúntient in Sion nomen Dómini: * et laudem ejus in Jerúsalem.", "That they may declare the name of the Lord in Sion, * and His praise in Jerusalem,"], ["t", "In conveniéndo pópulos in unum, * et reges ut sérviant Dómino.", "When the peoples gather together, * and kings, to serve the Lord."], ["t", "Respóndit ei in via virtútis suæ: * Paucitátem diérum meórum núntia mihi.", "He answered Him in the way of His strength: * Declare to me the fewness of my days."], ["t", "Ne révoces me in dimídio diérum meórum: * in generatiónem et generatiónem anni tui.", "Do not call me away in the midst of my days; * Your years are from generation to generation."], ["t", "Inítio tu, Dómine, terram fundásti: * et ópera mánuum tuárum sunt cæli.", "In the beginning, O Lord, You founded the earth, * and the heavens are the works of Your hands."], ["t", "Ipsi períbunt, tu autem pérmanes: * et omnes sicut vestiméntum veteráscent.", "They shall perish, but You remain; * and all of them shall grow old like a garment."], ["t", "Et sicut opertórium mutábis eos, et mutabúntur: * tu autem idem ipse es, et anni tui non defícient.", "And like a cloak You will change them, and they shall be changed; * but You are always the same, and Your years shall not fail."], ["t", "Fílii servórum tuórum habitábunt: * et semen eórum in sǽculum dirigétur.", "The children of Your servants shall dwell secure, * and their offspring shall be established for ever."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 129", "Psalm 129"], ["t", "De profúndis clamávi ad te, Dómine: * Dómine, exáudi vocem meam.", "Out of the depths I have cried to You, O Lord; * Lord, hear my voice."], ["t", "Fiant aures tuæ intendéntes, * in vocem deprecatiónis meæ.", "Let Your ears be attentive * to the voice of my supplication."], ["t", "Si iniquitátes observáveris, Dómine: * Dómine, quis sustinébit?", "If You, O Lord, mark iniquities, * Lord, who shall stand?"], ["t", "Quia apud te propitiátio est: * et propter legem tuam sustínui te, Dómine.", "For with You there is forgiveness, * and because of Your law I have waited for You, O Lord."], ["t", "Sustínuit ánima mea in verbo ejus: * sperávit ánima mea in Dómino.", "My soul has relied on His word; * my soul has hoped in the Lord."], ["t", "A custódia matutína usque ad noctem: * speret Israël in Dómino.", "From the morning watch even until night, * let Israel hope in the Lord."], ["t", "Quia apud Dóminum misericórdia: * et copiósa apud eum redémptio.", "For with the Lord there is mercy, * and with Him plentiful redemption."], ["t", "Et ipse rédimet Israël, * ex ómnibus iniquitátibus ejus.", "And He shall redeem Israel * from all its iniquities."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 142", "Psalm 142"], ["t", "Dómine, exáudi oratiónem meam: áuribus pércipe obsecratiónem meam in veritáte tua: * exáudi me in tua justítia.", "O Lord, hear my prayer; give ear to my supplication in Your truth; * hear me in Your justice."], ["t", "Et non intres in judícium cum servo tuo: * quia non justificábitur in conspéctu tuo omnis vivens.", "And enter not into judgment with Your servant, * for in Your sight no man living shall be justified."], ["t", "Quia persecútus est inimícus ánimam meam: * humiliávit in terra vitam meam.", "For the enemy has pursued my soul; * he has brought my life down to the earth."], ["t", "Collocávit me in obscúris sicut mórtuos sǽculi: * et anxiátus est super me spíritus meus, in me turbátum est cor meum.", "He has made me dwell in darkness like those long dead; * my spirit is in anguish within me, my heart within me is troubled."], ["t", "Memor fui diérum antiquórum, meditátus sum in ómnibus opéribus tuis: * in factis mánuum tuárum meditábar.", "I remembered the days of old, I meditated on all Your works; * I pondered the works of Your hands."], ["t", "Expándi manus meas ad te: * ánima mea sicut terra sine aqua tibi.", "I stretched forth my hands to You; * my soul is like earth without water before You."], ["t", "Velóciter exáudi me, Dómine: * defécit spíritus meus.", "Hear me speedily, O Lord; * my spirit has fainted away."], ["t", "Non avértas fáciem tuam a me: * et símilis ero descendéntibus in lacum.", "Turn not Your face away from me, * lest I be like those who go down into the pit."], ["t", "Audítam fac mihi mane misericórdiam tuam: * quia in te sperávi.", "Let me hear Your mercy in the morning, * for in You have I hoped."], ["t", "Notam fac mihi viam, in qua ámbulem: * quia ad te levávi ánimam meam.", "Make known to me the way in which I should walk, * for I have lifted up my soul to You."], ["t", "Éripe me de inimícis meis, Dómine, ad te confúgi: * doce me fácere voluntátem tuam, quia Deus meus es tu.", "Deliver me from my enemies, O Lord; to You have I fled. * Teach me to do Your will, for You are my God."], ["t", "Spíritus tuus bonus dedúcet me in terram rectam: * propter nomen tuum, Dómine, vivificábis me, in æquitáte tua.", "Your good spirit shall lead me into the right land; * for Your name's sake, O Lord, You will quicken me in Your justice."], ["t", "Edúces de tribulatióne ánimam meam: * et in misericórdia tua dispérdes inimícos meos.", "You will bring my soul out of trouble, * and in Your mercy You will destroy my enemies."], ["t", "Et perdes omnes, qui tríbulant ánimam meam: * quóniam ego servus tuus sum.", "And You will cut off all who afflict my soul, * for I am Your servant."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* Ne reminiscáris, Dómine, delícta nostra, vel paréntum nostrórum: neque vindíctam sumas de peccátis nostris.", "*Ant.* Remember not, O Lord, our offenses or those of our parents, and take not vengeance on our sins."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis._", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte, Deus, _miserére nobis._", "God the Holy Spirit, _have mercy on us._"], ["t", "Sancta Trínitas, unus Deus, _miserére nobis._", "Holy Trinity, one God, _have mercy on us._"], ["t", "Sancta María, _ora pro nobis._", "Holy Mary, _pray for us._"], ["t", "Sancta Dei Génetrix, _ora pro nobis._", "Holy Mother of God, _pray for us._"], ["t", "Sancta Virgo vírginum, _ora pro nobis._", "Holy Virgin of virgins, _pray for us._"], ["t", "Sancte Míchaël, _ora pro nobis._", "Saint Michael, _pray for us._"], ["t", "Sancte Gábriel, _ora pro nobis._", "Saint Gabriel, _pray for us._"], ["t", "Sancte Ráphaël, _ora pro nobis._", "Saint Raphael, _pray for us._"], ["t", "Omnes sancti Ángeli et Archángeli, _oráte pro nobis._", "All you holy Angels and Archangels, _pray for us._"], ["t", "Omnes sancti beatórum Spirítuum órdines, _oráte pro nobis._", "All you holy orders of blessed Spirits, _pray for us._"], ["t", "Sancte Joánnes Baptísta, _ora pro nobis._", "Saint John the Baptist, _pray for us._"], ["t", "Sancte Joseph, _ora pro nobis._", "Saint Joseph, _pray for us._"], ["t", "Omnes sancti Patriárchæ et Prophétæ, _oráte pro nobis._", "All you holy Patriarchs and Prophets, _pray for us._"], ["t", "Sancte Petre, _ora pro nobis._", "Saint Peter, _pray for us._"], ["t", "Sancte Paule, _ora pro nobis._", "Saint Paul, _pray for us._"], ["t", "Sancte Andréa, _ora pro nobis._", "Saint Andrew, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Joánnes, _ora pro nobis._", "Saint John, _pray for us._"], ["t", "Sancte Thoma, _ora pro nobis._", "Saint Thomas, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Philíppe, _ora pro nobis._", "Saint Philip, _pray for us._"], ["t", "Sancte Bartholomǽe, _ora pro nobis._", "Saint Bartholomew, _pray for us._"], ["t", "Sancte Matthǽe, _ora pro nobis._", "Saint Matthew, _pray for us._"], ["t", "Sancte Simon, _ora pro nobis._", "Saint Simon, _pray for us._"], ["t", "Sancte Thaddǽe, _ora pro nobis._", "Saint Thaddeus, _pray for us._"], ["t", "Sancte Matthía, _ora pro nobis._", "Saint Matthias, _pray for us._"], ["t", "Sancte Bárnaba, _ora pro nobis._", "Saint Barnabas, _pray for us._"], ["t", "Sancte Luca, _ora pro nobis._", "Saint Luke, _pray for us._"], ["t", "Sancte Marce, _ora pro nobis._", "Saint Mark, _pray for us._"], ["t", "Omnes sancti Apóstoli et Evangelístæ, _oráte pro nobis._", "All you holy Apostles and Evangelists, _pray for us._"], ["t", "Omnes sancti Discípuli Dómini, _oráte pro nobis._", "All you holy Disciples of the Lord, _pray for us._"], ["t", "Omnes sancti Innocéntes, _oráte pro nobis._", "All you holy Innocents, _pray for us._"], ["t", "Sancte Stéphane, _ora pro nobis._", "Saint Stephen, _pray for us._"], ["t", "Sancte Laurénti, _ora pro nobis._", "Saint Lawrence, _pray for us._"], ["t", "Sancte Vincénti, _ora pro nobis._", "Saint Vincent, _pray for us._"], ["t", "Sancti Fabiáne et Sebastiáne, _oráte pro nobis._", "Saints Fabian and Sebastian, _pray for us._"], ["t", "Sancti Joánnes et Paule, _oráte pro nobis._", "Saints John and Paul, _pray for us._"], ["t", "Sancti Cosma et Damiáne, _oráte pro nobis._", "Saints Cosmas and Damian, _pray for us._"], ["t", "Sancti Gervási et Protási, _oráte pro nobis._", "Saints Gervase and Protase, _pray for us._"], ["t", "Omnes sancti Mártyres, _oráte pro nobis._", "All you holy Martyrs, _pray for us._"], ["t", "Sancte Silvéster, _ora pro nobis._", "Saint Sylvester, _pray for us._"], ["t", "Sancte Gregóri, _ora pro nobis._", "Saint Gregory, _pray for us._"], ["t", "Sancte Ambrósi, _ora pro nobis._", "Saint Ambrose, _pray for us._"], ["t", "Sancte Augustíne, _ora pro nobis._", "Saint Augustine, _pray for us._"], ["t", "Sancte Hierónyme, _ora pro nobis._", "Saint Jerome, _pray for us._"], ["t", "Sancte Martíne, _ora pro nobis._", "Saint Martin, _pray for us._"], ["t", "Sancte Nicoláe, _ora pro nobis._", "Saint Nicholas, _pray for us._"], ["t", "Omnes sancti Pontífices et Confessóres, _oráte pro nobis._", "All you holy Bishops and Confessors, _pray for us._"], ["t", "Omnes sancti Doctóres, _oráte pro nobis._", "All you holy Doctors, _pray for us._"], ["t", "Sancte Antóni, _ora pro nobis._", "Saint Anthony, _pray for us._"], ["t", "Sancte Benedícte, _ora pro nobis._", "Saint Benedict, _pray for us._"], ["t", "Sancte Bernárde, _ora pro nobis._", "Saint Bernard, _pray for us._"], ["t", "Sancte Domínice, _ora pro nobis._", "Saint Dominic, _pray for us._"], ["t", "Sancte Francísce, _ora pro nobis._", "Saint Francis, _pray for us._"], ["t", "Omnes sancti Sacerdótes et Levítæ, _oráte pro nobis._", "All you holy Priests and Levites, _pray for us._"], ["t", "Omnes sancti Mónachi et Eremítæ, _oráte pro nobis._", "All you holy Monks and Hermits, _pray for us._"], ["t", "Sancta María Magdaléna, _ora pro nobis._", "Saint Mary Magdalene, _pray for us._"], ["t", "Sancta Ágatha, _ora pro nobis._", "Saint Agatha, _pray for us._"], ["t", "Sancta Lúcia, _ora pro nobis._", "Saint Lucy, _pray for us._"], ["t", "Sancta Agnes, _ora pro nobis._", "Saint Agnes, _pray for us._"], ["t", "Sancta Cæcília, _ora pro nobis._", "Saint Cecilia, _pray for us._"], ["t", "Sancta Catharína, _ora pro nobis._", "Saint Catherine, _pray for us._"], ["t", "Sancta Anastásia, _ora pro nobis._", "Saint Anastasia, _pray for us._"], ["t", "Omnes sanctæ Vírgines et Víduæ, _oráte pro nobis._", "All you holy Virgins and Widows, _pray for us._"], ["t", "Omnes Sancti et Sanctæ Dei, _intercédite pro nobis._", "All you holy men and women, Saints of God, _intercede for us._"], ["t", "Propítius esto, _parce nobis, Dómine._", "Be merciful, _spare us, O Lord._"], ["t", "Propítius esto, _exáudi nos, Dómine._", "Be merciful, _graciously hear us, O Lord._"], ["t", "Ab omni malo, _líbera nos, Dómine._", "From all evil, _deliver us, O Lord._"], ["t", "Ab omni peccáto, _líbera nos, Dómine._", "From all sin, _deliver us, O Lord._"], ["t", "Ab ira tua, _líbera nos, Dómine._", "From Your wrath, _deliver us, O Lord._"], ["t", "A subitánea et improvísa morte, _líbera nos, Dómine._", "From sudden and unprovided death, _deliver us, O Lord._"], ["t", "Ab insídiis diáboli, _líbera nos, Dómine._", "From the snares of the devil, _deliver us, O Lord._"], ["t", "Ab ira, et ódio, et omni mala voluntáte, _líbera nos, Dómine._", "From anger, and hatred, and every evil will, _deliver us, O Lord._"], ["t", "A spíritu fornicatiónis, _líbera nos, Dómine._", "From the spirit of fornication, _deliver us, O Lord._"], ["t", "A fúlgure et tempestáte, _líbera nos, Dómine._", "From lightning and tempest, _deliver us, O Lord._"], ["t", "A flagéllo terræmótus, _líbera nos, Dómine._", "From the scourge of earthquake, _deliver us, O Lord._"], ["t", "A peste, fame et bello, _líbera nos, Dómine._", "From plague, famine, and war, _deliver us, O Lord._"], ["t", "A morte perpétua, _líbera nos, Dómine._", "From everlasting death, _deliver us, O Lord._"], ["t", "Per mystérium sanctæ Incarnatiónis tuæ, _líbera nos, Dómine._", "Through the mystery of Your holy Incarnation, _deliver us, O Lord._"], ["t", "Per advéntum tuum, _líbera nos, Dómine._", "Through Your coming, _deliver us, O Lord._"], ["t", "Per nativitátem tuam, _líbera nos, Dómine._", "Through Your birth, _deliver us, O Lord._"], ["t", "Per baptísmum et sanctum jejúnium tuum, _líbera nos, Dómine._", "Through Your baptism and holy fasting, _deliver us, O Lord._"], ["t", "Per crucem et passiónem tuam, _líbera nos, Dómine._", "Through Your Cross and Passion, _deliver us, O Lord._"], ["t", "Per mortem et sepultúram tuam, _líbera nos, Dómine._", "Through Your death and burial, _deliver us, O Lord._"], ["t", "Per sanctam resurrectiónem tuam, _líbera nos, Dómine._", "Through Your holy resurrection, _deliver us, O Lord._"], ["t", "Per admirábilem ascensiónem tuam, _líbera nos, Dómine._", "Through Your wonderful ascension, _deliver us, O Lord._"], ["t", "Per advéntum Spíritus Sancti Parácliti, _líbera nos, Dómine._", "Through the coming of the Holy Spirit, the Paraclete, _deliver us, O Lord._"], ["t", "In die judícii, _líbera nos, Dómine._", "In the day of judgment, _deliver us, O Lord._"], ["t", "Peccatóres, _te rogámus, audi nos._", "We sinners, _we beseech You, hear us._"], ["t", "Ut nobis parcas, _te rogámus, audi nos._", "That You spare us, _we beseech You, hear us._"], ["t", "Ut nobis indúlgeas, _te rogámus, audi nos._", "That You pardon us, _we beseech You, hear us._"], ["t", "Ut ad veram pœniténtiam nos perdúcere dignéris, _te rogámus, audi nos._", "That You deign to bring us to true repentance, _we beseech You, hear us._"], ["t", "Ut Ecclésiam tuam sanctam régere et conserváre dignéris, _te rogámus, audi nos._", "That You deign to govern and preserve Your holy Church, _we beseech You, hear us._"], ["t", "Ut Domnum Apostólicum et omnes ecclesiásticos órdines in sancta religióne conserváre dignéris, _te rogámus, audi nos._", "That You deign to preserve the Apostolic Lord and all ranks of the Church in holy religion, _we beseech You, hear us._"], ["t", "Ut inimícos sanctæ Ecclésiæ humiliáre dignéris, _te rogámus, audi nos._", "That You deign to humble the enemies of holy Church, _we beseech You, hear us._"], ["t", "Ut régibus et princípibus christiánis pacem et veram concórdiam donáre dignéris, _te rogámus, audi nos._", "That You deign to give peace and true concord to Christian kings and rulers, _we beseech You, hear us._"], ["t", "Ut cuncto pópulo christiáno pacem et unitátem largíri dignéris, _te rogámus, audi nos._", "That You deign to grant peace and unity to all Christian people, _we beseech You, hear us._"], ["t", "Ut omnes errántes ad unitátem Ecclésiæ revocáre, et infidéles univérsos ad Evangélii lumen perdúcere dignéris, _te rogámus, audi nos._", "That You deign to call back all who have strayed to the unity of the Church, and to lead all unbelievers to the light of the Gospel, _we beseech You, hear us._"], ["t", "Ut nosmetípsos in tuo sancto servítio confortáre et conserváre dignéris, _te rogámus, audi nos._", "That You deign to strengthen and keep us in Your holy service, _we beseech You, hear us._"], ["t", "Ut mentes nostras ad cæléstia desidéria érigas, _te rogámus, audi nos._", "That You lift up our minds to heavenly desires, _we beseech You, hear us._"], ["t", "Ut ómnibus benefactóribus nostris sempitérna bona retríbuas, _te rogámus, audi nos._", "That You render eternal blessings to all our benefactors, _we beseech You, hear us._"], ["t", "Ut ánimas nostras, fratrum, propinquórum et benefactórum nostrórum ab ætérna damnatióne erípias, _te rogámus, audi nos._", "That You deliver our souls and the souls of our brethren, relatives, and benefactors from eternal damnation, _we beseech You, hear us._"], ["t", "Ut fructus terræ dare et conserváre dignéris, _te rogámus, audi nos._", "That You deign to give and preserve the fruits of the earth, _we beseech You, hear us._"], ["t", "Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris, _te rogámus, audi nos._", "That You deign to grant eternal rest to all the faithful departed, _we beseech You, hear us._"], ["t", "Ut nos exaudíre dignéris, _te rogámus, audi nos._", "That You deign graciously to hear us, _we beseech You, hear us._"], ["t", "Fili Dei, _te rogámus, audi nos._", "Son of God, _we beseech You, hear us._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _parce nobis, Dómine._", "Lamb of God, who take away the sins of the world, _spare us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _exáudi nos, Dómine._", "Lamb of God, who take away the sins of the world, _graciously hear us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _miserére nobis._", "Lamb of God, who take away the sins of the world, _have mercy on us._"], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["h", "Psalmus 69", "Psalm 69"], ["t", "Deus, in adjutórium meum inténde: * Dómine, ad adjuvándum me festína.", "O God, come to my assistance; * O Lord, make haste to help me."], ["t", "Confundántur et revereántur, * qui quærunt ánimam meam.", "Let them be confounded and ashamed * who seek my life."], ["t", "Avertántur retrórsum, et erubéscant, * qui volunt mihi mala.", "Let them be turned backward and put to shame * who desire evil for me."], ["t", "Avertántur statim erubescéntes, * qui dicunt mihi: Euge, euge.", "Let them be turned back at once in shame * who say to me: Aha, aha!"], ["t", "Exsúltent et læténtur in te omnes qui quærunt te, * et dicant semper: Magnificétur Dóminus: qui díligunt salutáre tuum.", "Let all who seek You rejoice and be glad in You, * and let those who love Your salvation say always: The Lord be magnified."], ["t", "Ego vero egénus, et pauper sum: * Deus, ádjuva me.", "But I am needy and poor; * O God, help me."], ["t", "Adjútor meus, et liberátor meus es tu: * Dómine, ne moréris.", "You are my helper and my deliverer; * O Lord, do not delay."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["v", "Salvos fac servos tuos.", "Save Your servants,"], ["x", "Deus meus, sperántes in te.", "O my God, who hope in You."], ["v", "Esto nobis, Dómine, turris fortitúdinis.", "Be unto us, O Lord, a tower of strength"], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Nihil profíciat inimícus in nobis.", "Let the enemy have no power over us,"], ["x", "Et fílius iniquitátis non appónat nocére nobis.", "Nor the son of iniquity draw near to harm us."], ["v", "Dómine, non secúndum peccáta nostra fácias nobis.", "O Lord, deal not with us according to our sins,"], ["x", "Neque secúndum iniquitátes nostras retríbuas nobis.", "Nor repay us according to our iniquities."], ["v", "Orémus pro Pontífice nostro N.", "Let us pray for our Pope N."], ["x", "Dóminus consérvet eum, et vivíficet eum, et beátum fáciat eum in terra, et non tradat eum in ánimam inimicórum ejus.", "May the Lord preserve him and give him life, make him blessed upon the earth, and not deliver him to the will of his enemies."], ["v", "Orémus pro benefactóribus nostris.", "Let us pray for our benefactors."], ["x", "Retribúere dignáre, Dómine, ómnibus, nobis bona faciéntibus propter nomen tuum, vitam ætérnam. Amen.", "Deign, O Lord, to reward with eternal life all who do good to us for Your name's sake. Amen."], ["v", "Orémus pro fidélibus defúnctis.", "Let us pray for the faithful departed."], ["x", "Réquiem ætérnam dona eis, Dómine, et lux perpétua lúceat eis.", "Eternal rest grant unto them, O Lord, and let perpetual light shine upon them."], ["v", "Requiéscant in pace.", "May they rest in peace."], ["x", "Amen.", "Amen."], ["v", "Pro frátribus nostris abséntibus.", "For our absent brethren."], ["x", "Salvos fac servos tuos, Deus meus, sperántes in te.", "Save Your servants, O my God, who hope in You."], ["v", "Mitte eis, Dómine, auxílium de sancto.", "Send them help, O Lord, from the sanctuary,"], ["x", "Et de Sion tuére eos.", "And defend them out of Sion."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, cui próprium est miseréri semper et párcere: súscipe deprecatiónem nostram; ut nos, et omnes fámulos tuos, quos delictórum caténa constríngit, miserátio tuæ pietátis cleménter absólvat.", "O God, whose nature it is always to have mercy and to spare, receive our petition, that the compassion of Your kindness may mercifully set free us and all Your servants who are bound by the chain of sin."], ["t", "Exáudi, quǽsumus, Dómine, súpplicum preces, et confiténtium tibi parce peccátis: ut páriter nobis indulgéntiam tríbuas benígnus et pacem.", "Hear, we beseech You, O Lord, the prayers of Your suppliants, and spare the sins of those who confess to You, that in Your goodness You may grant us both pardon and peace."], ["t", "Ineffábilem nobis, Dómine, misericórdiam tuam cleménter osténde: ut simul nos et a peccátis ómnibus éxuas, et a pœnis, quas pro his merémur, erípias.", "Mercifully show us, O Lord, Your unspeakable mercy, that You may both strip us of all our sins and deliver us from the punishments we deserve for them."], ["t", "Deus, qui culpa offénderis, pœniténtia placáris: preces pópuli tui supplicántis propítius réspice; et flagélla tuæ iracúndiæ, quæ pro peccátis nostris merémur, avérte.", "O God, who are offended by sin and appeased by penance, graciously regard the prayers of Your people who entreat You, and turn away the scourges of Your anger, which we deserve for our sins."], ["t", "Omnípotens sempitérne Deus, miserére fámulo tuo Pontífici nostro N., et dírige eum secúndum tuam cleméntiam in viam salútis ætérnæ: ut, te donánte, tibi plácita cúpiat, et tota virtúte perfíciat.", "Almighty, everlasting God, have mercy on Your servant N., our Pope, and in Your kindness guide him on the way of eternal salvation, that by Your gift he may desire what pleases You and accomplish it with all his strength."], ["t", "Deus, a quo sancta desidéria, recta consília et justa sunt ópera: da servis tuis illam, quam mundus dare non potest, pacem; ut et corda nostra mandátis tuis dédita, et hóstium subláta formídine, témpora sint, tua protectióne, tranquílla.", "O God, from whom come holy desires, right counsels, and just works: give to Your servants that peace which the world cannot give, that our hearts may be devoted to Your commandments and, the fear of enemies being removed, our times may be peaceful under Your protection."], ["t", "Ure igne Sancti Spíritus renes nostros et cor nostrum, Dómine: ut tibi casto córpore serviámus, et mundo corde placeámus.", "Inflame, O Lord, our hearts and our inmost being with the fire of the Holy Spirit, that we may serve You with a chaste body and please You with a clean heart."], ["t", "Fidélium, Deus, ómnium Cónditor et Redémptor, animábus famulórum famularúmque tuárum remissiónem cunctórum tríbue peccatórum: ut indulgéntiam, quam semper optavérunt, piis supplicatiónibus consequántur.", "O God, Creator and Redeemer of all the faithful, grant to the souls of Your servants, men and women, the remission of all their sins, that through our devout prayers they may obtain the pardon they have always desired."], ["t", "Actiónes nostras, quǽsumus, Dómine, aspirándo prǽveni et adjuvándo proséquere: ut cuncta nostra orátio et operátio a te semper incípiat, et per te cœpta finiátur.", "Direct our actions, we beseech You, O Lord, by Your inspiration, and further them by Your help, that every prayer and work of ours may always begin with You and, begun through You, be brought to completion."], ["t", "Omnípotens sempitérne Deus, qui vivórum domináris simul et mortuórum, omniúmque miseréris, quos tuos fide et ópere futúros esse prænóscis: te súpplices exorámus; ut, pro quibus effúndere preces decrévimus, quosque vel præsens sǽculum adhuc in carne rétinet, vel futúrum jam exútos córpore suscépit, intercedéntibus ómnibus Sanctis tuis, pietátis tuæ cleméntia, ómnium delictórum suórum véniam consequántur. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, who are Lord of the living and the dead, and have mercy on all whom You foreknow will be Yours by faith and works: we humbly entreat You that those for whom we have resolved to pour out our prayers, whether this present world still holds them in the flesh or the world to come has already received them freed from the body, may, through the intercession of all Your Saints and by the kindness of Your mercy, obtain pardon for all their sins. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["v", "Exáudiat nos omnípotens et miséricors Dóminus.", "May the almighty and merciful Lord graciously hear us."], ["x", "Amen.", "Amen."], ["v", "Et fidélium ánimæ per misericórdiam Dei requiéscant in pace.", "And may the souls of the faithful departed, through the mercy of God, rest in peace."], ["x", "Amen.", "Amen."]]}, {"id": "baptism-infants", "la": "Ordo Baptismi Parvulorum", "en": "The Rite of Baptism for Children", "cat": "Sacraments", "ref": "Tit. II, cap. 2", "b": [["r", "1. Sacerdos interrogat infantem (si plures sint baptizandi, interrogat singulariter singulos):", "1. The priest questions the child (if several are to be baptized, he questions each one individually):"], ["t", "*Sacerdos:* N., Quid petis ab Ecclésia Dei?", "*Priest:* N., what do you ask of the Church of God?"], ["t", "*Patrinus respondet:* Fidem.", "*The godparent answers:* Faith."], ["t", "*Sacerdos:* Fides, quid tibi præstat?", "*Priest:* What does faith offer you?"], ["t", "*Patrinus respondet:* Vitam ætérnam.", "*The godparent answers:* Eternal life."], ["r", "2. Sacerdos (etiam singulariter singulis):", "2. The priest (again to each individually):"], ["t", "Si ígitur vis ad vitam íngredi, serva mandáta. Díliges Dóminum Deum tuum ex toto corde tuo, et ex tota ánima tua, et ex tota mente tua, et próximum tuum sicut teípsum.", "If, then, you wish to enter into life, keep the commandments. You shall love the Lord your God with your whole heart, and with your whole soul, and with your whole mind, and your neighbor as yourself."], ["r", "3. Deinde ter exsufflat leniter in faciem infantis, et dicit semel (singulariter singulis):", "3. Then he breathes gently three times on the child's face, and says once (to each individually):"], ["t", "Exi ab eo (ea), immúnde spíritus, et da locum Spirítui Sancto Paráclito.", "Go out from him (her), unclean spirit, and give place to the Holy Spirit, the Paraclete."], ["r", "4. Postea pollice facit signum crucis in fronte, et in pectore infantis, dicens (singulariter singulis):", "4. Then with his thumb he makes the sign of the cross on the forehead and on the breast of the child, saying (to each individually):"], ["t", "Accipe signum Crucis tam in fron✠te, quam in cor✠de, sume fidem cæléstium præceptórum: et talis esto móribus, ut templum Dei jam esse possis.", "Receive the sign of the Cross both on your fore✠head and on your ✠heart; take hold of the faith of the heavenly precepts, and be such in your conduct that you may now be a temple of God."], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Preces nostras, quǽsumus, Dómine, cleménter exáudi: et hunc eléctum tuum N. (hanc eléctam tuam N.) Crucis Domínicæ impressióne signátum (-am) perpétua virtúte custódi: ut, magnitúdinis glóriæ tuæ rudiménta servans, per custódiam mandatórum tuórum ad regeneratiónis glóriam perveníre mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "Mercifully hear our prayers, we beseech You, O Lord, and with Your unfailing power guard this Your chosen one, N., marked with the sign of the Lord's Cross; that, holding fast to these first lessons in the greatness of Your glory, he (she) may, by keeping Your commandments, be worthy to attain the glory of rebirth. Through Christ our Lord. ℟. Amen."], ["r", "5. Deinde imponit manum super caput infantis (singulorum infantium), et postea manum extensam tenens dicit:", "5. Then he lays his hand on the head of the child (of each child), and afterward, holding his hand extended, he says:"], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Omnípotens sempitérne Deus, Pater Dómini nostri Jesu Christi, respícere dignáre super hunc fámulum tuum N. (hanc fámulam tuam N.), quem (quam) ad rudiménta fídei vocáre dignátus es: omnem cæcitátem cordis ab eo (ea) expélle: disrúmpe omnes láqueos sátanæ, quibus fúerat colligátus (-a): áperi ei, Dómine, jánuam pietátis tuæ, ut signo sapiéntiæ tuæ imbútus (-a), ómnium cupiditátum fœtóribus cáreat, et ad suávem odórem præceptórum tuórum lætus (-a) tibi in Ecclésia tua desérviat, et profíciat de die in diem. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, Father of our Lord Jesus Christ, graciously look upon this Your servant N., whom You have deigned to call to the first lessons of the faith. Drive out from him (her) all blindness of heart; break all the snares of Satan with which he (she) was bound. Open to him (her), O Lord, the gate of Your mercy, so that, filled with the sign of Your wisdom, he (she) may be free from the foulness of all evil desires, and in the sweet fragrance of Your commandments may joyfully serve You in Your Church and grow from day to day. Through the same Christ our Lord. ℟. Amen."], ["r", "6. Deinde Sacerdos benedicit sal, quod semel benedictum alias ad eundem usum deservire potest.", "6. Then the priest blesses the salt, which, once blessed, may be used again for the same purpose."], ["h", "Benedictio salis", "Blessing of the salt"], ["t", "Exorcízo te, creatúra salis, in nómine Dei ✠ Patris omnipoténtis, et in caritáte Dómini nostri Jesu ✠ Christi, et in virtúte Spíritus ✠ Sancti. Exorcízo te per Deum ✠ vivum, per Deum ✠ verum, per Deum ✠ sanctum, per Deum ✠, qui te ad tutélam humáni géneris procreávit, et pópulo veniénti ad credulitátem per servos suos consecrári præcépit, ut in nómine sanctæ Trinitátis efficiáris salutáre sacraméntum ad effugándum inimícum. Proínde rogámus te, Dómine Deus noster, ut hanc creatúram salis sanctificándo sanctí✠fices, et benedicéndo bene✠dícas, ut fiat ómnibus accipiéntibus perfécta medicína, pérmanens in viscéribus eórum, in nómine ejúsdem Dómini nostri Jesu Christi, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of salt, in the name of God the ✠ Father almighty, and in the love of our Lord Jesus ✠ Christ, and in the power of the Holy ✠ Spirit. I exorcise you by the ✠ living God, by the ✠ true God, by the ✠ holy God, by ✠ God who created you for the protection of the human race and commanded that you be consecrated by His servants for the people coming to the faith, so that in the name of the Holy Trinity you may become a saving sacrament to put the enemy to flight. Therefore we ask You, O Lord our God, that by sanctifying You may sanc✠tify, and by blessing You may ✠ bless this creature of salt, so that it may become for all who receive it a perfect medicine, abiding in their inmost being; in the name of the same Jesus Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["r", "7. Deinde immittit modicum salis benedicti in os infantis, dicens (singulariter singulis):", "7. Then he puts a little of the blessed salt into the child's mouth, saying (to each individually):"], ["t", "N., Accipe sal sapiéntiæ: propitiátio sit tibi in vitam ætérnam. ℟. Amen.", "N., receive the salt of wisdom; may it be for you a pledge of mercy unto life everlasting. ℟. Amen."], ["t", "*Sacerdos:* Pax tecum. ℟. Et cum spíritu tuo.", "*Priest:* Peace be with you. ℟. And with your spirit."], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Deus patrum nostrórum, Deus univérsæ cónditor veritátis, te súpplices exorámus, ut hunc fámulum tuum N. (hanc fámulam tuam N.) respícere dignéris propítius, et hoc primum pábulum salis gustántem, non diútius esuríre permíttas, quo minus cibo expleátur cælésti, quátenus sit semper spíritu fervens, spe gaudens, tuo semper nómini sérviens. Perduc eum (eam), Dómine, quǽsumus, ad novæ regeneratiónis lavácrum, ut cum fidélibus tuis promissiónum tuárum ætérna prǽmia cónsequi mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "O God of our fathers, God, the author of all truth, we humbly beseech You graciously to look upon this Your servant N., and as he (she) tastes this first nourishment of salt, do not let him (her) hunger any longer, but fill him (her) with heavenly food, so that he (she) may be ever fervent in spirit, rejoicing in hope, always serving Your name. Lead him (her), O Lord, we beseech You, to the font of the new birth, that with Your faithful he (she) may be worthy to obtain the eternal rewards of Your promises. Through Christ our Lord. ℟. Amen."], ["t", "Exorcízo te, immúnde spíritus, in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti, ut éxeas, et recédas ab hoc fámulo (hac fámula) Dei N.: Ipse enim tibi ímperat, maledícte damnáte, qui pédibus super mare ambulávit, et Petro mergénti déxteram porréxit.", "I exorcise you, unclean spirit, in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit, that you go out and depart from this servant of God, N. For He commands you, accursed and damned one, who walked upon the sea and stretched out His right hand to Peter as he was sinking."], ["t", "Ergo, maledícte diábole, recognósce senténtiam tuam, et da honórem Deo vivo et vero, da honórem Jesu Christo Fílio ejus, et Spirítui Sancto, et recéde ab hoc fámulo (hac fámula) Dei N., quia istum (istam) sibi Deus et Dóminus noster Jesus Christus ad suam sanctam grátiam, et benedictiónem, fontémque Baptísmatis vocáre dignátus est.", "Therefore, accursed devil, acknowledge your sentence, and give honor to the living and true God; give honor to Jesus Christ, His Son, and to the Holy Spirit; and depart from this servant of God, N., for our God and Lord Jesus Christ has deigned to call him (her) to His holy grace and blessing and to the font of Baptism."], ["r", "8. Hic pollice in fronte signat infantem, dicens (singulariter singulis):", "8. Here with his thumb he signs the child on the forehead, saying (to each individually):"], ["t", "Et hoc signum sanctæ Cru✠cis, quod nos fronti ejus damus, tu, maledícte diábole, numquam áudeas violáre. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "And this sign of the holy ✠ Cross, which we place upon his (her) forehead, do you, accursed devil, never dare to violate. Through the same Christ our Lord. ℟. Amen."], ["r", "9. Mox imponit manum super caput infantis (singulorum infantium), et postea manum extensam tenens dicit:", "9. Next he lays his hand on the head of the child (of each child), and afterward, holding his hand extended, he says:"], ["t", "Orémus. *(In plurali pro pluribus.)*", "Let us pray. *(In the plural for several.)*"], ["t", "Ætérnam ac justíssimam pietátem tuam déprecor, Dómine sancte, Pater omnípotens, ætérne Deus, auctor lúminis et veritátis, super hunc fámulum tuum N. (hanc fámulam tuam N.), ut dignéris eum (eam) illumináre lúmine intellegéntiæ tuæ: munda eum (eam), et sanctífica: da ei sciéntiam veram, ut dignus (-a) grátia Baptísmi tui efféctus (-a), téneat firmam spem, consílium rectum, doctrínam sanctam. Per Christum, Dóminum nostrum. ℟. Amen.", "I implore Your eternal and most just mercy, holy Lord, Father almighty, everlasting God, author of light and truth, upon this Your servant N., that You would deign to enlighten him (her) with the light of Your understanding. Cleanse him (her) and sanctify him (her); give him (her) true knowledge, so that, being made worthy of the grace of Your Baptism, he (she) may hold firm hope, right counsel, and holy doctrine. Through Christ our Lord. ℟. Amen."], ["r", "10. Postea Sacerdos imponit extremam partem stolæ pendentem a suo humero sinistro super primum infantem, et introducit eum (quem sequuntur ceteri) in ecclesiam, dicens (in plurali pro pluribus):", "10. Then the priest places the end of the stole hanging from his left shoulder upon the first child and leads him (the others following) into the church, saying (in the plural for several):"], ["t", "N., Ingrédere in templum Dei, ut hábeas partem cum Christo in vitam ætérnam. ℟. Amen.", "N., enter into the temple of God, that you may have part with Christ unto life everlasting. ℟. Amen."], ["r", "11. Cum fuerint ecclesiam ingressi, Sacerdos procedens ad Fontem, cum susceptoribus conjunctim clara voce dicit:", "11. When they have entered the church, the priest, proceeding to the font, says aloud together with the sponsors:"], ["t", "Credo in Deum, Patrem omnipoténtem, Creatórem cæli et terræ. Et in Jesum Christum, Fílium ejus únicum, Dóminum nostrum: qui concéptus est de Spíritu Sancto, natus ex María Vírgine, passus sub Póntio Piláto, crucifíxus, mórtuus, et sepúltus: descéndit ad ínferos; tértia die resurréxit a mórtuis; ascéndit ad cælos; sedet ad déxteram Dei Patris omnipoténtis: inde ventúrus est judicáre vivos et mórtuos. Credo in Spíritum Sanctum, sanctam Ecclésiam cathólicam, Sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, vitam ætérnam. Amen.", "I believe in God, the Father almighty, Creator of heaven and earth; and in Jesus Christ, His only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died, and was buried. He descended into hell; on the third day He rose again from the dead; He ascended into heaven and sits at the right hand of God the Father almighty; from there He will come to judge the living and the dead. I believe in the Holy Spirit, the holy catholic Church, the communion of Saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen."], ["t", "Pater noster, qui es in cælis, sanctificétur nomen tuum. Advéniat regnum tuum. Fiat volúntas tua, sicut in cælo et in terra. Panem nostrum cotidiánum da nobis hódie. Et dimítte nobis débita nostra, sicut et nos dimíttimus debitóribus nostris. Et ne nos indúcas in tentatiónem: sed líbera nos a malo. Amen.", "Our Father, who art in heaven, hallowed be Thy name; Thy kingdom come; Thy will be done on earth as it is in heaven. Give us this day our daily bread; and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen."], ["r", "12. Ac deinde, antequam accedat ad Baptisterium, versis renibus ostio cancellorum Baptisterii, dicit (in plurali pro pluribus):", "12. And then, before he approaches the baptistery, with his back turned to the gate of the baptistery railing, he says (in the plural for several):"], ["h", "Exorcismus", "Exorcism"], ["t", "Exorcízo te, omnis spíritus immúnde, in nómine Dei ✠ Patris omnipoténtis, et in nómine Jesu ✠ Christi Fílii ejus, Dómini et Júdicis nostri, et in virtúte Spíritus ✠ Sancti, ut discédas ab hoc plásmate Dei N., quod Dóminus noster ad templum sanctum suum vocáre dignátus est, ut fiat templum Dei vivi, et Spíritus Sanctus hábitet in eo. Per eúndem Christum, Dóminum nostrum, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, every unclean spirit, in the name of God the ✠ Father almighty, and in the name of Jesus ✠ Christ, His Son, our Lord and Judge, and in the power of the Holy ✠ Spirit, that you depart from this creature of God, N., whom our Lord has deigned to call to His holy temple, that he (she) may become a temple of the living God and the Holy Spirit may dwell in him (her). Through the same Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["r", "13. Postea Sacerdos pollice accipit de saliva oris sui, et tangit aures et nares infantis: tangendo vero aurem dexteram et sinistram, dicit (singulariter singulis):", "13. Then the priest takes a little spittle from his mouth with his thumb and touches the ears and nostrils of the child; touching the right and the left ear, he says (to each individually):"], ["t", "Ephpheta, quod est, Adaperíre.", "Ephpheta, that is, Be opened."], ["r", "Deinde tangit nares, dicens:", "Then he touches the nostrils, saying:"], ["t", "In odórem suavitátis. Tu autem effugáre, diábole; appropinquábit enim judícium Dei.", "Unto the odor of sweetness. But you, devil, take flight; for the judgment of God draws near."], ["r", "14. Postea interrogat baptizandum nominatim, dicens (singulariter singulis):", "14. Then he questions the one to be baptized by name, saying (to each individually):"], ["t", "N., Abrenúntias sátanæ?", "N., do you renounce Satan?"], ["t", "*Respondet Patrinus:* Abrenúntio.", "*The godparent answers:* I do renounce him."], ["t", "*Sacerdos:* Et ómnibus opéribus ejus?", "*Priest:* And all his works?"], ["t", "*Patrinus:* Abrenúntio.", "*Godparent:* I do renounce them."], ["t", "*Sacerdos:* Et ómnibus pompis ejus?", "*Priest:* And all his empty show?"], ["t", "*Patrinus:* Abrenúntio.", "*Godparent:* I do renounce them."], ["r", "15. Deinde Sacerdos intingit pollicem in oleo Catechumenorum, et infantem ungit in pectore, et inter scapulas in modum crucis, dicens semel (singulariter singulis):", "15. Then the priest dips his thumb in the oil of catechumens and anoints the child on the breast and between the shoulders in the form of a cross, saying once (to each individually):"], ["t", "Ego te línio ✠ óleo salútis in Christo Jesu, Dómino nostro, ut hábeas vitam ætérnam. ℟. Amen.", "I anoint you ✠ with the oil of salvation in Christ Jesus our Lord, that you may have life everlasting. ℟. Amen."], ["r", "16. Subinde pollicem, et inuncta loca abstergit bombacio, vel re simili.", "16. He then wipes his thumb and the anointed places with cotton or something similar."], ["r", "17. Stans ibidem extra cancellos deponit stolam violaceam, et sumit stolam albi coloris. Tunc ingreditur Baptisterium, in quod intrat etiam patrinus cum infante. Sacerdos ad Fontem interrogat, expresso nomine, baptizandum (singulos baptizandos), patrino respondente:", "17. Standing there outside the railing, he lays aside the violet stole and takes a white one. He then enters the baptistery, into which the godparent also enters with the child. At the font the priest questions the one to be baptized (each one), calling him by name, the godparent answering:"], ["t", "N., Credis in Deum Patrem omnipoténtem, Creatórem cæli et terræ? ℟. Credo.", "N., do you believe in God the Father almighty, Creator of heaven and earth? ℟. I do believe."], ["t", "Credis in Jesum Christum, Fílium ejus únicum, Dóminum nostrum, natum, et passum? ℟. Credo.", "Do you believe in Jesus Christ, His only Son, our Lord, who was born and who suffered? ℟. I do believe."], ["t", "Credis et in Spíritum Sanctum, sanctam Ecclésiam cathólicam, Sanctórum communiónem, remissiónem peccatórum, carnis resurrectiónem, et vitam ætérnam? ℟. Credo.", "Do you also believe in the Holy Spirit, the holy catholic Church, the communion of Saints, the forgiveness of sins, the resurrection of the body, and life everlasting? ℟. I do believe."], ["r", "18. Subinde, expresso nomine baptizandi, Sacerdos dicit (singulariter singulis):", "18. Then, naming the one to be baptized, the priest says (to each individually):"], ["t", "N., Vis baptizári?", "N., do you wish to be baptized?"], ["t", "*Respondet patrinus:* Volo.", "*The godparent answers:* I do."], ["r", "19. Tunc patrino, vel matrina, vel utroque (si ambo admittantur) infantem tenente, Sacerdos vasculo, seu urceolo accipit aquam baptismalem, et eam ter fundit super caput infantis in modum crucis, et simul verba proferens, semel tantum distincte, et attente, dicit (singulariter singulis):", "19. Then, while the godfather or godmother, or both (if both are admitted), hold the child, the priest takes baptismal water in a small vessel or pitcher and pours it three times on the child's head in the form of a cross, at the same time saying the words once only, distinctly and attentively (to each individually):"], ["t", "N., Ego te baptízo in nómine Patris, *(fundit primo)* et Fílii, *(fundit secundo)* et Spíritus ✠ Sancti. *(fundit tertio)*", "N., I baptize you in the name of the Father, *(he pours the first time)* and of the Son, *(he pours the second time)* and of the Holy ✠ Spirit. *(he pours the third time)*"], ["r", "20. Ubi autem est consuetudo baptizandi per immersionem, Sacerdos accipit infantem, et, advertens ne lædatur, caute immergit, et trina immersione baptizat, et semel tantum dicit:", "20. Where the custom is to baptize by immersion, the priest takes the child and, taking care that it is not harmed, carefully immerses it, baptizing it by a threefold immersion, and says only once:"], ["t", "N., Ego te baptízo in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti.", "N., I baptize you in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit."], ["r", "21. Mox patrinus, vel matrina, vel uterque simul infantem de sacro Fonte levant, suscipientes illum de manu Sacerdotis.", "21. Then the godfather or godmother, or both together, raise the child from the sacred font, receiving it from the hand of the priest."], ["r", "22. Si vero dubitetur, an infans fuerit baptizatus, utatur hac forma:", "22. If there is doubt whether the child has already been baptized, this form is used:"], ["t", "N., Si non es baptizátus (-a), ego te baptízo in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti.", "N., if you are not baptized, I baptize you in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit."], ["r", "23. Deinde intingit pollicem in sacro Chrismate, et ungit infantem in summitate capitis in modum crucis, dicens (singulariter singulis):", "23. Then he dips his thumb in the holy chrism and anoints the child on the crown of the head in the form of a cross, saying (to each individually):"], ["t", "Deus omnípotens, Pater Dómini nostri Jesu Christi, qui te regenerávit ex aqua et Spíritu Sancto, quique dedit tibi remissiónem ómnium peccatórum, *(hic inungit)* ipse te líniat ✠ Chrísmate salútis in eódem Christo Jesu Dómino nostro in vitam ætérnam. ℟. Amen.", "May almighty God, the Father of our Lord Jesus Christ, who has given you new birth by water and the Holy Spirit and has granted you the forgiveness of all your sins, *(here he anoints)* Himself anoint you ✠ with the chrism of salvation in the same Christ Jesus our Lord unto life everlasting. ℟. Amen."], ["t", "*Sacerdos:* Pax tibi. ℟. Et cum spíritu tuo.", "*Priest:* Peace be with you. ℟. And with your spirit."], ["r", "24. Tum bombacio, vel re simili, abstergit pollicem, et locum inunctum, et imponit capiti ejus linteolum candidum loco vestis albæ, dicens (singulariter singulis):", "24. Then with cotton or something similar he wipes his thumb and the anointed place, and lays a white linen cloth on the child's head in place of the white garment, saying (to each individually):"], ["t", "Accipe vestem cándidam, quam pérferas immaculátam ante tribúnal Dómini nostri Jesu Christi, ut hábeas vitam ætérnam. ℟. Amen.", "Receive this white garment, and carry it without stain before the judgment seat of our Lord Jesus Christ, that you may have life everlasting. ℟. Amen."], ["r", "25. Postea dat ei, vel patrino, candelam accensam, dicens (singulariter singulis):", "25. Then he gives to the child, or to the godparent, a lighted candle, saying (to each individually):"], ["t", "Accipe lámpadem ardéntem, et irreprehensíbilis custódi Baptísmum tuum: serva Dei mandáta, ut, cum Dóminus vénerit ad núptias, possis occúrrere ei una cum ómnibus Sanctis in aula cælésti, et vivas in sǽcula sæculórum. ℟. Amen.", "Receive this burning light, and keep your Baptism so as to be without blame. Keep the commandments of God, so that when the Lord comes to the wedding feast, you may go out to meet Him together with all the Saints in the heavenly court, and may live for ever and ever. ℟. Amen."], ["r", "26. Postremo dicit (in plurali pro pluribus):", "26. Lastly he says (in the plural for several):"], ["t", "N., Vade (Ite) in pace, et Dóminus sit tecum (vobíscum). ℟. Amen.", "N., go in peace, and the Lord be with you. ℟. Amen."], ["h", "Rubricæ", "Rubrics"], ["r", "27. Ritus superius descriptus servandus est etiam a Diacono Baptismum sollemnem ministrante, qui tamen sale et aqua utetur a Sacerdote ad hunc usum rite prius benedictis.", "27. The rite described above is to be observed also by a deacon administering solemn Baptism; he shall, however, use salt and water previously blessed for this purpose by a priest."], ["r", "28. Si vero sint plures baptizandi, sive masculi, sive feminæ, in catechismo masculi statuantur ad dexteram, feminæ vero ad sinistram; et omnia pariter dicantur ut supra, in proprio genere, et numero plurali. Verum prima nominis interrogatio, exsufflatio, crucis impressio, seu signatio, tactus aurium et narium cum saliva, abrenuntiationis interrogatio, unctio Olei Catechumenorum, interrogatio de Fide, seu Symbolo, et ipse Baptismus, inunctio Chrismatis, candidæ vestis impositio, atque accensæ candelæ traditio, singulariter singulis, et primum masculis, deinde feminis, fieri debent.", "28. If there are several to be baptized, whether boys or girls, the boys are placed on the right during the catechism and the girls on the left; and everything is said as above in the proper gen
