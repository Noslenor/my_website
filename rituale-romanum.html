nd her help, O Lord, from the sanctuary,"], ["x", "Et de Sion tuére eam.", "And defend her out of Sion."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui dedísti fámulis tuis in confessióne veræ fídei ætérnæ Trinitátis glóriam agnóscere, et in poténtia majestátis adoráre unitátem: quǽsumus; ut ejúsdem fídei firmitáte hæc fámula tua N. ab ómnibus semper muniátur advérsis. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who have granted to Your servants, in the confession of the true faith, to acknowledge the glory of the eternal Trinity and to adore the Unity in the power of Your majesty: we beseech You that by steadfastness in this same faith this Your servant N. may ever be protected against all adversity. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus, ómnium Creátor, fortis et terríbilis, justus et miséricors, qui solus bonus et pius es; qui de omni malo liberásti Israel, fáciens tibi patres nostros diléctos, et sanctificásti eos manu Spíritus tui; qui gloriósæ Vírginis Maríæ corpus et ánimam, ut dignum Fílii tui habitáculum éffici mererétur, Spíritu Sancto cooperánte præparásti; qui Joánnem Baptístam Spíritu Sancto replésti, et in útero matris exsultáre fecísti: áccipe sacrifícium cordis contríti, ac fervens desidérium fámulæ tuæ N. humíliter supplicántis pro conservatióne prolis, quam ei dedísti concípere: custódi partem tuam, et ab omni dolo et injúria duri hostis defénde; ut obstetricánte manu misericórdiæ tuæ fetus ejus ad lucem próspere véniat, ac sanctæ generatióni servétur, tibíque in ómnibus júgiter desérviat, et vitam cónsequi mereátur ætérnam. Per eúndem Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God, Creator of all things, strong and terrible, just and merciful, who alone are good and kind; who delivered Israel from every evil, making our fathers Your beloved, and sanctified them by the hand of Your Spirit; who by the cooperation of the Holy Spirit prepared the body and soul of the glorious Virgin Mary to become a worthy dwelling for Your Son; who filled John the Baptist with the Holy Spirit and made him leap in his mother's womb: accept the sacrifice of a contrite heart and the fervent desire of Your servant N., who humbly entreats You for the preservation of the child You have granted her to conceive. Guard what is Your own, and defend it from every deceit and injury of the harsh enemy, so that by the helping hand of Your mercy her child may come happily to the light, be kept for holy rebirth, serve You always in all things, and be worthy to attain eternal life. Through the same Jesus Christ, Your Son, our Lord, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Deinde mulier aspergatur aqua benedicta, et mox dicatur:", "Then the woman is sprinkled with holy water, and immediately the following is said:"], ["h", "Psalmus 66", "Psalm 66"], ["t", "Deus misereátur nostri, et benedícat nobis: * illúminet vultum suum super nos, et misereátur nostri.", "May God have mercy on us and bless us; * may He make His face to shine upon us and have mercy on us."], ["t", "Ut cognoscámus in terra viam tuam, * in ómnibus géntibus salutáre tuum.", "That we may know Your way upon earth, * Your salvation among all nations."], ["t", "Confiteántur tibi pópuli, Deus: * confiteántur tibi pópuli omnes.", "Let the peoples praise You, O God; * let all the peoples praise You."], ["t", "Læténtur et exsúltent gentes: * quóniam júdicas pópulos in æquitáte, et gentes in terra dírigis.", "Let the nations be glad and rejoice, * for You judge the peoples with equity and guide the nations upon earth."], ["t", "Confiteántur tibi pópuli, Deus, confiteántur tibi pópuli omnes: * terra dedit fructum suum.", "Let the peoples praise You, O God, let all the peoples praise You; * the earth has yielded its fruit."], ["t", "Benedícat nos Deus, Deus noster, benedícat nos Deus: * et métuant eum omnes fines terræ.", "May God, our God, bless us; may God bless us, * and may all the ends of the earth fear Him."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["v", "Benedicámus Patrem, et Fílium, cum Sancto Spíritu.", "Let us bless the Father and the Son, with the Holy Spirit."], ["x", "Laudémus et superexaltémus eum in sǽcula.", "Let us praise and exalt Him above all for ever."], ["v", "Ángelis suis Deus mandávit de te.", "God has given His angels charge over you,"], ["x", "Ut custódiant te in ómnibus viis tuis.", "To keep you in all your ways."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Vísita, quǽsumus, Dómine, habitatiónem istam, et omnes insídias inimíci ab ea, et a præsénti fámula tua N. longe repélle: Ángeli tui sancti hábitent in ea, qui eam et ejus prolem in pace custódiant, et benedíctio tua sit super eam semper. Salva eos, omnípotens Deus, et lucem eis tuam concéde perpétuam. Per Christum, Dóminum nostrum. ℟. Amen.", "Visit, we beseech You, O Lord, this dwelling, and drive far from it and from Your servant N. here present all the snares of the enemy. May Your holy Angels dwell herein to keep her and her child in peace, and may Your blessing be always upon her. Save them, almighty God, and grant them Your everlasting light. Through Christ our Lord. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et prolem tuam, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and your child and remain for ever. ℟. Amen."]]}, {"id": "infant", "la": "Benedictio Infantis", "en": "Blessing of an Infant", "cat": "Mothers & Children", "ref": "Appendix, Benedictiones non reservatæ, 45", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Deus noster miserétur.", "Our God is merciful,"], ["x", "Custódiens párvulos Dóminus.", "The Lord keeps the little ones."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, qui ante ómnia sǽcula génitus, in témpore tamen infans esse voluísti, et hujus ætátis díligis innocéntiam; qui párvulos tibi oblátos amánter compléxus es, iísque benedixísti: infántem istum (infántes istos) prǽveni in benedictiónibus dulcédinis, et præsta, ne malítia mutet intelléctum ejus (eórum): eíque (eísque) concéde, ut profíciens (proficiéntes) ætáte, sapiéntia et grátia, tibi semper placére váleat (váleant): Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, begotten before all ages, who nevertheless willed to become an infant in time, and who love the innocence of this age; who lovingly embraced and blessed the little ones brought to You: go before this infant (these infants) with the blessings of Your sweetness, and grant that malice may not change his (their) understanding; and grant that, advancing in age, wisdom, and grace, he (they) may always be pleasing to You: who live and reign with God the Father in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Deinde Sacerdos infantem (vel infantes) aspergat aqua benedicta, dicens:", "Then the priest sprinkles the infant (or infants) with holy water, saying:"], ["t", "Pax et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te (vos), et máneat semper. ℟. Amen.", "May the peace and blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."]]}, {"id": "boy", "la": "Benedictio Pueri ad obtinendam super ipsum misericordiam Dei", "en": "Blessing of a Child, to Obtain God's Mercy upon Him", "cat": "Mothers & Children", "ref": "Appendix, Benedictiones non reservatæ, 46", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, qui dixísti: Sínite párvulos veníre ad me, tálium est enim regnum cælórum; super hunc púerum tuum virtútem bene✠dictiónis tuæ infúnde, ac ad Ecclésiæ et paréntum illíus fidem ac devotiónem réspice; ut virtúte ac sapiéntia apud Deum et hómines profíciens, ad optátam pervéniat senectútem, et salútem consequátur ætérnam: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, who said, \"Let the little children come to Me, for of such is the kingdom of heaven\": pour out the power of Your ✠ blessing upon this child of Yours, and look upon the faith and devotion of the Church and of his parents; that, growing in virtue and wisdom before God and men, he may reach the old age he longs for and attain eternal salvation: who live and reign for ever and ever. ℟. Amen."], ["h", "Psalmus 112", "Psalm 112"], ["t", "Laudáte, púeri, Dóminum: * laudáte nomen Dómini.", "Praise the Lord, you children; * praise the name of the Lord."], ["t", "Sit nomen Dómini benedíctum, * ex hoc nunc, et usque in sǽculum.", "Blessed be the name of the Lord, * from this time forth and for evermore."], ["t", "A solis ortu usque ad occásum, * laudábile nomen Dómini.", "From the rising of the sun to its setting, * the name of the Lord is worthy of praise."], ["t", "Excélsus super omnes gentes Dóminus, * et super cælos glória ejus.", "The Lord is high above all nations, * and His glory above the heavens."], ["t", "Quis sicut Dóminus, Deus noster, qui in altis hábitat, * et humília réspicit in cælo et in terra?", "Who is like the Lord our God, who dwells on high, * and looks upon the lowly in heaven and on earth?"], ["t", "Súscitans a terra ínopem, * et de stércore érigens páuperem:", "Raising up the needy from the earth, * and lifting the poor out of the dunghill,"], ["t", "Ut cóllocet eum cum princípibus, * cum princípibus pópuli sui.", "To seat him with princes, * with the princes of His people."], ["t", "Qui habitáre facit stérilem in domo, * matrem filiórum lætántem.", "Who makes the barren woman dwell in her house, * the joyful mother of children."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."]]}, {"id": "children-church", "la": "Benedictio Puerorum, cum præsertim in ecclesia præsentantur", "en": "Blessing of Children, Especially When Presented in Church", "cat": "Mothers & Children", "ref": "Appendix, Benedictiones non reservatæ, 47", "b": [["r", "Die et hora constitutis, pueri conveniant in ecclesiam, quos ibi a parentibus vel magistris associari maxime deceret, ut in silentio et modestia facilius se componant. Quibus per ordinem dispositis, et pueris a puellis, si adsint, separatis, Sacerdos ad ipsos accedat, et brevissimo ac simplici sermone eos alloquatur, prout opportunum sibi visum fuerit.", "At the appointed day and hour the children gather in the church, where it is most fitting that they be accompanied by their parents or teachers, so that they may more easily keep silence and good order. When they have been arranged in order, the boys separated from the girls if both are present, the priest comes to them and addresses them in a very short and simple talk, as he sees fit."], ["r", "Deinde stans versus eos dicat:", "Then, standing facing them, he says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "*Ant.* Laudáte, púeri, Dóminum: laudáte nomen Dómini.", "*Ant.* Praise the Lord, you children; praise the name of the Lord."], ["r", "Psalmus 112, incipitur a secundo versu: Sit nomen Dómini (ut in Benedictione Pueri supra). Et repetitur Antiphona. Qui Psalmus cum sua Antiphona, si paucis tantum, aut minus sollemniter conferatur Benedictio, omitti poterit.", "Psalm 112 is said, beginning from the second verse, \"Blessed be the name of the Lord\" (as in the Blessing of a Child above), and the antiphon is repeated. If the blessing is given to only a few, or less solemnly, the psalm with its antiphon may be omitted."], ["r", "Finito Psalmo et repetita Antiphona, Sacerdos dicit:", "When the psalm is finished and the antiphon repeated, the priest says:"], ["v", "Sínite párvulos veníre ad me.", "Let the little children come to Me."], ["x", "Tálium est enim regnum cælórum.", "For of such is the kingdom of heaven."], ["v", "Ángeli eórum.", "Their Angels"], ["x", "Semper vident fáciem Patris.", "Always behold the face of the Father."], ["v", "Nihil profíciat inimícus in eis.", "Let the enemy have no power over them,"], ["x", "Et fílius iniquitátis non appónat nocére eis.", "Nor the son of iniquity draw near to harm them."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui párvulos tibi oblátos et ad te veniéntes compléxus es, manúsque super illos impónens benedixísti eis, atque dixísti: Sínite párvulos veníre ad me, et nolíte prohibére eos, tálium est enim regnum cælórum, et Ángeli eórum semper vident fáciem Patris mei; réspice, quǽsumus, ad puerórum (puellárum) præséntium innocéntiam, et ad eórum (eárum) paréntum devotiónem, et cleménter eos (eas) hódie per ministérium nostrum béne✠dic; ut in tua grátia et misericórdia semper profíciant, te sápiant, te díligant, te tímeant, et mandáta tua custódiant, et ad finem optátum felíciter pervéniant: per te, Salvátor mundi, qui cum Patre et Spíritu Sancto vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who embraced the little ones brought to You and coming to You, and laying Your hands upon them blessed them, saying, \"Let the little children come to Me, and do not forbid them, for of such is the kingdom of heaven, and their Angels always behold the face of My Father\": look, we beseech You, upon the innocence of these children here present and upon the devotion of their parents, and through our ministry graciously ✠ bless them this day; that they may ever grow in Your grace and mercy, may know You, love You, fear You, and keep Your commandments, and may happily reach the end they long for: through You, Savior of the world, who with the Father and the Holy Spirit live and reign, God, for ever and ever. ℟. Amen."], ["n", "", "The words in parentheses are used if only girls are present."], ["t", "Orémus.", "Let us pray."], ["t", "Defénde, quǽsumus, Dómine, beáta María semper Vírgine intercedénte, istam ab omni adversitáte famíliam: et toto corde tibi prostrátam, ab hóstium propítius tuére cleménter insídiis. Per Christum, Dóminum nostrum. ℟. Amen.", "Defend, we beseech You, O Lord, through the intercession of blessed Mary ever Virgin, this family from all adversity; and as they bow before You with all their heart, graciously protect them in Your kindness from the snares of the enemy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui ineffábili providéntia sanctos Ángelos tuos ad nostram custódiam míttere dignáris: largíre supplícibus tuis; et eórum semper protectióne deféndi, et ætérna societáte gaudére. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who in Your unspeakable providence deign to send Your holy Angels to guard us: grant to Your suppliants that we may always be defended by their protection and rejoice in their company for ever. Through Christ our Lord. ℟. Amen."], ["r", "Postea manu dextera producens signum crucis super pueros, benedicit eos, dicens:", "Then, making the sign of the cross over the children with his right hand, he blesses them, saying:"], ["t", "Benedícat vos Deus, et custódiat corda vestra et intellegéntias vestras, Pater, et Fílius, ✠ et Spíritus Sanctus. ℟. Amen.", "May God bless you and keep your hearts and minds, the Father, and the Son, ✠ and the Holy Spirit. ℟. Amen."], ["r", "Deinde aspergat pueros aqua benedicta.", "Then he sprinkles the children with holy water."]]}, {"id": "sick-children", "la": "Benedictio Puerorum Ægrotantium", "en": "Blessing of Sick Children", "cat": "Mothers & Children", "ref": "Appendix, Benedictiones non reservatæ, 48", "b": [["r", "Pueri infirmi, qui ad hunc usum rationis pervenerunt, ut ipsis præberi possit Sacramentum Extremæ Unctionis, iis adjuventur exhortationibus et precibus, quæ describuntur in hoc Rituali Romano, ubi agitur de visitatione et cura infirmorum, prout feret temporis opportunitas, et eorundem ægrotantium status. Verum pro ceteris junioribus pueris infirmis adhiberi possunt sequentes preces.", "Sick children who have reached such use of reason that Extreme Unction may be given them are to be helped with the exhortations and prayers described in this Roman Ritual for the visitation and care of the sick, as time and the state of the sick allow. For other, younger sick children, the following prayers may be used."], ["r", "Sacerdos infirmi cubiculum ingressus, primum dicit:", "The priest, entering the sick child's room, first says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "Mox infirmum et lectum ejus et cubiculum aspergit, nihil dicens. Deinde dicit Psalmum 112 Laudáte, púeri, Dóminum (ut in Benedictione Pueri supra), cum Glória Patri in fine.", "Then he sprinkles the sick child, the bed, and the room, saying nothing. Then he says Psalm 112, \"Praise the Lord, you children\" (as in the Blessing of a Child above), with the Glory be at the end."], ["r", "Postea dicit:", "Afterward he says:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Deus noster miserétur.", "Our God is merciful,"], ["x", "Custódiens párvulos Dóminus.", "The Lord keeps the little ones."], ["v", "Sínite párvulos veníre ad me.", "Let the little children come to Me."], ["x", "Tálium est enim regnum cælórum.", "For of such is the kingdom of heaven."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, cui cuncta adoléscunt, et per quem adúlta firmántur: exténde déxteram tuam super hunc fámulum tuum (hanc fámulam tuam), in ténera ætáte languéntem: quátenus vigóre sanitátis recépto, ad annórum pervéniat plenitúdinem, et tibi fidéle, gratúmque obséquium indesinénter præstet ómnibus diébus vitæ suæ. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, by whom all things grow and by whom what has grown is made strong: stretch forth Your right hand over this Your servant, who lies ill at a tender age; that, regaining vigor and health, he (she) may reach the fullness of years and render You faithful and pleasing service unceasingly all the days of his (her) life. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus misericordiárum, et Deus totíus consolatiónis, qui creatúræ tuæ multíplici pietáte cónsulens, non solum ánimæ, sed ipsi córpori curatiónis grátiam benígnus infúndis: hunc párvulum infírmum (hanc párvulam infírmam) a lecto ægritúdinis erígere, et Ecclésiæ tuæ sanctæ, suísque paréntibus incólumem restitúere dignéris; ut cunctis prolongátæ sibi vitæ diébus, grátia et sapiéntia coram te et homínibus profíciens, in justítia et sanctitáte tibi sérviat, et débitas misericórdiæ tuæ réferat gratiárum actiónes. Per Christum, Dóminum nostrum. ℟. Amen.", "God of mercies and God of all consolation, who in Your manifold kindness provide for Your creatures and graciously pour out the grace of healing not only upon the soul but upon the body as well: deign to raise this sick little one from the bed of sickness and restore him (her) unharmed to Your holy Church and to his (her) parents; that, growing in grace and wisdom before You and men all the days of the life prolonged for him (her), he (she) may serve You in justice and holiness and render due thanks to Your mercy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui miro órdine Angelórum ministéria hominúmque dispénsas: concéde propítius; ut, a quibus tibi ministrántibus in cælo semper assístitur, ab his in terra vita hujus púeri (puéllæ) muniátur. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who in wondrous order assign the ministries of Angels and of men: mercifully grant that the life of this boy (girl) on earth may be protected by those who ever stand ministering before You in heaven. Through Christ our Lord. ℟. Amen."], ["r", "Completa Oratione ultima, Sacerdos imponit dexteram manum super caput infirmi, et dicit:", "When the last prayer is finished, the priest lays his right hand upon the head of the sick child and says:"], ["t", "Super ægros manus impónent, et bene habébunt. Jesus, Maríæ Fílius, mundi salus et Dóminus, méritis et intercessióne sanctórum Apostolórum suórum Petri et Pauli, et ómnium Sanctórum, sit tibi clemens et propítius. Amen.", "They shall lay their hands upon the sick, and they shall recover. May Jesus, Son of Mary, Lord and Savior of the world, through the merits and intercession of His holy Apostles Peter and Paul and of all the Saints, be kind and merciful to you. Amen."], ["r", "Quod sequitur Evangelium, pro temporis opportunitate et pro ægrotantis pueri parentum desiderio, Sacerdotis arbitrio dici poterit.", "The following Gospel may be said at the priest's discretion, as time allows and as the parents of the sick child desire."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["v", "Inítium sancti Evangélii secúndum Joánnem.", "The beginning of the holy Gospel according to John."], ["x", "Glória tibi, Dómine.", "Glory to You, O Lord."], ["r", "Dum Sacerdos dicit Inítium, etc. facit signum crucis de more super se in fronte, ore et pectore; similiter super puerum infirmum, si non possit se signare.", "While the priest says \"The beginning,\" etc., he makes the sign of the cross in the usual way on his forehead, lips, and breast, and likewise over the sick child if the child cannot sign himself."], ["t", "In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in princípio apud Deum. Ómnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est: in ipso vita erat, et vita erat lux hóminum: et lux in ténebris lucet, et ténebræ eam non comprehendérunt. Fuit homo missus a Deo, cui nomen erat Joánnes. Hic venit in testimónium, ut testimónium perhibéret de lúmine, ut omnes créderent per illum. Non erat ille lux, sed ut testimónium perhibéret de lúmine. Erat lux vera, quæ illúminat omnem hóminem veniéntem in hunc mundum. In mundo erat, et mundus per ipsum factus est, et mundus eum non cognóvit. In própria venit, et sui eum non recepérunt. Quotquot autem recepérunt eum, dedit eis potestátem fílios Dei fíeri, his, qui credunt in nómine ejus: qui non ex sanguínibus, neque ex voluntáte carnis, neque ex voluntáte viri, sed ex Deo nati sunt. *(Hic genuflectitur)* Et Verbum caro factum est, et habitávit in nobis: et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ et veritátis.", "In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through Him, and without Him was made nothing that was made. In Him was life, and the life was the light of men; and the light shines in the darkness, and the darkness did not comprehend it. There was a man sent from God, whose name was John. He came as a witness, to bear witness to the light, that all might believe through him. He was not the light, but was to bear witness to the light. That was the true light, which enlightens every man coming into this world. He was in the world, and the world was made through Him, and the world did not know Him. He came unto His own, and His own did not receive Him. But to as many as received Him He gave the power to become children of God, to those who believe in His name: who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God. *(Here all genuflect)* And the Word was made flesh, and dwelt among us; and we saw His glory, the glory as of the Only-begotten of the Father, full of grace and truth."], ["x", "Deo grátias.", "Thanks be to God."], ["r", "Postea benedicens puerum infirmum, subjungit, dicens:", "Then, blessing the sick child, he adds:"], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Deinde aspergit eum aqua benedicta. Si sint plures infirmi in eodem cubiculo vel loco, Preces et Orationes prædictæ dicuntur super eos in numero plurali.", "Then he sprinkles the child with holy water. If there are several sick children in the same room or place, the foregoing prayers are said over them in the plural."]]}, {"id": "ad-omnia", "la": "Benedictio ad Omnia", "en": "Blessing for Any Object", "cat": "General", "ref": "Appendix, Benedictiones non reservatæ, 70", "b": [["r", "Hæc benedictionis formula adhiberi potest a quovis Sacerdote pro omnibus rebus, quarum specialis benedictio in hoc Rituali non habetur.", "This form of blessing may be used by any priest for all things that have no special blessing in this Ritual."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, cujus verbo sanctificántur ómnia, bene✠dictiónem tuam effúnde super creatúram istam (creatúras istas): et præsta; ut, quisquis ea (eis) secúndum legem et voluntátem tuam cum gratiárum actióne usus fúerit, per invocatiónem sanctíssimi nóminis tui, córporis sanitátem, et ánimæ tutélam, te auctóre, percípiat. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, by whose word all things are made holy, pour out Your ✠ blessing upon this creature (these creatures), and grant that whoever uses it (them) with thanksgiving, according to Your law and will, may, by the invocation of Your most holy name, receive through You health of body and protection of soul. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur (vel aspergantur) aqua benedicta.", "And it is (or they are) sprinkled with holy water."]]}, {"id": "ship", "la": "Benedictio Navis", "en": "Blessing of a Ship", "cat": "Work & Travel", "ref": "Tit. VIII, cap. 9", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Propitiáre, Dómine, supplicatiónibus nostris, et béne✠dic navem istam déxtera tua sancta et omnes qui in ea vehéntur, sicut dignátus es benedícere arcam Noe ambulántem in dilúvio: pórrige eis, Dómine, déxteram tuam, sicut porrexísti beáto Petro ambulánti supra mare; et mitte sanctum Ángelum tuum de cælis, qui líberet, et custódiat eam semper a perículis univérsis, cum ómnibus quæ in ea erunt: et fámulos tuos, repúlsis adversitátibus, portu semper optábili, cursúque tranquíllo tueáris, transactísque, ac recte perféctis negótiis ómnibus, iteráto témpore ad própria cum omni gáudio revocáre dignéris: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Be favorable, O Lord, to our prayers, and with Your holy right hand ✠ bless this ship and all who will sail in it, as You deigned to bless the ark of Noah as it moved upon the flood. Stretch out Your right hand to them, O Lord, as You stretched it out to blessed Peter walking upon the sea; and send Your holy Angel from heaven to deliver and guard it always from every danger, together with all that will be in it. Protect Your servants, driving away all adversity, with an ever-welcome harbor and a calm voyage; and when all their business has been rightly accomplished, deign in due time to bring them home again with all joy: who live and reign for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "crops-vineyards", "la": "Benedictio super Fruges et Vineas", "en": "Blessing of Crops and Vineyards", "cat": "Fields & Animals", "ref": "Tit. VIII, cap. 10", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Orámus pietátem tuam, omnípotens Deus, ut has primítias creatúræ tuæ, quas áëris et plúviæ temperaménto nutríre dignátus es, bene✠dictiónis tuæ imbre perfúndas, et fructus terræ tuæ usque ad maturitátem perdúcas. Tríbue quoque pópulo tuo de tuis munéribus tibi semper grátias ágere; ut a fertilitáte terræ esuriéntium ánimas bonis ómnibus affluéntibus répleas, et egénus et pauper laudent nomen glóriæ tuæ. Per Christum, Dóminum nostrum. ℟. Amen.", "We entreat Your loving kindness, almighty God, that You would pour the shower of Your ✠ blessing upon these first-fruits of Your creation, which You have deigned to nourish with the gentle balance of air and rain, and bring the fruits of Your earth to ripeness. Grant also to Your people always to give You thanks for Your gifts; that from the fruitfulness of the earth You may fill the souls of the hungry with an abundance of all good things, and the needy and the poor may praise the name of Your glory. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "pilgrims-departing", "la": "Benedictio Peregrinorum ad Loca Sancta Prodeuntium", "en": "Blessing of Pilgrims Setting Out for the Holy Places", "cat": "Work & Travel", "ref": "Tit. VIII, cap. 11", "b": [["r", "Peregrini ad loca sancta profecturi, antequam discedant, juxta veteris Ecclesiæ institutum, curent accipere patentes seu commendatitias litteras a suo Ordinario, seu Parocho. Quibus obtentis, et rebus suis dispositis, facta peccatorum suorum confessione, audiunt Missam, in qua dicitur Oratio pro peregrinantibus, ad instar Collectæ pro re gravi imperatæ, et Sanctissimam Eucharistiam devote suscipiunt. Expleta Missa, Sacerdos super eos genuflexos dicit sequentes Preces:", "Pilgrims about to set out for the holy places should, before they depart and according to the ancient custom of the Church, take care to obtain letters patent or letters of recommendation from their Ordinary or their pastor. Having obtained these and set their affairs in order, they confess their sins, hear Mass, in which the prayer for travelers is said in the manner of a collect ordered for a grave cause, and devoutly receive the Most Holy Eucharist. When Mass is finished, the priest says the following prayers over them as they kneel:"], ["t", "*Ant.* In viam pacis.", "*Ant.* Into the way of peace."], ["h", "Canticum Zachariæ (Luc. 1, 68-79)", "The Canticle of Zachary (Luke 1:68-79)"], ["t", "Benedíctus Dóminus, Deus Israël: * quia visitávit, et fecit redemptiónem plebis suæ:", "Blessed be the Lord, the God of Israel, * for He has visited and wrought the redemption of His people;"], ["t", "Et eréxit cornu salútis nobis: * in domo David, púeri sui.", "And has raised up a horn of salvation for us * in the house of David His servant,"], ["t", "Sicut locútus est per os sanctórum, * qui a sǽculo sunt, prophetárum ejus:", "As He spoke by the mouth of His holy ones, * the prophets from of old:"], ["t", "Salútem ex inimícis nostris, * et de manu ómnium, qui odérunt nos:", "Salvation from our enemies * and from the hand of all who hate us,"], ["t", "Ad faciéndam misericórdiam cum pátribus nostris: * et memorári testaménti sui sancti.", "To show mercy to our fathers * and to remember His holy covenant,"], ["t", "Jusjurándum, quod jurávit ad Ábraham, patrem nostrum, * datúrum se nobis:", "The oath which He swore to Abraham our father, * that He would grant us"], ["t", "Ut sine timóre, de manu inimicórum nostrórum liberáti, * serviámus illi.", "That, delivered from the hand of our enemies, * we might serve Him without fear,"], ["t", "In sanctitáte, et justítia coram ipso, * ómnibus diébus nostris.", "In holiness and justice before Him * all our days."], ["t", "Et tu, puer, Prophéta Altíssimi vocáberis: * præíbis enim ante fáciem Dómini paráre vias ejus:", "And you, child, shall be called the Prophet of the Most High, * for you shall go before the face of the Lord to prepare His ways,"], ["t", "Ad dandam sciéntiam salútis plebi ejus: * in remissiónem peccatórum eórum:", "To give His people knowledge of salvation * in the forgiveness of their sins,"], ["t", "Per víscera misericórdiæ Dei nostri: * in quibus visitávit nos, óriens ex alto:", "Through the tender mercy of our God, * by which the Dayspring from on high has visited us,"], ["t", "Illumináre his, qui in ténebris, et in umbra mortis sedent: * ad dirigéndos pedes nostros in viam pacis.", "To shine on those who sit in darkness and in the shadow of death, * to guide our feet into the way of peace."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* In viam pacis et prosperitátis dírigat vos omnípotens et miséricors Dóminus: et Ángelus Ráphaël comitétur vobíscum in via, ut cum pace, salúte, et gáudio revertámini ad própria.", "*Ant.* May the almighty and merciful Lord guide you into the way of peace and prosperity, and may the Angel Raphael accompany you on the way, so that you may return home in peace, health, and joy."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants,"], ["x", "Deus meus, sperántes in te.", "O my God, who hope in You."], ["v", "Mitte eis, Dómine, auxílium de sancto.", "Send them help, O Lord, from the sanctuary,"], ["x", "Et de Sion tuére eos.", "And defend them out of Sion."], ["v", "Esto eis, Dómine, turris fortitúdinis.", "Be unto them, O Lord, a tower of strength"], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Nihil profíciat inimícus in eis.", "Let the enemy have no power over them,"], ["x", "Et fílius iniquitátis non appónat nocére eis.", "Nor the son of iniquity draw near to harm them."], ["v", "Benedíctus Dóminus die cotídie.", "Blessed be the Lord day by day."], ["x", "Prósperum iter fáciat nobis Deus salutárium nostrórum.", "May God, our salvation, make our journey prosperous."], ["v", "Vias tuas, Dómine, demónstra nobis.", "Show us Your ways, O Lord,"], ["x", "Et sémitas tuas édoce nos.", "And teach us Your paths."], ["v", "Útinam dirigántur viæ nostræ.", "O that our ways may be directed"], ["x", "Ad custodiéndas justificatiónes tuas.", "To keep Your statutes."], ["v", "Erunt prava in dirécta.", "The crooked shall be made straight,"], ["x", "Et áspera in vias planas.", "And the rough ways plain."], ["v", "Ángelis suis Deus mandávit de te.", "God has given His angels charge over you,"], ["x", "Ut custódiant te in ómnibus viis tuis.", "To keep you in all your ways."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui fílios Israël per maris médium sicco vestígio ire fecísti, quique tribus Magis iter ad te stella duce pandísti: tríbue eis, quǽsumus, iter prósperum, tempúsque tranquíllum; ut Ángelo tuo sancto cómite, ad eum, quo pergunt, locum, ac demum ad ætérnæ salútis portum felíciter váleant perveníre.", "O God, who made the children of Israel pass dry-shod through the midst of the sea, and who opened to the three Magi the way to You by the guidance of a star: grant them, we beseech You, a prosperous journey and peaceful weather; that with Your holy Angel as their companion they may happily reach the place to which they are going, and at last the harbor of eternal salvation."], ["t", "Deus, qui Ábraham púerum tuum de Ur Chaldæórum edúctum, per omnes suæ peregrinatiónis vias illǽsum custodísti: quǽsumus, ut hos fámulos tuos custodíre dignéris; esto eis, Dómine, in procínctu suffrágium, in via solátium, in æstu umbráculum, in plúvia et frígore teguméntum, in lassitúdine vehículum, in adversitáte præsídium, in lúbrico báculus, in naufrágio portus: ut te duce, quo tendunt, próspere pervéniant, et demum incólumes ad própria revertántur.", "O God, who led Your servant Abraham out of Ur of the Chaldeans and kept him unharmed in all the ways of his pilgrimage: we beseech You to deign to guard these Your servants. Be to them, O Lord, a support when they set out, a comfort on the way, a shade in the heat, a shelter in rain and cold, a carriage in weariness, a defense in adversity, a staff on slippery ground, a harbor in shipwreck; so that under Your guidance they may happily reach their destination and at last return home unharmed."], ["t", "Adésto, quǽsumus, Dómine, supplicatiónibus nostris: et viam famulórum tuórum in salútis tuæ prosperitáte dispóne; ut inter omnes viæ et vitæ hujus varietátes tuo semper protegántur auxílio.", "Be attentive, we beseech You, O Lord, to our prayers, and order the way of Your servants in the prosperity of Your salvation; that amid all the changes of this journey and of this life they may ever be protected by Your help."], ["t", "Præsta, quǽsumus, omnípotens Deus: ut família tua per viam salútis incédat; et beáti Joánnis Præcursóris hortaménta sectándo, ad eum, quem prædíxit, secúra pervéniat, Dóminum nostrum Jesum Christum, Fílium tuum.", "Grant, we beseech You, almighty God, that Your family may walk in the way of salvation; and that, following the exhortations of blessed John the Forerunner, they may come safely to Him whom he foretold, our Lord Jesus Christ, Your Son."], ["t", "Exáudi, Dómine, preces nostras, et iter famulórum tuórum propítius comitáre, atque misericórdiam tuam, sicut ubíque es, ita ubíque largíre: quátenus a cunctis adversitátibus tua opitulatióne defénsi, gratiárum tibi réferant actiónem. Per Christum, Dóminum nostrum. ℟. Amen.", "Hear our prayers, O Lord, and graciously accompany the journey of Your servants; and as You are everywhere, so everywhere bestow Your mercy; that, defended from all adversity by Your help, they may render You thanks. Through Christ our Lord. ℟. Amen."], ["t", "Pax et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super vos, et máneat semper. ℟. Amen.", "May the peace and blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta. Quod si unus sit peregrinaturus, Preces dicantur in numero singulari: ac si Sacerdos ipse, qui benedicit, sit socius peregrinationis, eas dicat in persona prima numeri pluralis, quatenus congruere videbitur.", "And they are sprinkled with holy water. If only one person is going on pilgrimage, the prayers are said in the singular; and if the priest who gives the blessing is himself a companion on the pilgrimage, he says them in the first person plural, so far as seems fitting."]]}, {"id": "pilgrims-returning", "la": "Benedictio Peregrinorum post Reditum", "en": "Blessing of Pilgrims after Their Return", "cat": "Work & Travel", "ref": "Tit. VIII, cap. 12", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "*Ant.* Ecce, sic benedicétur homo, qui timet Dóminum.", "*Ant.* Behold, thus shall the man be blessed who fears the Lord."], ["h", "Psalmus 127", "Psalm 127"], ["t", "Beáti omnes, qui timent Dóminum, * qui ámbulant in viis ejus.", "Blessed are all who fear the Lord, * who walk in His ways."], ["t", "Labóres mánuum tuárum quia manducábis: * beátus es, et bene tibi erit.", "For you shall eat the labors of your hands; * blessed are you, and it shall be well with you."], ["t", "Uxor tua sicut vitis abúndans, * in latéribus domus tuæ.", "Your wife shall be like a fruitful vine * on the sides of your house."], ["t", "Fílii tui sicut novéllæ olivárum, * in circúitu mensæ tuæ.", "Your children like olive shoots * round about your table."], ["t", "Ecce, sic benedicétur homo, * qui timet Dóminum.", "Behold, thus shall the man be blessed * who fears the Lord."], ["t", "Benedícat tibi Dóminus ex Sion: * et vídeas bona Jerúsalem ómnibus diébus vitæ tuæ.", "May the Lord bless you out of Sion, * and may you see the good things of Jerusalem all the days of your life."], ["t", "Et vídeas fílios filiórum tuórum, * pacem super Israël.", "And may you see your children's children, * peace upon Israel."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* Ecce, sic benedicétur homo, qui timet Dóminum.", "*Ant.* Behold, thus shall the man be blessed who fears the Lord."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Benedícti, qui véniunt in nómine Dómini.", "Blessed are they who come in the name of the Lord."], ["x", "Benedícti vos a Dómino, qui fecit cælum et terram.", "Blessed are you by the Lord, who made heaven and earth."], ["v", "Réspice, Dómine, in servos tuos, et in ópera tua.", "Look, O Lord, upon Your servants and upon Your works,"], ["x", "Et dírige eos in viam mandatórum tuórum.", "And guide them in the way of Your commandments."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Largíre, quǽsumus, Dómine, fámulis tuis indulgéntiam placátus et pacem: ut páriter ab ómnibus mundéntur offénsis, et secúra tibi mente desérviant.", "Graciously grant to Your servants, O Lord, we beseech You, pardon and peace, that they may be cleansed from all their offenses and serve You with a quiet mind."], ["t", "Omnípotens sempitérne Deus, nostrórum témporum vitǽque dispósitor, fámulis tuis contínuæ tranquillitátis largíre subsídium: ut, quos incólumes própriis labóribus reddidísti, tua fácias protectióne secúros.", "Almighty, everlasting God, who order our times and our lives, grant Your servants the help of lasting peace; that those whom You have restored unharmed to their own labors You may make secure under Your protection."], ["t", "Deus, humílium visitátor, qui nos fratérna dilectióne consoláris: præténde societáti nostræ grátiam tuam; ut per eos, in quibus hábitas, tuum in nobis sentiámus advéntum. Per Dóminum nostrum Jesum Christum. ℟. Amen.", "O God, who visit the lowly and console us with brotherly love: extend Your grace to our fellowship, that through those in whom You dwell we may feel Your coming among us. Through our Lord Jesus Christ. ℟. Amen."], ["t", "Pax et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super vos, et máneat semper. ℟. Amen.", "May the peace and blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "easter-lamb", "la": "Benedictio Agni", "en": "Blessing of Lamb (at Easter)", "cat": "Food & Drink", "ref": "Tit. VIII, cap. 13", "b": [["n", "", "Chapters 13–18 are grouped in the Rituale under the heading \"Blessings of Foods, especially at Easter.\""], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui per fámulum tuum Móysen, in liberatióne pópuli tui de Ægýpto, agnum occídi jussísti in similitúdinem Dómini nostri Jesu Christi, et utrósque postes domórum de sánguine ejúsdem agni perúngi præcepísti: tu bene✠dícere, et sanctificáre dignéris hanc creatúram carnis, quam nos fámuli tui ad laudem tuam súmere desiderámus, per resurrectiónem ejúsdem Dómini nostri Jesu Christi: Qui tecum vivit et regnat in sǽcula sæculórum. ℟. Amen.", "O God, who through Your servant Moses, at the deliverance of Your people from Egypt, commanded a lamb to be slain as a figure of our Lord Jesus Christ, and ordered both doorposts of the houses to be anointed with its blood: deign to ✠ bless and sanctify this meat, which we Your servants desire to eat to Your praise, through the resurrection of the same Lord Jesus Christ, who lives and reigns with You for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "easter-eggs", "la": "Benedictio Ovorum", "en": "Blessing of Eggs", "cat": "Food & Drink", "ref": "Tit. VIII, cap. 14", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Subvéniat, quǽsumus, Dómine, tuæ bene✠dictiónis grátia huic ovórum creatúræ: ut cibus salúbris fiat fidélibus tuis, in tuárum gratiárum actióne suméntibus, ob resurrectiónem Dómini nostri Jesu Christi: Qui tecum vivit et regnat in sǽcula sæculórum. ℟. Amen.", "May the grace of Your ✠ blessing, we beseech You, O Lord, come upon these eggs, that they may be wholesome food for Your faithful who eat them in thanksgiving for the resurrection of our Lord Jesus Christ, who lives and reigns with You for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "bread", "la": "Benedictio Panis", "en": "Blessing of Bread", "cat": "Food & Drink", "ref": "Tit. VIII, cap. 15", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, panis Angelórum, panis vivus ætérnæ vitæ, bene✠dícere dignáre panem istum, sicut benedixísti quinque panes in desérto: ut omnes ex eo gustántes, inde córporis et ánimæ percípiant sanitátem: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, bread of Angels, living bread of eternal life, deign to ✠ bless this bread as You blessed the five loaves in the desert, that all who taste of it may receive from it health of body and soul: who live and reign for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "bread-another", "la": "Alia Benedictio Panis", "en": "Another Blessing of Bread", "cat": "Food & Drink", "ref": "Tit. VIII, cap. 16", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine sancte, Pater omnípotens, ætérne Deus, bene✠dícere dignéris hunc panem tua sancta spirituáli benedictióne: ut sit ómnibus suméntibus salus mentis et córporis; atque contra omnes morbos, et univérsas inimicórum insídias tutámen. Per Dóminum nostrum Jesum Christum, Fílium tuum, panem vivum, qui de cælo descéndit, et dat vitam et salútem mundo: et tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Holy Lord, Father almighty, everlasting God, deign to ✠ bless this bread with Your holy, spiritual blessing, that it may be for all who eat it health of mind and body, and a protection against all sickness and every snare of the enemy. Through our Lord Jesus Christ, Your Son, the living bread who came down from heaven and gives life and salvation to the world, and who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "new-fruits", "la": "Benedictio Novorum Fructuum", "en": "Blessing of New Fruits", "cat": "Food & Drink", "ref": "Tit. VIII, cap. 17", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, hos novos fructus N., et præsta: ut, qui ex eis in tuo sancto nómine vescéntur, córporis et ánimæ salúte potiántur. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, these new fruits N., and grant that those who eat of them in Your holy name may obtain health of body and soul. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "any-food", "la": "Benedictio ad quodcumque Comestibile", "en": "Blessing of Any Kind of Food", "cat": "Food & Drink", "ref": "Tit. VIII, cap. 18", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, creatúram istam N., ut sit remédium salutáre géneri humáno: et præsta per invocatiónem sancti nóminis tui: ut quicúmque ex ea sumpserint, córporis sanitátem, et ánimæ tutélam percípiant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, this creature N., that it may be a saving remedy for mankind; and grant, through the invocation of Your holy name, that all who partake of it may receive health of body and protection of soul. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "oil", "la": "Benedictio Olei", "en": "Blessing of Oil", "cat": "General", "ref": "Tit. VIII, cap. 19", "b": [["n", "", "This is a blessing of ordinary olive oil for the devotional use of the faithful; it is not one of the holy oils consecrated by the bishop on Holy Thursday."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["h", "Exorcismus", "Exorcism"], ["t", "Exorcízo te, creatúra ólei, per Deum ✠ Patrem omnipoténtem, qui fecit cælum et terram, mare, et ómnia, quæ in eis sunt. Omnis virtus adversárii, omnis exércitus diáboli, et omnis incúrsus, omne phantásma sátanæ eradicáre, et effugáre ab hac creatúra ólei, ut fiat ómnibus, qui eo usúri sunt, salus mentis et córporis, in nómine Dei ✠ Patris omnipoténtis, et Jesu ✠ Christi Fílii ejus Dómini nostri, et Spíritus ✠ Sancti Parácliti, et in caritáte ejúsdem Dómini nostri Jesu Christi, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, creature of oil, by God the ✠ Father almighty, who made heaven and earth and the sea and all that is in them. May all the power of the adversary, all the host of the devil, every assault and every phantom of Satan be uprooted and put to flight from this creature of oil, that it may become for all who use it health of mind and body, in the name of God the ✠ Father almighty, and of Jesus ✠ Christ His Son our Lord, and of the Holy ✠ Spirit the Paraclete, and in the love of the same Lord Jesus Christ, who will come to judge the living and the dead and the world by fire. ℟. Amen."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus omnípotens, cui astat exércitus Angelórum cum tremóre, quorum servítium spirituále cognóscitur, dignáre respícere, bene✠dícere, et sancti✠ficáre hanc creatúram ólei, quam ex olivárum succo eduxísti, et ex eo infírmos inúngi mandásti, quátenus sanitáte percépta, tibi Deo vivo et vero grátias ágerent: præsta, quǽsumus; ut hi, qui hoc óleo, quod in tuo nómine bene✠dícimus, usi fúerint, ab omni languóre, omníque infirmitáte, atque cunctis insídiis inimíci liberéntur, et cunctæ adversitátes separéntur a plásmate tuo, quod pretióso sánguine Fílii tui redemísti, ut numquam lædátur a morsu antíqui serpéntis. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God almighty, before whom the hosts of Angels stand in awe, and whose spiritual service is acknowledged, deign to look upon, ✠ bless, and ✠ sanctify this creature of oil, which You have drawn from the juice of olives and with which You commanded the sick to be anointed, so that, having recovered their health, they might give thanks to You, the living and true God. Grant, we beseech You, that those who use this oil, which we ✠ bless in Your name, may be delivered from all weakness, from every illness, and from all the snares of the enemy; and may every adversity be kept far from Your creature, whom You have redeemed by the precious blood of Your Son, that he may never be harmed by the bite of the ancient serpent. Through the same Jesus Christ, Your Son, our Lord, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "vestments", "la": "Benedictio Sacerdotalium Indumentorum", "en": "Blessing of Priestly Vestments", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 20", "b": [["n", "", "Chapters 20–25 are headed in the Rituale \"Blessings to be given by bishops or by others who have the faculty.\""], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui per Móysen fámulum tuum pontificália, et sacerdotália, seu levítica vestiménta, ad expléndum in conspéctu tuo ministérium eórum, ad honórem et decórem nóminis tui fíeri decrevísti: adésto propítius invocatiónibus nostris: ut hæc induménta sacerdotália (hoc induméntum sacerdotále), désuper irrigánte grátia tua, ingénti benedictióne per nostræ humilitátis servítium purificáre, bene✠dícere, et conse✠cráre dignéris: ut divínis cúltibus et sacris mystériis apta et benedícta exsístant (aptum et benedíctum exsístat): his quoque sacris véstibus (hac quoque sacra veste) Pontífices, et Sacerdótes, seu Levítæ tui indúti, ab ómnibus impulsiónibus, seu tentatiónibus malignórum spirítuum muníti et defénsi esse mereántur: tuísque mystériis apte et condígne servíre et inhærére, atque in his tibi plácite et devóte perseveráre tríbue. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who through Your servant Moses decreed that vestments for the high priests, priests, and Levites be made, for the fulfilling of their ministry in Your sight and for the honor and beauty of Your name: graciously hear our prayers, and deign, with the dew of Your grace from above, through the service of our lowliness, to purify, ✠ bless, and ✠ consecrate these priestly vestments (this priestly vestment) with an abundant blessing, so that they may be (it may be) fit and blessed for divine worship and the sacred mysteries. Grant also that Your bishops, priests, and deacons clothed in these sacred garments (this sacred garment) may be fortified and defended against all the assaults and temptations of evil spirits, and that they may fittingly and worthily serve and cleave to Your mysteries, and persevere in them pleasingly and devoutly before You. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus invíctæ virtútis triumphátor, et ómnium rerum creátor ac sanctificátor: inténde propítius preces nostras; et hæc induménta (hoc induméntum) levítica, sacerdotális, et pontificális glóriæ, minístris tuis fruénda (fruéndum), tuo ore próprio bene✠dícere, sancti✠ficáre, et conse✠cráre dignéris: omnésque eis (eo) uténtes, tuis mystériis aptos, et tibi in eis devóte ac laudabíliter serviéntes, gratos effícere dignéris. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, triumphant in unconquered power, Creator and Sanctifier of all things: graciously attend to our prayers, and deign by Your own word to ✠ bless, ✠ sanctify, and ✠ consecrate these vestments (this vestment) of levitical, priestly, and pontifical dignity, to be used by Your ministers; and deign to make all who use them fit for Your mysteries and pleasing to You as they serve You in them devoutly and worthily. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus omnípotens, qui vestiménta Pontifícibus, Sacerdótibus, et Levítis in usum tabernáculi fœ́deris necessária, Móysen fámulum tuum ágere jussísti, eúmque spíritu sapiéntiæ ad id peragéndum replevísti: hæc vestiménta (hoc vestiméntum) in usum et cultum mystérii tui bene✠dícere, sancti✠ficáre, et conse✠cráre dignéris: atque minístros altáris tui, qui ea (id) indúerint, septifórmis Spíritus grátia dignánter repléri, atque castitátis stola, beáta fácias cum bonórum fructu óperum ministérii congruéntis immortalitáte vestíri. Per Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God almighty, who commanded Your servant Moses to make the vestments needed by the high priests, priests, and Levites for the service of the tabernacle of the covenant, and filled him with the spirit of wisdom to accomplish it: deign to ✠ bless, ✠ sanctify, and ✠ consecrate these vestments (this vestment) for the use and worship of Your mystery; and graciously fill the ministers of Your altar who wear them with the grace of the sevenfold Spirit, and clothe them with the robe of chastity and, with the fruit of good works befitting their ministry, with blessed immortality. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur (aspergatur) aqua benedicta.", "And they are (it is) sprinkled with holy water."]]}, {"id": "altar-linens", "la": "Benedictio Mapparum seu Tobalearum Altaris", "en": "Blessing of Altar Cloths", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 21", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi, Dómine, preces nostras: et hæc linteámina (hoc linteámen), sacri Altáris úsui præparáta (præparátum), bene✠dícere, et sancti✠ficáre dignéris. Per Christum, Dóminum nostrum. ℟. Amen.", "Hear our prayers, O Lord, and deign to ✠ bless and ✠ sanctify these linens (this linen) prepared for the use of the holy altar. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus omnípotens, qui Móysen fámulum tuum ornaménta et linteámina fácere per quadragínta dies docuísti, quæ étiam María téxuit, et fecit in usum ministérii tabernáculi fœ́deris; bene✠dícere, sancti✠ficáre, et conse✠cráre dignéris hæc linteámina (hoc linteámen) ad tegéndum involvendúmque altáre gloriosíssimi Fílii tui Dómini nostri Jesu Christi: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God almighty, who during forty days taught Your servant Moses to make the ornaments and linens which Miriam also wove and made for the service of the tabernacle of the covenant: deign to ✠ bless, ✠ sanctify, and ✠ consecrate these linens (this linen) for covering and enfolding the altar of Your most glorious Son, our Lord Jesus Christ, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur (aspergatur) aqua benedicta.", "And they are (it is) sprinkled with holy water."]]}, {"id": "pall-corporal", "la": "Benedictio Pallæ et Corporalis", "en": "Blessing of a Pall and Corporal", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 22", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Clementíssime Dómine, cujus inenarrábilis est virtus, cujus mystéria arcánis mirabílibus celebrántur: tríbue, quǽsumus; ut hoc linteámen tuæ propitiatiónis bene✠dictióne sanctificétur ad consecrándum super illud Corpus et Sánguinem Dei et Dómini nostri Jesu Christi, Fílii tui: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Most merciful Lord, whose power is beyond words and whose mysteries are celebrated with hidden wonders: grant, we beseech You, that this linen may be sanctified by the ✠ blessing of Your favor, for the consecrating upon it of the Body and Blood of our God and Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, bene✠dícere, sancti✠ficáre, et conse✠cráre dignéris linteámen istud ad tegéndum involvendúmque Corpus et Sánguinem Dómini nostri Jesu Christi, Fílii tui: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, deign to ✠ bless, ✠ sanctify, and ✠ consecrate this linen for covering and enfolding the Body and Blood of our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens Deus, mánibus nostris opem tuæ benedictiónis infúnde: ut per nostram bene✠dictiónem hoc linteámen sanctificétur, et Córporis ac Sánguinis Redemptóris nostri novum sudárium, Spíritus Sancti grátia efficiátur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty God, pour the help of Your blessing into our hands, that through our ✠ blessing this linen may be sanctified and, by the grace of the Holy Spirit, become a new shroud for the Body and Blood of our Redeemer. Through the same Jesus Christ, Your Son, our Lord, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "tabernacle", "la": "Benedictio Tabernaculi seu Vasculi pro sacrosancta Eucharistia conservanda", "en": "Blessing of a Tabernacle or Vessel for Reserving the Holy Eucharist", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 23", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, majestátem tuam súpplices deprecámur: ut tabernáculum (seu vásculum) hoc pro Córpore Fílii tui, Dómini nostri Jesu Christi, in eo condéndo fabricátum, bene✠dictiónis tuæ grátia dicáre dignéris. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, we humbly entreat Your majesty that You would deign by the grace of Your ✠ blessing to dedicate this tabernacle (or vessel), made for reserving within it the Body of Your Son, our Lord Jesus Christ. Through the same Jesus Christ, Your Son, our Lord, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "cornerstone", "la": "Ritus Benedicendi et Imponendi Primarium Lapidem pro Ecclesia ædificanda", "en": "Blessing and Laying of the Cornerstone of a Church", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 26", "b": [["r", "1. Nulla ecclesia ædificetur sine expresso Ordinarii loci consensu scriptis dato, quem tamen Vicarius Generalis præstare nequit sine mandato speciali. Si Sacerdos, ejus ædificationis primarium lapidem benedicendi potestatem habens ab Ordinario, ejusmodi functionem peragat, hunc ritum servabit.", "1. No church is to be built without the express written consent of the local Ordinary, which the Vicar General may not give without a special mandate. If a priest who has received from the Ordinary the faculty to bless the cornerstone of such a building performs this function, he shall observe the following rite."], ["r", "2. Pridie quam primarius lapis benedicatur, ligneam Crucem in loco, ubi debet esse Altare, figat ipse, vel alius Sacerdos. Sequenti vero die lapis in ecclesiæ fundatione ponendus, qui debet esse quadratus, et angularis, benedicatur hoc modo.", "2. On the day before the cornerstone is blessed, he himself or another priest sets up a wooden cross on the spot where the altar is to be. On the following day the stone to be laid in the foundation of the church, which should be square and a corner stone, is blessed in this manner."], ["r", "3. Sacerdos indutus amictu, alba, cingulo, stola et pluviali albi coloris, adhibitis aliquot Clericis, sal et aquam benedicit, nisi prius in promptu habeat aquam jam benedictam, ordinaria benedictione, et interim, dum cantatur a Clericis Antiphona cum Psalmo sequenti, aspergit locum, ubi Crux posita est, aqua benedicta.", "3. The priest, vested in amice, alb, cincture, stole, and white cope, and attended by several clerics, blesses salt and water (unless he already has water blessed with the ordinary blessing at hand); and meanwhile, while the clerics sing the following antiphon and psalm, he sprinkles with holy water the place where the cross has been set up."], ["t", "*Ant.* Signum salútis pone, Dómine Jesu Christe, in loco isto: et non permíttas introíre Ángelum percutiéntem.", "*Ant.* Set the sign of salvation, Lord Jesus Christ, in this place, and do not allow the destroying Angel to enter."], ["h", "Psalmus 83", "Psalm 83"], ["t", "Quam dilécta tabernácula tua, Dómine virtútum! * concupíscit, et déficit ánima mea in átria Dómini.", "How lovely are Your dwellings, O Lord of hosts! * My soul longs and faints for the courts of the Lord."], ["t", "Cor meum, et caro mea * exsultavérunt in Deum vivum.", "My heart and my flesh * have rejoiced in the living God."], ["t", "Étenim passer invénit sibi domum: * et turtur nidum sibi, ubi ponat pullos suos.", "For the sparrow has found herself a house, * and the turtledove a nest where she may lay her young:"], ["t", "Altária tua, Dómine virtútum: * Rex meus, et Deus meus.", "Your altars, O Lord of hosts, * my King and my God."], ["t", "Beáti, qui hábitant in domo tua, Dómine: * in sǽcula sæculórum laudábunt te.", "Blessed are they who dwell in Your house, O Lord; * they shall praise You for ever and ever."], ["t", "Beátus vir, cujus est auxílium abs te: * ascensiónes in corde suo dispósuit, in valle lacrimárum in loco, quem pósuit.", "Blessed is the man whose help is from You; * he has set ascents in his heart, in the vale of tears, in the place which He has appointed."], ["t", "Étenim benedictiónem dabit legislátor, ibunt de virtúte in virtútem: * vidébitur Deus deórum in Sion.", "For the lawgiver shall give a blessing; they shall go from strength to strength; * the God of gods shall be seen in Sion."], ["t", "Dómine, Deus virtútum, exáudi oratiónem meam: * áuribus pércipe, Deus Jacob.", "O Lord God of hosts, hear my prayer; * give ear, O God of Jacob."], ["t", "Protéctor noster, áspice, Deus: * et réspice in fáciem Christi tui.", "Behold, O God our protector, * and look upon the face of Your Anointed."], ["t", "Quia mélior est dies una in átriis tuis * super míllia.", "For better is one day in Your courts * than a thousand elsewhere."], ["t", "Elégi abjéctus esse in domo Dei mei: * magis quam habitáre in tabernáculis peccatórum.", "I have chosen to be lowly in the house of my God * rather than to dwell in the tents of sinners."], ["t", "Quia misericórdiam, et veritátem díligit Deus: * grátiam et glóriam dabit Dóminus.", "For God loves mercy and truth; * the Lord will give grace and glory."], ["t", "Non privábit bonis eos, qui ámbulant in innocéntia: * Dómine virtútum, beátus homo, qui sperat in te.", "He will not deprive of good things those who walk in innocence. * O Lord of hosts, blessed is the man who hopes in You."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* Signum salútis pone, Dómine Jesu Christe, in loco isto: et non permíttas introíre Ángelum percutiéntem.", "*Ant.* Set the sign of salvation, Lord Jesus Christ, in this place, and do not allow the destroying Angel to enter."], ["r", "4. Finito Psalmo, Sacerdos versus ad locum a se aspersum, dicit:", "4. When the psalm is finished, the priest, turning toward the place he has sprinkled, says:"], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus, qui licet cælo et terra non capiáris, domum tamen dignáris habére in terris, ubi nomen tuum júgiter invocétur; locum hunc, quǽsumus, beátæ Maríæ semper Vírginis, et beáti N. *(nominando Sanctum vel Sanctam, in cujus honorem ac nomen fundabitur ecclesia)*, omniúmque Sanctórum intercedéntibus méritis, seréno pietátis tuæ intúitu vísita, et per infusiónem grátiæ tuæ ab omni inquinaménto purífica, purificatúmque consérva; et qui dilécti tui David devotiónem in fílii sui Salomónis ópere complevísti, in hoc ópere desidéria nostra perfícere dignéris, effugiántque omnes hinc nequítiæ spirituáles. Per Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God, who, though heaven and earth cannot contain You, yet deign to have a house on earth where Your name may be called upon without ceasing: through the interceding merits of blessed Mary ever Virgin, of blessed N. *(naming the Saint in whose honor and name the church will be founded)*, and of all the Saints, visit this place, we beseech You, with the serene gaze of Your kindness; by the outpouring of Your grace cleanse it from every defilement and keep it clean; and as You brought to completion the devotion of Your beloved David in the work of his son Solomon, so deign to fulfill our desires in this work, and let all spiritual wickedness flee from here. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "5. Postea stans benedicit primarium lapidem, dicens:", "5. Then, standing, he blesses the cornerstone, saying:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Sit nomen Dómini benedíctum.", "Blessed be the name of the Lord."], ["x", "Ex hoc nunc et usque in sǽculum.", "From this time forth and for evermore."], ["v", "Lápidem, quem reprobavérunt ædificántes.", "The stone which the builders rejected"], ["x", "Hic factus est in caput ánguli.", "Has become the head of the corner."], ["v", "Tu es Petrus.", "You are Peter,"], ["x", "Et super hanc petram ædificábo Ecclésiam meam.", "And upon this rock I will build My Church."], ["t", "Glória Patri, et Fílio, et Spirítui Sancto. Sicut erat in princípio, et nunc, et semper, et in sǽcula sæculórum. Amen.", "Glory be to the Father, and to the Son, and to the Holy Spirit. As it was in the beginning, is now, and ever shall be, world without end. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, qui es verus omnípotens Deus, splendor, et imágo ætérni Patris, et vita ætérna: qui es lapis anguláris de monte sine mánibus abscíssus, et immutábile fundaméntum: hunc lápidem collocándum in tuo nómine confírma; et tu, qui es princípium et finis, in quo princípio Deus Pater ab inítio cuncta creávit, sis, quǽsumus, princípium, et increméntum, et consummátio ipsíus óperis, quod debet ad laudem et glóriam tui nóminis inchoári: Qui cum Patre et Spíritu Sancto vivis et regnas Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, true and almighty God, the brightness and image of the eternal Father, and eternal life; You who are the corner stone cut from the mountain without hands, and the unchangeable foundation: make firm this stone that is to be laid in Your name; and You, who are the beginning and the end, the Beginning in whom God the Father created all things at the first, be, we beseech You, the beginning, the growth, and the completion of this work, which is to be begun for the praise and glory of Your name: who with the Father and the Holy Spirit live and reign, God, for ever and ever. ℟. Amen."], ["r", "6. Tunc aspergit lapidem ipsum aqua benedicta, et, accepto cultro, per singulas partes sculpit in eo signum crucis, dicens:", "6. Then he sprinkles the stone with holy water and, taking a knife, cuts the sign of the cross on each of its sides, saying:"], ["t", "In nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti. ℟. Amen.", "In the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit. ℟. Amen."], ["r", "Quo facto dicit:", "When this is done he says:"], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, creatúram istam lápidis, et præsta per invocatiónem sancti tui nóminis: ut, quicúmque ad hanc ecclésiam ædificándam pura mente auxílium déderint, córporis sanitátem, et ánimæ medélam percípiant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, this stone, and grant through the invocation of Your holy name that all who with a pure intention give their help toward building this church may receive health of body and healing of soul. Through Christ our Lord. ℟. Amen."], ["r", "7. Postea dicantur Litaniæ ordinariæ sine Orationibus in fine positis.", "7. Then the ordinary Litany of the Saints is said, without the prayers placed at its end."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis.
