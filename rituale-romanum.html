 tuum da nobis.", "And grant us Your salvation."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, humáni géneris Salvátor, hunc hábitum, quem propter tuum tuǽque Genetrícis Vírginis Maríæ de Monte Carmélo amórem servus tuus (ancílla tua) devóte est delatúrus (-a), déxtera tua sancti✠fica, ut eádem Genetríce tua intercedénte, ab hoste malígno defénsus (-a) in tua grátia usque ad mortem persevéret: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Savior of mankind, with Your right hand ✠ sanctify this habit, which Your servant (handmaid) will devoutly wear for love of You and of Your Mother, the Virgin Mary of Mount Carmel; so that, by the intercession of Your same Mother, he (she) may be defended from the evil enemy and persevere in Your grace until death. Who live and reign for ever and ever. ℟. Amen."], ["r", "Deinde aspergat Habitum aqua benedicta, et postea illum imponat personæ, vel personis (cuilibet separatim), dicens:", "Then he sprinkles the habit with holy water, and afterward places it upon the person or persons (each one separately), saying:"], ["t", "Accipe hunc hábitum benedíctum precans sanctíssimam Vírginem, ut ejus méritis illum pérferas sine mácula, et te ab omni adversitáte deféndat, atque ad vitam perdúcat ætérnam. ℟. Amen.", "Receive this blessed habit, asking the most holy Virgin that by her merits you may wear it without stain, and that she may defend you from all adversity and lead you to life everlasting. ℟. Amen."], ["r", "Postea subjungat:", "Then he adds:"], ["t", "Ego, ex potestáte mihi concéssa, recípio te (vos) ad participatiónem ómnium bonórum spirituálium, quæ, cooperánte misericórdia Jesu Christi, a Religiósis de Monte Carmélo peragúntur. In nómine Patris, et Fílii, et Spíritus Sancti. ℟. Amen.", "By the power granted to me, I receive you to a share in all the spiritual goods which, with the help of the mercy of Jesus Christ, are performed by the Religious of Mount Carmel. In the name of the Father, and of the Son, and of the Holy Spirit. ℟. Amen."], ["t", "Bene✠dícat te (vos) Cónditor cæli et terræ, Deus omnípotens, qui te (vos) cooptáre dignátus est in Confraternitátem beátæ Maríæ Vírginis de Monte Carmélo: quam exorámus, ut in hora óbitus tui (vestri) cónterat caput serpéntis antíqui, atque palmam et corónam sempitérnæ hereditátis tandem consequáris (consequámini). Per Christum, Dóminum nostrum. ℟. Amen.", "May the Creator of heaven and earth, God almighty, who has deigned to admit you into the Confraternity of the Blessed Virgin Mary of Mount Carmel, ✠ bless you; and may she, we beseech, crush at the hour of your death the head of the ancient serpent, so that you may at last win the palm and the crown of the everlasting inheritance. Through Christ our Lord. ℟. Amen."], ["r", "Aspergatur persona aqua benedicta. Si plures simul recipiendi sint, mutetur numerus. Si Habitus solummodo benedicendus sit, tunc benedictio incipit a ℣. Osténde, et concluditur cum Oratione Dómine Jesu Christe.", "The person is sprinkled with holy water. If several are received together, the number is changed. If the habit is only to be blessed, the blessing begins with ℣. \"Show us\" and ends with the prayer \"Lord Jesus Christ.\""]]}, {"id": "miraculous-medal", "la": "Benedictio et Impositio Sacri Numismatis B. M. V. Immaculatæ (Médaille miraculeuse)", "en": "Blessing and Imposition of the Miraculous Medal", "cat": "Objects of Devotion", "ref": "Appendix, Benedictiones propriæ (Congr. Missionis)", "b": [["r", "Sacerdos benedicturus sacrum Numisma immaculatæ Virginis Mariæ Conceptionis, superpelliceo et stola alba indutus, dicit:", "The priest who is to bless the sacred Medal of the Immaculate Conception of the Virgin Mary, vested in surplice and white stole, says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et miséricors Deus, qui per multíplices immaculátæ Maríæ Vírginis apparitiónes in terris mirabília júgiter pro animárum salúte operári dignátus es: super hoc numísmatis signum, tuam bene✠dictiónem benígnus infúnde; ut pie hoc recoléntes ac devóte gestántes et illíus patrocínium séntiant et tuam misericórdiam consequántur. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty and merciful God, who through the many apparitions on earth of the immaculate Virgin Mary have deigned to work wonders continually for the salvation of souls: graciously pour Your ✠ blessing upon this medal, so that those who piously remember its meaning and devoutly wear it may feel her protection and obtain Your mercy. Through Christ our Lord. ℟. Amen."], ["r", "Deinde Numisma aspergit aqua benedicta, et ipsum postea imponens dicit, si uni tantum imponatur:", "Then he sprinkles the medal with holy water, and afterward, placing it on the person, says, if it is given to one only:"], ["t", "Accipe sanctum Numísma, gesta fidéliter, et digna veneratióne proséquere: ut piíssima et immaculáta cælórum Dómina te prótegat atque deféndat; et pietátis suæ prodígia rénovans, quæ a Deo supplíciter postuláveris, tibi misericórditer ímpetret, ut vivens ac móriens in matérno ejus ampléxu felíciter requiéscas. Amen.", "Receive this holy medal; wear it faithfully and honor it with fitting reverence, so that the most loving and immaculate Queen of heaven may protect and defend you; and, renewing the wonders of her goodness, may mercifully obtain for you whatever you humbly ask of God, so that, living and dying, you may rest happily in her motherly embrace. Amen."], ["r", "Si vero pluribus imponatur, dicit:", "If it is given to several, he says:"], ["t", "Accípite sanctum Numísma, gestáte fidéliter, et digna veneratióne prosequímini: ut piíssima et immaculáta cælórum Dómina vos prótegat atque deféndat; et pietátis suæ prodígia rénovans, quæ a Deo supplíciter postulavéritis, vobis misericórditer ímpetret, ut vivéntes ac moriéntes in matérno ejus ampléxu felíciter requiescátis. Amen.", "Receive this holy medal; wear it faithfully and honor it with fitting reverence, so that the most loving and immaculate Queen of heaven may protect and defend you; and, renewing the wonders of her goodness, may mercifully obtain for you whatever you humbly ask of God, so that, living and dying, you may rest happily in her motherly embrace. Amen."], ["r", "Inde prosequitur:", "He then continues:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Regína sine labe origináli concépta.", "Queen conceived without original sin,"], ["x", "Ora pro nobis.", "Pray for us."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui beatíssimam Vírginem Maríam matrem tuam ab orígine immaculátam innúmeris miráculis claréscere voluísti: concéde; ut ejúsdem patrocínium semper implorántes, gáudia consequámur ætérna: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who willed that the most blessed Virgin Mary, Your Mother, immaculate from her origin, should become renowned through countless miracles: grant that, always imploring her protection, we may attain everlasting joys. Who live and reign for ever and ever. ℟. Amen."]]}, {"id": "st-benedict-medal", "la": "Benedictio Numismatum S. Benedicti", "en": "Blessing of St. Benedict Medals", "cat": "Objects of Devotion", "ref": "Appendix, Benedictiones propriæ (Ord. S. Benedicti)", "b": [["r", "Sacerdos benedicturus numismata sancti Benedicti, dicit:", "The priest who is to bless medals of St. Benedict says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "Exorcízo vos, numísmata, per Deum ✠ Patrem omnipoténtem, qui fecit cælum et terram, mare et ómnia, quæ in eis sunt. Omnis virtus adversárii, omnis exércitus diáboli, et omnis incúrsus, omne phantásma sátanæ, eradicáre et effugáre ab his numismátibus: ut fiant ómnibus, qui eis usúri sunt, salus mentis et córporis: in nómine Pa✠tris omnipoténtis, et Jesu ✠ Christi Fílii ejus, Dómini nostri, et Spíritus ✠ Sancti Parácliti, et in caritáte ejúsdem Dómini nostri Jesu Christi, qui ventúrus est judicáre vivos et mórtuos, et sǽculum per ignem. ℟. Amen.", "I exorcise you, medals, by God the ✠ Father almighty, who made heaven and earth, the sea, and all that is in them. May every power of the adversary, every host of the devil, every assault and every phantom of Satan be uprooted and put to flight from these medals, so that they may be health of mind and body to all who will use them: in the name of the ✠ Father almighty, and of Jesus ✠ Christ, His Son, our Lord, and of the Holy ✠ Spirit, the Paraclete, and in the love of the same Jesus Christ our Lord, who is to come to judge the living and the dead, and the world by fire. ℟. Amen."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants."], ["x", "Deus meus, sperántes in te.", "Who hope in You, O my God."], ["v", "Esto nobis, Dómine, turris fortitúdinis.", "Be to us, O Lord, a tower of strength."], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Dóminus virtútem pópulo suo dabit.", "The Lord will give strength to His people."], ["x", "Dóminus benedícet pópulum suum in pace.", "The Lord will bless His people with peace."], ["v", "Mitte nobis, Dómine, auxílium de sancto.", "Send us help, O Lord, from Your holy place."], ["x", "Et de Sion tuére nos.", "And defend us out of Sion."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus omnípotens, bonórum ómnium largítor, súpplices te rogámus, ut per intercessiónem sancti Benedícti, his sacris numismátibus, lítteris ac charactéribus a te designátis, tuam bene✠dictiónem infúndas: ut omnes, qui ea gestáverint ac bonis opéribus inténti fúerint, sanitátem mentis et córporis, et grátiam sanctificatiónis, atque indulgéntias (nobis) concéssas cónsequi mereántur; omnésque diáboli insídias et fraudes, per auxílium misericórdiæ tuæ, effúgere váleant, et in conspéctu tuo sancti et immaculáti appáreant. ℟. Amen.", "Almighty God, giver of all good things, we humbly beseech You, through the intercession of Saint Benedict, to pour out Your ✠ blessing upon these sacred medals, marked with the letters and signs designated by You; so that all who wear them and devote themselves to good works may be worthy to obtain health of mind and body, the grace of sanctification, and the indulgences granted (to us); and that by the help of Your mercy they may escape all the snares and deceits of the devil, and appear holy and spotless in Your sight. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui voluísti pro totíus mundi redemptióne de Vírgine nasci, circumcídi, a Judǽis reprobári, Judæ ósculo tradi, vínculis alligári, spinis coronári, clavis perforári, inter latrónes crucifígi, láncea vulnerári, et tandem in Cruce mori: per hanc tuam sanctíssimam passiónem humíliter exóro; ut omnes diabólicas insídias et fraudes expéllas ab eo, qui nomen sanctum tuum, his lítteris ac charactéribus a te designátis, devóte invocáverit, et eum ad salútis portum perdúcere dignéris: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who for the redemption of the whole world willed to be born of a Virgin, to be circumcised, rejected by the Jews, betrayed by the kiss of Judas, bound with chains, crowned with thorns, pierced with nails, crucified between thieves, wounded with a lance, and at last to die on the Cross: by this Your most holy Passion I humbly pray that You would drive away all the snares and deceits of the devil from whoever devoutly calls on Your holy name with these letters and signs designated by You, and deign to bring him to the harbor of salvation. Who live and reign for ever and ever. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super hæc numísmata, ac ea gestántes, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon these medals and those who wear them, and remain for ever. ℟. Amen."], ["r", "Deinde Sacerdos aspergit numismata aqua benedicta.", "Then the priest sprinkles the medals with holy water."], ["h", "Formula brevior benedicendi numismata S. Benedicti", "Shorter form for blessing St. Benedict medals"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["r", "Exorcízo vos, numísmata, etc., ut supra, usque ad Kýrie, eléison exclusive.", "\"I exorcise you, medals,\" etc., as above, up to \"Lord, have mercy,\" exclusive."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus omnípotens, bonórum ómnium largítor, súpplices te rogámus, ut per intercessiónem sancti Benedícti his sacris numismátibus tuam bene✠dictiónem infúndas, ut omnes qui ea gestáverint ac bonis opéribus inténti fúerint, sanitátem mentis et córporis, et grátiam sanctificatiónis, atque indulgéntias (nobis) concéssas cónsequi mereántur, omnésque diáboli insídias et fraudes, per auxílium misericórdiæ tuæ, stúdeant devitáre et in conspéctu tuo sancti et immaculáti váleant apparére. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty God, giver of all good things, we humbly beseech You, through the intercession of Saint Benedict, to pour out Your ✠ blessing upon these sacred medals, so that all who wear them and devote themselves to good works may be worthy to obtain health of mind and body, the grace of sanctification, and the indulgences granted (to us); and that by the help of Your mercy they may strive to avoid all the snares and deceits of the devil, and be able to appear holy and spotless in Your sight. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "cross", "la": "Sollemnis Benedictio Crucis", "en": "Solemn Blessing of a Cross", "cat": "Objects of Devotion", "ref": "Tit. VIII, cap. 24", "b": [["r", "Si Cruces, publicæ venerationi expositæ, sollemniter benedicantur, hæc benedictio Ordinario reservatur, qui tamen potest eam cuilibet Sacerdoti committere. Privatim autem hæc benedictio a quolibet Sacerdote fieri potest sine ulla Ordinarii licentia.", "If crosses exposed for public veneration are blessed solemnly, this blessing is reserved to the Ordinary, who may, however, entrust it to any priest. Privately, however, this blessing may be given by any priest without any permission from the Ordinary."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Rogámus te, Dómine sancte, Pater omnípotens, ætérne Deus: ut dignéris bene✠dícere hoc signum Crucis, ut sit remédium salutáre géneri humáno; sit solíditas fídei, proféctus bonórum óperum, redémptio animárum; sit solámen, et protéctio, ac tutéla contra sæva jácula inimicórum. Per Christum, Dóminum nostrum. ℟. Amen.", "We beseech You, holy Lord, Father almighty, everlasting God, that You would deign to ✠ bless this sign of the Cross, that it may be a saving remedy for mankind; that it may be the steadfastness of faith, the increase of good works, the redemption of souls; and that it may be a comfort, protection, and safeguard against the cruel darts of the enemy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine Jesu Christe, hanc Crucem, per quam eripuísti mundum a potestáte dæmonum, et superásti passióne tua suggestórem peccáti, qui gaudébat in prævaricatióne primi hóminis per ligni vétiti sumptiónem. *(Hic aspergatur aqua benedicta.)* Sanctificétur hoc signum Crucis in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti; ut orántes, inclinantésque se propter Dóminum ante istam Crucem, invéniant córporis et ánimæ sanitátem. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, Lord Jesus Christ, this Cross, by which You rescued the world from the power of demons and by Your Passion overcame the tempter to sin, who rejoiced in the fall of the first man through his eating of the forbidden tree. *(Here it is sprinkled with holy water.)* May this sign of the Cross be sanctified in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit; so that those who pray and bow before this Cross for the Lord's sake may find health of body and soul. Through the same Christ our Lord. ℟. Amen."], ["r", "2. Postea Sacerdos ante Crucem genuflexus ipsam devote adorat, et osculatur, et idem faciunt quicumque voluerint.", "2. Afterward the priest, kneeling before the Cross, devoutly venerates and kisses it, and all who wish do the same."]]}, {"id": "image", "la": "Sollemnis Benedictio Imaginis Jesu Christi Domini nostri vel B. Mariæ Virginis vel alius Sancti", "en": "Solemn Blessing of an Image of Our Lord, of the Blessed Virgin Mary, or of a Saint", "cat": "Objects of Devotion", "ref": "Tit. VIII, cap. 25", "b": [["r", "Si imagines, publicæ venerationi expositæ, sollemniter benedicantur, hæc benedictio Ordinario reservatur, qui tamen potest eam cuilibet Sacerdoti committere. Privatim autem hæc benedictio a quolibet Sacerdote fieri potest sine ulla Ordinarii licentia.", "If images exposed for public veneration are blessed solemnly, this blessing is reserved to the Ordinary, who may, however, entrust it to any priest. Privately, however, this blessing may be given by any priest without any permission from the Ordinary."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui Sanctórum tuórum imágines (sive effígies) sculpi, aut pingi non réprobas, ut quóties illas óculis córporis intuémur, tóties eórum actus et sanctitátem ad imitándum memóriæ óculis meditémur: hanc, quǽsumus, imáginem (seu sculptúram) in honórem et memóriam unigéniti Fílii tui Dómini nostri Jesu Christi (vel beatíssimæ Vírginis Maríæ, Matris Dómini nostri Jesu Christi, vel beáti N. Apóstoli tui, vel Mártyris, vel Pontíficis, vel Confessóris, vel beátæ N. Vírginis, vel Mártyris) adaptátam bene✠dícere, et sancti✠ficáre dignéris: et præsta; ut quicúmque coram illa unigénitum Fílium tuum (vel beatíssimam Vírginem, vel gloriósum Apóstolum, vel Mártyrem, vel Pontíficem, vel Confessórem, vel gloriósam Vírginem, vel Mártyrem) supplíciter cólere et honoráre studúerit, illíus méritis et obténtu a te grátiam in præsénti, et ætérnam glóriam obtíneat in futúrum. Per (eúndem) Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who do not disapprove of the carving or painting of images (or likenesses) of Your Saints, so that as often as we look upon them with bodily eyes we may meditate with the eyes of memory on their deeds and holiness, in order to imitate them: deign, we beseech You, to ✠ bless and ✠ sanctify this image (or statue), made in honor and memory of Your only-begotten Son, our Lord Jesus Christ (or of the most blessed Virgin Mary, Mother of our Lord Jesus Christ; or of blessed N., Your Apostle, or Martyr, or Bishop, or Confessor; or of blessed N., Virgin, or Martyr); and grant that whoever humbly strives to worship and honor Your only-begotten Son (or the most blessed Virgin, or the glorious Apostle, Martyr, Bishop, Confessor, Virgin, or Martyr) before it may, by his (her) merits and intercession, obtain from You grace in the present life and eternal glory in the life to come. Through (the same) Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "sick-adult", "la": "Benedictio Adulti Ægrotantis", "en": "Blessing of a Sick Adult", "cat": "The Sick", "ref": "Appendix, Benedictiones non reservatæ, 41", "b": [["r", "Sacerdos cubiculum ægrotantis ingrediens dicat:", "The priest, entering the sick person's room, says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "Et continuo ad infirmum accedens subjungat:", "And going straight to the sick person, he adds:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Intróeat, Dómine Jesu Christe, domum hanc ad nostræ humilitátis ingréssum pax et misericórdia tua; effúgiat ex hoc loco omnis nequítia dæmonum, adsint Angeli pacis, domúmque hanc déserat omnis malígna discórdia. Magnífica, Dómine, super nos nomen sanctum tuum: et bénedic nostræ conversatióni: Qui sanctus et pius es, et pérmanes cum Patre et Spíritu Sancto in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, as we in our lowliness enter this house, may Your peace and mercy enter with us. Let every wickedness of the demons flee from this place; let the Angels of peace be present, and let all evil discord depart from this house. Magnify Your holy name upon us, O Lord, and bless our coming among them; who are holy and merciful, and abide with the Father and the Holy Spirit for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Réspice, Dómine, fámulum tuum (fámulam tuam) in infirmitáte córporis laborántem, et ánimam réfove quam creásti: ut castigatiónibus emendátus (-a), contínuo se séntiat tua miseratióne salvátum (-am). Per Christum, Dóminum nostrum. ℟. Amen.", "Look down, O Lord, upon Your servant, laboring under bodily illness, and revive the soul You created; so that, made better by these trials, he (she) may soon feel himself (herself) restored by Your mercy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Miséricors, Dómine, fidélium consolátor, quǽsumus imménsam pietátem tuam, ut ad intróitum humilitátis nostræ hunc fámulum tuum (hanc fámulam tuam) super lectum dolóris sui jacéntem, visitáre dignéris, sicut socrum Simónis visitásti: propítius adésto ei, Dómine, quátenus prístina sanitáte recépta, gratiárum tibi in Ecclésia tua réferat actiónes: Qui vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "O merciful Lord, consoler of the faithful, we beseech Your boundless goodness that, as we in our lowliness enter, You would deign to visit this Your servant lying on his (her) bed of pain, as You visited Simon's mother-in-law. Graciously stand by him (her), O Lord, so that, his (her) former health restored, he (she) may give thanks to You in Your Church. Who live and reign, God, for ever and ever. ℟. Amen."], ["r", "Deinde, extendens dexteram versus ægrotum, dicat:", "Then, extending his right hand toward the sick person, he says:"], ["t", "Dóminus Jesus Christus apud te sit, ut te deféndat: intra te sit, ut te consérvet: ante te sit, ut te ducat: post te sit, ut te custódiat: super te sit, ut te benedícat: Qui cum Patre et Spíritu Sancto vivit et regnat in sǽcula sæculórum. ℟. Amen.", "May the Lord Jesus Christ be with you to defend you, within you to sustain you, before you to lead you, behind you to guard you, above you to bless you; who with the Father and the Holy Spirit lives and reigns for ever and ever. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Demum aspergat infirmum aqua benedicta.", "Finally he sprinkles the sick person with holy water."]]}, {"id": "sick-several", "la": "Eadem Benedictio pro Pluribus Infirmis", "en": "The Same Blessing for Several Sick Persons", "cat": "The Sick", "ref": "Appendix, Benedictiones non reservatæ, 42", "b": [["r", "Sacerdos cubiculum ægrotantium ingrediens dicat:", "The priest, entering the room of the sick, says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "Et continuo ad infirmos accedens subjungat:", "And going straight to the sick, he adds:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Intróeat, Dómine Jesu Christe, domum hanc ad nostræ humilitátis ingréssum pax et misericórdia tua: effúgiat ex hoc loco omnis nequítia dæmonum, adsint Angeli pacis, domúmque hanc déserat omnis malígna discórdia. Magnífica, Dómine, super nos nomen sanctum tuum: et bénedic nostræ conversatióni: Qui sanctus et pius es, et pérmanes cum Patre et Spíritu Sancto in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, as we in our lowliness enter this house, may Your peace and mercy enter with us. Let every wickedness of the demons flee from this place; let the Angels of peace be present, and let all evil discord depart from this house. Magnify Your holy name upon us, O Lord, and bless our coming among them; who are holy and merciful, and abide with the Father and the Holy Spirit for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Réspice, Dómine, fámulos tuos (fámulas tuas) in infirmitáte córporis laborántes, et ánimas réfove, quas creásti: ut castigatiónibus emendáti (-æ), contínuo se séntiant tua miseratióne salvátos (-as). Per Christum, Dóminum nostrum. ℟. Amen.", "Look down, O Lord, upon Your servants, laboring under bodily illness, and revive the souls You created; so that, made better by these trials, they may soon feel themselves restored by Your mercy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Miséricors, Dómine, fidélium consolátor, quǽsumus imménsam pietátem tuam, ut ad intróitum humilitátis nostræ hos fámulos tuos (has fámulas tuas) super lectum dolóris sui jacéntes, visitáre dignéris, sicut socrum Simónis visitásti: propítius adésto eis, Dómine, quátenus prístina sanitáte recépta, gratiárum tibi in Ecclésia tua réferant actiónes: Qui vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "O merciful Lord, consoler of the faithful, we beseech Your boundless goodness that, as we in our lowliness enter, You would deign to visit these Your servants lying on their beds of pain, as You visited Simon's mother-in-law. Graciously stand by them, O Lord, so that, their former health restored, they may give thanks to You in Your Church. Who live and reign, God, for ever and ever. ℟. Amen."], ["r", "Deinde, extendens dexteram versus ægrotos, dicat:", "Then, extending his right hand toward the sick, he says:"], ["t", "Dóminus Jesus Christus apud vos sit, ut vos deféndat: intra vos sit, ut vos consérvet: ante vos sit, ut vos ducat: post vos sit, ut vos custódiat: super vos sit, ut vos benedícat: Qui cum Patre et Spíritu Sancto vivit et regnat in sǽcula sæculórum. ℟. Amen.", "May the Lord Jesus Christ be with you to defend you, within you to sustain you, before you to lead you, behind you to guard you, above you to bless you; who with the Father and the Holy Spirit lives and reigns for ever and ever. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super vos, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Demum aspergat infirmos aqua benedicta.", "Finally he sprinkles the sick with holy water."]]}, {"id": "sick-pilgrims", "la": "Benedictio Peregrinorum Ægrotantium", "en": "Blessing of Sick Pilgrims", "cat": "The Sick", "ref": "Appendix, Benedictiones non reservatæ, 43", "b": [["r", "Sacerdos indutus superpelliceo et stola albi coloris, ponat extremitatem stolæ super caput infirmi, Evangeliumque recitet modo sequenti; si vero plures sint infirmi, stolam ipse teneat elevatam manu dextera, et benedictiones dicat in plurali.", "The priest, vested in surplice and white stole, places the end of the stole on the sick person's head and reads the Gospel as follows; if there are several sick persons, he holds the stole raised in his right hand and says the blessings in the plural."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "✠ Sequéntia sancti Evangélii secúndum Matthǽum. *(Cap. 13, 44-52)*", "✠ The continuation of the holy Gospel according to Matthew. *(Chapter 13:44-52)*"], ["x", "Glória tibi, Dómine.", "Glory to You, O Lord."], ["t", "In illo témpore: Dixit Jesus discípulis suis parábolam hanc: Símile est regnum cælórum thesáuro abscóndito in agro: quem qui invénit homo, abscóndit, et præ gáudio illíus vadit, et vendit univérsa, quæ habet, et emit agrum illum. Iterum símile est regnum cælórum hómini negotiatóri, quærénti bonas margarítas. Invénta autem una pretiósa margaríta, ábiit, et véndidit ómnia, quæ hábuit, et emit eam. Iterum símile est regnum cælórum sagénæ missæ in mare, et ex omni génere píscium congregánti. Quam, cum impléta esset, educéntes, et secus litus sedéntes, elegérunt bonos in vasa, malos autem foras misérunt. Sic erit in consummatióne sǽculi: exíbunt Angeli, et separábunt malos de médio justórum, et mittent eos in camínum ignis: ibi erit fletus, et stridor déntium. Intellexístis hæc ómnia? Dicunt ei: Etiam. Ait illis: Ideo omnis scriba doctus in regno cælórum símilis est hómini patrifamílias, qui profert de thesáuro suo nova et vétera.", "At that time Jesus told His disciples this parable: The kingdom of heaven is like a treasure hidden in a field, which a man found and hid; and in his joy he goes and sells all that he has and buys that field. Again, the kingdom of heaven is like a merchant seeking fine pearls; who, on finding one pearl of great price, went and sold all that he had and bought it. Again, the kingdom of heaven is like a net cast into the sea that gathered in fish of every kind. When it was full, they drew it ashore, sat down, and gathered the good into vessels, but threw the bad away. So it will be at the end of the world: the Angels will go out and separate the wicked from among the just, and cast them into the furnace of fire; there will be weeping and gnashing of teeth. Have you understood all these things? They said to Him: Yes. And He said to them: Therefore every scribe instructed in the kingdom of heaven is like a householder who brings out of his treasure things new and old."], ["r", "Post Evangelium benedicit infirmum dicens:", "After the Gospel he blesses the sick person, saying:"], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te (vos), et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Deinde porrigit extremitatem stolæ deosculandam infirmo, ipsumque aspergit aqua benedicta, dicens:", "Then he offers the end of the stole to the sick person to kiss, and sprinkles him with holy water, saying:"], ["t", "Aspérgat te (vos) Deus rore grátiæ suæ in vitam ætérnam. ℟. Amen.", "May God sprinkle you with the dew of His grace unto life everlasting. ℟. Amen."]]}, {"id": "pregnant-woman", "la": "Benedictio Mulieris Prægnantis in periculis partus", "en": "Blessing of an Expectant Mother in Danger of Childbirth", "cat": "Mothers & Children", "ref": "Appendix", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Salvam fac ancíllam tuam.", "Save Your handmaid,"], ["x", "Deus meus, sperántem in te.", "O my God, who hopes in You."], ["v", "Esto illi, Dómine, turris fortitúdinis.", "Be unto her, O Lord, a tower of strength"], ["x", "A fácie inimíci.", "Against the face of the enemy."], ["v", "Nihil profíciat inimícus in ea.", "Let the enemy have no power over her,"], ["x", "Et fílius iniquitátis non appónat nocére ei.", "Nor the son of iniquity draw near to harm her."], ["v", "Mitte ei, Dómine, auxílium de sancto.", "Send her help, O Lord, from the sanctuary,"], ["x", "Et de Sion tuére eam.", "And defend her out of Sion."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui dedísti fámulis tuis in confessióne veræ fídei ætérnæ Trinitátis glóriam agnóscere, et in poténtia majestátis adoráre unitátem: quǽsumus; ut ejúsdem fídei firmitáte hæc fámula tua N. ab ómnibus semper muniátur advérsis. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty, everlasting God, who have granted to Your servants, in the confession of the true faith, to acknowledge the glory of the eternal Trinity and to adore the Unity in the power of Your majesty: we beseech You that by steadfastness in this same faith this Your servant N. may ever be protected against all adversity. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus, ómnium Creátor, fortis et terríbilis, justus et miséricors, qui solus bonus et pius es; qui de omni malo liberásti Israel, fáciens tibi patres nostros diléctos, et sanctificásti eos manu Spíritus tui; qui gloriósæ Vírginis Maríæ corpus et ánimam, ut dignum Fílii tui habitáculum éffici mererétur, Spíritu Sancto cooperánte præparásti; qui Joánnem Baptístam Spíritu Sancto replésti, et in útero matris exsultáre fecísti: áccipe sacrifícium cordis contríti, ac fervens desidérium fámulæ tuæ N. humíliter supplicántis pro conservatióne prolis, quam ei dedísti concípere: custódi partem tuam, et ab omni dolo et injúria duri hostis defénde; ut obstetricánte manu misericórdiæ tuæ fetus ejus ad lucem próspere véniat, ac sanctæ generatióni servétur, tibíque in ómnibus júgiter desérviat, et vitam cónsequi mereátur ætérnam. Per eúndem Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God, Creator of all things, strong and terrible, just and merciful, who alone are good and kind; who delivered Israel from every evil, making our fathers Your beloved, and sanctified them by the hand of Your Spirit; who by the cooperation of the Holy Spirit prepared the body and soul of the glorious Virgin Mary to become a worthy dwelling for Your Son; who filled John the Baptist with the Holy Spirit and made him leap in his mother's womb: accept the sacrifice of a contrite heart and the fervent desire of Your servant N., who humbly entreats You for the preservation of the child You have granted her to conceive. Guard what is Your own, and defend it from every deceit and injury of the harsh enemy, so that by the helping hand of Your mercy her child may come happily to the light, be kept for holy rebirth, serve You always in all things, and be worthy to attain eternal life. Through the same Jesus Christ, Your Son, our Lord, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Deinde mulier aspergatur aqua benedicta, et mox dicatur:", "Then the woman is sprinkled with holy water, and immediately the following is said:"], ["h", "Psalmus 66", "Psalm 66"], ["t", "Deus misereátur nostri, et benedícat nobis: * illúminet vultum suum super nos, et misereátur nostri.", "May God have mercy on us and bless us; * may He make His face to shine upon us and have mercy on us."], ["t", "Ut cognoscámus in terra viam tuam, * in ómnibus géntibus salutáre tuum.", "That we may know Your way upon earth, * Your salvation among all nations."], ["t", "Confiteántur tibi pópuli, Deus: * confiteántur tibi pópuli omnes.", "Let the peoples praise You, O God; * let all the peoples praise You."], ["t", "Læténtur et exsúltent gentes: * quóniam júdicas pópulos in æquitáte, et gentes in terra dírigis.", "Let the nations be glad and rejoice, * for You judge the peoples with equity and guide the nations upon earth."], ["t", "Confiteántur tibi pópuli, Deus, confiteántur tibi pópuli omnes: * terra dedit fructum suum.", "Let the peoples praise You, O God, let all the peoples praise You; * the earth has yielded its fruit."], ["t", "Benedícat nos Deus, Deus noster, benedícat nos Deus: * et métuant eum omnes fines terræ.", "May God, our God, bless us; may God bless us, * and may all the ends of the earth fear Him."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["v", "Benedicámus Patrem, et Fílium, cum Sancto Spíritu.", "Let us bless the Father and the Son, with the Holy Spirit."], ["x", "Laudémus et superexaltémus eum in sǽcula.", "Let us praise and exalt Him above all for ever."], ["v", "Ángelis suis Deus mandávit de te.", "God has given His angels charge over you,"], ["x", "Ut custódiant te in ómnibus viis tuis.", "To keep you in all your ways."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Vísita, quǽsumus, Dómine, habitatiónem istam, et omnes insídias inimíci ab ea, et a præsénti fámula tua N. longe repélle: Ángeli tui sancti hábitent in ea, qui eam et ejus prolem in pace custódiant, et benedíctio tua sit super eam semper. Salva eos, omnípotens Deus, et lucem eis tuam concéde perpétuam. Per Christum, Dóminum nostrum. ℟. Amen.", "Visit, we beseech You, O Lord, this dwelling, and drive far from it and from Your servant N. here present all the snares of the enemy. May Your holy Angels dwell herein to keep her and her child in peace, and may Your blessing be always upon her. Save them, almighty God, and grant them Your everlasting light. Through Christ our Lord. ℟. Amen."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et prolem tuam, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and your child and remain for ever. ℟. Amen."]]}, {"id": "infant", "la": "Benedictio Infantis", "en": "Blessing of an Infant", "cat": "Mothers & Children", "ref": "Appendix", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Deus noster miserétur.", "Our God is merciful,"], ["x", "Custódiens párvulos Dóminus.", "The Lord keeps the little ones."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, qui ante ómnia sǽcula génitus, in témpore tamen infans esse voluísti, et hujus ætátis díligis innocéntiam; qui párvulos tibi oblátos amánter compléxus es, iísque benedixísti: infántem istum (infántes istos) prǽveni in benedictiónibus dulcédinis, et præsta, ne malítia mutet intelléctum ejus (eórum): eíque (eísque) concéde, ut profíciens (proficiéntes) ætáte, sapiéntia et grátia, tibi semper placére váleat (váleant): Qui vivis et regnas cum Deo Patre in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, begotten before all ages, who nevertheless willed to become an infant in time, and who love the innocence of this age; who lovingly embraced and blessed the little ones brought to You: go before this infant (these infants) with the blessings of Your sweetness, and grant that malice may not change his (their) understanding; and grant that, advancing in age, wisdom, and grace, he (they) may always be pleasing to You: who live and reign with God the Father in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Deinde Sacerdos infantem (vel infantes) aspergat aqua benedicta, dicens:", "Then the priest sprinkles the infant (or infants) with holy water, saying:"], ["t", "Pax et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te (vos), et máneat semper. ℟. Amen.", "May the peace and blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."]]}, {"id": "boy", "la": "Benedictio Pueri ad obtinendam super ipsum misericordiam Dei", "en": "Blessing of a Child, to Obtain God's Mercy upon Him", "cat": "Mothers & Children", "ref": "Appendix", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, qui dixísti: Sínite párvulos veníre ad me, tálium est enim regnum cælórum; super hunc púerum tuum virtútem bene✠dictiónis tuæ infúnde, ac ad Ecclésiæ et paréntum illíus fidem ac devotiónem réspice; ut virtúte ac sapiéntia apud Deum et hómines profíciens, ad optátam pervéniat senectútem, et salútem consequátur ætérnam: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, who said, \"Let the little children come to Me, for of such is the kingdom of heaven\": pour out the power of Your ✠ blessing upon this child of Yours, and look upon the faith and devotion of the Church and of his parents; that, growing in virtue and wisdom before God and men, he may reach the old age he longs for and attain eternal salvation: who live and reign for ever and ever. ℟. Amen."], ["h", "Psalmus 112", "Psalm 112"], ["t", "Laudáte, púeri, Dóminum: * laudáte nomen Dómini.", "Praise the Lord, you children; * praise the name of the Lord."], ["t", "Sit nomen Dómini benedíctum, * ex hoc nunc, et usque in sǽculum.", "Blessed be the name of the Lord, * from this time forth and for evermore."], ["t", "A solis ortu usque ad occásum, * laudábile nomen Dómini.", "From the rising of the sun to its setting, * the name of the Lord is worthy of praise."], ["t", "Excélsus super omnes gentes Dóminus, * et super cælos glória ejus.", "The Lord is high above all nations, * and His glory above the heavens."], ["t", "Quis sicut Dóminus, Deus noster, qui in altis hábitat, * et humília réspicit in cælo et in terra?", "Who is like the Lord our God, who dwells on high, * and looks upon the lowly in heaven and on earth?"], ["t", "Súscitans a terra ínopem, * et de stércore érigens páuperem:", "Raising up the needy from the earth, * and lifting the poor out of the dunghill,"], ["t", "Ut cóllocet eum cum princípibus, * cum princípibus pópuli sui.", "To seat him with princes, * with the princes of His people."], ["t", "Qui habitáre facit stérilem in domo, * matrem filiórum lætántem.", "Who makes the barren woman dwell in her house, * the joyful mother of children."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."]]}, {"id": "children-church", "la": "Benedictio Puerorum, cum præsertim in ecclesia præsentantur", "en": "Blessing of Children, Especially When Presented in Church", "cat": "Mothers & Children", "ref": "Appendix", "b": [["r", "Die et hora constitutis, pueri conveniant in ecclesiam, quos ibi a parentibus vel magistris associari maxime deceret, ut in silentio et modestia facilius se componant. Quibus per ordinem dispositis, et pueris a puellis, si adsint, separatis, Sacerdos ad ipsos accedat, et brevissimo ac simplici sermone eos alloquatur, prout opportunum sibi visum fuerit.", "At the appointed day and hour the children gather in the church, where it is most fitting that they be accompanied by their parents or teachers, so that they may more easily keep silence and good order. When they have been arranged in order, the boys separated from the girls if both are present, the priest comes to them and addresses them in a very short and simple talk, as he sees fit."], ["r", "Deinde stans versus eos dicat:", "Then, standing facing them, he says:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["t", "*Ant.* Laudáte, púeri, Dóminum: laudáte nomen Dómini.", "*Ant.* Praise the Lord, you children; praise the name of the Lord."], ["r", "Psalmus 112, incipitur a secundo versu: Sit nomen Dómini (ut in Benedictione Pueri supra). Et repetitur Antiphona. Qui Psalmus cum sua Antiphona, si paucis tantum, aut minus sollemniter conferatur Benedictio, omitti poterit.", "Psalm 112 is said, beginning from the second verse, \"Blessed be the name of the Lord\" (as in the Blessing of a Child above), and the antiphon is repeated. If the blessing is given to only a few, or less solemnly, the psalm with its antiphon may be omitted."], ["r", "Finito Psalmo et repetita Antiphona, Sacerdos dicit:", "When the psalm is finished and the antiphon repeated, the priest says:"], ["v", "Sínite párvulos veníre ad me.", "Let the little children come to Me."], ["x", "Tálium est enim regnum cælórum.", "For of such is the kingdom of heaven."], ["v", "Ángeli eórum.", "Their Angels"], ["x", "Semper vident fáciem Patris.", "Always behold the face of the Father."], ["v", "Nihil profíciat inimícus in eis.", "Let the enemy have no power over them,"], ["x", "Et fílius iniquitátis non appónat nocére eis.", "Nor the son of iniquity draw near to harm them."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui párvulos tibi oblátos et ad te veniéntes compléxus es, manúsque super illos impónens benedixísti eis, atque dixísti: Sínite párvulos veníre ad me, et nolíte prohibére eos, tálium est enim regnum cælórum, et Ángeli eórum semper vident fáciem Patris mei; réspice, quǽsumus, ad puerórum (puellárum) præséntium innocéntiam, et ad eórum (eárum) paréntum devotiónem, et cleménter eos (eas) hódie per ministérium nostrum béne✠dic; ut in tua grátia et misericórdia semper profíciant, te sápiant, te díligant, te tímeant, et mandáta tua custódiant, et ad finem optátum felíciter pervéniant: per te, Salvátor mundi, qui cum Patre et Spíritu Sancto vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who embraced the little ones brought to You and coming to You, and laying Your hands upon them blessed them, saying, \"Let the little children come to Me, and do not forbid them, for of such is the kingdom of heaven, and their Angels always behold the face of My Father\": look, we beseech You, upon the innocence of these children here present and upon the devotion of their parents, and through our ministry graciously ✠ bless them this day; that they may ever grow in Your grace and mercy, may know You, love You, fear You, and keep Your commandments, and may happily reach the end they long for: through You, Savior of the world, who with the Father and the Holy Spirit live and reign, God, for ever and ever. ℟. Amen."], ["n", "", "The words in parentheses are used if only girls are present."], ["t", "Orémus.", "Let us pray."], ["t", "Defénde, quǽsumus, Dómine, beáta María semper Vírgine intercedénte, istam ab omni adversitáte famíliam: et toto corde tibi prostrátam, ab hóstium propítius tuére cleménter insídiis. Per Christum, Dóminum nostrum. ℟. Amen.", "Defend, we beseech You, O Lord, through the intercession of blessed Mary ever Virgin, this family from all adversity; and as they bow before You with all their heart, graciously protect them in Your kindness from the snares of the enemy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui ineffábili providéntia sanctos Ángelos tuos ad nostram custódiam míttere dignáris: largíre supplícibus tuis; et eórum semper protectióne deféndi, et ætérna societáte gaudére. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who in Your unspeakable providence deign to send Your holy Angels to guard us: grant to Your suppliants that we may always be defended by their protection and rejoice in their company for ever. Through Christ our Lord. ℟. Amen."], ["r", "Postea manu dextera producens signum crucis super pueros, benedicit eos, dicens:", "Then, making the sign of the cross over the children with his right hand, he blesses them, saying:"], ["t", "Benedícat vos Deus, et custódiat corda vestra et intellegéntias vestras, Pater, et Fílius, ✠ et Spíritus Sanctus. ℟. Amen.", "May God bless you and keep your hearts and minds, the Father, and the Son, ✠ and the Holy Spirit. ℟. Amen."], ["r", "Deinde aspergat pueros aqua benedicta.", "Then he sprinkles the children with holy water."]]}, {"id": "sick-children", "la": "Benedictio Puerorum Ægrotantium", "en": "Blessing of Sick Children", "cat": "Mothers & Children", "ref": "Appendix", "b": [["r", "Pueri infirmi, qui ad hunc usum rationis pervenerunt, ut ipsis præberi possit Sacramentum Extremæ Unctionis, iis adjuventur exhortationibus et precibus, quæ describuntur in hoc Rituali Romano, ubi agitur de visitatione et cura infirmorum, prout feret temporis opportunitas, et eorundem ægrotantium status. Verum pro ceteris junioribus pueris infirmis adhiberi possunt sequentes preces.", "Sick children who have reached such use of reason that Extreme Unction may be given them are to be helped with the exhortations and prayers described in this Roman Ritual for the visitation and care of the sick, as time and the state of the sick allow. For other, younger sick children, the following prayers may be used."], ["r", "Sacerdos infirmi cubiculum ingressus, primum dicit:", "The priest, entering the sick child's room, first says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "Mox infirmum et lectum ejus et cubiculum aspergit, nihil dicens. Deinde dicit Psalmum 112 Laudáte, púeri, Dóminum (ut in Benedictione Pueri supra), cum Glória Patri in fine.", "Then he sprinkles the sick child, the bed, and the room, saying nothing. Then he says Psalm 112, \"Praise the Lord, you children\" (as in the Blessing of a Child above), with the Glory be at the end."], ["r", "Postea dicit:", "Afterward he says:"], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Deus noster miserétur.", "Our God is merciful,"], ["x", "Custódiens párvulos Dóminus.", "The Lord keeps the little ones."], ["v", "Sínite párvulos veníre ad me.", "Let the little children come to Me."], ["x", "Tálium est enim regnum cælórum.", "For of such is the kingdom of heaven."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, cui cuncta adoléscunt, et per quem adúlta firmántur: exténde déxteram tuam super hunc fámulum tuum (hanc fámulam tuam), in ténera ætáte languéntem: quátenus vigóre sanitátis recépto, ad annórum pervéniat plenitúdinem, et tibi fidéle, gratúmque obséquium indesinénter præstet ómnibus diébus vitæ suæ. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, by whom all things grow and by whom what has grown is made strong: stretch forth Your right hand over this Your servant, who lies ill at a tender age; that, regaining vigor and health, he (she) may reach the fullness of years and render You faithful and pleasing service unceasingly all the days of his (her) life. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus misericordiárum, et Deus totíus consolatiónis, qui creatúræ tuæ multíplici pietáte cónsulens, non solum ánimæ, sed ipsi córpori curatiónis grátiam benígnus infúndis: hunc párvulum infírmum (hanc párvulam infírmam) a lecto ægritúdinis erígere, et Ecclésiæ tuæ sanctæ, suísque paréntibus incólumem restitúere dignéris; ut cunctis prolongátæ sibi vitæ diébus, grátia et sapiéntia coram te et homínibus profíciens, in justítia et sanctitáte tibi sérviat, et débitas misericórdiæ tuæ réferat gratiárum actiónes. Per Christum, Dóminum nostrum. ℟. Amen.", "God of mercies and God of all consolation, who in Your manifold kindness provide for Your creatures and graciously pour out the grace of healing not only upon the soul but upon the body as well: deign to raise this sick little one from the bed of sickness and restore him (her) unharmed to Your holy Church and to his (her) parents; that, growing in grace and wisdom before You and men all the days of the life prolonged for him (her), he (she) may serve You in justice and holiness and render due thanks to Your mercy. Through Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui miro órdine Angelórum ministéria hominúmque dispénsas: concéde propítius; ut, a quibus tibi ministrántibus in cælo semper assístitur, ab his in terra vita hujus púeri (puéllæ) muniátur. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who in wondrous order assign the ministries of Angels and of men: mercifully grant that the life of this boy (girl) on earth may be protected by those who ever stand ministering before You in heaven. Through Christ our Lord. ℟. Amen."], ["r", "Completa Oratione ultima, Sacerdos imponit dexteram manum super caput infirmi, et dicit:", "When the last prayer is finished, the priest lays his right hand upon the head of the sick child and says:"], ["t", "Super ægros manus impónent, et bene habébunt. Jesus, Maríæ Fílius, mundi salus et Dóminus, méritis et intercessióne sanctórum Apostolórum suórum Petri et Pauli, et ómnium Sanctórum, sit tibi clemens et propítius. Amen.", "They shall lay their hands upon the sick, and they shall recover. May Jesus, Son of Mary, Lord and Savior of the world, through the merits and intercession of His holy Apostles Peter and Paul and of all the Saints, be kind and merciful to you. Amen."], ["r", "Quod sequitur Evangelium, pro temporis opportunitate et pro ægrotantis pueri parentum desiderio, Sacerdotis arbitrio dici poterit.", "The following Gospel may be said at the priest's discretion, as time allows and as the parents of the sick child desire."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["v", "Inítium sancti Evangélii secúndum Joánnem.", "The beginning of the holy Gospel according to John."], ["x", "Glória tibi, Dómine.", "Glory to You, O Lord."], ["r", "Dum Sacerdos dicit Inítium, etc. facit signum crucis de more super se in fronte, ore et pectore; similiter super puerum infirmum, si non possit se signare.", "While the priest says \"The beginning,\" etc., he makes the sign of the cross in the usual way on his forehead, lips, and breast, and likewise over the sick child if the child cannot sign himself."], ["t", "In princípio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum. Hoc erat in princípio apud Deum. Ómnia per ipsum facta sunt: et sine ipso factum est nihil, quod factum est: in ipso vita erat, et vita erat lux hóminum: et lux in ténebris lucet, et ténebræ eam non comprehendérunt. Fuit homo missus a Deo, cui nomen erat Joánnes. Hic venit in testimónium, ut testimónium perhibéret de lúmine, ut omnes créderent per illum. Non erat ille lux, sed ut testimónium perhibéret de lúmine. Erat lux vera, quæ illúminat omnem hóminem veniéntem in hunc mundum. In mundo erat, et mundus per ipsum factus est, et mundus eum non cognóvit. In própria venit, et sui eum non recepérunt. Quotquot autem recepérunt eum, dedit eis potestátem fílios Dei fíeri, his, qui credunt in nómine ejus: qui non ex sanguínibus, neque ex voluntáte carnis, neque ex voluntáte viri, sed ex Deo nati sunt. *(Hic genuflectitur)* Et Verbum caro factum est, et habitávit in nobis: et vídimus glóriam ejus, glóriam quasi Unigéniti a Patre, plenum grátiæ et veritátis.", "In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through Him, and without Him was made nothing that was made. In Him was life, and the life was the light of men; and the light shines in the darkness, and the darkness did not comprehend it. There was a man sent from God, whose name was John. He came as a witness, to bear witness to the light, that all might believe through him. He was not the light, but was to bear witness to the light. That was the true light, which enlightens every man coming into this world. He was in the world, and the world was made through Him, and the world did not know Him. He came unto His own, and His own did not receive Him. But to as many as received Him He gave the power to become children of God, to those who believe in His name: who were born not of blood, nor of the will of the flesh, nor of the will of man, but of God. *(Here all genuflect)* And the Word was made flesh, and dwelt among us; and we saw His glory, the glory as of the Only-begotten of the Father, full of grace and truth."], ["x", "Deo grátias.", "Thanks be to God."], ["r", "Postea benedicens puerum infirmum, subjungit, dicens:", "Then, blessing the sick child, he adds:"], ["t", "Benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super te, et máneat semper. ℟. Amen.", "May the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon you and remain for ever. ℟. Amen."], ["r", "Deinde aspergit eum aqua benedicta. Si sint plures infirmi in eodem cubiculo vel loco, Preces et Orationes prædictæ dicuntur super eos in numero plurali.", "Then he sprinkles the child with holy water. If there are several sick children in the same room or place, the foregoing prayers are said over them in the plural."]]}, {"id": "ad-omnia", "la": "Benedictio ad Omnia", "en": "Blessing for Any Object", "cat": "General", "ref": "Appendix", "b": [["r", "Hæc benedictionis formula adhiberi potest a quovis Sacerdote pro omnibus rebus, quarum specialis benedictio in hoc Rituali non habetur.", "This form of blessing may be used by any priest for all things that have no special blessing in this Ritual."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, cujus verbo sanctificántur ómnia, bene✠dictiónem tuam effúnde super creatúram istam (creatúras istas): et præsta; ut, quisquis ea (eis) secúndum legem et voluntátem tuam cum gratiárum actióne usus fúerit, per invocatiónem sanctíssimi nóminis tui, córporis sanitátem, et ánimæ tutélam, te auctóre, percípiat. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, by whose word all things are made holy, pour out Your ✠ blessing upon this creature (these creatures), and grant that whoever uses it (them) with thanksgiving, according to Your law and will, may, by the invocation of Your most holy name, receive through You health of body and protection of soul. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur (vel aspergantur) aqua benedicta.", "And it is (or they are) sprinkled with holy water."]]}];

(function () {

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  const cats = [...new Set(RITES.map(r => r.cat))].sort((a, b) => (CAT_ORDER.indexOf(a) + 99) % 99 - (CAT_ORDER.indexOf(b) + 99) % 99);
  let view = store.get('rit.view') || 'both';

  function fmt(s) {
    let h = esc(s);
    h = h.replace(/\*(\S[^*]*?\S|\S)\*/g, '<em class="rb">$1</em>');
    h = h.replace(/✠/g, '<span class="cross">✠</span>').replace(/℟\./g, '<span class="sym">℟.</span>').replace(/℣\./g, '<span class="sym">℣.</span>');
    return h;
  }
  function blockHTML([k, la, en]) {
    if (k === 'n') return `<div class="n ui">${fmt(en)}</div>`;
    const pre = k === 'v' ? '<span class="sym">℣.</span> ' : k === 'x' ? '<span class="sym">℟.</span> ' : '';
    return `<div class="row ${k}"><div class="la" lang="la">${pre}${fmt(la)}</div><div class="en">${pre}${fmt(en)}</div></div>`;
  }
  function riteHTML(r) {
    const i = RITES.indexOf(r), prev = RITES[i - 1], next = RITES[i + 1];
    return `<article class="rite"><div class="ref ui">${esc(r.cat)} · Rituale Romanum, ${esc(r.ref)}</div>
      <h1 lang="la">${esc(r.la)}</h1><div class="sub">${esc(r.en)}</div>
      <div class="rows ${view === 'both' ? '' : 'only-' + view}"><div class="colhead la ui">Latin</div><div class="colhead en ui">English</div>
      ${r.b.map(blockHTML).join('')}</div></article>
      <div class="pager">${prev ? `<a href="#${prev.id}">← ${esc(prev.en)}</a>` : '<span></span>'}${next ? `<a href="#${next.id}">${esc(next.en)} →</a>` : ''}</div>`;
  }
  function introHTML() {
    const counts = {}; RITES.forEach(r => counts[r.cat] = (counts[r.cat] || 0) + 1);
    return `<section class="intro"><h1 lang="la">Rituale Romanum</h1><div class="sub" style="font-style:italic;color:var(--muted);font-size:1.2rem;margin-bottom:12px">The rites and blessings of the Roman Ritual, in Latin with an English translation</div>
      <div class="grid-cats">${cats.map(c => `<a href="#${RITES.find(r => r.cat === c).id}"><b>${esc(c)}</b><span>${counts[c]} ${counts[c] === 1 ? 'rite' : 'rites'}</span></a>`).join('')}</div>
      <h2 style="color:var(--accent);font-weight:600">About this edition</h2>
      <p><b>Latin text.</b> Transcribed from the Pustet edition of the <i>Rituale Romanum</i> (juxta typicam 1925), with a second scan of the same edition consulted where the first was unclear. The 1952 typical edition, in use in 1962, kept these rites with very few changes; it chiefly added and reordered blessings. Chapter references follow the 1925 numbering. The psalms are given in the Vulgate; in 1962 the newer Pian Latin psalter was also permitted in some places.</p>
      <p><b>English translation.</b> A new, fairly literal translation made for this page, so that it can be read alongside the Latin. It is not an approved liturgical translation.</p>
      <p><b>Rubrics</b> (instructions) are printed in red, as in the liturgical books. <span class="cross">✠</span> marks the sign of the cross; <span class="sym">℣.</span> and <span class="sym">℟.</span> mark versicle and response.</p>
      <p>Pick a rite from the contents, or search for any word in Latin or English.</p></section>`;
  }

  function renderTOC(filter) {
    const q = (filter || '').trim().toLowerCase();
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/æ/g, 'ae').replace(/œ/g, 'oe');
    const nq = norm(q);
    const match = r => !nq || norm(r.la + ' ' + r.en).includes(nq) || r.b.some(([, la, en]) => norm(la + ' ' + en).includes(nq));
    const cur = location.hash.slice(1);
    let html = '';
    for (const c of cats) {
      const list = RITES.filter(r => r.cat === c && match(r));
      if (!list.length) continue;
      html += `<div class="cat ui">${esc(c)}</div>` + list.map(r => `<a href="#${r.id}" aria-current="${r.id === cur}"><span class="la" lang="la">${esc(r.la)}</span><span class="en">${esc(r.en)}</span></a>`).join('');
    }
    $('toc').innerHTML = html || '<div class="none ui">No rites match that search.</div>';
  }
  function render() {
    const id = location.hash.slice(1);
    const r = RITES.find(x => x.id === id);
    $('view').innerHTML = r ? riteHTML(r) : introHTML();
    document.title = r ? `${r.la} · Rituale Romanum` : 'Rituale Romanum';
    renderTOC($('q').value);
    document.body.classList.remove('menu-open');
    const q = $('q').value.trim();
    if (r && q.length > 2) highlight(q);
    window.scrollTo(0, 0);
  }
  function highlight(q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    document.querySelectorAll('#view .row > div').forEach(el => {
      if (!re.test(el.textContent)) return;
      const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
      nodes.forEach(n => { if (!re.test(n.nodeValue)) return; const span = document.createElement('span'); span.innerHTML = esc(n.nodeValue).replace(re, m => `<mark>${m}</mark>`); n.replaceWith(span); });
    });
  }
  function setView(v) {
    view = v; store.set('rit.view', v);
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    const rows = document.querySelector('.rows'); if (rows) rows.className = 'rows' + (v === 'both' ? '' : ' only-' + v);
  }
  document.querySelector('.seg').onclick = e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); };
  $('q').addEventListener('input', () => renderTOC($('q').value));
  $('menuBtn').onclick = () => document.body.classList.toggle('menu-open');
  $('printBtn').onclick = () => window.print();
  document.addEventListener('click', e => { if (document.body.classList.contains('menu-open') && !e.target.closest('aside') && !e.target.closest('#menuBtn')) document.body.classList.remove('menu-open'); });
  window.addEventListener('hashchange', render);
  setView(view);
  render();
})();
</script>
</body>
</html>
