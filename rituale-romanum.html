píritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, invíctæ virtútis auctor, et insuperábilis impérii Rex, ac semper magníficus triumphátor: qui advérsæ dominatiónis vires réprimis: qui inimíci rugiéntis sævítiam súperas: qui hostíles nequítias poténter expúgnas: te, Dómine, treméntes et súpplices deprecámur, ac pétimus: ut hanc creatúram salis et aquæ dignánter aspícias, benígnus illústres, pietátis tuæ rore sanctífices; ut, ubicúmque fúerit aspérsa, per invocatiónem sancti nóminis tui, omnis infestátio immúndi spíritus abigátur: terrórque venenósi serpéntis procul pellátur: et præséntia Sancti Spíritus nobis, misericórdiam tuam poscéntibus, ubíque adésse dignétur. Per Dóminum nostrum Jesum Christum, Fílium tuum: qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, author of invincible power, King of an empire that cannot be overcome, and ever glorious conqueror; who hold in check the forces of the adversary's dominion; who overcome the fury of the roaring enemy; who mightily vanquish his hostile wickedness: trembling and humbly we beseech and entreat You, O Lord, graciously to look upon this creature of salt and water, kindly to make it shine, and to sanctify it with the dew of Your goodness; so that wherever it is sprinkled, every assault of the unclean spirit may be driven off by the invocation of Your holy name, the dread of the poisonous serpent may be cast far away, and the presence of the Holy Spirit may everywhere be with us who ask for Your mercy. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "4. Post benedictionem aquæ, Sacerdos Dominicis diebus, antequam incipiat Missam, aspergit Altare, deinde se, et Ministros, ac populum, prout in Missali præscribitur, et in Appendice hujus Ritualis habetur.", "4. After the blessing of the water, on Sundays before beginning Mass, the priest sprinkles the altar, then himself, the ministers, and the people, as prescribed in the Missal and given in the Appendix of this Ritual."], ["r", "5. Christifideles autem possunt de ista aqua benedicta in vasculis suis accipere, et secum deferre ad aspergendos ægros, domos, agros, vineas, et alia, et ad eam habendam in cubiculis suis, ut ea cotidie et sæpius aspergi possint.", "5. The faithful may take some of this holy water in their own containers and carry it home to sprinkle the sick, their homes, fields, vineyards, and other things, and to keep it in their rooms, so that they may be sprinkled with it daily and often."]]}, {"id": "candles", "la": "Benedictio Candelarum", "en": "Blessing of Candles", "cat": "Objects of Devotion", "ref": "Tit. VIII, cap. 3", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, Fili Dei vivi, béne✠dic candélas istas supplicatiónibus nostris: infúnde eis, Dómine, per virtútem sanctæ Cru✠cis, benedictiónem cæléstem, qui eas ad repelléndas ténebras humáno géneri tribuísti; talémque benedictiónem signáculo sanctæ Cru✠cis accípiant, ut quibuscúmque locis accénsæ, sive pósitæ fúerint, discédant príncipes tenebrárum, et contremíscant, et fúgiant pávidi cum ómnibus minístris suis ab habitatiónibus illis, nec præsúmant ámplius inquietáre, aut molestáre serviéntes tibi omnipoténti Deo: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, Son of the living God, ✠ bless these candles at our humble request. By the power of the holy ✠ Cross, O Lord, pour upon them a heavenly blessing, You who gave them to mankind to dispel the darkness; and may they receive such a blessing through the sign of the holy ✠ Cross that, wherever they are lighted or placed, the princes of darkness may depart, tremble, and flee in terror with all their ministers from those dwellings, and no longer presume to disturb or molest those who serve You, the almighty God, who live and reign for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "homes-easter", "la": "Benedictio Domorum in Sabbato Sancto et reliquo Tempore Paschali", "en": "Blessing of Homes on Holy Saturday and during Eastertide", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 4", "b": [["r", "1. Parochus, seu alius Sacerdos de Parochi licentia, superpelliceo et stola alba indutus, cum ministro deferente vas aquæ benedictæ in Fonte baptismali, atque ante infusionem Olei et Chrismatis acceptæ, Sabbato Sancto visitat domos suæ parœciæ, aspergens eas eadem aqua benedicta. Ingrediens domum dicit:", "1. The pastor, or another priest with the pastor's permission, vested in surplice and white stole, with a server carrying a vessel of the water blessed in the baptismal font and taken before the pouring in of the oil and chrism, visits the homes of his parish on Holy Saturday, sprinkling them with this holy water. Entering the house, he says:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "2. Deinde aspergens loca præcipua domus, et habitantes in ea, dicit Antiphonam:", "2. Then, sprinkling the principal rooms of the house and those who live there, he says the antiphon:"], ["t", "*Ant.* Vidi aquam egrediéntem de templo, a látere dextro, allelúja: et omnes, ad quos pervénit aqua ista, salvi facti sunt, et dicent: allelúja, allelúja.", "*Ant.* I saw water flowing from the temple, from its right side, alleluia; and all to whom that water came were saved, and they shall say: alleluia, alleluia."], ["t", "*Ps. 117, 1.* Confitémini Dómino, quóniam bonus: quóniam in sǽculum misericórdia ejus.", "*Ps. 117, 1.* Give praise to the Lord, for He is good; for His mercy endures for ever."], ["t", "Glória Patri, etc.", "Glory be to the Father, etc."], ["r", "Repetitur Antiphona: Vidi aquam, etc. Deinde dicit:", "The antiphon \"I saw water,\" etc., is repeated. Then he says:"], ["v", "Osténde nobis, Dómine, misericórdiam tuam, allelúja.", "Show us, O Lord, Your mercy, alleluia."], ["x", "Et salutáre tuum da nobis, allelúja.", "And grant us Your salvation, alleluia."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi nos, Dómine sancte, Pater omnípotens, ætérne Deus: et sicut domos Hebræórum in éxitu de Ægýpto, agni sánguine linítas (quod pascha nostrum, in quo immolátus est Christus, figurábat), ab Angelo percutiénte custodísti; ita míttere dignéris sanctum Angelum tuum de cælis, qui custódiat, fóveat, prótegat, vísitet, atque deféndat omnes habitántes in hoc habitáculo. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "Hear us, holy Lord, Father almighty, everlasting God; and as You protected from the destroying Angel the houses of the Hebrews that were marked with the blood of the lamb at the departure from Egypt (a figure of our Pasch, in which Christ was sacrificed), so deign to send Your holy Angel from heaven to guard, cherish, protect, visit, and defend all who dwell in this house. Through the same Christ our Lord. ℟. Amen."], ["r", "3. Ritus superius descriptus adhibetur, etiamsi benedictio domorum fiat alia die intra Tempus Paschale pro locorum consuetudine.", "3. The rite described above is used even if, according to local custom, the blessing of homes takes place on another day within Eastertide."]]}, {"id": "homes", "la": "Benedictio Domorum extra Tempus Paschale", "en": "Blessing of Homes outside Eastertide", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 5", "b": [["r", "1. Parochus, seu alius Sacerdos, volens aliquam particularem domum, vel generaliter domos fidelium, extra Tempus Paschale aspergere aqua benedicta, ingrediens domum dicit:", "1. The pastor, or another priest, wishing to sprinkle with holy water a particular house, or the homes of the faithful generally, outside Eastertide, says on entering the house:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["r", "2. Deinde loca præcipua domus aspergendo, dicit Antiphonam:", "2. Then, sprinkling the principal rooms of the house, he says the antiphon:"], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* Sprinkle me, O Lord, with hyssop, and I shall be cleansed; wash me, and I shall be made whiter than snow."], ["t", "*Ps. 50, 3.* Miserére mei, Deus, secúndum magnam misericórdiam tuam. Glória Patri, etc.", "*Ps. 50, 3.* Have mercy on me, O God, according to Your great mercy. Glory be to the Father, etc."], ["r", "Et repetitur Antiphona: Aspérges me, etc.", "And the antiphon \"Sprinkle me,\" etc., is repeated."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi nos, Dómine sancte, Pater omnípotens, ætérne Deus: et míttere dignéris sanctum Angelum tuum de cælis, qui custódiat, fóveat, prótegat, vísitet, atque deféndat omnes habitántes in hoc habitáculo. Per Christum, Dóminum nostrum. ℟. Amen.", "Hear us, holy Lord, Father almighty, everlasting God, and deign to send Your holy Angel from heaven to guard, cherish, protect, visit, and defend all who dwell in this house. Through Christ our Lord. ℟. Amen."]]}, {"id": "place-or-house", "la": "Benedictio Loci vel Domus", "en": "Blessing of a Place or a House", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 6", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, Deus omnípotens, locum istum (vel domum istam): ut sit in eo (ea) sánitas, cástitas, victória, virtus, humílitas, bónitas, et mansuetúdo, plenitúdo legis, et gratiárum áctio Deo Patri, et Fílio, et Spirítui Sancto; et hæc benedíctio máneat super hunc locum (vel super hanc domum) et super habitántes in eo (ea) nunc et in ómnia sǽcula sæculórum. ℟. Amen.", "✠ Bless, O Lord God almighty, this place (or this house), that in it there may be health, chastity, victory, strength, humility, goodness and gentleness, the fullness of the law, and thanksgiving to God the Father, and to the Son, and to the Holy Spirit; and may this blessing remain upon this place (or this house) and upon those who dwell in it, now and for all ages. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "house-another", "la": "Alia Benedictio Domus", "en": "Another Blessing of a House", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 7", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Te Deum Patrem omnipoténtem supplíciter exorámus pro hac domo, et habitatóribus ejus, ac rebus: ut eam bene✠dícere, et sancti✠ficáre, ac bonis ómnibus ampliáre dignéris: tríbue eis, Dómine, de rore cæli abundántiam, et de pinguédine terræ vitæ substántiam, et desidéria voti eórum ad efféctum tuæ miseratiónis perdúcas. Ad intróitum ergo nostrum bene✠dícere, et sancti✠ficáre dignéris hanc domum, sicut benedícere dignátus es domum Abraham, Isaac, et Jacob: et intra paríetes domus istíus Angeli tuæ lucis inhábitent, eámque, et ejus habitatóres custódiant. Per Christum, Dóminum nostrum. ℟. Amen.", "We humbly beseech You, God the Father almighty, for this house, its inhabitants, and its goods: that You would deign to ✠ bless and ✠ sanctify it and enrich it with every good thing. Grant them, O Lord, abundance from the dew of heaven and the substance of life from the fatness of the earth, and bring the desires of their prayers to fulfillment through Your mercy. At our coming in, then, deign to ✠ bless and ✠ sanctify this house, as You deigned to bless the house of Abraham, Isaac, and Jacob; and within the walls of this house may the Angels of Your light dwell, and guard it and those who live in it. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "bridal-chamber", "la": "Benedictio Thalami", "en": "Blessing of a Bridal Chamber", "cat": "Homes & Places", "ref": "Tit. VIII, cap. 8", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, thálamum hunc: ut omnes habitántes in eo, in tua pace consístant, et in tua voluntáte permáneant, et senéscant, et multiplicéntur in longitúdinem diérum, et ad regna cælórum pervéniant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, this bridal chamber, that all who dwell in it may abide in Your peace and persevere in Your will, may grow old and be multiplied in length of days, and come at last to the kingdom of heaven. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "asperges", "la": "Benedictio Populi cum Aqua Benedicta diebus Dominicis", "en": "The Sprinkling of the People with Holy Water on Sundays (Asperges)", "cat": "Holy Water", "ref": "Appendix, Benedictiones non reservatæ, 1", "b": [["r", "Sacerdos celebraturus, indutus pluviali coloris Officio convenientis, accedit ad Altare, et ibi ad gradus cum Ministris genuflexus, etiam Tempore Paschali, accipit a Diacono aspersorium, et primo ter aspergit Altare, deinde se, et erectus Ministros, incipiens Antiphonam: Aspérges me. Et chorus prosequitur: Dómine, hyssópo, etc., ut infra. Interim Celebrans aspergit clerum, deinde populum, dicens submissa voce cum Ministris Psalmum Miserére mei, Deus.", "The priest who is to celebrate, vested in a cope of the color proper to the Office, goes to the altar and, kneeling there on the steps with the ministers (even in Eastertide), receives the sprinkler from the deacon. He first sprinkles the altar three times, then himself, and then, standing, the ministers, intoning the antiphon \"Sprinkle me.\" The choir continues \"O Lord, with hyssop,\" etc., as below. Meanwhile the celebrant sprinkles the clergy and then the people, saying in a low voice with the ministers the psalm \"Have mercy on me, O God.\""], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* Sprinkle me, O Lord, with hyssop, and I shall be cleansed; wash me, and I shall be made whiter than snow."], ["t", "*Ps. 50, 3.* Miserére mei, Deus, secúndum magnam misericórdiam tuam. Glória Patri.", "*Ps. 50, 3.* Have mercy on me, O God, according to Your great mercy. Glory be to the Father."], ["r", "Et repetitur Antiphona Aspérges me. Hæc Antiphona prædicto modo dicitur ad aspersionem aquæ benedictæ in Dominicis per totum annum: excepta Dominica de Passione, et Dominica Palmarum, in quibus non dicitur Glória Patri; sed post Psalmum Miserére repetitur immediate Antiphona Aspérges me. Excepto etiam Tempore Paschali, scilicet a Dominica Paschæ usque ad Pentecosten inclusive, quo tempore cantatur sequens Antiphona:", "The antiphon \"Sprinkle me\" is repeated. This antiphon is said in this way at the sprinkling of holy water on Sundays throughout the year, except Passion Sunday and Palm Sunday, on which the \"Glory be\" is not said, but the antiphon is repeated immediately after the psalm \"Have mercy.\" Eastertide is also excepted, that is, from Easter Sunday through Pentecost inclusive, during which the following antiphon is sung:"], ["t", "*Ant.* Vidi aquam egrediéntem de templo, a látere dextro, allelúja: et omnes, ad quos pervénit aqua ista, salvi facti sunt, et dicent: allelúja, allelúja.", "*Ant.* I saw water flowing from the temple, from its right side, alleluia; and all to whom that water came were saved, and they shall say: alleluia, alleluia."], ["t", "*Ps. 117, 1.* Confitémini Dómino, quóniam bonus: quóniam in sǽculum misericórdia ejus. Glória Patri.", "*Ps. 117, 1.* Give praise to the Lord, for He is good; for His mercy endures for ever. Glory be to the Father."], ["r", "Repetitur Antiphona: Vidi aquam. In Dominica vero Trinitatis resumitur Antiphona Aspérges me, Dómine, etc., ut supra. In die sancto Paschæ, et Pentecostes, ubi est fons baptismalis, fit aspersio cum aqua pridie benedicta in fonte Baptismi, et ante infusionem Olei et Chrismatis accepta. Finita Antiphona supradicto modo, Sacerdos qui aspersit aquam, reversus ad Altare, stans ante gradus Altaris junctis manibus dicat:", "The antiphon \"I saw water\" is repeated. On Trinity Sunday the antiphon \"Sprinkle me, O Lord\" is resumed, as above. On Easter Sunday and on Pentecost, where there is a baptismal font, the sprinkling is done with the water blessed in the font the day before and taken before the oil and chrism were poured in. When the antiphon has been finished as described, the priest who sprinkled the water returns to the altar and, standing before the altar steps with hands joined, says:"], ["v", "Osténde nobis, Dómine, misericórdiam tuam. *(T. P.* Allelúja.*)*", "Show us, O Lord, Your mercy. *(In Eastertide:* Alleluia.*)*"], ["x", "Et salutáre tuum da nobis. *(T. P.* Allelúja.*)*", "And grant us Your salvation. *(In Eastertide:* Alleluia.*)*"], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Exáudi nos, Dómine sancte, Pater omnípotens, ætérne Deus: et míttere dignéris sanctum Angelum tuum de cælis; qui custódiat, fóveat, prótegat, vísitet, atque deféndat omnes habitántes in hoc habitáculo. Per Christum, Dóminum nostrum. ℟. Amen.", "Hear us, holy Lord, Father almighty, everlasting God, and deign to send Your holy Angel from heaven to guard, cherish, protect, visit, and defend all who dwell in this house. Through Christ our Lord. ℟. Amen."]]}, {"id": "wine-st-john", "la": "Benedictio Vini in Festo S. Joannis Apostoli et Evangelistæ", "en": "Blessing of Wine on the Feast of St. John, Apostle and Evangelist", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 2", "b": [["r", "In Festo sancti Joannis Ap. et Evang., expleta omnino Missa majore, hoc est post ultimum Evangelium, Sacerdos, retentis omnibus paramentis, excepto manipulo, vinum a populo oblatum, in memoriam et honorem S. Joannis, qui venenum innocue sumpsit, benedicit hoc modo:", "On the feast of St. John, Apostle and Evangelist, when the principal Mass is completely finished, that is, after the last Gospel, the priest, keeping on all his vestments except the maniple, blesses the wine brought by the people in memory and honor of St. John, who drank poison without harm, in this way:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Bene✠dícere et conse✠cráre dignéris, Dómine Deus, déxtera tua hunc cálicem vini, et cujúslibet potus: et præsta; ut per mérita sancti Joánnis Apóstoli et Evangelístæ, omnes in te credéntes et de cálice isto bibéntes benedicántur, et protegántur. Et sicut beátus Joánnes de cálice bibens venénum, illǽsus omníno permánsit, ita omnes, hac die in honórem beáti Joánnis de cálice isto bibéntes, méritis ipsíus ab omni ægritúdine venéni, et nóxiis quibúsvis absolvántur, et córpore ac ánima se offeréntes, ab omni culpa liberéntur. Per Christum, Dóminum nostrum. ℟. Amen.", "Deign, O Lord God, to ✠ bless and ✠ consecrate with Your right hand this cup of wine and of every drink; and grant that, through the merits of Saint John, Apostle and Evangelist, all who believe in You and drink from this cup may be blessed and protected. And as blessed John drank poison from the cup and remained entirely unharmed, so may all who on this day drink from this cup in honor of blessed John be freed by his merits from every sickness caused by poison and from all harmful things, and, offering themselves in body and soul, be delivered from all guilt. Through Christ our Lord. ℟. Amen."], ["t", "Béne✠dic, Dómine, hanc creatúram potus: ut sit remédium salutáre ómnibus suméntibus: et præsta per invocatiónem sancti nóminis tui; ut, quicúmque ex eo gustáverint, tam ánimæ quam córporis sanitátem te donánte percípiant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord, this creature of drink, that it may be a saving remedy to all who take it; and grant, through the invocation of Your holy name, that whoever tastes of it may, by Your gift, receive health of soul as well as of body. Through Christ our Lord. ℟. Amen."], ["t", "Et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super hanc creatúram vini, et cujúslibet potus, et máneat semper. ℟. Amen.", "And may the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon this creature of wine and of every drink, and remain for ever. ℟. Amen."], ["r", "Et aspergatur aqua benedicta. Quod si benedictio illa fiat privatim extra Missam, Sacerdos, superpelliceo et stola indutus, eam conficiat modo superius tradito.", "And it is sprinkled with holy water. If this blessing is given privately outside Mass, the priest, vested in surplice and stole, performs it in the manner given above."]]}, {"id": "wine-st-john-another", "la": "Alia Benedictio Vini in Festo S. Joannis Apostoli et Evangelistæ", "en": "Another Blessing of Wine on the Feast of St. John", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 3", "b": [["r", "In fine Missæ post Evangelium sancti Joannis, In princípio erat Verbum, dicitur:", "At the end of Mass, after the Gospel of St. John, \"In the beginning was the Word,\" there is said:"], ["h", "Psalmus 22", "Psalm 22"], ["t", "Dóminus regit me, et nihil mihi déerit: * in loco páscuæ ibi me collocávit.", "The Lord rules me, and I shall want nothing; * He has set me in a place of pasture."], ["t", "Super aquam refectiónis educávit me: * ánimam meam convértit.", "He has brought me up on the water of refreshment; * He has restored my soul."], ["t", "Dedúxit me super sémitas justítiæ, * propter nomen suum.", "He has led me on the paths of justice, * for His own name's sake."], ["t", "Nam, et si ambulávero in médio umbræ mortis, non timébo mala: * quóniam tu mecum es.", "For though I should walk in the midst of the shadow of death, I will fear no evils, * for You are with me."], ["t", "Virga tua, et báculus tuus: * ipsa me consoláta sunt.", "Your rod and Your staff, * they have comforted me."], ["t", "Parásti in conspéctu meo mensam, * advérsus eos, qui tríbulant me.", "You have prepared a table before me * against those who afflict me."], ["t", "Impinguásti in óleo caput meum: * et calix meus inébrians quam præclárus est!", "You have anointed my head with oil; * and my chalice which inebriates, how goodly it is!"], ["t", "Et misericórdia tua subsequétur me * ómnibus diébus vitæ meæ.", "And Your mercy will follow me * all the days of my life."], ["t", "Et ut inhábitem in domo Dómini, * in longitúdinem diérum.", "And that I may dwell in the house of the Lord * unto length of days."], ["t", "Glória Patri.", "Glory be to the Father."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvos fac servos tuos.", "Save Your servants."], ["x", "Deus meus, sperántes in te.", "Who hope in You, O my God."], ["v", "Mitte eis, Dómine, auxílium de sancto.", "Send them help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eos.", "And defend them out of Sion."], ["v", "Nihil profíciat inimícus in eis.", "Let the enemy have no power over them."], ["x", "Et fílius iniquitátis non appónat nocére eis.", "And let the son of iniquity do nothing to harm them."], ["v", "Et si mortíferum quid bíberint.", "And if they drink anything deadly,"], ["x", "Non eis nocébit.", "It shall not harm them."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine sancte, Pater omnípotens, ætérne Deus: qui Fílium tuum tibi coætérnum et consubstantiálem de cælis descéndere, et de sacratíssima Vírgine María in hoc témpore plenitúdinis incarnári temporáliter voluísti, ut ovem pérditam et errántem quǽreret, et in húmeris própriis ad ovíle reportáret; nec non ut eum, qui in latrónes íncidit, a vúlnerum suórum dolóre, infúndens ipsi vinum et óleum, curáret; béne✠dic et sanctí✠fica hoc vinum: quod de vite in potum hóminum produxísti, et præsta: ut, quisquis in hac sacra sollemnitáte de eo súmpserit vel bíberit, salútem ánimæ et córporis consequátur: et si in peregrinatióne fúerit, ab eódem, tua grátia mediánte, confortétur; ut via ejus in omni prosperitáte dirigátur. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "Holy Lord, Father almighty, everlasting God, who willed that Your Son, coeternal and consubstantial with You, should come down from heaven and in this fullness of time take flesh of the most holy Virgin Mary, to seek the lost and straying sheep and carry it back to the fold on His own shoulders, and to heal the man who fell among robbers of the pain of his wounds by pouring in wine and oil: ✠ bless and ✠ sanctify this wine, which You have brought forth from the vine for the drink of men; and grant that whoever takes or drinks of it on this holy feast may obtain health of soul and body; and that, if he is on a journey, he may be strengthened by it through Your grace, so that his way may be directed in all prosperity. Through the same Christ our Lord. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Jesu Christe, qui te vitem veram, et sanctos Apóstolos tuos pálmites appellári, et de ómnibus te diligéntibus víneam eléctam plantáre voluísti; béne✠dic hoc vinum, et virtútem ei tuæ benedictiónis infúnde: ut, quicúmque ex eo súmpserit vel bíberit, intercedénte dilécto discípulo tuo Joánne Apóstolo et Evangelísta, síngulis morbis et venénis pestíferis effugátis, sanitátem inde córporis et ánimæ consequátur: Qui vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Lord Jesus Christ, who willed to call Yourself the true vine and Your holy Apostles the branches, and to plant a chosen vineyard of all who love You: ✠ bless this wine and pour into it the power of Your blessing, so that whoever takes or drinks of it may, through the intercession of Your beloved disciple John, Apostle and Evangelist, be rid of every sickness and deadly poison and obtain health of body and soul. Who live and reign for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui humáno géneri panem in cibum, et vinum in potum procreásti, ut panis corpus confórtet, et vinum cor hóminis lætíficet; quique beáto Joánni prædilécto discípulo tuo tantam grátiam contulísti, ut non solum haustum venéni illǽsus eváderet, sed étiam in tua virtúte venéno prostrátos a morte resuscitáret: præsta ómnibus hoc vinum bibéntibus, ut spirituálem lætítiam et vitam cónsequi mereántur ætérnam. Per Dóminum. ℟. Amen.", "O God, who created bread as food and wine as drink for mankind, that bread might strengthen the body and wine gladden the heart of man; and who gave such grace to blessed John, Your beloved disciple, that he not only escaped unharmed after drinking poison but even, by Your power, raised from death those laid low by poison: grant to all who drink this wine that they may be worthy to obtain spiritual joy and life everlasting. Through our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "gold-frankincense-myrrh", "la": "Benedictio Auri, Thuris et Myrrhæ in Festo Epiphaniæ", "en": "Blessing of Gold, Frankincense and Myrrh on the Epiphany", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 4", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Súscipe, sancte Pater, a me indígno fámulo tuo hæc múnera, quæ in honórem nóminis tui sancti, et in títulum omnipoténtiæ tuæ majestátis, humíliter tibi óffero: sicut suscepísti sacrifícium Abel justi, et sicut eádem múnera a tribus Magis tibi quondam offeréntibus suscepísti.", "Receive, holy Father, from me, Your unworthy servant, these gifts which I humbly offer You in honor of Your holy name and in acknowledgment of Your almighty majesty, as You received the sacrifice of just Abel, and as You once received these same gifts from the three Magi who offered them to You."], ["t", "Exorcízo te, creatúra auri, thuris et myrrhæ, per Pa✠trem omnipoténtem, per Jesum ✠ Christum, Fílium ejus unigénitum, et per Spíritum ✠ Sanctum Paráclitum: ut a te discédat omnis fraus, dolus, et nequítia diáboli, et sis remédium salutáre humáno géneri contra insídias inimíci: et quicúmque divíno freti auxílio te in suis lóculis, dómibus, aut circa se habúerint, per virtútem et mérita Dómini et Salvatóris nostri, ac intercessiónem ejus sanctíssimæ Genetrícis et Vírginis Maríæ, ac eórum, qui hódie simílibus munéribus Christum Dóminum veneráti sunt, omniúmque Sanctórum, ab ómnibus perículis ánimæ et córporis liberéntur, et bonis ómnibus pérfrui mereántur. ℟. Amen.", "I exorcise you, creature of gold, frankincense, and myrrh, by the ✠ Father almighty, by Jesus ✠ Christ, His only-begotten Son, and by the Holy ✠ Spirit, the Paraclete: that all deceit, guile, and wickedness of the devil may depart from you, and that you may be a saving remedy to mankind against the snares of the enemy; and that all who, trusting in divine help, keep you in their chests, their homes, or about their persons may, by the power and merits of our Lord and Savior, by the intercession of His most holy Mother, the Virgin Mary, of those who on this day honored Christ the Lord with like gifts, and of all the Saints, be delivered from all dangers of soul and body and be worthy to enjoy all good things. ℟. Amen."], ["t", "Deus invisíbilis et interminábilis, pietátem tuam per sanctum et treméndum Fílii tui nomen, supplíciter deprecámur: ut in hanc creatúram auri, thuris, myrrhæ bene✠dictiónem ac operatiónem tuæ virtútis infúndas: ut, qui ea penes se habúerint, ab omni ægritúdinis et læsiónis incúrsu tuti sint; et omnes morbos córporis et ánimæ effúgiant, nullum dominétur eis perículum, et læti, ac incólumes tibi in Ecclésia tua desérviant: Qui in Trinitáte perfécta vivis et regnas Deus per ómnia sǽcula sæculórum. ℟. Amen.", "O God, invisible and without end, we humbly beseech Your mercy, by the holy and awesome name of Your Son, that You would pour into this creature of gold, frankincense, and myrrh the ✠ blessing and working of Your power, so that those who keep them may be safe from every onset of sickness and injury, may escape all diseases of body and soul, may be ruled by no danger, and may serve You in Your Church joyful and unharmed. Who in perfect Trinity live and reign, God, for ever and ever. ℟. Amen."], ["t", "Et benedíctio Dei omnipoténtis, Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti, descéndat super hanc creatúram auri, thuris et myrrhæ, et máneat semper. ℟. Amen.", "And may the blessing of almighty God, the ✠ Father, and the ✠ Son, and the Holy ✠ Spirit, come down upon this creature of gold, frankincense, and myrrh, and remain for ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "chalk-epiphany", "la": "Benedictio Cretæ in Festo Epiphaniæ", "en": "Blessing of Chalk on the Epiphany", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 5", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine Deus, creatúram istam cretæ: ut sit salutáris humáno géneri; et præsta per invocatiónem nóminis tui sanctíssimi, ut, quicúmque ex ea súmpserint, vel in ea in domus suæ portis scrípserint nómina sanctórum tuórum Gásparis, Melchióris et Baltássar, per eórum intercessiónem et mérita, córporis sanitátem, et ánimæ tutélam percípiant. Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord God, this creature of chalk, that it may be a means of salvation to mankind; and grant, through the invocation of Your most holy name, that whoever takes some of it, or writes with it on the doors of his house the names of Your saints Gaspar, Melchior, and Balthasar, may through their intercession and merits receive health of body and protection of soul. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta.", "And it is sprinkled with holy water."]]}, {"id": "homes-epiphany", "la": "Benedictio Domorum in Festo Epiphaniæ", "en": "Blessing of Homes on the Epiphany", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 6", "b": [["r", "In ingressu:", "On entering:"], ["v", "Pax huic dómui.", "Peace be to this house."], ["x", "Et ómnibus habitántibus in ea.", "And to all who dwell in it."], ["t", "*Ant.* Ab Oriénte venérunt Magi in Béthlehem, adoráre Dóminum: et apértis thesáuris suis pretiósa múnera obtulérunt, aurum Regi magno, thus Deo vero, myrrham sepultúræ ejus. Allelúja.", "*Ant.* From the East came Magi to Bethlehem to adore the Lord; and opening their treasures they offered precious gifts: gold to the great King, incense to the true God, and myrrh for His burial. Alleluia."], ["h", "Canticum beatæ Mariæ Virginis (Luc. 1, 46-55)", "The Canticle of the Blessed Virgin Mary (Luke 1:46-55)"], ["t", "Magníficat * ánima mea Dóminum:", "My soul * magnifies the Lord,"], ["t", "Et exsultávit spíritus meus * in Deo, salutári meo.", "And my spirit has rejoiced * in God my Savior."], ["t", "Quia respéxit humilitátem ancíllæ suæ: * ecce enim ex hoc beátam me dicent omnes generatiónes.", "For He has regarded the lowliness of His handmaid; * for behold, from henceforth all generations shall call me blessed."], ["t", "Quia fecit mihi magna qui potens est: * et sanctum nomen ejus.", "For He who is mighty has done great things for me, * and holy is His name."], ["t", "Et misericórdia ejus a progénie in progénies * timéntibus eum.", "And His mercy is from generation to generation * on those who fear Him."], ["t", "Fecit poténtiam in bráchio suo: * dispérsit supérbos mente cordis sui.", "He has shown might with His arm; * He has scattered the proud in the conceit of their heart."], ["t", "Depósuit poténtes de sede, * et exaltávit húmiles.", "He has put down the mighty from their throne, * and has exalted the lowly."], ["t", "Esuriéntes implévit bonis: * et dívites dimísit inánes.", "He has filled the hungry with good things, * and the rich He has sent away empty."], ["t", "Suscépit Israel, púerum suum, * recordátus misericórdiæ suæ.", "He has received Israel His servant, * being mindful of His mercy,"], ["t", "Sicut locútus est ad patres nostros, * Abraham, et sémini ejus in sǽcula.", "As He spoke to our fathers, * to Abraham and to his seed for ever."], ["t", "Glória Patri.", "Glory be to the Father."], ["r", "Interea aspergitur, et incensatur domus, et in fine repetitur Antiphona: Ab Oriénte venérunt, etc.", "Meanwhile the house is sprinkled and incensed, and at the end the antiphon \"From the East came,\" etc., is repeated."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Omnes de Saba vénient.", "All they from Saba shall come,"], ["x", "Aurum et thus deferéntes.", "Bringing gold and frankincense."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui hodiérna die Unigénitum tuum géntibus stella duce revelásti: concéde propítius; ut, qui jam te ex fide cognóvimus, usque ad contemplándam spéciem tuæ celsitúdinis perducámur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who on this day revealed Your only-begotten Son to the nations by the guidance of a star: mercifully grant that we, who already know You by faith, may be led on to contemplate the beauty of Your majesty. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "*Responsorium.* Illumináre, illumináre, Jerúsalem, quia venit lux tua: et glória Dómini super te orta est, Jesus Christus ex María Vírgine.", "*Responsory.* Arise, be enlightened, O Jerusalem, for your light has come, and the glory of the Lord has risen upon you: Jesus Christ, born of the Virgin Mary."], ["v", "Et ambulábunt gentes in lúmine tuo: et reges in splendóre ortus tui.", "And the nations shall walk in your light, and kings in the brightness of your rising."], ["x", "Et glória Dómini super te orta est.", "And the glory of the Lord has risen upon you."], ["t", "Orémus.", "Let us pray."], ["t", "Béne✠dic, Dómine, Deus omnípotens, locum istum (vel domum istam): ut sit in eo (ea) sánitas, cástitas, victória, virtus, humílitas, bónitas, et mansuetúdo, plenitúdo legis, et gratiárum áctio Deo Patri, et Fílio, et Spirítui Sancto; et hæc benedíctio máneat super hunc locum (vel hanc domum), et super habitántes in eo (ea). Per Christum, Dóminum nostrum. ℟. Amen.", "✠ Bless, O Lord God almighty, this place (or this house), that in it there may be health, chastity, victory, strength, humility, goodness and gentleness, the fullness of the law, and thanksgiving to God the Father, and to the Son, and to the Holy Spirit; and may this blessing remain upon this place (or this house) and upon those who dwell in it. Through Christ our Lord. ℟. Amen."]]}, {"id": "candles-st-blaise", "la": "Benedictio Candelarum in Festo S. Blasii Episcopi et Martyris", "en": "Blessing of Candles on the Feast of St. Blaise, and the Blessing of Throats", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 7", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et mitíssime Deus, qui ómnium mundi rerum diversitátes solo Verbo creásti, et ad hóminum reformatiónem illud idem Verbum, per quod facta sunt ómnia, incarnári voluísti; qui magnus es, et imménsus, terríbilis atque laudábilis, ac fáciens mirabília: pro cujus fídei confessióne gloriósus Martyr et Póntifex Blásius, diversórum tormentórum génera non pavéscens, martyrii palmam felíciter est adéptus: quique eídem, inter céteras grátias, hanc prærogatívam contulísti, ut quoscúmque gútturis morbos tua virtúte curáret; majestátem tuam supplíciter exorámus, ut non inspéctu reátus nostri, sed ejus placátus méritis et précibus, hanc ceræ creatúram bene✠dícere, ac sancti✠ficáre tua venerábili pietáte dignéris, tuam grátiam infundéndo; ut omnes, quorum colla per eam ex bona fide tacta fúerint, a quocúmque gútturis morbo ipsíus passiónis méritis liberéntur, et in Ecclésia sancta tua sani et hílares tibi gratiárum réferant actiónes, laudéntque nomen tuum gloriósum, quod est benedíctum in sǽcula sæculórum. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty and most gentle God, who created the diversity of all things in the world by Your Word alone, and willed that the same Word, by whom all things were made, should take flesh for the renewal of mankind; who are great and boundless, awesome and worthy of praise, the doer of wonders: for the confession of whose faith the glorious martyr and bishop Blaise, not dreading tortures of every kind, happily won the palm of martyrdom; and on whom, among other graces, You bestowed this privilege, that by Your power he should cure all ailments of the throat: we humbly beseech Your majesty that, looking not on our guilt but appeased by his merits and prayers, You would deign in Your venerable goodness to ✠ bless and ✠ sanctify this creature of wax, pouring in Your grace; so that all whose throats are touched with it in good faith may, by the merits of his passion, be delivered from every ailment of the throat, and, healthy and joyful, give thanks to You in Your holy Church and praise Your glorious name, which is blessed for ever and ever. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta. Deinde Sacerdos duos cereos in modum crucis aptatos apponit sub mento gutturi singulorum, qui benedicendi sunt, ipsis ante Altare genuflectentibus, dicens:", "And they are sprinkled with holy water. Then the priest places two candles, arranged in the form of a cross, under the chin against the throat of each person to be blessed, as they kneel before the altar, saying:"], ["t", "Per intercessiónem sancti Blásii, Epíscopi et Mártyris, líberet te Deus a malo gútturis, et a quólibet álio malo. In nómine Patris, et Fílii, ✠ et Spíritus Sancti. ℟. Amen.", "Through the intercession of Saint Blaise, bishop and martyr, may God deliver you from ailments of the throat and from every other evil. In the name of the Father, and of the Son, ✠ and of the Holy Spirit. ℟. Amen."]]}, {"id": "bread-wine-st-blaise", "la": "Benedictio Panis, Vini, Aquæ et Fructuum contra Gutturis Ægritudinem in Festo S. Blasii", "en": "Blessing of Bread, Wine, Water and Fruit against Ailments of the Throat on the Feast of St. Blaise", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 8", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Salvátor mundi Deus, qui hodiérnam diem beatíssimi Blásii martyrio consecrásti, quique eídem inter céteras grátias, hanc prærogatívam contulísti, ut quoscúmque gútturis morbos tua virtúte curáret: ineffábilem misericórdiam tuam supplíciter exorámus, et pétimus; ut hos panes, vinum, aquam et fructus, quæ plebs fidélis tibi devóte hódie ad sanctificándum áttulit, tua pietáte bene✠dícere et sancti✠ficáre dignéris: ut, qui ex his gustáverint, ab omni gútturis plaga, et quávis ália ánimæ et córporis infirmitáte, méritis et intercessióne ejúsdem beáti Blásii Mártyris tui atque Pontíficis, plenam recípiant sanitátem: Qui vivis et regnas Deus in sǽcula sæculórum. ℟. Amen.", "O God, Savior of the world, who consecrated this day by the martyrdom of most blessed Blaise, and on whom, among other graces, You bestowed this privilege, that by Your power he should cure all ailments of the throat: we humbly beseech and entreat Your ineffable mercy that in Your goodness You would deign to ✠ bless and ✠ sanctify these loaves, this wine, water, and fruit, which Your faithful people have devoutly brought to You today to be sanctified; so that those who taste of them may, by the merits and intercession of the same blessed Blaise, Your martyr and bishop, receive full health from every affliction of the throat and every other infirmity of soul and body. Who live and reign, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "field-crosses", "la": "Benedictio Crucium in Agris, Vineis, etc. Plantandarum", "en": "Blessing of Crosses to be Set Up in Fields, Vineyards, etc. (Finding of the Holy Cross)", "cat": "Fields & Animals", "ref": "Appendix, Benedictiones non reservatæ, 9", "b": [["r", "Quæ fit in Festo Inventionis S. Crucis vel Dominica proxima.", "Given on the feast of the Finding of the Holy Cross, or on the nearest Sunday."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, Pater totíus consolatiónis et pietátis, per unigéniti Fílii tui Dómini nostri Jesu Christi acerbíssimæ Passiónis méritum, quam pro nobis peccatóribus in ligno Crucis sustinére dignátus est: béne✠dic has Cruces, quas tui fidéles in hortis, víneis, agris, aliísve locis plantándas áfferunt, ut a prǽdiis quibus defíxæ fúerint, fragor absit grándinum, procélla túrbinum, ímpetus tempestátum, et omnis infestátio inimíci: quátenus eórum fructus ad maturitátem perdúcti, in tui nóminis honórem colligántur a sperántibus in virtúte sanctæ Crucis ejúsdem Fílii tui Dómini nostri Jesu Christi, qui tecum vivit et regnat in sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, Father of all consolation and mercy, by the merit of the most bitter Passion of Your only-begotten Son, our Lord Jesus Christ, which He deigned to endure for us sinners on the wood of the Cross: ✠ bless these crosses, which Your faithful bring to be set up in gardens, vineyards, fields, and other places, so that from the lands where they are planted may be kept away the crash of hail, the whirlwind's blast, the violence of storms, and every attack of the enemy; that their fruits, brought to ripeness, may be gathered in honor of Your name by those who hope in the power of the holy Cross of the same Son, our Lord Jesus Christ, who lives and reigns with You for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."]]}, {"id": "bonfire-st-john", "la": "Benedictio Rogi in Vigilia Nativitatis S. Joannis Baptistæ", "en": "Blessing of the Bonfire on the Vigil of the Nativity of St. John the Baptist", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 10", "b": [["r", "Quæ fit a Clero extra ecclesiam.", "Given by the clergy outside the church."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine Deus, Pater omnípotens, lumen indefíciens, qui es cónditor ómnium lúminum: novum hunc ignem sancti✠fica, et præsta; ut ad te, qui es lumen indefíciens, puris méntibus post hujus sǽculi calíginem perveníre valeámus. Per Christum, Dóminum nostrum. ℟. Amen.", "O Lord God, Father almighty, unfailing light and maker of all lights: ✠ sanctify this new fire, and grant that after the darkness of this world we may come with pure minds to You, who are the unfailing light. Through Christ our Lord. ℟. Amen."], ["r", "Et aspergatur aqua benedicta. Deinde a Clero cantetur sequens Hymnus:", "And it is sprinkled with holy water. Then the clergy sing the following hymn:"], ["t", "Ut queant laxis resonáre fibris / Mira gestórum fámuli tuórum, / Solve pollúti lábii reátum, / Sancte Joánnes.", "That your servants may with loosened voices / sound forth the wonders of your deeds, / take away the guilt of our unclean lips, / O holy John."], ["t", "Núntius celso véniens Olýmpo, / Te patri magnum fore nascitúrum, / Nomen, et vitæ sériem geréndæ, / Ordine promit.", "A messenger coming from high heaven / tells your father that you will be born great, / and sets out in order your name / and the course of your life."], ["t", "Ille promíssi dúbius supérni, / Pérdidit promptæ módulos loquélæ; / Sed reformásti génitus perémptæ / Organa vocis.", "He, doubting the heavenly promise, / lost the ready use of speech; / but at your birth you restored / the powers of his lost voice."], ["t", "Ventris obstrúso récubans cubíli, / Sénseras Regem thálamo manéntem; / Hinc parens nati méritis utérque / Abdita pandit.", "Lying in the hidden chamber of the womb, / you perceived the King abiding in His chamber; / and so, through the merits of their son, / both parents revealed hidden things."], ["t", "Sit decus Patri, genitǽque Proli, / Et tibi compar utriúsque virtus, / Spíritus semper, Deus unus, omni / Témporis ævo. Amen.", "Glory be to the Father and to the begotten Son, / and to You, O Spirit, equal in power with both, / one God for ever, / through every age of time. Amen."], ["v", "Fuit homo missus a Deo.", "There was a man sent from God,"], ["x", "Cui nomen erat Joánnes.", "Whose name was John."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui præséntem diem honorábilem nobis in beáti Joánnis nativitáte fecísti: da pópulis tuis spirituálium grátiam gaudiórum; et ómnium fidélium mentes dírige in viam salútis ætérnæ. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who have made this day honorable for us by the birth of blessed John: give Your peoples the grace of spiritual joys, and direct the minds of all the faithful into the way of eternal salvation. Through Christ our Lord. ℟. Amen."]]}, {"id": "herbs-assumption", "la": "Benedictio Herbarum in Festo Assumptionis B. Mariæ V.", "en": "Blessing of Herbs on the Feast of the Assumption", "cat": "Feasts of the Year", "ref": "Appendix, Benedictiones non reservatæ, 11", "b": [["r", "Absoluta aspersione, si Festum venerit in Dominica, alioquin immediate ante Missam, Sacerdos stans ante Altare, conversus ad populum tenentem herbas vel fructus, dicit voce intellegibili:", "When the sprinkling is finished (if the feast falls on a Sunday), or otherwise immediately before Mass, the priest, standing before the altar and turned toward the people, who hold the herbs or fruits, says in an audible voice:"], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["h", "Psalmus 64", "Psalm 64"], ["t", "Te decet hymnus, Deus, in Sion: * et tibi reddétur votum in Jerúsalem.", "A hymn befits You, O God, in Sion; * and a vow shall be paid to You in Jerusalem."], ["t", "Exáudi oratiónem meam: * ad te omnis caro véniet.", "Hear my prayer; * all flesh shall come to You."], ["t", "Verba iniquórum prævaluérunt super nos: * et impietátibus nostris tu propitiáberis.", "The words of the wicked have prevailed over us, * but You will pardon our transgressions."], ["t", "Beátus, quem elegísti, et assumpsísti: * inhabitábit in átriis tuis.", "Blessed is he whom You have chosen and taken to Yourself; * he shall dwell in Your courts."], ["t", "Replébimur in bonis domus tuæ: * sanctum est templum tuum, mirábile in æquitáte.", "We shall be filled with the good things of Your house; * holy is Your temple, wonderful in justice."], ["t", "Exáudi nos, Deus, salutáris noster, * spes ómnium fínium terræ, et in mari longe.", "Hear us, O God our Savior, * the hope of all the ends of the earth and of those far off on the sea."], ["t", "Præparans montes in virtúte tua, accínctus poténtia: * qui contúrbas profúndum maris sonum flúctuum ejus.", "You prepare the mountains by Your strength, girded with power; * You stir up the depth of the sea, the roar of its waves."], ["t", "Turbabúntur gentes, et timébunt qui hábitant términos a signis tuis: * éxitus matutíni, et véspere delectábis.", "The nations shall be troubled, and those who dwell at the ends of the earth shall fear Your signs; * You shall make the going forth of the morning and the evening rejoice."], ["t", "Visitásti terram, et inebriásti eam: * multiplicásti locupletáre eam.", "You have visited the earth and watered it abundantly; * You have greatly enriched it."], ["t", "Flumen Dei replétum est aquis, parásti cibum illórum: * quóniam ita est præparátio ejus.", "The river of God is filled with water; You have prepared their food, * for so is its preparation."], ["t", "Rivos ejus inébria, multíplica genímina ejus: * in stillicídiis ejus lætábitur gérminans.", "Fill its streams to overflowing, multiply its yield; * the sprouting seed shall rejoice in its showers."], ["t", "Benedíces corónæ anni benignitátis tuæ: * et campi tui replebúntur ubertáte.", "You shall bless the crown of the year with Your goodness, * and Your fields shall be filled with plenty."], ["t", "Pinguéscent speciósa desérti: * et exsultatióne colles accingéntur.", "The beautiful places of the wilderness shall grow rich, * and the hills shall be girded with gladness."], ["t", "Indúti sunt aríetes óvium, et valles abundábunt fruménto: * clamábunt, étenim hymnum dicent.", "The rams of the flock are clothed, and the valleys shall abound with grain; * they shall shout, yes, they shall sing a hymn."], ["t", "Glória Patri.", "Glory be to the Father."], ["v", "Dóminus dabit benignitátem.", "The Lord will give His goodness,"], ["x", "Et terra nostra dabit fructum suum.", "And our earth shall yield its fruit."], ["v", "Rigans montes de superióribus suis.", "You water the hills from Your upper rooms;"], ["x", "De fructu óperum tuórum satiábitur terra.", "The earth shall be filled with the fruit of Your works."], ["v", "Prodúcens fœnum juméntis.", "Bringing forth grass for the cattle,"], ["x", "Et herbam servitúti hóminum.", "And plants for the service of men."], ["v", "Ut edúcas panem de terra.", "That You may bring bread out of the earth,"], ["x", "Et vinum lætíficet cor hóminis.", "And that wine may gladden the heart of man."], ["v", "Ut exhílaret fáciem in óleo.", "That he may make his face cheerful with oil,"], ["x", "Et panis cor hóminis confírmet.", "And that bread may strengthen man's heart."], ["v", "Misit verbum suum, et sanávit eos.", "He sent His word and healed them,"], ["x", "Et erípuit eos de ómnibus interitiónibus eórum.", "And delivered them from all their destruction."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, qui cælum, terram, mare, visibília et invisibília verbo tuo ex níhilo creásti, quique herbas, arborésque ad usus hóminum animaliúmque terram gígnere, et unumquódque juxta seméntem in semetípso fructum habére præcepísti; atque non solum ut herbæ animántibus ad victum, sed ægris étiam corpóribus prodéssent ad medicaméntum, tua ineffábili pietáte concessísti: te súpplici mente et ore deprecámur, ut has divérsi géneris herbas et fructus tua cleméntia bene✠dícas, et supra naturálem a te índitam virtútem, eis benedictiónis tuæ novæ grátiam infúndas; ut ad usum homínibus et juméntis in nómine tuo applicátæ, ómnium morbórum et adversitátum efficiántur præsídium. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, who by Your word created out of nothing heaven, earth, and sea, things visible and invisible; who commanded the earth to bring forth plants and trees for the use of men and animals, each bearing fruit with its seed in itself; and who in Your ineffable goodness granted that plants should serve not only as food for living creatures but also as medicine for sick bodies: with humble heart and voice we beseech You that in Your mercy You would ✠ bless these herbs and fruits of various kinds, and pour into them, beyond the natural power You have given them, the grace of Your new blessing; so that, used in Your name for men and beasts, they may become a protection against all diseases and adversities. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui per Móysen fámulum tuum mandásti fíliis Israel, ut manípulos novórum frúctuum benedicéndos deférrent ad sacerdótes, tolleréntque fructus árboris pulchérrimæ, et lætaréntur coram te Dómino Deo suo: adésto propítius invocatiónibus nostris, et infúnde tuæ bene✠dictiónis abundántiam super nos, et super manípulos novárum frugum, novárum herbárum, et frúctuum collectiónem, quæ cum gratiárum actióne tibi repræsentámus, et in nómine tuo in hac sollemnitáte bene✠dícimus; et concéde, ut homínibus, pecóribus, pecúdibus et juméntis contra morbos, pestes, úlcera, malefícia, incantatiónes, venefícia serpéntum, et aliórum venenosórum animálium et bestiárum morsus, nec non quæcúmque venéna, remédium præstent; atque contra diabólicas illusiónes, et machinatiónes, et fraudes tutámen ferant, in quocúmque loco pósitum vel portátum aut hábitum áliquid ex eis fúerit: quátenus cum manípulis bonórum óperum, méritis beátæ Maríæ Vírginis, cujus assumptiónis festum cólimus, quo ipsa assúmpta est, súscipi mereámur. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who through Moses Your servant commanded the children of Israel to bring their sheaves of new fruits to the priests to be blessed, and to take the fruits of the fairest tree and rejoice before You, the Lord their God: graciously hear our prayers, and pour out the abundance of Your ✠ blessing upon us and upon these sheaves of new grain, new herbs, and the gathered fruits, which we present to You with thanksgiving and ✠ bless in Your name on this feast. Grant that they may be a remedy for men, flocks, herds, and beasts of burden against sickness, pestilence, sores, curses, spells, the poison of serpents and the bites of other venomous animals and beasts, and against every poison; and that they may be a safeguard against the illusions, schemes, and deceits of the devil, wherever any part of them is placed, carried, or kept; so that, with the sheaves of good works, by the merits of the Blessed Virgin Mary, the feast of whose Assumption we keep, we may be worthy to be taken up to where she has been assumed. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui virgam Jesse, Genetrícem Fílii tui Dómini nostri Jesu Christi, hodiérna die ad cælórum fastígia ídeo evexísti, ut per ejus suffrágia et patrocínia fructum ventris illíus, eúndem Fílium tuum, mortalitáti nostræ communicáres: te súpplices exorámus; ut ejúsdem Fílii tui virtúte, ejúsque Genetrícis glorióso patrocínio, istórum terræ frúctuum præsídiis per temporálem ad ætérnam salútem disponámur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who on this day raised to the heights of heaven the rod of Jesse, the Mother of Your Son, our Lord Jesus Christ, so that through her prayers and patronage You might share with our mortal nature the fruit of her womb, Your same Son: we humbly beseech You that by the power of Your Son and the glorious patronage of His Mother, we may, with the help of these fruits of the earth, be made ready through temporal well-being for eternal salvation. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Et benedíctio Dei omnipoténtis, Patris, et Fílii, ✠ et Spíritus Sancti, descéndat super has creatúras, et máneat semper. ℟. Amen.", "And may the blessing of almighty God, the Father, and the Son, ✠ and the Holy Spirit, come down upon these creatures and remain for ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta, et thurificentur.", "And they are sprinkled with holy water and incensed."]]}, {"id": "seeds-nativity-bvm", "la": "Benedictio Seminum et Segetum in Festo Nativitatis B. Mariæ Virg.", "en": "Blessing of Seeds and Seedlings on the Feast of the Nativity of the Blessed Virgin Mary", "cat": "Fields & Animals", "ref": "Appendix, Benedictiones non reservatæ, 12", "b": [["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Dómine sancte, Pater omnípotens, sempitérne Deus: pétimus ac rogámus, ut hos fructus ségetum ac séminum tuis serénis óculis, hilaríque vultu aspícere dignéris: et sicut testátus es Móysi fámulo tuo in terra Ægýpti, dicens: Dic fíliis Israel, cum ingréssi fúerint terram promissiónis, quam eis dabo, ut primítias frúctuum suórum ófferant sacerdótibus, et erunt benedícti: sic et nos rogámus te, Dómine, ut per auxílium misericórdiæ tuæ emíttas super hunc fructum ségetum déxteræ tuæ bene✠dictiónem, quem ad exhibéndum proférre dignéris, ut non súbruat grando, nec aëris inundátio extérminet, sed semper incólumis permáneat, propter usum animárum et córporum, et ad bene abundántem et pleníssimam maturitátem perdúcere dignéris: Qui in Trinitáte perfécta vivis et regnas in sǽcula sæculórum. ℟. Amen.", "Holy Lord, Father almighty, everlasting God, we beg and beseech You to look upon these seeds and seedlings with Your serene eyes and gracious countenance; and as You declared to Your servant Moses in the land of Egypt, saying, \"Tell the children of Israel that when they have entered the land of promise which I will give them, they are to offer the first fruits of their harvest to the priests, and they shall be blessed,\" so we too ask You, O Lord, by the help of Your mercy, to send upon this growing crop the ✠ blessing of Your right hand; that You may deign to bring it forth, that hail may not beat it down nor floods destroy it, but that it may always remain unharmed for the needs of souls and bodies, and that You may bring it to rich and abundant ripeness. Who in perfect Trinity live and reign for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens sempitérne Deus, cæléstis verbi seminátor et cultor, qui nostri cordis áream spiritálibus rastris exérces: adésto propítius précibus nostris, et super agros, quibus si fúerint sémina ínsita, tuam largam benedictiónem infúnde, ac ab eis omnem vim procellárum grátia tuæ defensiónis avérte: ut omnis hic fructus et tua bene✠dictióne repleátur, et ad hórrea sine impediménto pervéniat. Per Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty, everlasting God, sower and tender of the heavenly word, who work the field of our hearts with spiritual rakes: graciously hear our prayers, and pour out Your abundant blessing upon the fields in which the seeds are sown, and by the grace of Your protection turn away from them every violent storm; so that all this harvest may be filled with Your ✠ blessing and reach the barns without hindrance. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta, et, si fieri potest, thurificentur.", "And they are sprinkled with holy water and, if possible, incensed."]]}, {"id": "rosary", "la": "Benedictio Coronarum Sacratissimi Rosarii B. M. V.", "en": "Blessing of Rosaries", "cat": "Objects of Devotion", "ref": "Appendix, Benedictiones propriæ (Ord. Prædicatorum)", "b": [["n", "", "Proper to the Dominican Order. Priests of the Order, and others with the faculty from the Holy See, used this form; the shorter form follows below."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et miséricors Deus, qui propter exímiam caritátem tuam, qua dilexísti nos, Fílium tuum unigénitum, Dóminum nostrum Jesum Christum, de cælis in terram descéndere, et de beatíssimæ Vírginis Maríæ Dóminæ nostræ útero sacratíssimo, Angelo nuntiánte, carnem suscípere, crucémque ac mortem subíre, et tértia die glorióse a mórtuis resúrgere voluísti, ut nos eríperes de potestáte diáboli: obsecrámus imménsam cleméntiam tuam; ut hæc signa Rosárii, in honórem et laudem ejúsdem Genetrícis Fílii tui ab Ecclésia tua fidéli dicáta, bene✠dícas, et sancti✠fices, eísque tantam infúndas virtútem Spíritus ✠ Sancti, ut, quicúmque horum quódlibet secum portáverit, atque in domo sua reverénter tenúerit, et in eis ad te, secúndum hujus sanctæ Societátis institúta, divína contemplándo mystéria devóte oráverit, salúbri et perseveránti devotióne abúndet, sitque consors et párticeps ómnium gratiárum, privilegiórum, et indulgentiárum, quæ eídem Societáti per sanctam Sedem Apostólicam concéssa fuérunt, ab omni hoste visíbili et invisíbili semper et ubíque in hoc sǽculo liberétur, et in éxitu suo ab ipsa beatíssima Vírgine María Dei Genetríce tibi plenus bonis opéribus præsentári mereátur. Per eúndem Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte ejúsdem Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty and merciful God, who, because of the exceeding love with which You loved us, willed that Your only-begotten Son, our Lord Jesus Christ, should come down from heaven to earth, take flesh at the message of an Angel in the most sacred womb of our Lady, the most blessed Virgin Mary, undergo the Cross and death, and rise gloriously from the dead on the third day, to rescue us from the power of the devil: we implore Your boundless mercy that You would ✠ bless and ✠ sanctify these rosaries, dedicated by Your faithful Church to the honor and praise of the same Mother of Your Son, and pour into them such power of the Holy ✠ Spirit that whoever carries any one of them, keeps it reverently in his home, and devoutly prays to You with it, contemplating the divine mysteries according to the rules of this holy Society, may abound in wholesome and persevering devotion; may share and partake in all the graces, privileges, and indulgences granted to this Society by the holy Apostolic See; may be delivered always and everywhere in this world from every enemy, visible and invisible; and at his departure may be worthy to be presented to You, full of good works, by the most blessed Virgin Mary, Mother of God, herself. Through the same Jesus Christ our Lord, Your Son, who lives and reigns with You in the unity of the same Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "Et aspergantur aqua benedicta.", "And they are sprinkled with holy water."], ["h", "Formula brevior benedicendi coronam sacratissimi Rosarii B. M. V.", "Shorter form for blessing a rosary"], ["t", "Ad laudem et glóriam Deíparæ Vírginis Maríæ, in memóriam mysteriórum vitæ, mortis et resurrectiónis ejúsdem Dómini nostri Jesu Christi, bene✠dicátur et sancti✠ficétur hæc sacratíssimi Rosárii coróna: in nómine Patris, et Fílii, ✠ et Spíritus Sancti. Amen.", "To the praise and glory of the Virgin Mary, Mother of God, in memory of the mysteries of the life, death, and resurrection of our same Lord Jesus Christ, may this rosary of the most holy Rosary be ✠ blessed and ✠ sanctified: in the name of the Father, and of the Son, ✠ and of the Holy Spirit. Amen."]]}, {"id": "brown-scapular", "la": "Benedictio et Impositio Scapularis B. M. V. de Monte Carmelo", "en": "Blessing and Investiture with the Brown Scapular of Our Lady of Mount Carmel", "cat": "Sacramentals & Scapulars", "ref": "Appendix, Benedictiones propriæ (Ord. Carmelitarum Discalceatorum)", "b": [["r", "Persona recipienda ad Habitum genuflexa, Sacerdos superpelliceo et stola alba indutus dicat:", "The person to be received into the habit kneels, and the priest, vested in surplice and white stole, says:"], ["t", "*Ant.* Suscépimus, Deus, misericórdiam tuam in médio templi tui: secúndum nomen tuum, Deus, sic et laus tua in fines terræ, justítia plena est déxtera tua.", "*Ant.* We have received Your mercy, O God, in the midst of Your temple; as is Your name, O God, so also is Your praise to the ends of the earth; Your right hand is full of justice."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["t", "Pater noster *(secreto usque ad)*", "Our Father *(silently until)*"], ["v", "Et ne nos indúcas in tentatiónem.", "And lead us not into temptation."], ["x", "Sed líbera nos a malo.", "But deliver us from evil."], ["v", "Salvum (-am) fac servum tuum (ancíllam tuam).", "Save Your servant (handmaid),"], ["x", "Deus meus, sperántem in te.", "Who hopes in You, O my God."], ["v", "Mitte ei, Dómine, auxílium de sancto.", "Send him (her) help, O Lord, from Your holy place."], ["x", "Et de Sion tuére eum (eam).", "And defend him (her) out of Sion."], ["v", "Nihil profíciat inimícus in eo (ea).", "Let the enemy have no power over him (her)."], ["x", "Et fílius iniquitátis non appónat nocére ei.", "And let the son of iniquity do nothing to harm him (her)."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Suscípiat te Christus in número fidélium suórum, et nos, licet indígni, te suscípimus in oratiónibus nostris. Concédat tibi Deus per Unigénitum suum, mediatórem Dei et hóminum, tempus bene vivéndi, locum bene agéndi, constántiam bene perseverándi, et ad ætérnæ vitæ hereditátem felíciter perveniéndi: et sicut nos hódie fratérna cáritas spirituáliter jungit in terris, ita divína píetas, quæ dilectiónis est auctrix et amátrix, nos cum fidélibus suis conjúngere dignétur in cælis. Per eúndem Christum, Dóminum nostrum. ℟. Amen.", "May Christ receive you into the number of His faithful; and we, though unworthy, receive you into our prayers. May God, through His only-begotten Son, the mediator between God and men, grant you time to live well, a place to do good, constancy to persevere in good, and a happy arrival at the inheritance of eternal life. And as fraternal charity unites us spiritually on earth today, so may the divine goodness, which is the author and lover of love, deign to unite us with His faithful in heaven. Through the same Christ our Lord. ℟. Amen."], ["v", "Adjutórium nostrum in nómine Dómini.", "Our help is in the name of the Lord."], ["x", "Qui fecit cælum et terram.", "Who made heaven and earth."], ["v", "Sit nomen Dómini benedíctum.", "Blessed be the name of the Lord."], ["x", "Ex hoc nunc, et usque in sǽculum.", "Now and for ever."], ["v", "Dómine, exáudi oratiónem meam.", "O Lord, hear my prayer."], ["x", "Et clamor meus ad te véniat.", "And let my cry come unto You."], ["v", "Dóminus vobíscum.", "The Lord be with you."], ["x", "Et cum spíritu tuo.", "And with your spirit."], ["t", "Orémus.", "Let us pray."], ["t", "Ætérne Pater et omnípotens Deus, qui Unigénitum tuum vestem nostræ mortalitátis indúere voluísti: obsecrámus, imménsæ tuæ largitátis bene✠dictiónem in hoc genus efflúere vestiménti, quod sancti Patres ad innocéntiæ et humilitátis indícium a renuntiántibus sǽculo gestári sanxérunt; et sic ipsum bene✠dícere dignéris, ut, quicúmque eo usus fúerit, indúere mereátur ipsum Dóminum nostrum Jesum Christum, Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Eternal Father and almighty God, who willed that Your only-begotten Son should put on the garment of our mortality: we implore that the ✠ blessing of Your boundless generosity may flow upon this kind of garment, which the holy Fathers decreed should be worn by those who renounce the world as a sign of innocence and humility; and deign so to ✠ bless it that whoever wears it may be worthy to put on our Lord Jesus Christ Himself, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["t", "Orémus.", "Let us pray."], ["t", "Supplíciter te, Dómine, rogámus, ut super hunc hábitum servo tuo (ancíllæ tuæ) imponéndum bene✠díctio tua benígna descéndat, ut sit bene✠díctus, atque divína virtúte procul pellántur hóstium nostrórum visibílium et invisibílium tela nequíssima. ℟. Amen.", "We humbly beseech You, O Lord, that Your kindly ✠ blessing may come down upon this habit, to be placed upon Your servant (handmaid), so that it may be ✠ blessed, and that by divine power the most wicked weapons of our enemies, visible and invisible, may be driven far away. ℟. Amen."], ["r", "Aspergat Habitum aqua benedicta. Si autem Habitus solum sit benedicendus, incipit a ℣. Adjutórium nostrum, usque ad Orationem Supplíciter, inclusive. Imponens ei Habitum, dicat:", "He sprinkles the habit with holy water. If the habit is only to be blessed, he begins at ℣. \"Our help\" and continues through the prayer \"We humbly beseech,\" inclusive. Placing the habit upon the person, he says:"], ["t", "Accipe, vir devóte (múlier devóta), hunc hábitum benedíctum: precans sanctíssimam Vírginem, ut ejus méritis illum pérferas sine mácula, et te ab omni adversitáte deféndat, atque ad vitam perdúcat ætérnam. ℟. Amen.", "Receive, devout man (woman), this blessed habit, asking the most holy Virgin that by her merits you may wear it without stain, and that she may defend you from all adversity and lead you to life everlasting. ℟. Amen."], ["t", "Adésto, Dómine, supplicatiónibus nostris: et hunc fámulum tuum, quem (hanc fámulam tuam, quam) Sodalitáti sanctæ Religiónis Carmelitárum sociámus, perpétua tríbue firmitáte corroborári, ut, perseveránti propósito, in omni sanctitáte tibi váleat famulári.", "Be attentive, O Lord, to our prayers, and grant that this Your servant, whom we are associating with the Confraternity of the holy Order of Carmelites, may be strengthened with lasting steadfastness, so that with persevering purpose he (she) may serve You in all holiness."], ["t", "Prótege, Dómine, fámulum tuum (fámulam tuam) subsídiis pacis, et beátæ Maríæ semper Vírginis patrocíniis confidéntem, a cunctis hóstibus redde secúrum (-am).", "Protect, O Lord, with the help of peace, Your servant who trusts in the patronage of blessed Mary ever Virgin, and make him (her) safe from all enemies."], ["t", "Bene✠dícat te Cónditor cæli et terræ, Deus omnípotens, qui te elígere dignátus est ad beatíssimæ Vírginis Maríæ de Monte Carmélo Societátem et Confraternitátem: quam precámur, ut in hora óbitus tui cónterat caput serpéntis, qui tibi est adversárius, et tandem tamquam victor (victrix) palmam, et corónam sempitérnæ hereditátis consequáris. Per Christum, Dóminum nostrum. ℟. Amen.", "May the Creator of heaven and earth, God almighty, who has deigned to choose you for the Society and Confraternity of the most blessed Virgin Mary of Mount Carmel, ✠ bless you; and may she, we pray, crush at the hour of your death the head of the serpent who is your adversary, so that at last, as a victor, you may win the palm and the crown of the everlasting inheritance. Through Christ our Lord. ℟. Amen."], ["r", "Deinde aspergat Confratrem aqua benedicta, et subjungat:", "Then he sprinkles the new member with holy water, and adds:"], ["t", "Ego auctoritáte, qua fungor, et mihi concéssa, recípio te ad Confraternitátem sacræ Religiónis Carmelitárum, et invéstio, ac partícipem te fácio ómnium bonórum spirituálium ejúsdem Ordinis. In nómine Patris, et Fílii, ✠ et Spíritus Sancti. ℟. Amen.", "By the authority which I exercise and which has been granted to me, I receive you into the Confraternity of the holy Order of Carmelites, I invest you, and I make you a sharer in all the spiritual goods of the same Order. In the name of the Father, and of the Son, ✠ and of the Holy Spirit. ℟. Amen."], ["r", "His expletis, Sacerdos Confratrem paucis sed efficacioribus verbis adhortetur ad caute, pie, sancteque vivendum, ad onera omnia adimplenda tum generalia pro omnibus Confratribus, tum specialia pro iis, qui gaudere volunt privilegio, vulgo nuncupato Sabbatino (circa quæ eundem sufficienter instruat), atque ad Virginem Deiparam in posterum peculiaribus devotionis obsequiis assidue colendam, eamque veluti singularem ac dulcissimam Matrem filiali et sincero affectu prosequendam.", "When this is finished, the priest, in few but forceful words, exhorts the new member to live carefully, piously, and holily; to fulfill all the obligations, both those general to all members and those particular to those who wish to enjoy the privilege commonly called \"Sabbatine\" (on which he should instruct him sufficiently); and from now on to honor the Virgin Mother of God assiduously with special acts of devotion, and to love her with sincere, filial affection as a singular and most sweet Mother."], ["h", "Formula brevior benedicendi et imponendi Scapulare B. M. V. de Monte Carmelo", "Shorter form for blessing and imposing the scapular"], ["r", "Quæ adhiberi potest, præsertim in privatis receptionibus, vel occasione magni concursus. Persona recipienda ad Habitum genuflexa, Sacerdos superpelliceo et stola albi coloris, aut saltem stola indutus, dicat:", "This may be used especially for private receptions, or when many are to be received. The person to be received kneels, and the priest, vested in surplice and white stole, or at least in a stole, says:"], ["v", "Osténde nobis, Dómine, misericórdiam tuam.", "Show us, O Lord, Your mercy."], ["x", "Et salutáre
