_", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte, Deus, _miserére nobis._", "God the Holy Spirit, _have mercy on us._"], ["t", "Sancta Trínitas, unus Deus, _miserére nobis._", "Holy Trinity, one God, _have mercy on us._"], ["t", "Sancta María, _ora pro nobis._", "Holy Mary, _pray for us._"], ["t", "Sancta Dei Génetrix, _ora pro nobis._", "Holy Mother of God, _pray for us._"], ["t", "Sancta Virgo vírginum, _ora pro nobis._", "Holy Virgin of virgins, _pray for us._"], ["t", "Sancte Míchaël, _ora pro nobis._", "Saint Michael, _pray for us._"], ["t", "Sancte Gábriel, _ora pro nobis._", "Saint Gabriel, _pray for us._"], ["t", "Sancte Ráphaël, _ora pro nobis._", "Saint Raphael, _pray for us._"], ["t", "Omnes sancti Ángeli et Archángeli, _oráte pro nobis._", "All you holy Angels and Archangels, _pray for us._"], ["t", "Omnes sancti beatórum Spirítuum órdines, _oráte pro nobis._", "All you holy orders of blessed Spirits, _pray for us._"], ["t", "Sancte Joánnes Baptísta, _ora pro nobis._", "Saint John the Baptist, _pray for us._"], ["t", "Sancte Joseph, _ora pro nobis._", "Saint Joseph, _pray for us._"], ["t", "Omnes sancti Patriárchæ et Prophétæ, _oráte pro nobis._", "All you holy Patriarchs and Prophets, _pray for us._"], ["t", "Sancte Petre, _ora pro nobis._", "Saint Peter, _pray for us._"], ["t", "Sancte Paule, _ora pro nobis._", "Saint Paul, _pray for us._"], ["t", "Sancte Andréa, _ora pro nobis._", "Saint Andrew, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Joánnes, _ora pro nobis._", "Saint John, _pray for us._"], ["t", "Sancte Thoma, _ora pro nobis._", "Saint Thomas, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Philíppe, _ora pro nobis._", "Saint Philip, _pray for us._"], ["t", "Sancte Bartholomǽe, _ora pro nobis._", "Saint Bartholomew, _pray for us._"], ["t", "Sancte Matthǽe, _ora pro nobis._", "Saint Matthew, _pray for us._"], ["t", "Sancte Simon, _ora pro nobis._", "Saint Simon, _pray for us._"], ["t", "Sancte Thaddǽe, _ora pro nobis._", "Saint Thaddeus, _pray for us._"], ["t", "Sancte Matthía, _ora pro nobis._", "Saint Matthias, _pray for us._"], ["t", "Sancte Bárnaba, _ora pro nobis._", "Saint Barnabas, _pray for us._"], ["t", "Sancte Luca, _ora pro nobis._", "Saint Luke, _pray for us._"], ["t", "Sancte Marce, _ora pro nobis._", "Saint Mark, _pray for us._"], ["t", "Omnes sancti Apóstoli et Evangelístæ, _oráte pro nobis._", "All you holy Apostles and Evangelists, _pray for us._"], ["t", "Omnes sancti Discípuli Dómini, _oráte pro nobis._", "All you holy Disciples of the Lord, _pray for us._"], ["t", "Omnes sancti Innocéntes, _oráte pro nobis._", "All you holy Innocents, _pray for us._"], ["t", "Sancte Stéphane, _ora pro nobis._", "Saint Stephen, _pray for us._"], ["t", "Sancte Laurénti, _ora pro nobis._", "Saint Lawrence, _pray for us._"], ["t", "Sancte Vincénti, _ora pro nobis._", "Saint Vincent, _pray for us._"], ["t", "Sancti Fabiáne et Sebastiáne, _oráte pro nobis._", "Saints Fabian and Sebastian, _pray for us._"], ["t", "Sancti Joánnes et Paule, _oráte pro nobis._", "Saints John and Paul, _pray for us._"], ["t", "Sancti Cosma et Damiáne, _oráte pro nobis._", "Saints Cosmas and Damian, _pray for us._"], ["t", "Sancti Gervási et Protási, _oráte pro nobis._", "Saints Gervase and Protase, _pray for us._"], ["t", "Omnes sancti Mártyres, _oráte pro nobis._", "All you holy Martyrs, _pray for us._"], ["t", "Sancte Silvéster, _ora pro nobis._", "Saint Sylvester, _pray for us._"], ["t", "Sancte Gregóri, _ora pro nobis._", "Saint Gregory, _pray for us._"], ["t", "Sancte Ambrósi, _ora pro nobis._", "Saint Ambrose, _pray for us._"], ["t", "Sancte Augustíne, _ora pro nobis._", "Saint Augustine, _pray for us._"], ["t", "Sancte Hierónyme, _ora pro nobis._", "Saint Jerome, _pray for us._"], ["t", "Sancte Martíne, _ora pro nobis._", "Saint Martin, _pray for us._"], ["t", "Sancte Nicoláe, _ora pro nobis._", "Saint Nicholas, _pray for us._"], ["t", "Omnes sancti Pontífices et Confessóres, _oráte pro nobis._", "All you holy Bishops and Confessors, _pray for us._"], ["t", "Omnes sancti Doctóres, _oráte pro nobis._", "All you holy Doctors, _pray for us._"], ["t", "Sancte Antóni, _ora pro nobis._", "Saint Anthony, _pray for us._"], ["t", "Sancte Benedícte, _ora pro nobis._", "Saint Benedict, _pray for us._"], ["t", "Sancte Bernárde, _ora pro nobis._", "Saint Bernard, _pray for us._"], ["t", "Sancte Domínice, _ora pro nobis._", "Saint Dominic, _pray for us._"], ["t", "Sancte Francísce, _ora pro nobis._", "Saint Francis, _pray for us._"], ["t", "Omnes sancti Sacerdótes et Levítæ, _oráte pro nobis._", "All you holy Priests and Levites, _pray for us._"], ["t", "Omnes sancti Mónachi et Eremítæ, _oráte pro nobis._", "All you holy Monks and Hermits, _pray for us._"], ["t", "Sancta María Magdaléna, _ora pro nobis._", "Saint Mary Magdalene, _pray for us._"], ["t", "Sancta Ágatha, _ora pro nobis._", "Saint Agatha, _pray for us._"], ["t", "Sancta Lúcia, _ora pro nobis._", "Saint Lucy, _pray for us._"], ["t", "Sancta Agnes, _ora pro nobis._", "Saint Agnes, _pray for us._"], ["t", "Sancta Cæcília, _ora pro nobis._", "Saint Cecilia, _pray for us._"], ["t", "Sancta Catharína, _ora pro nobis._", "Saint Catherine, _pray for us._"], ["t", "Sancta Anastásia, _ora pro nobis._", "Saint Anastasia, _pray for us._"], ["t", "Omnes sanctæ Vírgines et Víduæ, _oráte pro nobis._", "All you holy Virgins and Widows, _pray for us._"], ["t", "Omnes Sancti et Sanctæ Dei, _intercédite pro nobis._", "All you holy men and women, Saints of God, _intercede for us._"], ["t", "Propítius esto, _parce nobis, Dómine._", "Be merciful, _spare us, O Lord._"], ["t", "Propítius esto, _exáudi nos, Dómine._", "Be merciful, _graciously hear us, O Lord._"], ["t", "Ab omni malo, _líbera nos, Dómine._", "From all evil, _deliver us, O Lord._"], ["t", "Ab omni peccáto, _líbera nos, Dómine._", "From all sin, _deliver us, O Lord._"], ["t", "Ab ira tua, _líbera nos, Dómine._", "From Your wrath, _deliver us, O Lord._"], ["t", "A subitánea et improvísa morte, _líbera nos, Dómine._", "From sudden and unprovided death, _deliver us, O Lord._"], ["t", "Ab insídiis diáboli, _líbera nos, Dómine._", "From the snares of the devil, _deliver us, O Lord._"], ["t", "Ab ira, et ódio, et omni mala voluntáte, _líbera nos, Dómine._", "From anger, and hatred, and every evil will, _deliver us, O Lord._"], ["t", "A spíritu fornicatiónis, _líbera nos, Dómine._", "From the spirit of fornication, _deliver us, O Lord._"], ["t", "A fúlgure et tempestáte, _líbera nos, Dómine._", "From lightning and tempest, _deliver us, O Lord._"], ["t", "A flagéllo terræmótus, _líbera nos, Dómine._", "From the scourge of earthquake, _deliver us, O Lord._"], ["t", "A peste, fame et bello, _líbera nos, Dómine._", "From plague, famine, and war, _deliver us, O Lord._"], ["t", "A morte perpétua, _líbera nos, Dómine._", "From everlasting death, _deliver us, O Lord._"], ["t", "Per mystérium sanctæ Incarnatiónis tuæ, _líbera nos, Dómine._", "Through the mystery of Your holy Incarnation, _deliver us, O Lord._"], ["t", "Per advéntum tuum, _líbera nos, Dómine._", "Through Your coming, _deliver us, O Lord._"], ["t", "Per nativitátem tuam, _líbera nos, Dómine._", "Through Your birth, _deliver us, O Lord._"], ["t", "Per baptísmum et sanctum jejúnium tuum, _líbera nos, Dómine._", "Through Your baptism and holy fasting, _deliver us, O Lord._"], ["t", "Per crucem et passiónem tuam, _líbera nos, Dómine._", "Through Your Cross and Passion, _deliver us, O Lord._"], ["t", "Per mortem et sepultúram tuam, _líbera nos, Dómine._", "Through Your death and burial, _deliver us, O Lord._"], ["t", "Per sanctam resurrectiónem tuam, _líbera nos, Dómine._", "Through Your holy resurrection, _deliver us, O Lord._"], ["t", "Per admirábilem ascensiónem tuam, _líbera nos, Dómine._", "Through Your wonderful ascension, _deliver us, O Lord._"], ["t", "Per advéntum Spíritus Sancti Parácliti, _líbera nos, Dómine._", "Through the coming of the Holy Spirit, the Paraclete, _deliver us, O Lord._"], ["t", "In die judícii, _líbera nos, Dómine._", "In the day of judgment, _deliver us, O Lord._"], ["t", "Peccatóres, _te rogámus, audi nos._", "We sinners, _we beseech You, hear us._"], ["t", "Ut nobis parcas, _te rogámus, audi nos._", "That You spare us, _we beseech You, hear us._"], ["t", "Ut nobis indúlgeas, _te rogámus, audi nos._", "That You pardon us, _we beseech You, hear us._"], ["t", "Ut ad veram pœniténtiam nos perdúcere dignéris, _te rogámus, audi nos._", "That You deign to bring us to true repentance, _we beseech You, hear us._"], ["t", "Ut Ecclésiam tuam sanctam régere et conserváre dignéris, _te rogámus, audi nos._", "That You deign to govern and preserve Your holy Church, _we beseech You, hear us._"], ["t", "Ut Domnum Apostólicum et omnes ecclesiásticos órdines in sancta religióne conserváre dignéris, _te rogámus, audi nos._", "That You deign to preserve the Apostolic Lord and all ranks of the Church in holy religion, _we beseech You, hear us._"], ["t", "Ut inimícos sanctæ Ecclésiæ humiliáre dignéris, _te rogámus, audi nos._", "That You deign to humble the enemies of holy Church, _we beseech You, hear us._"], ["t", "Ut régibus et princípibus christiánis pacem et veram concórdiam donáre dignéris, _te rogámus, audi nos._", "That You deign to give peace and true concord to Christian kings and rulers, _we beseech You, hear us._"], ["t", "Ut cuncto pópulo christiáno pacem et unitátem largíri dignéris, _te rogámus, audi nos._", "That You deign to grant peace and unity to all Christian people, _we beseech You, hear us._"], ["t", "Ut omnes errántes ad unitátem Ecclésiæ revocáre, et infidéles univérsos ad Evangélii lumen perdúcere dignéris, _te rogámus, audi nos._", "That You deign to call back all who have strayed to the unity of the Church, and to lead all unbelievers to the light of the Gospel, _we beseech You, hear us._"], ["t", "Ut nosmetípsos in tuo sancto servítio confortáre et conserváre dignéris, _te rogámus, audi nos._", "That You deign to strengthen and keep us in Your holy service, _we beseech You, hear us._"], ["t", "Ut mentes nostras ad cæléstia desidéria érigas, _te rogámus, audi nos._", "That You lift up our minds to heavenly desires, _we beseech You, hear us._"], ["t", "Ut ómnibus benefactóribus nostris sempitérna bona retríbuas, _te rogámus, audi nos._", "That You render eternal blessings to all our benefactors, _we beseech You, hear us._"], ["t", "Ut ánimas nostras, fratrum, propinquórum et benefactórum nostrórum ab ætérna damnatióne erípias, _te rogámus, audi nos._", "That You deliver our souls and the souls of our brethren, relatives, and benefactors from eternal damnation, _we beseech You, hear us._"], ["t", "Ut fructus terræ dare et conserváre dignéris, _te rogámus, audi nos._", "That You deign to give and preserve the fruits of the earth, _we beseech You, hear us._"], ["t", "Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris, _te rogámus, audi nos._", "That You deign to grant eternal rest to all the faithful departed, _we beseech You, hear us._"], ["t", "Ut nos exaudíre dignéris, _te rogámus, audi nos._", "That You deign graciously to hear us, _we beseech You, hear us._"], ["t", "Fili Dei, _te rogámus, audi nos._", "Son of God, _we beseech You, hear us._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _parce nobis, Dómine._", "Lamb of God, who take away the sins of the world, _spare us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _exáudi nos, Dómine._", "Lamb of God, who take away the sins of the world, _graciously hear us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _miserére nobis._", "Lamb of God, who take away the sins of the world, _have mercy on us._"], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["r", "Quibus dictis, parato cæmento, et cæmentario assistente, Sacerdos inchoat, Clericis prosequentibus, Antiphonam:", "When the Litany is finished, the mortar having been prepared and the mason standing by, the priest begins the antiphon, and the clerics continue:"], ["t", "*Ant.* Mane surgens Jacob, erigébat lápidem in títulum: fundens óleum désuper, votum vovit Dómino: Vere locus iste sanctus est, et ego nesciébam.", "*Ant.* Rising in the morning, Jacob set up the stone as a monument, pouring oil upon it; he made a vow to the Lord: Truly this place is holy, and I knew it not."], ["h", "Psalmus 126", "Psalm 126"], ["t", "Nisi Dóminus ædificáverit domum, * in vanum laboravérunt qui ædíficant eam.", "Unless the Lord builds the house, * they labor in vain who build it."], ["t", "Nisi Dóminus custodíerit civitátem, * frustra vígilat qui custódit eam.", "Unless the Lord guards the city, * he watches in vain who guards it."], ["t", "Vanum est vobis ante lucem súrgere: * súrgite postquam sedéritis, qui manducátis panem dolóris.", "It is vain for you to rise before light; * rise after you have rested, you who eat the bread of sorrow."], ["t", "Cum déderit diléctis suis somnum: * ecce heréditas Dómini fílii: merces, fructus ventris.", "For He gives sleep to His beloved; * behold, children are the inheritance of the Lord, the fruit of the womb a reward."], ["t", "Sicut sagíttæ in manu poténtis: * ita fílii excussórum.", "Like arrows in the hand of a mighty man, * so are the children of the young."], ["t", "Beátus vir qui implévit desidérium suum ex ipsis: * non confundétur cum loquétur inimícis suis in porta.", "Blessed is the man whose desire is fulfilled with them; * he shall not be put to shame when he speaks with his enemies in the gate."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["r", "8. Quo dicto, Sacerdos stans ponit ipsum primarium lapidem in fundamento, vel saltem illum tangit, dicens:", "8. When the psalm is finished, the priest, standing, places the cornerstone in the foundation, or at least touches it, saying:"], ["t", "In fide Jesu Christi collocámus lápidem istum primárium in hoc fundaménto, in nómine Pa✠tris, et Fí✠lii, et Spíritus ✠ Sancti: ut vígeat vera fides hic, et timor Dei, fratérnaque diléctio; et sit hic locus destinátus oratióni, et ad invocándum, et laudándum nomen ejúsdem Dómini nostri Jesu Christi, qui cum Patre et Spíritu Sancto vivit et regnat Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "In the faith of Jesus Christ we lay this cornerstone in this foundation, in the name of the ✠ Father, and of the ✠ Son, and of the Holy ✠ Spirit, that here true faith may flourish, and the fear of God, and brotherly love; and that this place may be set apart for prayer and for calling upon and praising the name of the same our Lord Jesus Christ, who with the Father and the Holy Spirit lives and reigns, God, for ever and ever. ℟. Amen."], ["r", "9. Interim cæmentarius aptat ipsum lapidem cum cæmento: postea Sacerdos spargit super lapidem aquam benedictam, dicens:", "9. Meanwhile the mason sets the stone in mortar; then the priest sprinkles holy water upon the stone, saying:"], ["t", "Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["r", "Deinde dicitur totus Psalmus Miserére mei, Deus, cum Glória Patri.", "Then the whole psalm \"Have mercy on me, O God\" is said, with the Glory be."], ["h", "Psalmus 50", "Psalm 50"], ["t", "Miserére mei, Deus, * secúndum magnam misericórdiam tuam.", "Have mercy on me, O God, * according to Your great mercy."], ["t", "Et secúndum multitúdinem miseratiónum tuárum, * dele iniquitátem meam.", "And according to the multitude of Your tender mercies * blot out my iniquity."], ["t", "Ámplius lava me ab iniquitáte mea: * et a peccáto meo munda me.", "Wash me yet more from my iniquity, * and cleanse me from my sin."], ["t", "Quóniam iniquitátem meam ego cognósco: * et peccátum meum contra me est semper.", "For I know my iniquity, * and my sin is always before me."], ["t", "Tibi soli peccávi, et malum coram te feci: * ut justificéris in sermónibus tuis, et vincas cum judicáris.", "Against You alone have I sinned and done evil in Your sight, * that You may be justified in Your words and prevail when You are judged."], ["t", "Ecce enim in iniquitátibus concéptus sum: * et in peccátis concépit me mater mea.", "For behold, I was conceived in iniquities, * and in sins did my mother conceive me."], ["t", "Ecce enim veritátem dilexísti: * incérta et occúlta sapiéntiæ tuæ manifestásti mihi.", "For behold, You have loved truth; * the uncertain and hidden things of Your wisdom You have made known to me."], ["t", "Aspérges me hyssópo, et mundábor: * lavábis me, et super nivem dealbábor.", "You will sprinkle me with hyssop, and I shall be cleansed; * You will wash me, and I shall be made whiter than snow."], ["t", "Audítui meo dabis gáudium et lætítiam: * et exsultábunt ossa humiliáta.", "To my hearing You will give joy and gladness, * and the bones that were humbled shall rejoice."], ["t", "Avérte fáciem tuam a peccátis meis: * et omnes iniquitátes meas dele.", "Turn away Your face from my sins, * and blot out all my iniquities."], ["t", "Cor mundum crea in me, Deus: * et spíritum rectum ínnova in viscéribus meis.", "Create a clean heart in me, O God, * and renew a right spirit within me."], ["t", "Ne projícias me a fácie tua: * et spíritum sanctum tuum ne áuferas a me.", "Cast me not away from Your face, * and take not Your holy spirit from me."], ["t", "Redde mihi lætítiam salutáris tui: * et spíritu principáli confírma me.", "Restore to me the joy of Your salvation, * and strengthen me with a willing spirit."], ["t", "Docébo iníquos vias tuas: * et ímpii ad te converténtur.", "I will teach the unjust Your ways, * and the wicked shall be converted to You."], ["t", "Líbera me de sanguínibus, Deus, Deus salútis meæ: * et exsultábit lingua mea justítiam tuam.", "Deliver me from blood, O God, the God of my salvation, * and my tongue shall extol Your justice."], ["t", "Dómine, lábia mea apéries: * et os meum annuntiábit laudem tuam.", "O Lord, You will open my lips, * and my mouth shall declare Your praise."], ["t", "Quóniam si voluísses sacrifícium, dedíssem útique: * holocáustis non delectáberis.", "For if You had desired sacrifice, I would surely have given it; * with burnt offerings You will not be delighted."], ["t", "Sacrifícium Deo spíritus contribulátus: * cor contrítum, et humiliátum, Deus, non despícies.", "A sacrifice to God is an afflicted spirit; * a contrite and humbled heart, O God, You will not despise."], ["t", "Benígne fac, Dómine, in bona voluntáte tua Sion: * ut ædificéntur muri Jerúsalem.", "Deal favorably, O Lord, in Your good will with Sion, * that the walls of Jerusalem may be built up."], ["t", "Tunc acceptábis sacrifícium justítiæ, oblatiónes, et holocáusta: * tunc impónent super altáre tuum vítulos.", "Then You will accept the sacrifice of justice, oblations and whole burnt offerings; * then shall they lay calves upon Your altar."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["r", "Quo dicto, Sacerdos spargit aquam benedictam per omnia fundamenta, si sunt aperta: si vero non sunt aperta, circuit aspergendo fundamenta ecclesiæ designata, hoc modo. Incipiens aspergere, inchoat, Clero prosequente, Antiphonam:", "After this the priest sprinkles holy water over all the foundations, if they are open; if they are not open, he goes around sprinkling the marked-out foundations of the church in this manner. As he begins to sprinkle, he intones the antiphon, and the clergy continue:"], ["t", "*Ant.* O quam metuéndus est locus iste! Vere non est hic áliud, nisi domus Dei, et porta cæli.", "*Ant.* How awesome is this place! Truly this is none other than the house of God and the gate of heaven."], ["h", "Psalmus 86", "Psalm 86"], ["t", "Fundaménta ejus in móntibus sanctis: * díligit Dóminus portas Sion super ómnia tabernácula Jacob.", "Its foundations are upon the holy mountains; * the Lord loves the gates of Sion above all the dwellings of Jacob."], ["t", "Gloriósa dicta sunt de te, * cívitas Dei.", "Glorious things are said of you, * O city of God."], ["t", "Memor ero Rahab, et Babylónis * sciéntium me.", "I will be mindful of Rahab and of Babylon, * who know me."], ["t", "Ecce alienígenæ, et Tyrus, et pópulus Æthíopum, * hi fuérunt illic.", "Behold, the foreigners, and Tyre, and the people of the Ethiopians: * these were there."], ["t", "Numquid Sion dicet: Homo, et homo natus est in ea: * et ipse fundávit eam Altíssimus?", "Shall it not be said of Sion: This man and that man was born in her, * and the Most High Himself has founded her?"], ["t", "Dóminus narrábit in scriptúris populórum, et príncipum: * horum, qui fuérunt in ea.", "The Lord shall tell in His record of peoples and of princes * of those who have been in her."], ["t", "Sicut lætántium ómnium * habitátio est in te.", "The dwelling in you * is as of all who rejoice."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* O quam metuéndus est locus iste! Vere non est hic áliud, nisi domus Dei, et porta cæli.", "*Ant.* How awesome is this place! Truly this is none other than the house of God and the gate of heaven."], ["r", "10. Interim aspergendo procedit usque ad fundamenta aperta, seu designata, et repetita Antiphona a Clero, Sacerdos stans dicit:", "10. Meanwhile he proceeds, sprinkling, as far as the open or marked-out foundations; and when the clergy have repeated the antiphon, the priest, standing, says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Omnípotens et miséricors Deus, qui Sacerdótibus tuis tantam præ céteris grátiam contulísti, ut quidquid in tuo nómine digne, perfectéque ab eis ágitur, a te fíeri credátur: quǽsumus imménsam cleméntiam tuam; ut quidquid modo visitatúri sumus, vísites; et quidquid benedictúri sumus, bene✠dícas; sitque ad nostræ humilitátis intróitum, Sanctórum tuórum méritis, fuga dæmonum, Ángeli pacis ingréssus. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty and merciful God, who have bestowed on Your priests a grace so far beyond others that whatever is done worthily and perfectly by them in Your name is believed to be done by You: we beseech Your boundless mercy that whatever we are now about to visit You may visit, and whatever we are about to bless You may ✠ bless; and that, at the entrance of our lowliness, through the merits of Your Saints, the demons may flee and the Angel of peace may enter. Through Christ our Lord. ℟. Amen."], ["t", "Deus, qui ex ómnium cohabitatióne Sanctórum ætérnum majestáti tuæ condis habitáculum: da ædificatióni tuæ increménta cæléstia; ut, quod te jubénte fundátur, te largiénte perficiátur. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who from the fellowship of all the Saints build an eternal dwelling for Your majesty: give heavenly increase to this building of Yours, that what is founded at Your command may by Your bounty be brought to completion. Through Christ our Lord. ℟. Amen."]]}, {"id": "new-church", "la": "Ritus Benedicendi Novam Ecclesiam seu Oratorium Publicum", "en": "Blessing of a New Church or Public Oratory", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 27", "b": [["r", "1. Sacerdos novam ecclesiam seu oratorium publicum de licentia Ordinarii benedicturus, ut ibi divinum Missæ sacrificium rite celebretur, amictu, alba, cingulo, stola ac pluviali albi coloris indutus, aliquot Clericis adhibitis, prælata Cruce media inter duos Clericos deferentes cereos accensos, mane procedit ad primariam ecclesiæ, vel oratorii januam: ubi stans capite aperto, conversus ad eam dicat absolute Orationem:", "1. The priest who, with the permission of the Ordinary, is to bless a new church or public oratory so that the divine Sacrifice of the Mass may lawfully be celebrated there, vested in amice, alb, cincture, stole, and white cope, and attended by several clerics, with the cross carried before him between two clerics bearing lighted candles, goes in the morning to the main door of the church or oratory. Standing there bareheaded and facing it, he says the following prayer without \"Let us pray\":"], ["t", "Actiónes nostras, quǽsumus, Dómine, aspirándo prǽveni, et adjuvándo proséquere: ut cuncta nostra orátio et operátio a te semper incípiat, et per te cœpta finiátur. Per Christum, Dóminum nostrum. ℟. Amen.", "Direct our actions, we beseech You, O Lord, by Your inspiration, and further them by Your help, that every prayer and work of ours may always begin with You and, begun through You, be brought to completion. Through Christ our Lord. ℟. Amen."], ["r", "2. Deinde inchoat, Clero prosequente, Antiphonam:", "2. Then he intones the antiphon, and the clergy continue:"], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["r", "Et Clerus alternatim dicit Psalmum Miserére: in fine Glória Patri.", "And the clergy say the psalm \"Have mercy\" in alternation, with the Glory be at the end."], ["h", "Psalmus 50", "Psalm 50"], ["t", "Miserére mei, Deus, * secúndum magnam misericórdiam tuam.", "Have mercy on me, O God, * according to Your great mercy."], ["t", "Et secúndum multitúdinem miseratiónum tuárum, * dele iniquitátem meam.", "And according to the multitude of Your tender mercies * blot out my iniquity."], ["t", "Ámplius lava me ab iniquitáte mea: * et a peccáto meo munda me.", "Wash me yet more from my iniquity, * and cleanse me from my sin."], ["t", "Quóniam iniquitátem meam ego cognósco: * et peccátum meum contra me est semper.", "For I know my iniquity, * and my sin is always before me."], ["t", "Tibi soli peccávi, et malum coram te feci: * ut justificéris in sermónibus tuis, et vincas cum judicáris.", "Against You alone have I sinned and done evil in Your sight, * that You may be justified in Your words and prevail when You are judged."], ["t", "Ecce enim in iniquitátibus concéptus sum: * et in peccátis concépit me mater mea.", "For behold, I was conceived in iniquities, * and in sins did my mother conceive me."], ["t", "Ecce enim veritátem dilexísti: * incérta et occúlta sapiéntiæ tuæ manifestásti mihi.", "For behold, You have loved truth; * the uncertain and hidden things of Your wisdom You have made known to me."], ["t", "Aspérges me hyssópo, et mundábor: * lavábis me, et super nivem dealbábor.", "You will sprinkle me with hyssop, and I shall be cleansed; * You will wash me, and I shall be made whiter than snow."], ["t", "Audítui meo dabis gáudium et lætítiam: * et exsultábunt ossa humiliáta.", "To my hearing You will give joy and gladness, * and the bones that were humbled shall rejoice."], ["t", "Avérte fáciem tuam a peccátis meis: * et omnes iniquitátes meas dele.", "Turn away Your face from my sins, * and blot out all my iniquities."], ["t", "Cor mundum crea in me, Deus: * et spíritum rectum ínnova in viscéribus meis.", "Create a clean heart in me, O God, * and renew a right spirit within me."], ["t", "Ne projícias me a fácie tua: * et spíritum sanctum tuum ne áuferas a me.", "Cast me not away from Your face, * and take not Your holy spirit from me."], ["t", "Redde mihi lætítiam salutáris tui: * et spíritu principáli confírma me.", "Restore to me the joy of Your salvation, * and strengthen me with a willing spirit."], ["t", "Docébo iníquos vias tuas: * et ímpii ad te converténtur.", "I will teach the unjust Your ways, * and the wicked shall be converted to You."], ["t", "Líbera me de sanguínibus, Deus, Deus salútis meæ: * et exsultábit lingua mea justítiam tuam.", "Deliver me from blood, O God, the God of my salvation, * and my tongue shall extol Your justice."], ["t", "Dómine, lábia mea apéries: * et os meum annuntiábit laudem tuam.", "O Lord, You will open my lips, * and my mouth shall declare Your praise."], ["t", "Quóniam si voluísses sacrifícium, dedíssem útique: * holocáustis non delectáberis.", "For if You had desired sacrifice, I would surely have given it; * with burnt offerings You will not be delighted."], ["t", "Sacrifícium Deo spíritus contribulátus: * cor contrítum, et humiliátum, Deus, non despícies.", "A sacrifice to God is an afflicted spirit; * a contrite and humbled heart, O God, You will not despise."], ["t", "Benígne fac, Dómine, in bona voluntáte tua Sion: * ut ædificéntur muri Jerúsalem.", "Deal favorably, O Lord, in Your good will with Sion, * that the walls of Jerusalem may be built up."], ["t", "Tunc acceptábis sacrifícium justítiæ, oblatiónes, et holocáusta: * tunc impónent super altáre tuum vítulos.", "Then You will accept the sacrifice of justice, oblations and whole burnt offerings; * then shall they lay calves upon Your altar."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["r", "3. Interim circumdant exterius ecclesiam (quæ intus debet esse vacua et nuda, et pariter Altaria nuda excluso populo, donec absoluta sit benedictio), et Sacerdos accepto aspergillo ex herba hyssopi, ad ejus dexteram se convertens, parietes ecclesiæ in superiori parte, et in fundamentis aqua benedicta aspergit, dicens: Aspérges me, etc.", "3. Meanwhile they go around the outside of the church (which inside should be empty and bare, the altars likewise bare, and the people kept out until the blessing is finished). The priest, taking a sprinkler made of hyssop and turning to his right, sprinkles the walls of the church with holy water, at the top and at the foundations, saying: \"You will sprinkle me,\" etc."], ["r", "4. Reversi ad locum, unde Processio initium habuit, repetita Antiphona a Clero, Sacerdos stans ut prius versus ad ecclesiam, dicit:", "4. When they have returned to the place where the procession began, and the clergy have repeated the antiphon, the priest, standing as before and facing the church, says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Dómine Deus, qui licet cælo et terra non capiáris, domum tamen dignáris habére in terris, ubi nomen tuum júgiter invocétur: locum hunc, quǽsumus, beátæ Maríæ semper Vírginis, et beáti N. *(nominando Sanctum vel Sanctam, in cujus honorem ac nomen benedicitur ecclesia)*, omniúmque Sanctórum intercedéntibus méritis, seréno pietátis tuæ intúitu vísita, et per infusiónem grátiæ tuæ ab omni inquinaménto purífica, purificatúmque consérva; et qui dilécti tui David devotiónem in fílii sui Salomónis ópere complevísti, in hoc ópere desidéria nostra perfícere dignéris, effugiántque omnes hinc nequítiæ spirituáles. Per Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O Lord God, who, though heaven and earth cannot contain You, yet deign to have a house on earth where Your name may be called upon without ceasing: through the interceding merits of blessed Mary ever Virgin, of blessed N. *(naming the Saint in whose honor and name the church is blessed)*, and of all the Saints, visit this place, we beseech You, with the serene gaze of Your kindness; by the outpouring of Your grace cleanse it from every defilement and keep it clean; and as You brought to completion the devotion of Your beloved David in the work of his son Solomon, so deign to fulfill our desires in this work, and let all spiritual wickedness flee from here. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "5. Qua finita Oratione, omnes bini in ecclesiam intrant, et ad altare majus procedunt, Litanias ordinarias decantantes.", "5. When this prayer is finished, all enter the church two by two and go to the high altar, singing the ordinary Litany of the Saints."], ["r", "6. Sacerdos coram altari genuflectit: cumque dictum fuerit: Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris. ℟. Te rogámus, audi nos, surgit Sacerdos, et intellegibili voce dicit:", "6. The priest kneels before the altar; and when \"That You deign to grant eternal rest to all the faithful departed. ℟. We beseech You, hear us\" has been sung, the priest rises and says in an audible voice:"], ["t", "Ut hanc ecclésiam, et altáre hoc, ad honórem tuum, et nomen Sancti tui N., purgáre, et bene✠dícere dignéris. ℟. Te rogámus, audi nos.", "That You deign to cleanse and ✠ bless this church and this altar, to Your honor and in the name of Your Saint N. ℟. We beseech You, hear us."], ["r", "Cum dicit benedícere, manu dextera benedicit ecclesiam et altare; deinde, ut prius, genuflectit donec perficiantur Litaniæ, et cantores prosequuntur: Ut nos exaudíre dignéris, etc.", "As he says \"bless,\" he blesses the church and the altar with his right hand; then he kneels again as before until the Litany is finished, and the cantors continue: \"That You deign graciously to hear us,\" etc."], ["n", "", "The full Litany follows for convenience; the priest's petition above is inserted after the petition for the faithful departed."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis._", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte, Deus, _miserére nobis._", "God the Holy Spirit, _have mercy on us._"], ["t", "Sancta Trínitas, unus Deus, _miserére nobis._", "Holy Trinity, one God, _have mercy on us._"], ["t", "Sancta María, _ora pro nobis._", "Holy Mary, _pray for us._"], ["t", "Sancta Dei Génetrix, _ora pro nobis._", "Holy Mother of God, _pray for us._"], ["t", "Sancta Virgo vírginum, _ora pro nobis._", "Holy Virgin of virgins, _pray for us._"], ["t", "Sancte Míchaël, _ora pro nobis._", "Saint Michael, _pray for us._"], ["t", "Sancte Gábriel, _ora pro nobis._", "Saint Gabriel, _pray for us._"], ["t", "Sancte Ráphaël, _ora pro nobis._", "Saint Raphael, _pray for us._"], ["t", "Omnes sancti Ángeli et Archángeli, _oráte pro nobis._", "All you holy Angels and Archangels, _pray for us._"], ["t", "Omnes sancti beatórum Spirítuum órdines, _oráte pro nobis._", "All you holy orders of blessed Spirits, _pray for us._"], ["t", "Sancte Joánnes Baptísta, _ora pro nobis._", "Saint John the Baptist, _pray for us._"], ["t", "Sancte Joseph, _ora pro nobis._", "Saint Joseph, _pray for us._"], ["t", "Omnes sancti Patriárchæ et Prophétæ, _oráte pro nobis._", "All you holy Patriarchs and Prophets, _pray for us._"], ["t", "Sancte Petre, _ora pro nobis._", "Saint Peter, _pray for us._"], ["t", "Sancte Paule, _ora pro nobis._", "Saint Paul, _pray for us._"], ["t", "Sancte Andréa, _ora pro nobis._", "Saint Andrew, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Joánnes, _ora pro nobis._", "Saint John, _pray for us._"], ["t", "Sancte Thoma, _ora pro nobis._", "Saint Thomas, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Philíppe, _ora pro nobis._", "Saint Philip, _pray for us._"], ["t", "Sancte Bartholomǽe, _ora pro nobis._", "Saint Bartholomew, _pray for us._"], ["t", "Sancte Matthǽe, _ora pro nobis._", "Saint Matthew, _pray for us._"], ["t", "Sancte Simon, _ora pro nobis._", "Saint Simon, _pray for us._"], ["t", "Sancte Thaddǽe, _ora pro nobis._", "Saint Thaddeus, _pray for us._"], ["t", "Sancte Matthía, _ora pro nobis._", "Saint Matthias, _pray for us._"], ["t", "Sancte Bárnaba, _ora pro nobis._", "Saint Barnabas, _pray for us._"], ["t", "Sancte Luca, _ora pro nobis._", "Saint Luke, _pray for us._"], ["t", "Sancte Marce, _ora pro nobis._", "Saint Mark, _pray for us._"], ["t", "Omnes sancti Apóstoli et Evangelístæ, _oráte pro nobis._", "All you holy Apostles and Evangelists, _pray for us._"], ["t", "Omnes sancti Discípuli Dómini, _oráte pro nobis._", "All you holy Disciples of the Lord, _pray for us._"], ["t", "Omnes sancti Innocéntes, _oráte pro nobis._", "All you holy Innocents, _pray for us._"], ["t", "Sancte Stéphane, _ora pro nobis._", "Saint Stephen, _pray for us._"], ["t", "Sancte Laurénti, _ora pro nobis._", "Saint Lawrence, _pray for us._"], ["t", "Sancte Vincénti, _ora pro nobis._", "Saint Vincent, _pray for us._"], ["t", "Sancti Fabiáne et Sebastiáne, _oráte pro nobis._", "Saints Fabian and Sebastian, _pray for us._"], ["t", "Sancti Joánnes et Paule, _oráte pro nobis._", "Saints John and Paul, _pray for us._"], ["t", "Sancti Cosma et Damiáne, _oráte pro nobis._", "Saints Cosmas and Damian, _pray for us._"], ["t", "Sancti Gervási et Protási, _oráte pro nobis._", "Saints Gervase and Protase, _pray for us._"], ["t", "Omnes sancti Mártyres, _oráte pro nobis._", "All you holy Martyrs, _pray for us._"], ["t", "Sancte Silvéster, _ora pro nobis._", "Saint Sylvester, _pray for us._"], ["t", "Sancte Gregóri, _ora pro nobis._", "Saint Gregory, _pray for us._"], ["t", "Sancte Ambrósi, _ora pro nobis._", "Saint Ambrose, _pray for us._"], ["t", "Sancte Augustíne, _ora pro nobis._", "Saint Augustine, _pray for us._"], ["t", "Sancte Hierónyme, _ora pro nobis._", "Saint Jerome, _pray for us._"], ["t", "Sancte Martíne, _ora pro nobis._", "Saint Martin, _pray for us._"], ["t", "Sancte Nicoláe, _ora pro nobis._", "Saint Nicholas, _pray for us._"], ["t", "Omnes sancti Pontífices et Confessóres, _oráte pro nobis._", "All you holy Bishops and Confessors, _pray for us._"], ["t", "Omnes sancti Doctóres, _oráte pro nobis._", "All you holy Doctors, _pray for us._"], ["t", "Sancte Antóni, _ora pro nobis._", "Saint Anthony, _pray for us._"], ["t", "Sancte Benedícte, _ora pro nobis._", "Saint Benedict, _pray for us._"], ["t", "Sancte Bernárde, _ora pro nobis._", "Saint Bernard, _pray for us._"], ["t", "Sancte Domínice, _ora pro nobis._", "Saint Dominic, _pray for us._"], ["t", "Sancte Francísce, _ora pro nobis._", "Saint Francis, _pray for us._"], ["t", "Omnes sancti Sacerdótes et Levítæ, _oráte pro nobis._", "All you holy Priests and Levites, _pray for us._"], ["t", "Omnes sancti Mónachi et Eremítæ, _oráte pro nobis._", "All you holy Monks and Hermits, _pray for us._"], ["t", "Sancta María Magdaléna, _ora pro nobis._", "Saint Mary Magdalene, _pray for us._"], ["t", "Sancta Ágatha, _ora pro nobis._", "Saint Agatha, _pray for us._"], ["t", "Sancta Lúcia, _ora pro nobis._", "Saint Lucy, _pray for us._"], ["t", "Sancta Agnes, _ora pro nobis._", "Saint Agnes, _pray for us._"], ["t", "Sancta Cæcília, _ora pro nobis._", "Saint Cecilia, _pray for us._"], ["t", "Sancta Catharína, _ora pro nobis._", "Saint Catherine, _pray for us._"], ["t", "Sancta Anastásia, _ora pro nobis._", "Saint Anastasia, _pray for us._"], ["t", "Omnes sanctæ Vírgines et Víduæ, _oráte pro nobis._", "All you holy Virgins and Widows, _pray for us._"], ["t", "Omnes Sancti et Sanctæ Dei, _intercédite pro nobis._", "All you holy men and women, Saints of God, _intercede for us._"], ["t", "Propítius esto, _parce nobis, Dómine._", "Be merciful, _spare us, O Lord._"], ["t", "Propítius esto, _exáudi nos, Dómine._", "Be merciful, _graciously hear us, O Lord._"], ["t", "Ab omni malo, _líbera nos, Dómine._", "From all evil, _deliver us, O Lord._"], ["t", "Ab omni peccáto, _líbera nos, Dómine._", "From all sin, _deliver us, O Lord._"], ["t", "Ab ira tua, _líbera nos, Dómine._", "From Your wrath, _deliver us, O Lord._"], ["t", "A subitánea et improvísa morte, _líbera nos, Dómine._", "From sudden and unprovided death, _deliver us, O Lord._"], ["t", "Ab insídiis diáboli, _líbera nos, Dómine._", "From the snares of the devil, _deliver us, O Lord._"], ["t", "Ab ira, et ódio, et omni mala voluntáte, _líbera nos, Dómine._", "From anger, and hatred, and every evil will, _deliver us, O Lord._"], ["t", "A spíritu fornicatiónis, _líbera nos, Dómine._", "From the spirit of fornication, _deliver us, O Lord._"], ["t", "A fúlgure et tempestáte, _líbera nos, Dómine._", "From lightning and tempest, _deliver us, O Lord._"], ["t", "A flagéllo terræmótus, _líbera nos, Dómine._", "From the scourge of earthquake, _deliver us, O Lord._"], ["t", "A peste, fame et bello, _líbera nos, Dómine._", "From plague, famine, and war, _deliver us, O Lord._"], ["t", "A morte perpétua, _líbera nos, Dómine._", "From everlasting death, _deliver us, O Lord._"], ["t", "Per mystérium sanctæ Incarnatiónis tuæ, _líbera nos, Dómine._", "Through the mystery of Your holy Incarnation, _deliver us, O Lord._"], ["t", "Per advéntum tuum, _líbera nos, Dómine._", "Through Your coming, _deliver us, O Lord._"], ["t", "Per nativitátem tuam, _líbera nos, Dómine._", "Through Your birth, _deliver us, O Lord._"], ["t", "Per baptísmum et sanctum jejúnium tuum, _líbera nos, Dómine._", "Through Your baptism and holy fasting, _deliver us, O Lord._"], ["t", "Per crucem et passiónem tuam, _líbera nos, Dómine._", "Through Your Cross and Passion, _deliver us, O Lord._"], ["t", "Per mortem et sepultúram tuam, _líbera nos, Dómine._", "Through Your death and burial, _deliver us, O Lord._"], ["t", "Per sanctam resurrectiónem tuam, _líbera nos, Dómine._", "Through Your holy resurrection, _deliver us, O Lord._"], ["t", "Per admirábilem ascensiónem tuam, _líbera nos, Dómine._", "Through Your wonderful ascension, _deliver us, O Lord._"], ["t", "Per advéntum Spíritus Sancti Parácliti, _líbera nos, Dómine._", "Through the coming of the Holy Spirit, the Paraclete, _deliver us, O Lord._"], ["t", "In die judícii, _líbera nos, Dómine._", "In the day of judgment, _deliver us, O Lord._"], ["t", "Peccatóres, _te rogámus, audi nos._", "We sinners, _we beseech You, hear us._"], ["t", "Ut nobis parcas, _te rogámus, audi nos._", "That You spare us, _we beseech You, hear us._"], ["t", "Ut nobis indúlgeas, _te rogámus, audi nos._", "That You pardon us, _we beseech You, hear us._"], ["t", "Ut ad veram pœniténtiam nos perdúcere dignéris, _te rogámus, audi nos._", "That You deign to bring us to true repentance, _we beseech You, hear us._"], ["t", "Ut Ecclésiam tuam sanctam régere et conserváre dignéris, _te rogámus, audi nos._", "That You deign to govern and preserve Your holy Church, _we beseech You, hear us._"], ["t", "Ut Domnum Apostólicum et omnes ecclesiásticos órdines in sancta religióne conserváre dignéris, _te rogámus, audi nos._", "That You deign to preserve the Apostolic Lord and all ranks of the Church in holy religion, _we beseech You, hear us._"], ["t", "Ut inimícos sanctæ Ecclésiæ humiliáre dignéris, _te rogámus, audi nos._", "That You deign to humble the enemies of holy Church, _we beseech You, hear us._"], ["t", "Ut régibus et princípibus christiánis pacem et veram concórdiam donáre dignéris, _te rogámus, audi nos._", "That You deign to give peace and true concord to Christian kings and rulers, _we beseech You, hear us._"], ["t", "Ut cuncto pópulo christiáno pacem et unitátem largíri dignéris, _te rogámus, audi nos._", "That You deign to grant peace and unity to all Christian people, _we beseech You, hear us._"], ["t", "Ut omnes errántes ad unitátem Ecclésiæ revocáre, et infidéles univérsos ad Evangélii lumen perdúcere dignéris, _te rogámus, audi nos._", "That You deign to call back all who have strayed to the unity of the Church, and to lead all unbelievers to the light of the Gospel, _we beseech You, hear us._"], ["t", "Ut nosmetípsos in tuo sancto servítio confortáre et conserváre dignéris, _te rogámus, audi nos._", "That You deign to strengthen and keep us in Your holy service, _we beseech You, hear us._"], ["t", "Ut mentes nostras ad cæléstia desidéria érigas, _te rogámus, audi nos._", "That You lift up our minds to heavenly desires, _we beseech You, hear us._"], ["t", "Ut ómnibus benefactóribus nostris sempitérna bona retríbuas, _te rogámus, audi nos._", "That You render eternal blessings to all our benefactors, _we beseech You, hear us._"], ["t", "Ut ánimas nostras, fratrum, propinquórum et benefactórum nostrórum ab ætérna damnatióne erípias, _te rogámus, audi nos._", "That You deliver our souls and the souls of our brethren, relatives, and benefactors from eternal damnation, _we beseech You, hear us._"], ["t", "Ut fructus terræ dare et conserváre dignéris, _te rogámus, audi nos._", "That You deign to give and preserve the fruits of the earth, _we beseech You, hear us._"], ["t", "Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris, _te rogámus, audi nos._", "That You deign to grant eternal rest to all the faithful departed, _we beseech You, hear us._"], ["t", "Ut nos exaudíre dignéris, _te rogámus, audi nos._", "That You deign graciously to hear us, _we beseech You, hear us._"], ["t", "Fili Dei, _te rogámus, audi nos._", "Son of God, _we beseech You, hear us._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _parce nobis, Dómine._", "Lamb of God, who take away the sins of the world, _spare us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _exáudi nos, Dómine._", "Lamb of God, who take away the sins of the world, _graciously hear us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _miserére nobis._", "Lamb of God, who take away the sins of the world, _have mercy on us._"], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["r", "7. Dicto ultimo Kýrie, eléison, Sacerdos stans dicit:", "7. When the last \"Lord, have mercy\" has been sung, the priest, standing, says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Præveniat nos, quǽsumus, Dómine, misericórdia tua: et, intercedéntibus ómnibus Sanctis tuis, voces nostras cleméntia tuæ propitiatiónis antícipet. Per Christum, Dóminum nostrum. ℟. Amen.", "May Your mercy, we beseech You, O Lord, go before us, and through the intercession of all Your Saints may the kindness of Your favor anticipate our prayers. Through Christ our Lord. ℟. Amen."], ["r", "8. Tum distans ab altari congruenti spatio genuflexus, et se signans, dicit: Deus, in adjutórium meum inténde; et statim surgit, Clero respondente: Dómine, ad adjuvándum me festína; ipse vero stans dicit: Glória Patri, et Fílio, et Spirítui Sancto. Chorus respondet: Sicut erat in princípio, et nunc, et semper, et in sǽcula sæculórum. Amen.", "8. Then, kneeling at a suitable distance from the altar and signing himself, he says: \"O God, come to my assistance\"; and he rises at once, the clergy answering: \"O Lord, make haste to help me.\" Standing, he says: \"Glory be to the Father, and to the Son, and to the Holy Spirit.\" The choir answers: \"As it was in the beginning, is now, and ever shall be, world without end. Amen.\""], ["v", "Deus, in adjutórium meum inténde.", "O God, come to my assistance."], ["x", "Dómine, ad adjuvándum me festína.", "O Lord, make haste to help me."], ["t", "Glória Patri, et Fílio, et Spirítui Sancto. Sicut erat in princípio, et nunc, et semper, et in sǽcula sæculórum. Amen.", "Glory be to the Father, and to the Son, and to the Holy Spirit. As it was in the beginning, is now, and ever shall be, world without end. Amen."], ["r", "9. Postea Sacerdos dicit:", "9. Afterward the priest says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Omnípotens et miséricors Deus, qui Sacerdótibus tuis tantam præ céteris grátiam contulísti, ut quidquid in tuo nómine digne, perfectéque ab eis ágitur, a te fíeri credátur: quǽsumus imménsam cleméntiam tuam; ut quidquid modo visitatúri sumus, vísites, et quidquid benedictúri sumus, bene✠dícas: sitque ad nostræ humilitátis intróitum, Sanctórum tuórum méritis, fuga dæmonum, Ángeli pacis ingréssus. Per Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "Almighty and merciful God, who have bestowed on Your priests a grace so far beyond others that whatever is done worthily and perfectly by them in Your name is believed to be done by You: we beseech Your boundless mercy that whatever we are now about to visit You may visit, and whatever we are about to bless You may ✠ bless; and that, at the entrance of our lowliness, through the merits of Your Saints, the demons may flee and the Angel of peace may enter. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "10. His dictis, inchoat, Clero prosequente, Antiphonam, et dicuntur tres Psalmi sequentes:", "10. When this has been said, he intones the antiphon, the clergy continuing, and the three following psalms are said:"], ["t", "*Ant.* Bénedic, Dómine, domum istam nómini tuo ædificátam.", "*Ant.* Bless, O Lord, this house built to Your name."], ["h", "Psalmus 119", "Psalm 119"], ["t", "Ad Dóminum cum tribulárer clamávi: * et exaudívit me.", "In my trouble I cried to the Lord, * and He heard me."], ["t", "Dómine, líbera ánimam meam a lábiis iníquis, * et a lingua dolósa.", "O Lord, deliver my soul from wicked lips * and from a deceitful tongue."], ["t", "Quid detur tibi, aut quid apponátur tibi * ad linguam dolósam?", "What shall be given to you, or what added to you, * against a deceitful tongue?"], ["t", "Sagíttæ poténtis acútæ, * cum carbónibus desolatóriis.", "The sharp arrows of the mighty, * with coals that lay waste."], ["t", "Heu mihi, quia incolátus meus prolongátus est: habitávi cum habitántibus Cedar: * multum íncola fuit ánima mea.", "Woe is me, that my sojourning is prolonged! I have dwelt with the inhabitants of Kedar; * my soul has long been a sojourner."], ["t", "Cum his, qui odérunt pacem, eram pacíficus: * cum loquébar illis, impugnábant me gratis.", "With those who hated peace I was peaceable; * when I spoke to them, they fought against me without cause."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 120", "Psalm 120"], ["t", "Levávi óculos meos in montes, * unde véniet auxílium mihi.", "I have lifted up my eyes to the mountains, * from whence help shall come to me."], ["t", "Auxílium meum a Dómino, * qui fecit cælum et terram.", "My help is from the Lord, * who made heaven and earth."], ["t", "Non det in commotiónem pedem tuum: * neque dormítet qui custódit te.", "May He not suffer your foot to be moved, * nor may He slumber who keeps you."], ["t", "Ecce, non dormitábit neque dórmiet, * qui custódit Israël.", "Behold, He shall neither slumber nor sleep, * who keeps Israel."], ["t", "Dóminus custódit te, Dóminus protéctio tua, * super manum déxteram tuam.", "The Lord keeps you; the Lord is your protection * at your right hand."], ["t", "Per diem sol non uret te: * neque luna per noctem.", "The sun shall not burn you by day, * nor the moon by night."], ["t", "Dóminus custódit te ab omni malo: * custódiat ánimam tuam Dóminus.", "The Lord keeps you from all evil; * may the Lord keep your soul."], ["t", "Dóminus custódiat intróitum tuum, et éxitum tuum: * ex hoc nunc, et usque in sǽculum.", "May the Lord keep your coming in and your going out, * from this time forth and for evermore."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["h", "Psalmus 121", "Psalm 121"], ["t", "Lætátus sum in his, quæ dicta sunt mihi: * In domum Dómini íbimus.", "I rejoiced at the things that were said to me: * We shall go into the house of the Lord."], ["t", "Stantes erant pedes nostri, * in átriis tuis, Jerúsalem.", "Our feet were standing * in your courts, O Jerusalem."], ["t", "Jerúsalem, quæ ædificátur ut cívitas: * cujus participátio ejus in idípsum.", "Jerusalem, which is built as a city, * whose parts are joined together in unity."], ["t", "Illuc enim ascendérunt tribus, tribus Dómini: * testimónium Israël ad confiténdum nómini Dómini.", "For there the tribes went up, the tribes of the Lord, * the testimony of Israel, to praise the name of the Lord."], ["t", "Quia illic sedérunt sedes in judício, * sedes super domum David.", "For there are set the seats of judgment, * the seats over the house of David."], ["t", "Rogáte quæ ad pacem sunt Jerúsalem: * et abundántia diligéntibus te.", "Pray for the things that are for the peace of Jerusalem, * and abundance for those who love you."], ["t", "Fiat pax in virtúte tua: * et abundántia in túrribus tuis.", "Let peace be in your strength, * and abundance in your towers."], ["t", "Propter fratres meos, et próximos meos, * loquébar pacem de te.", "For the sake of my brethren and my neighbors * I spoke peace of you."], ["t", "Propter domum Dómini, Dei nostri, * quæsívi bona tibi.", "For the sake of the house of the Lord our God * I have sought good things for you."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* Bénedic, Dómine, domum istam nómini tuo ædificátam.", "*Ant.* Bless, O Lord, this house built to Your name."], ["r", "11. Interim aspergit interius parietes in parte superiori et inferiori, inchoans aspersionem a parte Evangelii, dicens: Aspérges me, etc. tum ad altare reversus, dicit:", "11. Meanwhile he sprinkles the inside walls, above and below, beginning on the Gospel side and saying: \"You will sprinkle me,\" etc. Then, having returned to the altar, he says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Deus, qui loca nómini tuo dicánda sanctíficas, effúnde super hanc oratiónis domum grátiam tuam: ut ab ómnibus hic nomen tuum invocántibus auxílium tuæ misericórdiæ sentiátur. Per Dóminum nostrum Jesum Christum Fílium tuum: Qui tecum vivit et regnat in unitáte Spíritus Sancti Deus, per ómnia sǽcula sæculórum. ℟. Amen.", "O God, who sanctify places to be dedicated to Your name, pour out Your grace upon this house of prayer, that all who call upon Your name here may feel the help of Your mercy. Through our Lord Jesus Christ, Your Son, who lives and reigns with You in the unity of the Holy Spirit, God, for ever and ever. ℟. Amen."], ["r", "12. His peractis, dicitur Missa de Mysterio vel Sancto, in cujus honorem ecclesia est benedicta; sed, si occurrat Officium Missas votivas sollemnes pro re gravi excludens, dicitur Missa de die occurrenti, cum Commemoratione Titularis, juxta Missalis rubricas.", "12. When this is done, Mass is said of the mystery or Saint in whose honor the church has been blessed; but if the Office of the day excludes solemn votive Masses for a grave cause, the Mass of the day is said with a commemoration of the titular, according to the rubrics of the Missal."], ["r", "13. Ecclesiæ vero cathedrales, et, quantum fieri potest, ecclesiæ collegiatæ, conventuales et parœciales, quamvis a simplici Sacerdote, ut supra, sint benedictæ, sollemniter tamen consecrandæ sunt.", "13. Cathedral churches, however, and as far as possible collegiate, conventual, and parish churches, even though they have been blessed by a simple priest as above, are nevertheless to be solemnly consecrated."], ["r", "14. Oratoria privata seu domestica nec consecrari nec benedici possunt more ecclesiarum.", "14. Private or domestic oratories may be neither consecrated nor blessed in the manner of churches."]]}, {"id": "reconcile-church", "la": "Ritus Reconciliandi Ecclesiam Violatam, quæ fuerit tantummodo benedicta", "en": "Reconciliation of a Violated Church that Has Only Been Blessed", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 28", "b": [["r", "1. Violata ecclesia, non ideo cœmeterium, etsi contiguum, violatum censetur, et viceversa. Si vero cœmeterium ecclesiæ pollutæ contiguum violatum fuerit, illud una cum ecclesia reconciliatur.", "1. When a church is violated, the cemetery, even if adjoining, is not thereby considered violated, and vice versa. But if a cemetery adjoining a defiled church has also been violated, it is reconciled together with the church."], ["r", "Ecclesiæ benedictæ ac violatæ reconciliatio per Rectorem ejusdem, vel quemlibet Sacerdotem de consensu saltem præsumpto Rectoris, fiat hoc modo. Altare ecclesiæ omnino nudetur, provideaturque, ut ecclesia possit libere circumiri tam exterius, quam interius, si fieri potest. Paretur vasculum cum aqua benedicta, et aspergillum de herba hyssopi factum. Sacerdos, indutus amictu, alba, cingulo, stola et pluviali albi coloris, adhibitis aliquot Clericis, procedit ad primariam ecclesiæ portam, ubi stans, incipit, Clero prosequente, Antiphonam:", "The reconciliation of a blessed church that has been violated is carried out by its rector, or by any priest with at least the presumed consent of the rector, in this manner. The altar of the church is stripped completely, and provision is made that the church can be freely walked around both outside and inside, if possible. A vessel of holy water is prepared, and a sprinkler made of hyssop. The priest, vested in amice, alb, cincture, stole, and white cope, and attended by several clerics, goes to the main door of the church, where, standing, he intones the antiphon, and the clergy continue:"], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["r", "Et dicitur totus Psalmus Miserére, cum Glória Patri. Quo finito, Antiphona repetitur. Interim dum Antiphona et Psalmus dicuntur, Sacerdos aqua benedicta aspergit in circuitu extrinsecus ecclesiam, et cœmeterium, simul aspergendo alternatim ad parietes ecclesiæ, ac ad terram cœmeterii, præsertim ad loca contaminata. Si vero cœmeterium violatum non fuerit, ejus aspersio omittitur.", "The whole psalm \"Have mercy\" is said, with the Glory be, and when it is finished the antiphon is repeated. Meanwhile, during the antiphon and psalm, the priest goes around the outside of the church sprinkling it and the cemetery with holy water, alternately sprinkling the walls of the church and the ground of the cemetery, especially the places that were defiled. If the cemetery has not been violated, its sprinkling is omitted."], ["h", "Psalmus 50", "Psalm 50"], ["t", "Miserére mei, Deus, * secúndum magnam misericórdiam tuam.", "Have mercy on me, O God, * according to Your great mercy."], ["t", "Et secúndum multitúdinem miseratiónum tuárum, * dele iniquitátem meam.", "And according to the multitude of Your tender mercies * blot out my iniquity."], ["t", "Ámplius lava me ab iniquitáte mea: * et a peccáto meo munda me.", "Wash me yet more from my iniquity, * and cleanse me from my sin."], ["t", "Quóniam iniquitátem meam ego cognósco: * et peccátum meum contra me est semper.", "For I know my iniquity, * and my sin is always before me."], ["t", "Tibi soli peccávi, et malum coram te feci: * ut justificéris in sermónibus tuis, et vincas cum judicáris.", "Against You alone have I sinned and done evil in Your sight, * that You may be justified in Your words and prevail when You are judged."], ["t", "Ecce enim in iniquitátibus concéptus sum: * et in peccátis concépit me mater mea.", "For behold, I was conceived in iniquities, * and in sins did my mother conceive me."], ["t", "Ecce enim veritátem dilexísti: * incérta et occúlta sapiéntiæ tuæ manifestásti mihi.", "For behold, You have loved truth; * the uncertain and hidden things of Your wisdom You have made known to me."], ["t", "Aspérges me hyssópo, et mundábor: * lavábis me, et super nivem dealbábor.", "You will sprinkle me with hyssop, and I shall be cleansed; * You will wash me, and I shall be made whiter than snow."], ["t", "Audítui meo dabis gáudium et lætítiam: * et exsultábunt ossa humiliáta.", "To my hearing You will give joy and gladness, * and the bones that were humbled shall rejoice."], ["t", "Avérte fáciem tuam a peccátis meis: * et omnes iniquitátes meas dele.", "Turn away Your face from my sins, * and blot out all my iniquities."], ["t", "Cor mundum crea in me, Deus: * et spíritum rectum ínnova in viscéribus meis.", "Create a clean heart in me, O God, * and renew a right spirit within me."], ["t", "Ne projícias me a fácie tua: * et spíritum sanctum tuum ne áuferas a me.", "Cast me not away from Your face, * and take not Your holy spirit from me."], ["t", "Redde mihi lætítiam salutáris tui: * et spíritu principáli confírma me.", "Restore to me the joy of Your salvation, * and strengthen me with a willing spirit."], ["t", "Docébo iníquos vias tuas: * et ímpii ad te converténtur.", "I will teach the unjust Your ways, * and the wicked shall be converted to You."], ["t", "Líbera me de sanguínibus, Deus, Deus salútis meæ: * et exsultábit lingua mea justítiam tuam.", "Deliver me from blood, O God, the God of my salvation, * and my tongue shall extol Your justice."], ["t", "Dómine, lábia mea apéries: * et os meum annuntiábit laudem tuam.", "O Lord, You will open my lips, * and my mouth shall declare Your praise."], ["t", "Quóniam si voluísses sacrifícium, dedíssem útique: * holocáustis non delectáberis.", "For if You had desired sacrifice, I would surely have given it; * with burnt offerings You will not be delighted."], ["t", "Sacrifícium Deo spíritus contribulátus: * cor contrítum, et humiliátum, Deus, non despícies.", "A sacrifice to God is an afflicted spirit; * a contrite and humbled heart, O God, You will not despise."], ["t", "Benígne fac, Dómine, in bona voluntáte tua Sion: * ut ædificéntur muri Jerúsalem.", "Deal favorably, O Lord, in Your good will with Sion, * that the walls of Jerusalem may be built up."], ["t", "Tunc acceptábis sacrifícium justítiæ, oblatiónes, et holocáusta: * tunc impónent super altáre tuum vítulos.", "Then You will accept the sacrifice of justice, oblations and whole burnt offerings; * then shall they lay calves upon Your altar."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["r", "Quo facto, redit ad locum, ubi incepit aspergere, et stans dicit:", "When this is done, he returns to the place where he began sprinkling and, standing, says:"], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens et miséricors Deus, qui Sacerdótibus tuis tantam præ céteris grátiam contulísti, ut quidquid in tuo nómine digne, perfectéque ab eis ágitur, a te fíeri credátur: quǽsumus imménsam cleméntiam tuam; ut, quidquid modo visitatúri sumus, vísites, et quidquid benedictúri sumus, bene✠dícas; sitque ad nostræ humilitátis intróitum, Sanctórum tuórum méritis, fuga dæmonum, Ángeli pacis ingréssus. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty and merciful God, who have bestowed on Your priests a grace so far beyond others that whatever is done worthily and perfectly by them in Your name is believed to be done by You: we beseech Your boundless mercy that whatever we are now about to visit You may visit, and whatever we are about to bless You may ✠ bless; and that, at the entrance of our lowliness, through the merits of Your Saints, the demons may flee and the Angel of peace may enter. Through Christ our Lord. ℟. Amen."], ["r", "2. Deinde omnes bini in ecclesiam ingrediuntur, et ad altare majus accedunt, Litanias ordinarias decantantes. Sacerdos coram altari genuflectit: cumque dictum fuerit: Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris. ℟. Te rogámus, audi nos, Sacerdos surgit, et clara voce dicit:", "2. Then all enter the church two by two and go to the high altar, singing the ordinary Litany of the Saints. The priest kneels before the altar; and when \"That You deign to grant eternal rest to all the faithful departed. ℟. We beseech You, hear us\" has been sung, the priest rises and says in a clear voice:"], ["t", "Ut hanc ecclésiam, et altáre hoc, ac cœmetérium purgáre, et recon✠ciliáre dignéris. ℟. Te rogámus, audi nos.", "That You deign to cleanse and ✠ reconcile this church and this altar, and the cemetery. ℟. We beseech You, hear us."], ["r", "3. Si vero cœmeterium violatum non fuerit, omittuntur verba ac cœmetérium. Deinde rursus genuflectit, et Litaniæ perficiuntur.", "3. If the cemetery has not been violated, the words \"and the cemetery\" are omitted. Then he kneels again, and the Litany is completed."], ["n", "", "The full Litany follows for convenience; the priest's petition above is inserted after the petition for the faithful departed."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis._", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte, Deus, _miserére nobis._", "God the Holy Spirit, _have mercy on us._"], ["t", "Sancta Trínitas, unus Deus, _miserére nobis._", "Holy Trinity, one God, _have mercy on us._"], ["t", "Sancta María, _ora pro nobis._", "Holy Mary, _pray for us._"], ["t", "Sancta Dei Génetrix, _ora pro nobis._", "Holy Mother of God, _pray for us._"], ["t", "Sancta Virgo vírginum, _ora pro nobis._", "Holy Virgin of virgins, _pray for us._"], ["t", "Sancte Míchaël, _ora pro nobis._", "Saint Michael, _pray for us._"], ["t", "Sancte Gábriel, _ora pro nobis._", "Saint Gabriel, _pray for us._"], ["t", "Sancte Ráphaël, _ora pro nobis._", "Saint Raphael, _pray for us._"], ["t", "Omnes sancti Ángeli et Archángeli, _oráte pro nobis._", "All you holy Angels and Archangels, _pray for us._"], ["t", "Omnes sancti beatórum Spirítuum órdines, _oráte pro nobis._", "All you holy orders of blessed Spirits, _pray for us._"], ["t", "Sancte Joánnes Baptísta, _ora pro nobis._", "Saint John the Baptist, _pray for us._"], ["t", "Sancte Joseph, _ora pro nobis._", "Saint Joseph, _pray for us._"], ["t", "Omnes sancti Patriárchæ et Prophétæ, _oráte pro nobis._", "All you holy Patriarchs and Prophets, _pray for us._"], ["t", "Sancte Petre, _ora pro nobis._", "Saint Peter, _pray for us._"], ["t", "Sancte Paule, _ora pro nobis._", "Saint Paul, _pray for us._"], ["t", "Sancte Andréa, _ora pro nobis._", "Saint Andrew, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Joánnes, _ora pro nobis._", "Saint John, _pray for us._"], ["t", "Sancte Thoma, _ora pro nobis._", "Saint Thomas, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Philíppe, _ora pro nobis._", "Saint Philip, _pray for us._"], ["t", "Sancte Bartholomǽe, _ora pro nobis._", "Saint Bartholomew, _pray for us._"], ["t", "Sancte Matthǽe, _ora pro nobis._", "Saint Matthew, _pray for us._"], ["t", "Sancte Simon, _ora pro nobis._", "Saint Simon, _pray for us._"], ["t", "Sancte Thaddǽe, _ora pro nobis._", "Saint Thaddeus, _pray for us._"], ["t", "Sancte Matthía, _ora pro nobis._", "Saint Matthias, _pray for us._"], ["t", "Sancte Bárnaba, _ora pro nobis._", "Saint Barnabas, _pray for us._"], ["t", "Sancte Luca, _ora pro nobis._", "Saint Luke, _pray for us._"], ["t", "Sancte Marce, _ora pro nobis._", "Saint Mark, _pray for us._"], ["t", "Omnes sancti Apóstoli et Evangelístæ, _oráte pro nobis._", "All you holy Apostles and Evangelists, _pray for us._"], ["t", "Omnes sancti Discípuli Dómini, _oráte pro nobis._", "All you holy Disciples of the Lord, _pray for us._"], ["t", "Omnes sancti Innocéntes, _oráte pro nobis._", "All you holy Innocents, _pray for us._"], ["t", "Sancte Stéphane, _ora pro nobis._", "Saint Stephen, _pray for us._"], ["t", "Sancte Laurénti, _ora pro nobis._", "Saint Lawrence, _pray for us._"], ["t", "Sancte Vincénti, _ora pro nobis._", "Saint Vincent, _pray for us._"], ["t", "Sancti Fabiáne et Sebastiáne, _oráte pro nobis._", "Saints Fabian and Sebastian, _pray for us._"], ["t", "Sancti Joánnes et Paule, _oráte pro nobis._", "Saints John and Paul, _pray for us._"], ["t", "Sancti Cosma et Damiáne, _oráte pro nobis._", "Saints Cosmas and Damian, _pray for us._"], ["t", "Sancti Gervási et Protási, _oráte pro nobis._", "Saints Gervase and Protase, _pray for us._"], ["t", "Omnes sancti Mártyres, _oráte pro nobis._", "All you holy Martyrs, _pray for us._"], ["t", "Sancte Silvéster, _ora pro nobis._", "Saint Sylvester, _pray for us._"], ["t", "Sancte Gregóri, _ora pro nobis._", "Saint Gregory, _pray for us._"], ["t", "Sancte Ambrósi, _ora pro nobis._", "Saint Ambrose, _pray for us._"], ["t", "Sancte Augustíne, _ora pro nobis._", "Saint Augustine, _pray for us._"], ["t", "Sancte Hierónyme, _ora pro nobis._", "Saint Jerome, _pray for us._"], ["t", "Sancte Martíne, _ora pro nobis._", "Saint Martin, _pray for us._"], ["t", "Sancte Nicoláe, _ora pro nobis._", "Saint Nicholas, _pray for us._"], ["t", "Omnes sancti Pontífices et Confessóres, _oráte pro nobis._", "All you holy Bishops and Confessors, _pray for us._"], ["t", "Omnes sancti Doctóres, _oráte pro nobis._", "All you holy Doctors, _pray for us._"], ["t", "Sancte Antóni, _ora pro nobis._", "Saint Anthony, _pray for us._"], ["t", "Sancte Benedícte, _ora pro nobis._", "Saint Benedict, _pray for us._"], ["t", "Sancte Bernárde, _ora pro nobis._", "Saint Bernard, _pray for us._"], ["t", "Sancte Domínice, _ora pro nobis._", "Saint Dominic, _pray for us._"], ["t", "Sancte Francísce, _ora pro nobis._", "Saint Francis, _pray for us._"], ["t", "Omnes sancti Sacerdótes et Levítæ, _oráte pro nobis._", "All you holy Priests and Levites, _pray for us._"], ["t", "Omnes sancti Mónachi et Eremítæ, _oráte pro nobis._", "All you holy Monks and Hermits, _pray for us._"], ["t", "Sancta María Magdaléna, _ora pro nobis._", "Saint Mary Magdalene, _pray for us._"], ["t", "Sancta Ágatha, _ora pro nobis._", "Saint Agatha, _pray for us._"], ["t", "Sancta Lúcia, _ora pro nobis._", "Saint Lucy, _pray for us._"], ["t", "Sancta Agnes, _ora pro nobis._", "Saint Agnes, _pray for us._"], ["t", "Sancta Cæcília, _ora pro nobis._", "Saint Cecilia, _pray for us._"], ["t", "Sancta Catharína, _ora pro nobis._", "Saint Catherine, _pray for us._"], ["t", "Sancta Anastásia, _ora pro nobis._", "Saint Anastasia, _pray for us._"], ["t", "Omnes sanctæ Vírgines et Víduæ, _oráte pro nobis._", "All you holy Virgins and Widows, _pray for us._"], ["t", "Omnes Sancti et Sanctæ Dei, _intercédite pro nobis._", "All you holy men and women, Saints of God, _intercede for us._"], ["t", "Propítius esto, _parce nobis, Dómine._", "Be merciful, _spare us, O Lord._"], ["t", "Propítius esto, _exáudi nos, Dómine._", "Be merciful, _graciously hear us, O Lord._"], ["t", "Ab omni malo, _líbera nos, Dómine._", "From all evil, _deliver us, O Lord._"], ["t", "Ab omni peccáto, _líbera nos, Dómine._", "From all sin, _deliver us, O Lord._"], ["t", "Ab ira tua, _líbera nos, Dómine._", "From Your wrath, _deliver us, O Lord._"], ["t", "A subitánea et improvísa morte, _líbera nos, Dómine._", "From sudden and unprovided death, _deliver us, O Lord._"], ["t", "Ab insídiis diáboli, _líbera nos, Dómine._", "From the snares of the devil, _deliver us, O Lord._"], ["t", "Ab ira, et ódio, et omni mala voluntáte, _líbera nos, Dómine._", "From anger, and hatred, and every evil will, _deliver us, O Lord._"], ["t", "A spíritu fornicatiónis, _líbera nos, Dómine._", "From the spirit of fornication, _deliver us, O Lord._"], ["t", "A fúlgure et tempestáte, _líbera nos, Dómine._", "From lightning and tempest, _deliver us, O Lord._"], ["t", "A flagéllo terræmótus, _líbera nos, Dómine._", "From the scourge of earthquake, _deliver us, O Lord._"], ["t", "A peste, fame et bello, _líbera nos, Dómine._", "From plague, famine, and war, _deliver us, O Lord._"], ["t", "A morte perpétua, _líbera nos, Dómine._", "From everlasting death, _deliver us, O Lord._"], ["t", "Per mystérium sanctæ Incarnatiónis tuæ, _líbera nos, Dómine._", "Through the mystery of Your holy Incarnation, _deliver us, O Lord._"], ["t", "Per advéntum tuum, _líbera nos, Dómine._", "Through Your coming, _deliver us, O Lord._"], ["t", "Per nativitátem tuam, _líbera nos, Dómine._", "Through Your birth, _deliver us, O Lord._"], ["t", "Per baptísmum et sanctum jejúnium tuum, _líbera nos, Dómine._", "Through Your baptism and holy fasting, _deliver us, O Lord._"], ["t", "Per crucem et passiónem tuam, _líbera nos, Dómine._", "Through Your Cross and Passion, _deliver us, O Lord._"], ["t", "Per mortem et sepultúram tuam, _líbera nos, Dómine._", "Through Your death and burial, _deliver us, O Lord._"], ["t", "Per sanctam resurrectiónem tuam, _líbera nos, Dómine._", "Through Your holy resurrection, _deliver us, O Lord._"], ["t", "Per admirábilem ascensiónem tuam, _líbera nos, Dómine._", "Through Your wonderful ascension, _deliver us, O Lord._"], ["t", "Per advéntum Spíritus Sancti Parácliti, _líbera nos, Dómine._", "Through the coming of the Holy Spirit, the Paraclete, _deliver us, O Lord._"], ["t", "In die judícii, _líbera nos, Dómine._", "In the day of judgment, _deliver us, O Lord._"], ["t", "Peccatóres, _te rogámus, audi nos._", "We sinners, _we beseech You, hear us._"], ["t", "Ut nobis parcas, _te rogámus, audi nos._", "That You spare us, _we beseech You, hear us._"], ["t", "Ut nobis indúlgeas, _te rogámus, audi nos._", "That You pardon us, _we beseech You, hear us._"], ["t", "Ut ad veram pœniténtiam nos perdúcere dignéris, _te rogámus, audi nos._", "That You deign to bring us to true repentance, _we beseech You, hear us._"], ["t", "Ut Ecclésiam tuam sanctam régere et conserváre dignéris, _te rogámus, audi nos._", "That You deign to govern and preserve Your holy Church, _we beseech You, hear us._"], ["t", "Ut Domnum Apostólicum et omnes ecclesiásticos órdines in sancta religióne conserváre dignéris, _te rogámus, audi nos._", "That You deign to preserve the Apostolic Lord and all ranks of the Church in holy religion, _we beseech You, hear us._"], ["t", "Ut inimícos sanctæ Ecclésiæ humiliáre dignéris, _te rogámus, audi nos._", "That You deign to humble the enemies of holy Church, _we beseech You, hear us._"], ["t", "Ut régibus et princípibus christiánis pacem et veram concórdiam donáre dignéris, _te rogámus, audi nos._", "That You deign to give peace and true concord to Christian kings and rulers, _we beseech You, hear us._"], ["t", "Ut cuncto pópulo christiáno pacem et unitátem largíri dignéris, _te rogámus, audi nos._", "That You deign to grant peace and unity to all Christian people, _we beseech You, hear us._"], ["t", "Ut omnes errántes ad unitátem Ecclésiæ revocáre, et infidéles univérsos ad Evangélii lumen perdúcere dignéris, _te rogámus, audi nos._", "That You deign to call back all who have strayed to the unity of the Church, and to lead all unbelievers to the light of the Gospel, _we beseech You, hear us._"], ["t", "Ut nosmetípsos in tuo sancto servítio confortáre et conserváre dignéris, _te rogámus, audi nos._", "That You deign to strengthen and keep us in Your holy service, _we beseech You, hear us._"], ["t", "Ut mentes nostras ad cæléstia desidéria érigas, _te rogámus, audi nos._", "That You lift up our minds to heavenly desires, _we beseech You, hear us._"], ["t", "Ut ómnibus benefactóribus nostris sempitérna bona retríbuas, _te rogámus, audi nos._", "That You render eternal blessings to all our benefactors, _we beseech You, hear us._"], ["t", "Ut ánimas nostras, fratrum, propinquórum et benefactórum nostrórum ab ætérna damnatióne erípias, _te rogámus, audi nos._", "That You deliver our souls and the souls of our brethren, relatives, and benefactors from eternal damnation, _we beseech You, hear us._"], ["t", "Ut fructus terræ dare et conserváre dignéris, _te rogámus, audi nos._", "That You deign to give and preserve the fruits of the earth, _we beseech You, hear us._"], ["t", "Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris, _te rogámus, audi nos._", "That You deign to grant eternal rest to all the faithful departed, _we beseech You, hear us._"], ["t", "Ut nos exaudíre dignéris, _te rogámus, audi nos._", "That You deign graciously to hear us, _we beseech You, hear us._"], ["t", "Fili Dei, _te rogámus, audi nos._", "Son of God, _we beseech You, hear us._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _parce nobis, Dómine._", "Lamb of God, who take away the sins of the world, _spare us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _exáudi nos, Dómine._", "Lamb of God, who take away the sins of the world, _graciously hear us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _miserére nobis._", "Lamb of God, who take away the sins of the world, _have mercy on us._"], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["r", "Quibus finitis, Sacerdos versus ad dictum altare dicit:", "When it is finished, the priest, turning toward the altar, says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Prævéniat nos, quǽsumus, Dómine, misericórdia tua: et intercedéntibus ómnibus Sanctis tuis, voces nostras cleméntia tuæ propitiatiónis antícipet. Per Christum, Dóminum nostrum. ℟. Amen.", "May Your mercy, we beseech You, O Lord, go before us, and through the intercession of all
