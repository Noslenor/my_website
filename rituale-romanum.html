  RITUALE ROMANUM · Latin and English side by side
  ════════════════════════════════════════════════════════════════════════

  WHERE THINGS ARE
    • The prayer texts are NOT in this file. They live in plain text files:
          rituale/contents.txt   the list of text files, in order
          rituale/texts/         one file per section of the book
          rituale/shared/        psalms, hymns and litanies used in many rites
      To fix a word in a prayer, edit the text file, not this page.
      How to do that is explained in rituale/README.md.

    • This file only controls how the page looks and works:
          PART 1  Page setup (title, fonts)
          PART 2  Styles: colors, sidebar, prayer layout, phone, printing
          PART 3  Page skeleton (sidebar, buttons, reading area)
          PART 4  Program: loads the text files and shows the rites

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rituale Romanum</title>

<!-- ════════════════════════════════════════════════════════════════════
     PART 2 · STYLES (how the page looks)
     ════════════════════════════════════════════════════════════════════ -->
<style>
  /* ── 2a. Colors ─────────────────────────────────────────────────────
     Change a color here and it changes everywhere on the page.
       --paper   page background        --page    card background
       --ink     main text              --muted   grey secondary text
       --rubric  red of the rubrics     --accent  dark red of titles
       --hl      highlight (search hits, current rite in the menu)   */
  :root {
    --paper: #f6f1e7; --page: #fffdf8; --ink: #2b2420; --muted: #75695d; --line: #e5dccb;
    --rubric: #a3221b; --accent: #7b1e1a; --hl: #f3e3b5;
    --shadow: 0 1px 2px rgba(50,30,10,.06), 0 8px 26px rgba(50,30,10,.07);
  }
  /* Colors used when the phone or computer is set to dark mode */
  @media (prefers-color-scheme: dark) {
    :root { --paper: #16120f; --page: #1f1a16; --ink: #ece4d6; --muted: #a89a88; --line: #3a3129; --rubric: #e9776c; --accent: #e9776c; --hl: #4a3b1a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.35); }
  }

  /* ── 2b. Basic text and page layout ────────────────────────────────
     17px is the reading size of the prayers; change it to make all text larger or smaller. */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 "EB Garamond", Georgia, serif; }
  button, input, select { font: inherit; color: inherit; }
  .ui { font-family: Inter, system-ui, -apple-system, sans-serif; }
  a { color: var(--accent); }
  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 100vh; }

  /* ── 2c. Sidebar (contents menu on the left) ─────────────────────── */
  aside { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--line); background: var(--page); padding: 18px 14px 40px; }
  .brand { display: block; text-decoration: none; font-size: 1.6rem; font-weight: 600; letter-spacing: .3px; color: var(--accent); line-height: 1.1; }   /* the title is also a link to the welcome page */
  .brand small { display: block; font-family: Inter, sans-serif; font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; font-weight: 500; }
  .back { font-size: .8rem; color: var(--muted); text-decoration: none; display: inline-block; margin: 6px 0 14px; }
  .search { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 11px; font-size: .9rem; }
  .cat { margin: 16px 0 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .toc a { display: block; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 8px; line-height: 1.25; }
  .toc a .la { display: block; font-size: .98rem; }
  .toc a .en { display: block; font-family: Inter, sans-serif; font-size: .74rem; color: var(--muted); }
  .toc a:hover { background: var(--paper); }
  .toc a[aria-current="true"] { background: var(--hl); }
  .toc .none { font-size: .85rem; color: var(--muted); padding: 8px; }

  /* ── 2d. Top bar (Latin / English buttons, Print) ────────────────── */
  main { padding: 26px 34px 80px; max-width: 1180px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--page); }
  .seg button { border: 0; background: transparent; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); }
  .btn { border: 1px solid var(--line); background: var(--page); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .82rem; }
  .menu-btn { display: none; }
  .bar-left { display: inline-flex; gap: 8px; }
  .btn.home { text-decoration: none; color: var(--ink); }   /* the Home button: back to the welcome page */

  /* ── 2e. A rite: title, two columns, and each kind of line ─────────
     .r = rubric   .h = heading   .t = text   .v = versicle   .x = response   .n = English note */
  article.rite { background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 34px 34px; }
  .ref { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { margin: 6px 0 2px; font-weight: 600; font-size: clamp(1.7rem, 3.4vw, 2.4rem); line-height: 1.12; color: var(--accent); }
  h1 + .sub { font-size: 1.25rem; font-style: italic; color: var(--muted); margin-bottom: 18px; }
  .rows { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 34px; }
  .rows.only-la, .rows.only-en { grid-template-columns: minmax(0, 1fr); max-width: 760px; }
  .rows.only-la .en, .rows.only-en .la { display: none; }
  .colhead { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 8px; }
  .rows.only-la .colhead.en, .rows.only-en .colhead.la { display: none; }
  .row { display: contents; }
  .row > div { padding: 5px 0; }
  .la { font-feature-settings: "liga", "dlig"; }
  .r > div { color: var(--rubric); font-size: .92rem; font-style: italic; }
  .h > div { font-weight: 600; font-size: 1.12rem; padding-top: 16px; color: var(--accent); font-variant: small-caps; letter-spacing: .03em; }
  .v > div, .x > div { padding: 1px 0; }
  .sym, .cross { color: var(--rubric); font-weight: 600; }
  em.rb { color: var(--rubric); }
  .n { grid-column: 1 / -1; font-family: Inter, sans-serif; font-size: .82rem; color: var(--muted); background: var(--paper); border-left: 3px solid var(--rubric); border-radius: 6px; padding: 8px 12px; margin: 10px 0; }
  .pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; font-family: Inter, sans-serif; font-size: .85rem; }
  .pager a { text-decoration: none; max-width: 48%; }
  mark { background: var(--hl); color: inherit; padding: 0 2px; border-radius: 3px; }

  /* ── 2f. Welcome page, loading message, and the red "problem" box ── */
  .intro { background: var(--page); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px 34px; }
  .intro h1 { margin-top: 0; }
  .intro p, .intro li { font-size: 1.05rem; max-width: 72ch; }
  .grid-cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 18px 0; font-family: Inter, sans-serif; }
  .grid-cats a { display: block; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .grid-cats a b { display: block; font-size: .95rem; }
  .grid-cats a span { font-size: .78rem; color: var(--muted); }
  .loading { font-family: Inter, sans-serif; color: var(--muted); padding: 40px 10px; }
  .problems { font-family: Inter, sans-serif; font-size: .85rem; border: 2px solid var(--rubric); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; background: var(--page); }
  .problems b { color: var(--rubric); }
  .problems li { margin: 3px 0; }
  .problems code { background: var(--paper); padding: 0 4px; border-radius: 4px; }

  /* ── 2g. Phones and small screens (900px wide or less) ─────────── */
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(330px, 88vw); z-index: 20; transform: translateX(-102%); transition: transform .25s; box-shadow: var(--shadow); }
    body.menu-open aside { transform: none; }
    .menu-btn { display: inline-block; }
    main { padding: 16px 16px 60px; }
    article.rite, .intro { padding: 22px 18px; border-radius: 12px; }
    .rows { grid-template-columns: minmax(0, 1fr); }
    .rows .row > .en { padding-top: 0; padding-bottom: 12px; color: var(--muted); }
    .rows .r > .en { color: var(--rubric); opacity: .8; }
    .rows.only-la .row > .en, .rows.only-en .row > .la { display: none; }
    .rows.only-en .row > .en { color: var(--ink); padding-bottom: 5px; }
    .colhead { display: none; }
  }

  /* ── 2h. Printing ─────────────────────────────────────────────────── */
  @media print {
    aside, .bar, .pager, .problems { display: none !important; }
    .shell { display: block; }
    main { padding: 0; max-width: none; }
    article.rite { border: 0; box-shadow: none; padding: 0; }
    body { background: #fff; color: #000; font-size: 11.5pt; }
    :root { --rubric: #a3221b; --accent: #7b1e1a; }
  }
</style>
</head>
<body>
<!-- ════════════════════════════════════════════════════════════════════
     PART 3 · PAGE SKELETON
     The program in Part 4 fills in the contents menu (#toc) and the
     reading area (#view).
     ════════════════════════════════════════════════════════════════════ -->
<div class="shell">
  <!-- Sidebar: title, link home, search box, contents menu -->
  <aside id="side" aria-label="Contents">
    <a class="brand" href="#" title="Back to the welcome page">Rituale Romanum<small>Latin · English</small></a>
    <input class="search ui" id="q" type="search" placeholder="Search Latin or English…" aria-label="Search the rites">
    <nav class="toc" id="toc"></nav>
  </aside>
  <!-- Main area: buttons at the top, then the rite being read -->
  <main>
    <div class="bar ui">
      <div class="bar-left">
        <button class="btn menu-btn" id="menuBtn" aria-controls="side">☰ Contents</button>
        <a class="btn home" href="#" title="Back to the welcome page">⌂ Home</a>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button data-view="both" aria-pressed="true">Latin &amp; English</button>
        <button data-view="la" aria-pressed="false">Latin</button>
        <button data-view="en" aria-pressed="false">English</button>
      </div>
      <button class="btn" id="printBtn">Print</button>
    </div>
    <div id="problems"></div>
    <div id="view"><div class="loading">Loading the Rituale…</div></div>
  </main>

<!-- ════════════════════════════════════════════════════════════════════
     PART 4 · PROGRAM
     ════════════════════════════════════════════════════════════════════ -->
<script>
(function () {

  /* ── 4a. SETTINGS YOU MAY WANT TO CHANGE ─────────────────────────── */

  // Where the text files are kept (folders next to this page).
  const CONTENTS_FILE = 'rituale/contents.txt';
  const TEXTS_FOLDER  = 'rituale/texts/';
  const SHARED_FOLDER = 'rituale/shared/';

  // Order of the categories in the contents menu. A category used in a text
  // file but missing from this list is shown at the end.
  const CATEGORY_ORDER = ['Sacraments', 'The Dying & the Dead', 'General', 'Litanies & Prayers', 'Processions', 'Exorcism',
    'Holy Water', 'Objects of Devotion', 'Sacramentals & Scapulars', 'Homes & Places', 'The Sick', 'Mothers & Children',
    'Food & Drink', 'Feasts of the Year', 'Fields & Animals', 'Work & Travel', 'Churches & Sacred Things',
    'Proper to Religious Orders', 'Other'];

  // The "About this edition" text on the welcome page is in section 4d below.


  /* ── Small helpers ───────────────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  let RITES = [];          // every rite, filled in by loadEverything()
  let cats = [];           // the categories, in menu order
  let view = store.get('rit.view') || 'both';   // Latin & English / Latin / English
  const problems = [];     // mistakes found in the text files


  /* ── 4b. READING THE TEXT FILES ──────────────────────────────────────
     Each text file is read line by line:
       "# id | Latin title | English title | Category | Reference"  starts a rite
       "r: Latin || English" (also t: h: v: x:)                        adds a line
       "n: English note"                                                adds a note
       "@name"                                                          inserts rituale/shared/name.txt
       "// ..." and empty lines                                         are skipped
     Anything else is reported in the red "problem" box at the top of the page. */

  async function fetchText(path) {
    const res = await fetch(path, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`could not open ${path}`);
    return res.text();
  }

  const sharedCache = {};
  async function readShared(name) {
    if (!(name in sharedCache)) sharedCache[name] = fetchText(SHARED_FOLDER + name + '.txt');
    return sharedCache[name];
  }

  // Turns the text of one file into lines, replacing every @name with the shared text.
  async function expandIncludes(text, fileLabel, depth = 0) {
    const out = [];
    const lines = text.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trimEnd();
      const m = line.match(/^@(\S+)\s*$/);
      if (m) {
        if (depth > 5) { problems.push(`${fileLabel}, line ${i + 1}: shared texts nested too deeply`); continue; }
        try {
          const shared = await readShared(m[1]);
          out.push(...await expandIncludes(shared, `shared/${m[1]}.txt`, depth + 1));
        } catch (e) { problems.push(`${fileLabel}, line ${i + 1}: there is no shared text called <code>${esc(m[1])}</code> (looked for rituale/shared/${esc(m[1])}.txt)`); }
        continue;
      }
      out.push({ text: line, where: `${fileLabel}, line ${i + 1}` });
    }
    return out;
  }

  // Reads one text file and returns the list of rites in it.
  async function readTextFile(fileName) {
    const raw = await fetchText(TEXTS_FOLDER + fileName);
    const lines = await expandIncludes(raw, `texts/${fileName}`);
    const rites = [];
    let current = null;
    for (const { text, where } of lines) {
      if (!text.trim() || text.trim().startsWith('//')) continue;          // blank line or editor's note
      if (text.startsWith('# ')) {                                         // start of a new rite
        const parts = text.slice(2).split('|').map(p => p.trim());
        if (parts.length !== 5) { problems.push(`${where}: a rite heading needs 5 parts separated by | (id | Latin title | English title | Category | Reference)`); current = null; continue; }
        const [id, la, en, cat, ref] = parts;
        current = { id, la, en, cat, ref, b: [] };
        rites.push(current);
        continue;
      }
      const m = text.match(/^([rthvxn]):\s?(.*)$/);
      if (!m) { problems.push(`${where}: this line does not start with r: t: h: v: x: n: # or @ — <code>${esc(text.slice(0, 60))}</code>`); continue; }
      if (!current) { problems.push(`${where}: this line comes before any rite heading (# ...)`); continue; }
      const [, kind, body] = m;
      if (kind === 'n') { current.b.push(['n', '', body.trim()]); continue; }
      const split = body.indexOf(' || ');
      if (split < 0) { problems.push(`${where}: missing " || " between the Latin and the English`); continue; }
      const la = body.slice(0, split).trim(), en = body.slice(split + 4).trim();
      const crossesLa = (la.match(/✠/g) || []).length, crossesEn = (en.match(/✠/g) || []).length;
      if (crossesLa !== crossesEn) problems.push(`${where}: ${crossesLa} ✠ in the Latin but ${crossesEn} in the English`);
      current.b.push([kind, la, en]);
    }
    return rites;
  }

  // Reads contents.txt, then every text file listed there (all at the same time, kept in order).
  async function loadEverything() {
    const list = (await fetchText(CONTENTS_FILE)).split(/\r?\n/)
      .map(l => l.replace(/\/\/.*$/, '').trim())        // drop // notes
      .filter(Boolean);
    const perFile = await Promise.all(list.map(async name => {
      try { return await readTextFile(name); }
      catch (e) { problems.push(`contents.txt lists <code>${esc(name)}</code>, but that file could not be opened in rituale/texts/`); return []; }
    }));
    RITES = perFile.flat();
    const seen = new Set();
    RITES.forEach(r => { if (seen.has(r.id)) problems.push(`two rites use the same id <code>${esc(r.id)}</code>; each id must be different`); seen.add(r.id); });
    cats = [...new Set(RITES.map(r => r.cat))].sort((a, b) => rank(a) - rank(b));
  }
  const rank = c => { const i = CATEGORY_ORDER.indexOf(c); return i < 0 ? 999 : i; };


  /* ── 4c. TURNING A RITE INTO THE PAGE YOU SEE ────────────────────── */

  // Inline marks: *red italic*, _italic_, and coloring of ✠ ℟. ℣.
  function fmt(s) {
    let h = esc(s);
    h = h.replace(/\*(\S[^*]*?\S|\S)\*/g, '<em class="rb">$1</em>');
    h = h.replace(/_(\S[^_]*?\S|\S)_/g, '<i>$1</i>');
    h = h.replace(/✠/g, '<span class="cross">✠</span>').replace(/℟\./g, '<span class="sym">℟.</span>').replace(/℣\./g, '<span class="sym">℣.</span>');
    return h;
  }
  // One line of a rite: Latin cell + English cell (or a full-width note).
  function blockHTML([k, la, en]) {
    if (k === 'n') return `<div class="n ui">${fmt(en)}</div>`;
    const pre = k === 'v' ? '<span class="sym">℣.</span> ' : k === 'x' ? '<span class="sym">℟.</span> ' : '';
    return `<div class="row ${k}"><div class="la" lang="la">${pre}${fmt(la)}</div><div class="en">${pre}${fmt(en)}</div></div>`;
  }
  // A whole rite with its title and the previous/next links at the bottom.
  function riteHTML(r) {
    const i = RITES.indexOf(r), prev = RITES[i - 1], next = RITES[i + 1];
    return `<article class="rite"><div class="ref ui">${esc(r.cat)} · Rituale Romanum, ${esc(r.ref)}</div>
      <h1 lang="la">${esc(r.la)}</h1><div class="sub">${esc(r.en)}</div>
      <div class="rows ${view === 'both' ? '' : 'only-' + view}"><div class="colhead la ui">Latin</div><div class="colhead en ui">English</div>
      ${r.b.map(blockHTML).join('')}</div></article>
      <div class="pager">${prev ? `<a href="#${prev.id}">← ${esc(prev.en)}</a>` : '<span></span>'}<a href="#">⌂ Home</a>${next ? `<a href="#${next.id}">${esc(next.en)} →</a>` : '<span></span>'}</div>`;
  }


  /* ── 4d. THE WELCOME PAGE ("About this edition") ─────────────────────
     The paragraphs between <p> and </p> below can be edited like ordinary text. */
  function introHTML() {
    const counts = {}; RITES.forEach(r => counts[r.cat] = (counts[r.cat] || 0) + 1);
    return `<section class="intro"><h1 lang="la">Rituale Romanum</h1><div class="sub" style="font-style:italic;color:var(--muted);font-size:1.2rem;margin-bottom:12px">The rites and blessings of the Roman Ritual, in Latin with an English translation</div>
      <div class="grid-cats">${cats.map(c => `<a href="#${RITES.find(r => r.cat === c).id}"><b>${esc(c)}</b><span>${counts[c]} ${counts[c] === 1 ? 'rite' : 'rites'}</span></a>`).join('')}</div>
      <h2 style="color:var(--accent);font-weight:600">About this edition</h2>

      <p><b>Latin text.</b> Transcribed from the Pustet edition of the <i>Rituale Romanum</i> (juxta typicam 1925), with a second scan of the same edition consulted where the first was unclear. The 1952 typical edition, in use in 1962, kept these rites with very few changes; it chiefly added and reordered blessings. Chapter references follow the 1925 numbering. The psalms are given in the Vulgate; in 1962 the newer Pian Latin psalter was also permitted in some places.</p>

      <p><b>Contents.</b> The whole book: all twelve Titles (the sacraments, the sick and dying, funerals and the Office of the Dead, blessings, processions, litanies, the exorcism and the parish registers) and the Appendix (further sacramental rites, the reserved and proper blessings, and those approved for particular places). Left out: the papal decrees at the front, the index, the musical notation (the chanted texts are given as words), and the English and German addresses printed for local use.</p>

      <p><b>English translation.</b> A new, fairly literal translation made for this page, so that it can be read alongside the Latin. It is not an approved liturgical translation.</p>

      <p><b>Rubrics</b> (instructions) are printed in red, as in the liturgical books. <span class="cross">✠</span> marks the sign of the cross; <span class="sym">℣.</span> and <span class="sym">℟.</span> mark versicle and response.</p>

      <p>Pick a rite from the contents, or search for any word in Latin or English.</p></section>`;
  }


  /* ── 4e. CONTENTS MENU AND SEARCH ────────────────────────────────── */

  // Search ignores accents and treats æ as ae, œ as oe.
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/æ/g, 'ae').replace(/œ/g, 'oe');

  function renderTOC(filter) {
    const nq = norm((filter || '').trim());
    const match = r => !nq || norm(r.la + ' ' + r.en).includes(nq) || r.b.some(([, la, en]) => norm(la + ' ' + en).includes(nq));
    const cur = location.hash.slice(1);
    let html = '';
    for (const c of cats) {
      const list = RITES.filter(r => r.cat === c && match(r));
      if (!list.length) continue;
      html += `<div class="cat ui">${esc(c)}</div>` + list.map(r => `<a href="#${r.id}" aria-current="${r.id === cur}"><span class="la" lang="la">${esc(r.la)}</span><span class="en">${esc(r.en)}</span></a>`).join('');
    }
    $('toc').innerHTML = html || '<div class="none ui">No rites match that search.</div>';
  }

  // Shows the rite named in the address (#id), or the welcome page.
  function render() {
    const id = location.hash.slice(1);
    const r = RITES.find(x => x.id === id);
    $('view').innerHTML = r ? riteHTML(r) : introHTML();
    document.title = r ? `${r.la} · Rituale Romanum` : 'Rituale Romanum';
    renderTOC($('q').value);
    document.body.classList.remove('menu-open');
    const q = $('q').value.trim();
    if (r && q.length > 2) highlight(q);
    window.scrollTo(0, 0);
  }

  // Marks the searched word inside the rite being read.
  function highlight(q) {
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    document.querySelectorAll('#view .row > div').forEach(el => {
      if (!re.test(el.textContent)) return;
      const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = []; while (walk.nextNode()) nodes.push(walk.currentNode);
      nodes.forEach(n => { re.lastIndex = 0; if (!re.test(n.nodeValue)) return; const span = document.createElement('span'); span.innerHTML = esc(n.nodeValue).replace(re, m => `<mark>${m}</mark>`); n.replaceWith(span); });
    });
  }

  // Lists any mistakes found in the text files in a red box at the top.
  function showProblems() {
    if (!problems.length) return;
    $('problems').innerHTML = `<div class="problems"><b>Problems found in the text files</b> (fix these lines, then reload):<ul>${problems.slice(0, 40).map(p => `<li>${p}</li>`).join('')}</ul>${problems.length > 40 ? `…and ${problems.length - 40} more.` : ''}</div>`;
  }


  /* ── 4f. BUTTONS AND STARTING UP ─────────────────────────────────── */

  function setView(v) {
    view = v; store.set('rit.view', v);
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
    const rows = document.querySelector('.rows'); if (rows) rows.className = 'rows' + (v === 'both' ? '' : ' only-' + v);
  }
  document.querySelector('.seg').onclick = e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); };
  $('q').addEventListener('input', () => renderTOC($('q').value));
  $('menuBtn').onclick = () => document.body.classList.toggle('menu-open');
  $('printBtn').onclick = () => window.print();
  document.addEventListener('click', e => { if (document.body.classList.contains('menu-open') && !e.target.closest('aside') && !e.target.closest('#menuBtn')) document.body.classList.remove('menu-open'); });
  window.addEventListener('hashchange', render);
  setView(view);

  loadEverything()
    .then(() => { window.RITUALE = RITES; showProblems(); render(); })   // RITUALE: handy for checking in the browser console
    .catch(err => { $('view').innerHTML = `<div class="problems"><b>The texts could not be loaded.</b> ${esc(err.message)}</div>`; });
})();
</script>
