Your Saints may the kindness of Your favor anticipate our prayers. Through Christ our Lord. ℟. Amen."], ["r", "4. Deinde Sacerdos genuflectit ante altare, et se signo crucis muniens, clara voce dicit: Deus, in adjutórium meum inténde: tum surgit, et Chorus, seu astantes Clerici respondent: Dómine, ad adjuvándum me festína; et Sacerdos stans, dicit: Glória Patri, et Fílio, et Spirítui Sancto. ℟. Sicut erat in princípio, et nunc, et semper, et in sǽcula sæculórum. Amen.", "4. Then the priest kneels before the altar and, signing himself with the cross, says in a clear voice: \"O God, come to my assistance\"; then he rises, and the choir or the clerics present answer: \"O Lord, make haste to help me\"; and the priest, standing, says: \"Glory be to the Father, and to the Son, and to the Holy Spirit.\" ℟. \"As it was in the beginning, is now, and ever shall be, world without end. Amen.\""], ["v", "Deus, in adjutórium meum inténde.", "O God, come to my assistance."], ["x", "Dómine, ad adjuvándum me festína.", "O Lord, make haste to help me."], ["t", "Glória Patri, et Fílio, et Spirítui Sancto. ℟. Sicut erat in princípio, et nunc, et semper, et in sǽcula sæculórum. Amen.", "Glory be to the Father, and to the Son, and to the Holy Spirit. ℟. As it was in the beginning, is now, and ever shall be, world without end. Amen."], ["r", "5. Quo dicto, Sacerdos inchoat, Clero prosequente, Antiphonam, quæ post singulos versus Psalmi repetitur:", "5. After this the priest intones the antiphon, the clergy continuing; it is repeated after each verse of the psalm:"], ["t", "*Ant.* Exsúrgat Deus, et dissipéntur inimíci ejus: et fúgiant, qui odérunt eum, a fácie ejus.", "*Ant.* Let God arise, and let His enemies be scattered, and let those who hate Him flee before His face."], ["h", "Psalmus 67 (vv. 27–36)", "Psalm 67 (vv. 27–36)"], ["t", "In ecclésiis benedícite Deo Dómino, * de fóntibus Israël.", "In the churches bless God the Lord, * you of the fountains of Israel."], ["t", "Ibi Bénjamin adolescéntulus, * in mentis excéssu.", "There is Benjamin, the youngest, * in ecstasy of mind;"], ["t", "Príncipes Juda, duces eórum: * príncipes Zábulon, príncipes Néphthali.", "The princes of Judah, their leaders; * the princes of Zabulon, the princes of Nephthali."], ["t", "Manda, Deus, virtúti tuæ: * confírma hoc, Deus, quod operátus es in nobis.", "Command Your strength, O God; * confirm, O God, what You have wrought in us."], ["t", "A templo sancto tuo in Jerúsalem, * tibi ófferent reges múnera.", "From Your holy temple in Jerusalem * kings shall offer gifts to You."], ["t", "Íncrepa feras arúndinis, congregátio taurórum in vaccis populórum: * ut exclúdant eos, qui probáti sunt argénto.", "Rebuke the wild beasts of the reeds, the herd of bulls among the heifers of the peoples, * who seek to shut out those who have been tried like silver."], ["t", "Díssipa gentes, quæ bella volunt: vénient legáti ex Ægýpto: * Æthiópia prævéniet manus ejus Deo.", "Scatter the nations that delight in wars. Envoys shall come out of Egypt; * Ethiopia shall stretch forth her hands to God."], ["t", "Regna terræ, cantáte Deo: * psállite Dómino.", "Sing to God, you kingdoms of the earth; * sing praises to the Lord."], ["t", "Psállite Deo, qui ascéndit super cælum cæli, * ad Oriéntem.", "Sing to God, who ascends above the heaven of heavens, * toward the east."], ["t", "Ecce, dabit voci suæ vocem virtútis, date glóriam Deo super Israël, * magnificéntia ejus, et virtus ejus in núbibus.", "Behold, He will give His voice a voice of power. Give glory to God over Israel; * His magnificence and His power are in the clouds."], ["t", "Mirábilis Deus in sanctis suis, Deus Israël ipse dabit virtútem, et fortitúdinem plebi suæ, * benedíctus Deus.", "God is wonderful in His Saints; the God of Israel Himself will give power and strength to His people. * Blessed be God."], ["r", "Et non dicitur Glória Patri, sed Antiphona repetitur.", "The Glory be is not said, but the antiphon is repeated."], ["t", "*Ant.* Exsúrgat Deus, et dissipéntur inimíci ejus: et fúgiant, qui odérunt eum, a fácie ejus.", "*Ant.* Let God arise, and let His enemies be scattered, and let those who hate Him flee before His face."], ["r", "6. Interim dum Antiphona et Psalmus prædicti dicuntur, Sacerdos circuit ecclesiam intrinsecus aspergendo: aspergit etiam specialiter loca contaminata. Quo facto, stans in presbyterio versus ad altare, dicit:", "6. Meanwhile, while the antiphon and psalm are said, the priest goes around the inside of the church sprinkling it, and sprinkles especially the places that were defiled. When this is done, standing in the sanctuary facing the altar, he says:"], ["t", "Deus, qui in omni loco dominatiónis tuæ clemens et benígnus purificátor assístis: exáudi nos, quǽsumus, et concéde; ut in pósterum inviolábilis hujus loci permáneat benedíctio, et tui múneris benefícia univérsitas fidélium, quæ súpplicat, percípere mereátur. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, who in every place of Your dominion are present as a merciful and kind purifier: hear us, we beseech You, and grant that the blessing of this place may hereafter remain inviolate, and that the whole company of the faithful who make their supplication here may be worthy to receive the benefits of Your bounty. Through Christ our Lord. ℟. Amen."], ["r", "7. Deinde dicitur Missa de die occurrenti.", "7. Then the Mass of the day is said."], ["r", "8. Simplex Sacerdos tantum de licentia Ordinarii potest ecclesiam consecratam reconciliare, et tunc utatur ritu in Pontificali præscripto: procedatque indutus amictu, alba, cingulo, stola et pluviali albi coloris, adhibitis secum aliquot Clericis superpelliceis indutis. In casu tamen gravis et urgentis necessitatis, si Ordinarius adiri nequeat, Rectori ecclesiæ consecratæ eandem reconciliare fas est, certiore facto postea Ordinario.", "8. A simple priest may reconcile a consecrated church only with the permission of the Ordinary, and in that case he uses the rite prescribed in the Pontifical, vested in amice, alb, cincture, stole, and white cope, and attended by several clerics in surplices. In a case of grave and urgent necessity, however, if the Ordinary cannot be reached, the rector of a consecrated church may reconcile it, informing the Ordinary afterward."]]}, {"id": "new-cemetery", "la": "Ritus Benedicendi Novum Cœmeterium", "en": "Blessing of a New Cemetery", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 29", "b": [["r", "1. Pridie quam fiat benedictio, ponitur in medio cœmeterii benedicendi lignea Crux, alta ad staturam hominis et ante ipsam Crucem in terra figitur paxillus tridens ligneus, altus ad cubitum unum, aptus ad affigendum illi tres candelas.", "1. On the day before the blessing, a wooden cross the height of a man is set up in the middle of the cemetery to be blessed, and in front of the cross a three-pronged wooden stake, a cubit high, is fixed in the ground, suitable for holding three candles."], ["r", "2. Sequenti die mane Sacerdos, ab Ordinario delegatus, in sacristia paratur amictu, alba, cingulo, stola ac pluviali albi coloris, et, adhibitis aliquot Clericis indutis superpelliceis, qui deferant vasculum aquæ benedictæ, aspergillum, thuribulum cum incensi navicula, hunc Ritualem librum et tres candelas cereas, procedit ad cœmeterium benedicendum ante Crucem in medio positam, et affiguntur, et accenduntur tres candelæ super ligneum paxillum: tunc Sacerdos ante Crucem et candelas stans, discooperto capite, dicit:", "2. On the following morning the priest delegated by the Ordinary vests in the sacristy in amice, alb, cincture, stole, and white cope; and, attended by several clerics in surplices carrying the holy water vessel, the sprinkler, the thurible with the incense boat, this Ritual, and three wax candles, he goes to the cemetery to be blessed, before the cross set up in its midst. The three candles are fixed on the wooden stake and lighted. Then the priest, standing bareheaded before the cross and the candles, says:"], ["t", "Orémus.", "Let us pray."], ["t", "Omnípotens Deus, qui es custos animárum, et tutéla salútis, fides credéntium: réspice propítius ad nostræ servitútis offícium, et ad intróitum nostrum purgétur, bene✠dicátur, et sancti✠ficétur hoc cœmetérium; ut humána córpora hic post vitæ cursum quiescéntia, in magno judícii die simul cum felícibus animábus mereántur adipísci vitæ perénnis gáudia. Per Christum, Dóminum nostrum. ℟. Amen.", "Almighty God, guardian of souls, safeguard of salvation, and faith of believers: look graciously upon the service of our ministry, and at our entrance may this cemetery be cleansed, ✠ blessed, and ✠ sanctified; so that the human bodies resting here after the course of this life may, on the great day of judgment, together with the blessed souls, be worthy to obtain the joys of everlasting life. Through Christ our Lord. ℟. Amen."], ["r", "3. Mox ante ipsam Crucem omnes genibus flexis dicunt Litanias ordinarias, incipiente cantore, ceteris respondentibus; et cum dictum fuerit: Ut ómnibus fidélibus defúnctis, etc. ℟. Te rogámus, audi nos, Sacerdos surgit, et clara voce dicit, producens manu signum crucis:", "3. Then all, kneeling before the cross, say the ordinary Litany of the Saints, the cantor beginning and the others responding; and when \"That You deign to grant eternal rest to all the faithful departed,\" etc. ℟. \"We beseech You, hear us\" has been said, the priest rises and, making the sign of the cross with his hand, says in a clear voice:"], ["t", "Ut hoc cœmetérium purgáre, et bene✠dícere dignéris. ℟. Te rogámus, audi nos.", "That You deign to cleanse and ✠ bless this cemetery. ℟. We beseech You, hear us."], ["r", "4. Deinde Sacerdos, ut prius, genuflectit, et Litaniæ perficiuntur.", "4. Then the priest kneels as before, and the Litany is completed."], ["n", "", "The full Litany follows for convenience; the priest's petition above is inserted after the petition for the faithful departed."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis._", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte, Deus, _miserére nobis._", "God the Holy Spirit, _have mercy on us._"], ["t", "Sancta Trínitas, unus Deus, _miserére nobis._", "Holy Trinity, one God, _have mercy on us._"], ["t", "Sancta María, _ora pro nobis._", "Holy Mary, _pray for us._"], ["t", "Sancta Dei Génetrix, _ora pro nobis._", "Holy Mother of God, _pray for us._"], ["t", "Sancta Virgo vírginum, _ora pro nobis._", "Holy Virgin of virgins, _pray for us._"], ["t", "Sancte Míchaël, _ora pro nobis._", "Saint Michael, _pray for us._"], ["t", "Sancte Gábriel, _ora pro nobis._", "Saint Gabriel, _pray for us._"], ["t", "Sancte Ráphaël, _ora pro nobis._", "Saint Raphael, _pray for us._"], ["t", "Omnes sancti Ángeli et Archángeli, _oráte pro nobis._", "All you holy Angels and Archangels, _pray for us._"], ["t", "Omnes sancti beatórum Spirítuum órdines, _oráte pro nobis._", "All you holy orders of blessed Spirits, _pray for us._"], ["t", "Sancte Joánnes Baptísta, _ora pro nobis._", "Saint John the Baptist, _pray for us._"], ["t", "Sancte Joseph, _ora pro nobis._", "Saint Joseph, _pray for us._"], ["t", "Omnes sancti Patriárchæ et Prophétæ, _oráte pro nobis._", "All you holy Patriarchs and Prophets, _pray for us._"], ["t", "Sancte Petre, _ora pro nobis._", "Saint Peter, _pray for us._"], ["t", "Sancte Paule, _ora pro nobis._", "Saint Paul, _pray for us._"], ["t", "Sancte Andréa, _ora pro nobis._", "Saint Andrew, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Joánnes, _ora pro nobis._", "Saint John, _pray for us._"], ["t", "Sancte Thoma, _ora pro nobis._", "Saint Thomas, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Philíppe, _ora pro nobis._", "Saint Philip, _pray for us._"], ["t", "Sancte Bartholomǽe, _ora pro nobis._", "Saint Bartholomew, _pray for us._"], ["t", "Sancte Matthǽe, _ora pro nobis._", "Saint Matthew, _pray for us._"], ["t", "Sancte Simon, _ora pro nobis._", "Saint Simon, _pray for us._"], ["t", "Sancte Thaddǽe, _ora pro nobis._", "Saint Thaddeus, _pray for us._"], ["t", "Sancte Matthía, _ora pro nobis._", "Saint Matthias, _pray for us._"], ["t", "Sancte Bárnaba, _ora pro nobis._", "Saint Barnabas, _pray for us._"], ["t", "Sancte Luca, _ora pro nobis._", "Saint Luke, _pray for us._"], ["t", "Sancte Marce, _ora pro nobis._", "Saint Mark, _pray for us._"], ["t", "Omnes sancti Apóstoli et Evangelístæ, _oráte pro nobis._", "All you holy Apostles and Evangelists, _pray for us._"], ["t", "Omnes sancti Discípuli Dómini, _oráte pro nobis._", "All you holy Disciples of the Lord, _pray for us._"], ["t", "Omnes sancti Innocéntes, _oráte pro nobis._", "All you holy Innocents, _pray for us._"], ["t", "Sancte Stéphane, _ora pro nobis._", "Saint Stephen, _pray for us._"], ["t", "Sancte Laurénti, _ora pro nobis._", "Saint Lawrence, _pray for us._"], ["t", "Sancte Vincénti, _ora pro nobis._", "Saint Vincent, _pray for us._"], ["t", "Sancti Fabiáne et Sebastiáne, _oráte pro nobis._", "Saints Fabian and Sebastian, _pray for us._"], ["t", "Sancti Joánnes et Paule, _oráte pro nobis._", "Saints John and Paul, _pray for us._"], ["t", "Sancti Cosma et Damiáne, _oráte pro nobis._", "Saints Cosmas and Damian, _pray for us._"], ["t", "Sancti Gervási et Protási, _oráte pro nobis._", "Saints Gervase and Protase, _pray for us._"], ["t", "Omnes sancti Mártyres, _oráte pro nobis._", "All you holy Martyrs, _pray for us._"], ["t", "Sancte Silvéster, _ora pro nobis._", "Saint Sylvester, _pray for us._"], ["t", "Sancte Gregóri, _ora pro nobis._", "Saint Gregory, _pray for us._"], ["t", "Sancte Ambrósi, _ora pro nobis._", "Saint Ambrose, _pray for us._"], ["t", "Sancte Augustíne, _ora pro nobis._", "Saint Augustine, _pray for us._"], ["t", "Sancte Hierónyme, _ora pro nobis._", "Saint Jerome, _pray for us._"], ["t", "Sancte Martíne, _ora pro nobis._", "Saint Martin, _pray for us._"], ["t", "Sancte Nicoláe, _ora pro nobis._", "Saint Nicholas, _pray for us._"], ["t", "Omnes sancti Pontífices et Confessóres, _oráte pro nobis._", "All you holy Bishops and Confessors, _pray for us._"], ["t", "Omnes sancti Doctóres, _oráte pro nobis._", "All you holy Doctors, _pray for us._"], ["t", "Sancte Antóni, _ora pro nobis._", "Saint Anthony, _pray for us._"], ["t", "Sancte Benedícte, _ora pro nobis._", "Saint Benedict, _pray for us._"], ["t", "Sancte Bernárde, _ora pro nobis._", "Saint Bernard, _pray for us._"], ["t", "Sancte Domínice, _ora pro nobis._", "Saint Dominic, _pray for us._"], ["t", "Sancte Francísce, _ora pro nobis._", "Saint Francis, _pray for us._"], ["t", "Omnes sancti Sacerdótes et Levítæ, _oráte pro nobis._", "All you holy Priests and Levites, _pray for us._"], ["t", "Omnes sancti Mónachi et Eremítæ, _oráte pro nobis._", "All you holy Monks and Hermits, _pray for us._"], ["t", "Sancta María Magdaléna, _ora pro nobis._", "Saint Mary Magdalene, _pray for us._"], ["t", "Sancta Ágatha, _ora pro nobis._", "Saint Agatha, _pray for us._"], ["t", "Sancta Lúcia, _ora pro nobis._", "Saint Lucy, _pray for us._"], ["t", "Sancta Agnes, _ora pro nobis._", "Saint Agnes, _pray for us._"], ["t", "Sancta Cæcília, _ora pro nobis._", "Saint Cecilia, _pray for us._"], ["t", "Sancta Catharína, _ora pro nobis._", "Saint Catherine, _pray for us._"], ["t", "Sancta Anastásia, _ora pro nobis._", "Saint Anastasia, _pray for us._"], ["t", "Omnes sanctæ Vírgines et Víduæ, _oráte pro nobis._", "All you holy Virgins and Widows, _pray for us._"], ["t", "Omnes Sancti et Sanctæ Dei, _intercédite pro nobis._", "All you holy men and women, Saints of God, _intercede for us._"], ["t", "Propítius esto, _parce nobis, Dómine._", "Be merciful, _spare us, O Lord._"], ["t", "Propítius esto, _exáudi nos, Dómine._", "Be merciful, _graciously hear us, O Lord._"], ["t", "Ab omni malo, _líbera nos, Dómine._", "From all evil, _deliver us, O Lord._"], ["t", "Ab omni peccáto, _líbera nos, Dómine._", "From all sin, _deliver us, O Lord._"], ["t", "Ab ira tua, _líbera nos, Dómine._", "From Your wrath, _deliver us, O Lord._"], ["t", "A subitánea et improvísa morte, _líbera nos, Dómine._", "From sudden and unprovided death, _deliver us, O Lord._"], ["t", "Ab insídiis diáboli, _líbera nos, Dómine._", "From the snares of the devil, _deliver us, O Lord._"], ["t", "Ab ira, et ódio, et omni mala voluntáte, _líbera nos, Dómine._", "From anger, and hatred, and every evil will, _deliver us, O Lord._"], ["t", "A spíritu fornicatiónis, _líbera nos, Dómine._", "From the spirit of fornication, _deliver us, O Lord._"], ["t", "A fúlgure et tempestáte, _líbera nos, Dómine._", "From lightning and tempest, _deliver us, O Lord._"], ["t", "A flagéllo terræmótus, _líbera nos, Dómine._", "From the scourge of earthquake, _deliver us, O Lord._"], ["t", "A peste, fame et bello, _líbera nos, Dómine._", "From plague, famine, and war, _deliver us, O Lord._"], ["t", "A morte perpétua, _líbera nos, Dómine._", "From everlasting death, _deliver us, O Lord._"], ["t", "Per mystérium sanctæ Incarnatiónis tuæ, _líbera nos, Dómine._", "Through the mystery of Your holy Incarnation, _deliver us, O Lord._"], ["t", "Per advéntum tuum, _líbera nos, Dómine._", "Through Your coming, _deliver us, O Lord._"], ["t", "Per nativitátem tuam, _líbera nos, Dómine._", "Through Your birth, _deliver us, O Lord._"], ["t", "Per baptísmum et sanctum jejúnium tuum, _líbera nos, Dómine._", "Through Your baptism and holy fasting, _deliver us, O Lord._"], ["t", "Per crucem et passiónem tuam, _líbera nos, Dómine._", "Through Your Cross and Passion, _deliver us, O Lord._"], ["t", "Per mortem et sepultúram tuam, _líbera nos, Dómine._", "Through Your death and burial, _deliver us, O Lord._"], ["t", "Per sanctam resurrectiónem tuam, _líbera nos, Dómine._", "Through Your holy resurrection, _deliver us, O Lord._"], ["t", "Per admirábilem ascensiónem tuam, _líbera nos, Dómine._", "Through Your wonderful ascension, _deliver us, O Lord._"], ["t", "Per advéntum Spíritus Sancti Parácliti, _líbera nos, Dómine._", "Through the coming of the Holy Spirit, the Paraclete, _deliver us, O Lord._"], ["t", "In die judícii, _líbera nos, Dómine._", "In the day of judgment, _deliver us, O Lord._"], ["t", "Peccatóres, _te rogámus, audi nos._", "We sinners, _we beseech You, hear us._"], ["t", "Ut nobis parcas, _te rogámus, audi nos._", "That You spare us, _we beseech You, hear us._"], ["t", "Ut nobis indúlgeas, _te rogámus, audi nos._", "That You pardon us, _we beseech You, hear us._"], ["t", "Ut ad veram pœniténtiam nos perdúcere dignéris, _te rogámus, audi nos._", "That You deign to bring us to true repentance, _we beseech You, hear us._"], ["t", "Ut Ecclésiam tuam sanctam régere et conserváre dignéris, _te rogámus, audi nos._", "That You deign to govern and preserve Your holy Church, _we beseech You, hear us._"], ["t", "Ut Domnum Apostólicum et omnes ecclesiásticos órdines in sancta religióne conserváre dignéris, _te rogámus, audi nos._", "That You deign to preserve the Apostolic Lord and all ranks of the Church in holy religion, _we beseech You, hear us._"], ["t", "Ut inimícos sanctæ Ecclésiæ humiliáre dignéris, _te rogámus, audi nos._", "That You deign to humble the enemies of holy Church, _we beseech You, hear us._"], ["t", "Ut régibus et princípibus christiánis pacem et veram concórdiam donáre dignéris, _te rogámus, audi nos._", "That You deign to give peace and true concord to Christian kings and rulers, _we beseech You, hear us._"], ["t", "Ut cuncto pópulo christiáno pacem et unitátem largíri dignéris, _te rogámus, audi nos._", "That You deign to grant peace and unity to all Christian people, _we beseech You, hear us._"], ["t", "Ut omnes errántes ad unitátem Ecclésiæ revocáre, et infidéles univérsos ad Evangélii lumen perdúcere dignéris, _te rogámus, audi nos._", "That You deign to call back all who have strayed to the unity of the Church, and to lead all unbelievers to the light of the Gospel, _we beseech You, hear us._"], ["t", "Ut nosmetípsos in tuo sancto servítio confortáre et conserváre dignéris, _te rogámus, audi nos._", "That You deign to strengthen and keep us in Your holy service, _we beseech You, hear us._"], ["t", "Ut mentes nostras ad cæléstia desidéria érigas, _te rogámus, audi nos._", "That You lift up our minds to heavenly desires, _we beseech You, hear us._"], ["t", "Ut ómnibus benefactóribus nostris sempitérna bona retríbuas, _te rogámus, audi nos._", "That You render eternal blessings to all our benefactors, _we beseech You, hear us._"], ["t", "Ut ánimas nostras, fratrum, propinquórum et benefactórum nostrórum ab ætérna damnatióne erípias, _te rogámus, audi nos._", "That You deliver our souls and the souls of our brethren, relatives, and benefactors from eternal damnation, _we beseech You, hear us._"], ["t", "Ut fructus terræ dare et conserváre dignéris, _te rogámus, audi nos._", "That You deign to give and preserve the fruits of the earth, _we beseech You, hear us._"], ["t", "Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris, _te rogámus, audi nos._", "That You deign to grant eternal rest to all the faithful departed, _we beseech You, hear us._"], ["t", "Ut nos exaudíre dignéris, _te rogámus, audi nos._", "That You deign graciously to hear us, _we beseech You, hear us._"], ["t", "Fili Dei, _te rogámus, audi nos._", "Son of God, _we beseech You, hear us._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _parce nobis, Dómine._", "Lamb of God, who take away the sins of the world, _spare us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _exáudi nos, Dómine._", "Lamb of God, who take away the sins of the world, _graciously hear us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _miserére nobis._", "Lamb of God, who take away the sins of the world, _have mercy on us._"], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["r", "5. Quibus finitis, surgunt omnes, et Sacerdos Crucem aspergit aqua benedicta, dicens Antiphonam:", "5. When it is finished, all rise, and the priest sprinkles the cross with holy water, saying the antiphon:"], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["r", "6. Deinde dicitur ab astantibus totus Psalmus Miserére, cum Glória Patri. Quo dicto repetitur Antiphona. Dum dicitur Psalmus, Sacerdos circuit, et perambulat totum cœmeterium, incipiens ad ejus dexteram, aspergens ubique aqua benedicta: quo facto, redit ante Crucem, et ad ipsam respiciens, dicit:", "6. Then those present say the whole psalm \"Have mercy,\" with the Glory be, after which the antiphon is repeated. While the psalm is said, the priest goes around and walks through the whole cemetery, beginning at his right, sprinkling holy water everywhere. When this is done, he returns before the cross and, facing it, says:"], ["h", "Psalmus 50", "Psalm 50"], ["t", "Miserére mei, Deus, * secúndum magnam misericórdiam tuam.", "Have mercy on me, O God, * according to Your great mercy."], ["t", "Et secúndum multitúdinem miseratiónum tuárum, * dele iniquitátem meam.", "And according to the multitude of Your tender mercies * blot out my iniquity."], ["t", "Ámplius lava me ab iniquitáte mea: * et a peccáto meo munda me.", "Wash me yet more from my iniquity, * and cleanse me from my sin."], ["t", "Quóniam iniquitátem meam ego cognósco: * et peccátum meum contra me est semper.", "For I know my iniquity, * and my sin is always before me."], ["t", "Tibi soli peccávi, et malum coram te feci: * ut justificéris in sermónibus tuis, et vincas cum judicáris.", "Against You alone have I sinned and done evil in Your sight, * that You may be justified in Your words and prevail when You are judged."], ["t", "Ecce enim in iniquitátibus concéptus sum: * et in peccátis concépit me mater mea.", "For behold, I was conceived in iniquities, * and in sins did my mother conceive me."], ["t", "Ecce enim veritátem dilexísti: * incérta et occúlta sapiéntiæ tuæ manifestásti mihi.", "For behold, You have loved truth; * the uncertain and hidden things of Your wisdom You have made known to me."], ["t", "Aspérges me hyssópo, et mundábor: * lavábis me, et super nivem dealbábor.", "You will sprinkle me with hyssop, and I shall be cleansed; * You will wash me, and I shall be made whiter than snow."], ["t", "Audítui meo dabis gáudium et lætítiam: * et exsultábunt ossa humiliáta.", "To my hearing You will give joy and gladness, * and the bones that were humbled shall rejoice."], ["t", "Avérte fáciem tuam a peccátis meis: * et omnes iniquitátes meas dele.", "Turn away Your face from my sins, * and blot out all my iniquities."], ["t", "Cor mundum crea in me, Deus: * et spíritum rectum ínnova in viscéribus meis.", "Create a clean heart in me, O God, * and renew a right spirit within me."], ["t", "Ne projícias me a fácie tua: * et spíritum sanctum tuum ne áuferas a me.", "Cast me not away from Your face, * and take not Your holy spirit from me."], ["t", "Redde mihi lætítiam salutáris tui: * et spíritu principáli confírma me.", "Restore to me the joy of Your salvation, * and strengthen me with a willing spirit."], ["t", "Docébo iníquos vias tuas: * et ímpii ad te converténtur.", "I will teach the unjust Your ways, * and the wicked shall be converted to You."], ["t", "Líbera me de sanguínibus, Deus, Deus salútis meæ: * et exsultábit lingua mea justítiam tuam.", "Deliver me from blood, O God, the God of my salvation, * and my tongue shall extol Your justice."], ["t", "Dómine, lábia mea apéries: * et os meum annuntiábit laudem tuam.", "O Lord, You will open my lips, * and my mouth shall declare Your praise."], ["t", "Quóniam si voluísses sacrifícium, dedíssem útique: * holocáustis non delectáberis.", "For if You had desired sacrifice, I would surely have given it; * with burnt offerings You will not be delighted."], ["t", "Sacrifícium Deo spíritus contribulátus: * cor contrítum, et humiliátum, Deus, non despícies.", "A sacrifice to God is an afflicted spirit; * a contrite and humbled heart, O God, You will not despise."], ["t", "Benígne fac, Dómine, in bona voluntáte tua Sion: * ut ædificéntur muri Jerúsalem.", "Deal favorably, O Lord, in Your good will with Sion, * that the walls of Jerusalem may be built up."], ["t", "Tunc acceptábis sacrifícium justítiæ, oblatiónes, et holocáusta: * tunc impónent super altáre tuum vítulos.", "Then You will accept the sacrifice of justice, oblations and whole burnt offerings; * then shall they lay calves upon Your altar."], ["t", "Glória Patri, et Fílio, * et Spirítui Sancto.", "Glory be to the Father, and to the Son, * and to the Holy Spirit."], ["t", "Sicut erat in princípio, et nunc, et semper, * et in sǽcula sæculórum. Amen.", "As it was in the beginning, is now, and ever shall be, * world without end. Amen."], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["t", "Orémus.", "Let us pray."], ["t", "Deus, qui es totíus orbis cónditor, et humáni géneris redémptor, cunctarúmque creaturárum visibílium et invisibílium perféctus dispósitor: te súpplici voce, ac puro corde expóscimus; ut hoc cœmetérium, in quo famulórum, famularúmque tuárum córpora quiéscere debent, post currícula hujus vitæ labéntia, pur✠gáre, bene✠dícere, et sancti✠ficáre dignéris: quique remissiónem ómnium peccatórum per tuam magnam misericórdiam in te confidéntibus præstitísti, corpóribus quoque eórum in hoc cœmetério quiescéntibus, et tubam primi Archángeli exspectántibus, consolatiónem perpétuam lárgiter impertíre. Per Christum, Dóminum nostrum. ℟. Amen.", "O God, Founder of the whole world and Redeemer of the human race, perfect Ruler of all creatures visible and invisible: with suppliant voice and pure heart we beg You that You would deign to ✠ cleanse, ✠ bless, and ✠ sanctify this cemetery, in which the bodies of Your servants, men and women, are to rest after the passing course of this life; and as by Your great mercy You have granted the remission of all sins to those who trust in You, so bountifully grant everlasting comfort also to their bodies resting in this cemetery and awaiting the trumpet of the first Archangel. Through Christ our Lord. ℟. Amen."], ["r", "7. Tunc figit in summitate Crucis unam ex tribus candelis ardentibus, et alias duas similiter ardentes in duobus brachiis ejusdem Crucis. Deinde incensat ipsam Crucem, et aspergens cœmeterium aqua benedicta, redit cum Ministris in sacristiam.", "7. Then he fixes one of the three burning candles on the top of the cross, and the other two, likewise burning, on its two arms. Then he incenses the cross and, sprinkling the cemetery with holy water, returns with the ministers to the sacristy."]]}, {"id": "reconcile-cemetery", "la": "Ritus Reconciliandi Cœmeterium Violatum", "en": "Reconciliation of a Violated Cemetery", "cat": "Churches & Sacred Things", "ref": "Tit. VIII, cap. 30", "b": [["r", "1. Si cœmeterium ecclesiæ pollutæ contiguum violatum fuerit, illud una cum ecclesia reconciliatur, ut supra dictum est. Secus cœmeterii reconciliatio fit hoc modo. Mane diei, qua facienda est reconciliatio, Rector cœmeterii vel quilibet Sacerdos, de consensu saltem præsumpto Rectoris, adhibitis aliquot Clericis indutis superpelliceis, in sacristia, aut alio decenti loco, vestitus amictu, alba, cingulo, stola et pluviali albi coloris, accedit ad medium cœmeterii, Clerico vasculum aquæ benedictæ et aspergillum deferente: et ibi super tapete genuflectit una cum Ministris; et cantores, aliique omnes genibus flexis, dicunt Litanias ordinarias. In quibus cum dictum fuerit: Ut ómnibus fidélibus defúnctis, etc. ℟. Te rogámus, audi nos, Sacerdos surgit et manu dextera producens signum crucis super cœmeterium, clara voce dicit:", "1. If a cemetery adjoining a defiled church has been violated, it is reconciled together with the church, as stated above. Otherwise the reconciliation of a cemetery is done in this manner. On the morning of the day of the reconciliation, the rector of the cemetery, or any priest with at least the presumed consent of the rector, attended by several clerics in surplices, vests in the sacristy or another suitable place in amice, alb, cincture, stole, and white cope, and goes to the middle of the cemetery, a cleric carrying the holy water vessel and sprinkler. There he kneels on a carpet together with the ministers, and the cantors and all the others, kneeling, say the ordinary Litany of the Saints. When \"That You deign to grant eternal rest to all the faithful departed,\" etc. ℟. \"We beseech You, hear us\" has been said, the priest rises and, making the sign of the cross over the cemetery with his right hand, says in a clear voice:"], ["t", "Ut hoc cœmetérium recon✠ciliáre et sancti✠ficáre dignéris. ℟. Te rogámus, audi nos.", "That You deign to ✠ reconcile and ✠ sanctify this cemetery. ℟. We beseech You, hear us."], ["r", "2. Deinde Sacerdos, ut prius, genuflectit, cantoribus Litanias perficientibus.", "2. Then the priest kneels as before, while the cantors complete the Litany."], ["n", "", "The full Litany follows for convenience; the priest's petition above is inserted after the petition for the faithful departed."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis._", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte, Deus, _miserére nobis._", "God the Holy Spirit, _have mercy on us._"], ["t", "Sancta Trínitas, unus Deus, _miserére nobis._", "Holy Trinity, one God, _have mercy on us._"], ["t", "Sancta María, _ora pro nobis._", "Holy Mary, _pray for us._"], ["t", "Sancta Dei Génetrix, _ora pro nobis._", "Holy Mother of God, _pray for us._"], ["t", "Sancta Virgo vírginum, _ora pro nobis._", "Holy Virgin of virgins, _pray for us._"], ["t", "Sancte Míchaël, _ora pro nobis._", "Saint Michael, _pray for us._"], ["t", "Sancte Gábriel, _ora pro nobis._", "Saint Gabriel, _pray for us._"], ["t", "Sancte Ráphaël, _ora pro nobis._", "Saint Raphael, _pray for us._"], ["t", "Omnes sancti Ángeli et Archángeli, _oráte pro nobis._", "All you holy Angels and Archangels, _pray for us._"], ["t", "Omnes sancti beatórum Spirítuum órdines, _oráte pro nobis._", "All you holy orders of blessed Spirits, _pray for us._"], ["t", "Sancte Joánnes Baptísta, _ora pro nobis._", "Saint John the Baptist, _pray for us._"], ["t", "Sancte Joseph, _ora pro nobis._", "Saint Joseph, _pray for us._"], ["t", "Omnes sancti Patriárchæ et Prophétæ, _oráte pro nobis._", "All you holy Patriarchs and Prophets, _pray for us._"], ["t", "Sancte Petre, _ora pro nobis._", "Saint Peter, _pray for us._"], ["t", "Sancte Paule, _ora pro nobis._", "Saint Paul, _pray for us._"], ["t", "Sancte Andréa, _ora pro nobis._", "Saint Andrew, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Joánnes, _ora pro nobis._", "Saint John, _pray for us._"], ["t", "Sancte Thoma, _ora pro nobis._", "Saint Thomas, _pray for us._"], ["t", "Sancte Jacóbe, _ora pro nobis._", "Saint James, _pray for us._"], ["t", "Sancte Philíppe, _ora pro nobis._", "Saint Philip, _pray for us._"], ["t", "Sancte Bartholomǽe, _ora pro nobis._", "Saint Bartholomew, _pray for us._"], ["t", "Sancte Matthǽe, _ora pro nobis._", "Saint Matthew, _pray for us._"], ["t", "Sancte Simon, _ora pro nobis._", "Saint Simon, _pray for us._"], ["t", "Sancte Thaddǽe, _ora pro nobis._", "Saint Thaddeus, _pray for us._"], ["t", "Sancte Matthía, _ora pro nobis._", "Saint Matthias, _pray for us._"], ["t", "Sancte Bárnaba, _ora pro nobis._", "Saint Barnabas, _pray for us._"], ["t", "Sancte Luca, _ora pro nobis._", "Saint Luke, _pray for us._"], ["t", "Sancte Marce, _ora pro nobis._", "Saint Mark, _pray for us._"], ["t", "Omnes sancti Apóstoli et Evangelístæ, _oráte pro nobis._", "All you holy Apostles and Evangelists, _pray for us._"], ["t", "Omnes sancti Discípuli Dómini, _oráte pro nobis._", "All you holy Disciples of the Lord, _pray for us._"], ["t", "Omnes sancti Innocéntes, _oráte pro nobis._", "All you holy Innocents, _pray for us._"], ["t", "Sancte Stéphane, _ora pro nobis._", "Saint Stephen, _pray for us._"], ["t", "Sancte Laurénti, _ora pro nobis._", "Saint Lawrence, _pray for us._"], ["t", "Sancte Vincénti, _ora pro nobis._", "Saint Vincent, _pray for us._"], ["t", "Sancti Fabiáne et Sebastiáne, _oráte pro nobis._", "Saints Fabian and Sebastian, _pray for us._"], ["t", "Sancti Joánnes et Paule, _oráte pro nobis._", "Saints John and Paul, _pray for us._"], ["t", "Sancti Cosma et Damiáne, _oráte pro nobis._", "Saints Cosmas and Damian, _pray for us._"], ["t", "Sancti Gervási et Protási, _oráte pro nobis._", "Saints Gervase and Protase, _pray for us._"], ["t", "Omnes sancti Mártyres, _oráte pro nobis._", "All you holy Martyrs, _pray for us._"], ["t", "Sancte Silvéster, _ora pro nobis._", "Saint Sylvester, _pray for us._"], ["t", "Sancte Gregóri, _ora pro nobis._", "Saint Gregory, _pray for us._"], ["t", "Sancte Ambrósi, _ora pro nobis._", "Saint Ambrose, _pray for us._"], ["t", "Sancte Augustíne, _ora pro nobis._", "Saint Augustine, _pray for us._"], ["t", "Sancte Hierónyme, _ora pro nobis._", "Saint Jerome, _pray for us._"], ["t", "Sancte Martíne, _ora pro nobis._", "Saint Martin, _pray for us._"], ["t", "Sancte Nicoláe, _ora pro nobis._", "Saint Nicholas, _pray for us._"], ["t", "Omnes sancti Pontífices et Confessóres, _oráte pro nobis._", "All you holy Bishops and Confessors, _pray for us._"], ["t", "Omnes sancti Doctóres, _oráte pro nobis._", "All you holy Doctors, _pray for us._"], ["t", "Sancte Antóni, _ora pro nobis._", "Saint Anthony, _pray for us._"], ["t", "Sancte Benedícte, _ora pro nobis._", "Saint Benedict, _pray for us._"], ["t", "Sancte Bernárde, _ora pro nobis._", "Saint Bernard, _pray for us._"], ["t", "Sancte Domínice, _ora pro nobis._", "Saint Dominic, _pray for us._"], ["t", "Sancte Francísce, _ora pro nobis._", "Saint Francis, _pray for us._"], ["t", "Omnes sancti Sacerdótes et Levítæ, _oráte pro nobis._", "All you holy Priests and Levites, _pray for us._"], ["t", "Omnes sancti Mónachi et Eremítæ, _oráte pro nobis._", "All you holy Monks and Hermits, _pray for us._"], ["t", "Sancta María Magdaléna, _ora pro nobis._", "Saint Mary Magdalene, _pray for us._"], ["t", "Sancta Ágatha, _ora pro nobis._", "Saint Agatha, _pray for us._"], ["t", "Sancta Lúcia, _ora pro nobis._", "Saint Lucy, _pray for us._"], ["t", "Sancta Agnes, _ora pro nobis._", "Saint Agnes, _pray for us._"], ["t", "Sancta Cæcília, _ora pro nobis._", "Saint Cecilia, _pray for us._"], ["t", "Sancta Catharína, _ora pro nobis._", "Saint Catherine, _pray for us._"], ["t", "Sancta Anastásia, _ora pro nobis._", "Saint Anastasia, _pray for us._"], ["t", "Omnes sanctæ Vírgines et Víduæ, _oráte pro nobis._", "All you holy Virgins and Widows, _pray for us._"], ["t", "Omnes Sancti et Sanctæ Dei, _intercédite pro nobis._", "All you holy men and women, Saints of God, _intercede for us._"], ["t", "Propítius esto, _parce nobis, Dómine._", "Be merciful, _spare us, O Lord._"], ["t", "Propítius esto, _exáudi nos, Dómine._", "Be merciful, _graciously hear us, O Lord._"], ["t", "Ab omni malo, _líbera nos, Dómine._", "From all evil, _deliver us, O Lord._"], ["t", "Ab omni peccáto, _líbera nos, Dómine._", "From all sin, _deliver us, O Lord._"], ["t", "Ab ira tua, _líbera nos, Dómine._", "From Your wrath, _deliver us, O Lord._"], ["t", "A subitánea et improvísa morte, _líbera nos, Dómine._", "From sudden and unprovided death, _deliver us, O Lord._"], ["t", "Ab insídiis diáboli, _líbera nos, Dómine._", "From the snares of the devil, _deliver us, O Lord._"], ["t", "Ab ira, et ódio, et omni mala voluntáte, _líbera nos, Dómine._", "From anger, and hatred, and every evil will, _deliver us, O Lord._"], ["t", "A spíritu fornicatiónis, _líbera nos, Dómine._", "From the spirit of fornication, _deliver us, O Lord._"], ["t", "A fúlgure et tempestáte, _líbera nos, Dómine._", "From lightning and tempest, _deliver us, O Lord._"], ["t", "A flagéllo terræmótus, _líbera nos, Dómine._", "From the scourge of earthquake, _deliver us, O Lord._"], ["t", "A peste, fame et bello, _líbera nos, Dómine._", "From plague, famine, and war, _deliver us, O Lord._"], ["t", "A morte perpétua, _líbera nos, Dómine._", "From everlasting death, _deliver us, O Lord._"], ["t", "Per mystérium sanctæ Incarnatiónis tuæ, _líbera nos, Dómine._", "Through the mystery of Your holy Incarnation, _deliver us, O Lord._"], ["t", "Per advéntum tuum, _líbera nos, Dómine._", "Through Your coming, _deliver us, O Lord._"], ["t", "Per nativitátem tuam, _líbera nos, Dómine._", "Through Your birth, _deliver us, O Lord._"], ["t", "Per baptísmum et sanctum jejúnium tuum, _líbera nos, Dómine._", "Through Your baptism and holy fasting, _deliver us, O Lord._"], ["t", "Per crucem et passiónem tuam, _líbera nos, Dómine._", "Through Your Cross and Passion, _deliver us, O Lord._"], ["t", "Per mortem et sepultúram tuam, _líbera nos, Dómine._", "Through Your death and burial, _deliver us, O Lord._"], ["t", "Per sanctam resurrectiónem tuam, _líbera nos, Dómine._", "Through Your holy resurrection, _deliver us, O Lord._"], ["t", "Per admirábilem ascensiónem tuam, _líbera nos, Dómine._", "Through Your wonderful ascension, _deliver us, O Lord._"], ["t", "Per advéntum Spíritus Sancti Parácliti, _líbera nos, Dómine._", "Through the coming of the Holy Spirit, the Paraclete, _deliver us, O Lord._"], ["t", "In die judícii, _líbera nos, Dómine._", "In the day of judgment, _deliver us, O Lord._"], ["t", "Peccatóres, _te rogámus, audi nos._", "We sinners, _we beseech You, hear us._"], ["t", "Ut nobis parcas, _te rogámus, audi nos._", "That You spare us, _we beseech You, hear us._"], ["t", "Ut nobis indúlgeas, _te rogámus, audi nos._", "That You pardon us, _we beseech You, hear us._"], ["t", "Ut ad veram pœniténtiam nos perdúcere dignéris, _te rogámus, audi nos._", "That You deign to bring us to true repentance, _we beseech You, hear us._"], ["t", "Ut Ecclésiam tuam sanctam régere et conserváre dignéris, _te rogámus, audi nos._", "That You deign to govern and preserve Your holy Church, _we beseech You, hear us._"], ["t", "Ut Domnum Apostólicum et omnes ecclesiásticos órdines in sancta religióne conserváre dignéris, _te rogámus, audi nos._", "That You deign to preserve the Apostolic Lord and all ranks of the Church in holy religion, _we beseech You, hear us._"], ["t", "Ut inimícos sanctæ Ecclésiæ humiliáre dignéris, _te rogámus, audi nos._", "That You deign to humble the enemies of holy Church, _we beseech You, hear us._"], ["t", "Ut régibus et princípibus christiánis pacem et veram concórdiam donáre dignéris, _te rogámus, audi nos._", "That You deign to give peace and true concord to Christian kings and rulers, _we beseech You, hear us._"], ["t", "Ut cuncto pópulo christiáno pacem et unitátem largíri dignéris, _te rogámus, audi nos._", "That You deign to grant peace and unity to all Christian people, _we beseech You, hear us._"], ["t", "Ut omnes errántes ad unitátem Ecclésiæ revocáre, et infidéles univérsos ad Evangélii lumen perdúcere dignéris, _te rogámus, audi nos._", "That You deign to call back all who have strayed to the unity of the Church, and to lead all unbelievers to the light of the Gospel, _we beseech You, hear us._"], ["t", "Ut nosmetípsos in tuo sancto servítio confortáre et conserváre dignéris, _te rogámus, audi nos._", "That You deign to strengthen and keep us in Your holy service, _we beseech You, hear us._"], ["t", "Ut mentes nostras ad cæléstia desidéria érigas, _te rogámus, audi nos._", "That You lift up our minds to heavenly desires, _we beseech You, hear us._"], ["t", "Ut ómnibus benefactóribus nostris sempitérna bona retríbuas, _te rogámus, audi nos._", "That You render eternal blessings to all our benefactors, _we beseech You, hear us._"], ["t", "Ut ánimas nostras, fratrum, propinquórum et benefactórum nostrórum ab ætérna damnatióne erípias, _te rogámus, audi nos._", "That You deliver our souls and the souls of our brethren, relatives, and benefactors from eternal damnation, _we beseech You, hear us._"], ["t", "Ut fructus terræ dare et conserváre dignéris, _te rogámus, audi nos._", "That You deign to give and preserve the fruits of the earth, _we beseech You, hear us._"], ["t", "Ut ómnibus fidélibus defúnctis réquiem ætérnam donáre dignéris, _te rogámus, audi nos._", "That You deign to grant eternal rest to all the faithful departed, _we beseech You, hear us._"], ["t", "Ut nos exaudíre dignéris, _te rogámus, audi nos._", "That You deign graciously to hear us, _we beseech You, hear us._"], ["t", "Fili Dei, _te rogámus, audi nos._", "Son of God, _we beseech You, hear us._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _parce nobis, Dómine._", "Lamb of God, who take away the sins of the world, _spare us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _exáudi nos, Dómine._", "Lamb of God, who take away the sins of the world, _graciously hear us, O Lord._"], ["t", "Agnus Dei, qui tollis peccáta mundi, _miserére nobis._", "Lamb of God, who take away the sins of the world, _have mercy on us._"], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Kýrie, eléison. Christe, eléison. Kýrie, eléison.", "Lord, have mercy. Christ, have mercy. Lord, have mercy."], ["r", "3. Quibus finitis, surgunt omnes, et Sacerdos, accepto aspergillo cum aqua benedicta, inchoat, Clero prosequente, Antiphonam:", "3. When it is finished, all rise, and the priest, taking the sprinkler with holy water, intones the antiphon, and the clergy continue:"], ["t", "*Ant.* Aspérges me, Dómine, hyssópo, et mundábor: lavábis me, et super nivem dealbábor.", "*Ant.* You will sprinkle me, O Lord, with hyssop, and I shall be cleansed; You will wash me, and I shall be made whiter than snow."], ["h", "Psalmus 50", "Psalm 50"], ["t", "Miserére mei, Deus, * secúndum magnam misericórdiam tuam.", "Have mercy on me, O God, * according to Your great mercy."], ["t", "Et secúndum multitúdinem miseratiónum tuárum, * dele iniquitátem meam.", "And according to the multitude of Your tender mercies * blot out my iniquity."], ["t", "Ámplius lava me ab iniquitáte mea: * et a peccáto meo munda me.", "Wash me yet more from my iniquity, * and cleanse me from my sin."], ["t", "Quóniam iniquitátem meam ego cognósco: * et peccátum meum contra me est semper.", "For I know my iniquity, * and my sin is always before me."], ["t", "Tibi soli peccávi, et malum coram te feci: * ut justificéris in sermónibus tuis, et vincas cum judicáris.", "Against You alone have I sinned and done evil in Your sight, * that You may be justified in Your words and prevail when You are judged."], ["t", "Ecce enim in iniquitátibus concéptus sum: * et in peccátis concépit me mater mea.", "For behold, I was conceived in iniquities, * and in sins did my mother conceive me."], ["t", "Ecce enim veritátem dilexísti: * incérta et occúlta sapiéntiæ tuæ manifestásti mihi.", "For behold, You have loved truth; * the uncertain and hidden things of Your wisdom You have made known to me."], ["t", "Aspérges me hyssópo, et mundábor: * lavábis me, et super nivem dealbábor.", "You will sprinkle me with hyssop, and I shall be cleansed; * You will wash me, and I shall be made whiter than snow."], ["t", "Audítui meo dabis gáudium et lætítiam: * et exsultábunt ossa humiliáta.", "To my hearing You will give joy and gladness, * and the bones that were humbled shall rejoice."], ["t", "Avérte fáciem tuam a peccátis meis: * et omnes iniquitátes meas dele.", "Turn away Your face from my sins, * and blot out all my iniquities."], ["t", "Cor mundum crea in me, Deus: * et spíritum rectum ínnova in viscéribus meis.", "Create a clean heart in me, O God, * and renew a right spirit within me."], ["t", "Ne projícias me a fácie tua: * et spíritum sanctum tuum ne áuferas a me.", "Cast me not away from Your face, * and take not Your holy spirit from me."], ["t", "Redde mihi lætítiam salutáris tui: * et spíritu principáli confírma me.", "Restore to me the joy of Your salvation, * and strengthen me with a willing spirit."], ["t", "Docébo iníquos vias tuas: * et ímpii ad te converténtur.", "I will teach the unjust Your ways, * and the wicked shall be converted to You."], ["t", "Líbera me de sanguínibus, Deus, Deus salútis meæ: * et exsultábit lingua mea justítiam tuam.", "Deliver me from blood, O God, the God of my salvation, * and my tongue shall extol Your justice."], ["t", "Dómine, lábia mea apéries: * et os meum annuntiábit laudem tuam.", "O Lord, You will open my lips, * and my mouth shall declare Your praise."], ["t", "Quóniam si voluísses sacrifícium, dedíssem útique: * holocáustis non delectáberis.", "For if You had desired sacrifice, I would surely have given it; * with burnt offerings You will not be delighted."], ["t", "Sacrifícium Deo spíritus contribulátus: * cor contrítum, et humiliátum, Deus, non despícies.", "A sacrifice to God is an afflicted spirit; * a contrite and humbled heart, O God, You will not despise."], ["t", "Benígne fac, Dómine, in bona voluntáte tua Sion: * ut ædificéntur muri Jerúsalem.", "Deal favorably, O Lord, in Your good will with Sion, * that the walls of Jerusalem may be built up."], ["t", "Tunc acceptábis sacrifícium justítiæ, oblatiónes, et holocáusta: * tunc impónent super altáre tuum vítulos.", "Then You will accept the sacrifice of justice, oblations and whole burnt offerings; * then shall they lay calves upon Your altar."], ["r", "Non dicitur Glória Patri. In fine repetitur Antiphona: Aspérges me.", "The Glory be is not said. At the end the antiphon \"You will sprinkle me\" is repeated."], ["r", "4. Dum hæc dicuntur, Sacerdos circuit totum cœmeterium, incipiens ad ejus dexteram, aspergens ubique aqua benedicta, præsertim in loco, ubi violatio commissa est. Quo peracto, redit ad locum ubi Litaniæ dictæ fuerunt, et ibi stans dicit:", "4. While these are said, the priest goes around the whole cemetery, beginning at his right, sprinkling holy water everywhere, especially in the place where the violation was committed. When this is done, he returns to the place where the Litany was said and, standing there, says:"], ["t", "Orémus.", "Let us pray."], ["v", "Flectámus génua.", "Let us kneel."], ["x", "Leváte.", "Arise."], ["t", "Dómine pie, qui agrum fíguli prétio sánguinis tui in sepultúram peregrinórum comparári voluísti: quǽsumus, dignánter reminíscere clementíssimi hujus mystérii tui. Tu es enim, Dómine, fígulus noster: tu quiétis nostræ ager: tu agri hujus prétium. Tu dedísti étiam, et suscepísti. Tu de prétio tui vivífici sánguinis nos requiéscere donásti. Tu ergo, Dómine, qui es offensiónis nostræ clementíssimus indúltor, exspectantíssimus judicátor, judícii tui superabundantíssimus miserátor: judícium tuæ justíssimæ severitátis abscóndens, post miseratiónem tuæ piæ redemptiónis, adésto exaudítor et efféctor nostræ reconciliatiónis: hocque cœmetérium peregrinórum tuórum, cæléstis pátriæ incolátum exspectántium, benígnus purífica, et reconcília; et hic tumulatórum et tumulandórum córpora, de poténtia et pietáte tuæ resurrectiónis ad glóriam incorruptiónis, non damnans, sed gloríficans resúscita: Qui ventúrus es judicáre vivos, et mórtuos, et sǽculum per ignem. ℟. Amen.", "O loving Lord, who willed that the potter's field be bought with the price of Your blood for the burial of strangers: deign, we beseech You, to remember this most merciful mystery of Yours. For You, O Lord, are our potter; You are the field of our rest; You are the price of this field. You both gave and received. By the price of Your life-giving blood You have granted us to rest. You therefore, O Lord, who are the most merciful forgiver of our offense, the most patient of judges, the most abundantly compassionate in Your judgment: hiding the judgment of Your most just severity, and after the mercy of Your loving redemption, be present to hear and accomplish our reconciliation. In Your kindness purify and reconcile this cemetery of Your pilgrims who await their dwelling in the heavenly homeland; and by the power and love of Your resurrection raise up the bodies of those buried and to be buried here, not condemning but glorifying them unto the glory of incorruption: who will come to judge the living and the dead and the world by fire. ℟. Amen."]]}, {"id": "peoples-fields", "la": "Ritus Benedicendi Populos et Agros ex Apostolicæ Sedis indulto", "en": "Blessing of Peoples and Fields by Indult of the Apostolic See", "cat": "Fields & Animals", "ref": "Tit. VIII, cap. 31", "b": [["r", "1. Accepto diplomate pontificio, constituatur dies Dominica, Delegato et populo commodior, pro ejusdem diplomatis publicatione, et exsecutionis inchoatione.", "1. When the papal document has been received, a Sunday convenient to the delegate and the people is appointed for its publication and the beginning of its execution."], ["r", "2. Die constituta, mane fiat contio, qua doceatur populus de contentis in diplomate pontificio, et de præparatione ad futuram Absolutionem et Benedictionem. Deinde a Delegato celebretur Missa pro remissione peccatorum, in paramentis violaceis, sine Glória in excélsis, et cum Credo, ad instar Missæ votivæ sollemnis pro re gravi et publica simul causa; qua finita, Celebrans, depositis casula et manipulo, induatur pluviali violaceo, et, si sit Episcopus, mitram auriphrygiatam assumat: tum, omnibus genuflexis ante Altare, cantentur Litaniæ Sanctorum, omissis Precibus et Orationibus post eas dici solitis.", "2. On the appointed day, in the morning, a sermon is given in which the people are taught about the contents of the papal document and about preparing for the coming absolution and blessing. Then the delegate celebrates the Mass for the remission of sins, in violet vestments, without the Gloria and with the Creed, in the manner of a solemn votive Mass for a grave and public cause. When it is finished, the celebrant lays aside the chasuble and maniple and puts on a violet cope (and, if he is a bishop, the orphreyed mitre); then, all kneeling before the altar, the Litany of the Saints is sung, omitting the prayers and orations usually said after it."], ["h", "Litaniæ Sanctorum", "The Litany of the Saints"], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, eléison.", "Christ, have mercy."], ["t", "Kýrie, eléison.", "Lord, have mercy."], ["t", "Christe, audi nos.", "Christ, hear us."], ["t", "Christe, exáudi nos.", "Christ, graciously hear us."], ["t", "Pater de cælis, Deus, _miserére nobis._", "God the Father of heaven, _have mercy on us._"], ["t", "Fili, Redémptor mundi, Deus, _miserére nobis._", "God the Son, Redeemer of the world, _have mercy on us._"], ["t", "Spíritus Sancte,
